<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OREO | Leandro Bruno</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --text: #fff; --gray: #888; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Manrope', sans-serif; 
            margin: 0; padding: 0; 
        }

        /* NAVEGACIÓN */
        nav { 
            display: flex; justify-content: space-between; padding: 40px 5%; align-items: center;
            position: absolute; top: 0; width: 90%; z-index: 1000;
        }
        .logo img { height: 40px; width: auto; }
        .menu { display: flex; }
        .menu-item { margin-left: 30px; }
        .menu-item a { 
            text-decoration: none; color: var(--gray); font-size: 0.65rem; 
            letter-spacing: 2px; text-transform: uppercase; transition: 0.3s;
        }
        .menu-item:hover a { color: #fff; }

        /* CONTENEDOR DE VIDEO */
        .video-container {
            width: 100%;
            height: 80vh; /* Altura cinemática */
            background: #000;
            padding-top: 100px;
        }

        .video-wrapper {
            width: 90%;
            height: 100%;
            margin: 0 auto;
            position: relative;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* SECCIÓN DE CRÉDITOS */
        .project-details {
            padding: 60px 5%;
            display: grid;
            grid-template-columns: 1fr 2fr; /* Columna de título y columna de créditos */
            gap: 40px;
        }

        .project-title h1 {
            font-size: 1.5rem;
            letter-spacing: 5px;
            font-weight: 400;
            margin: 0;
            text-transform: uppercase;
        }

        .credits-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .credit-item {
            border-top: 1px solid #222;
            padding-top: 15px;
        }

        .label {
            font-size: 0.6rem;
            color: var(--gray);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .value {
            font-size: 0.85rem;
            font-weight: 200;
            letter-spacing: 1px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .project-details { grid-template-columns: 1fr; }
            .credits-grid { grid-template-columns: 1fr; }
            .video-container { height: 50vh; }
        }

        footer { padding: 100px 5% 40px; text-align: center; font-size: 9px; color: #222; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html"><img src="LOGO_Manrope_v01.png" alt="Leandro Bruno"></a></div>
        <div class="menu">
            <div class="menu-item"><a href="index.html">BACK TO WORK</a></div>
        </div>
    </nav>

    <section class="video-container">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/7Cllu0Rme74?rel=0&showinfo=0&modestbranding=1" allowfullscreen></iframe>
        </div>
    </section>

    <section class="project-details">
        <div class="project-title">
            <h1>OREO</h1>
            <p style="color: var(--gray); font-size: 0.7rem; letter-spacing: 2px; margin-top: 10px;">ADVERTISING</p>
        </div>

        <div class="credits-grid">
            <div class="credit-item">
                <div class="label">Client</div>
                <div class="value">Oreo México</div>
            </div>
            <div class="credit-item">
                <div class="label">Editor</div>
                <div class="value">Leandro Bruno</div>
            </div>
            <div class="credit-item">
                <div class="label">Year</div>
                <div class="value">2025</div>
            </div>
            <div class="credit-item">
                <div class="label">Campaign</div>
                <div class="value">Estás a una Oreo de tu momento de diversión</div>
            </div>
        </div>
    </section>

    <footer>© 2026 LEANDRO BRUNO.</footer>

</body>
</html>
