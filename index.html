<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --radius: 12px; /* Redondeado sutil estilo Whitehouse */
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 40px 60px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 500;
            pointer-events: none; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            transition: background 0.3s;
        }

        nav.index-active { background: #050505; pointer-events: auto; }

        .brand, .nav-links a { pointer-events: auto; cursor: pointer; }

        .brand {
            font-size: clamp(1.5rem, 2vw, 2.5rem); 
            font-weight: 600; letter-spacing: -1px; text-transform: lowercase;
            line-height: 1; font-family: var(--font-serif);
        }
        
        .brand span {
            display: block; font-family: var(--font-main); font-size: 0.4em;
            letter-spacing: 2px; opacity: 0.7; margin-top: 5px;
            text-transform: uppercase; font-weight: 400;
        }

        .nav-links { display: flex; gap: 40px; padding-top: 10px; }

        .nav-links a {
            color: var(--text); text-decoration: none; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.7;
            transition: opacity 0.3s; position: relative;
        }
        .nav-links a:hover { opacity: 1; }

        /* --- CAROUSEL (HOME HERO) --- */
        .carousel { height: 100vh; width: 100vw; position: relative; z-index: 1; }

        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
            padding: 40px 60px 80px 60px; cursor: pointer;
        }

        .slide.active { opacity: 1; z-index: 1; }

        .slide video {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            object-fit: cover; transform: translate(-50%, -50%) scale(1.05);
            transition: transform 6s ease; z-index: 0;
        }
        .slide.active video { transform: translate(-50%, -50%) scale(1); }

        .slide::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.4) 100%);
        }

        .slide-info {
            position: relative; z-index: 2; max-width: 1100px; opacity: 0;
            transform: translateY(30px); transition: all 1s ease 0.3s;
        }
        .slide.active .slide-info { opacity: 1; transform: translateY(0); }

        .project-title {
            font-family: var(--font-serif); font-size: clamp(3rem, 7vw, 6.5rem); 
            margin-bottom: 15px; letter-spacing: -1px; line-height: 1.1; color: #fff;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .credits {
            display: flex; gap: 30px; font-size: 0.9rem; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 20px; color: rgba(255,255,255,0.8);
        }
        .credits span b { color: #fff; margin-right: 5px; }

        .controls {
            position: absolute; bottom: 50px; right: 60px; z-index: 10;
            display: flex; gap: 15px;
        }
        .dot {
            width: 40px; height: 3px; background: rgba(255,255,255,0.3);
            cursor: pointer; transition: 0.3s;
        }
        .dot.active { background: #fff; width: 60px; }

        /* --- INDEX OVERLAY (BENTO GRID STYLE) --- */
        #index-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 400; 
            padding: 140px 60px 60px 60px; 
            overflow-y: auto;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: translateY(20px);
        }

        #index-overlay.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

        /* Estilo Bento Grid (Whitehouse Ref) */
        .grid {
            display: grid; 
            grid-template-columns: 1fr 1fr; /* 2 columnas base */
            gap: 30px;
            padding-bottom: 100px;
            max-width: 1800px; margin: 0 auto;
        }

        .grid-item { 
            position: relative; 
            cursor: pointer; 
            border-radius: var(--radius);
            overflow: hidden;
            background: #111;
        }

        /* Clases de tamaño */
        .grid-item.full { grid-column: span 2; aspect-ratio: 21/9; } /* Panorámico ancho */
        .grid-item.half { grid-column: span 1; aspect-ratio: 16/9; } /* Estándar */

        .grid-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s ease; opacity: 0.8;
            filter: grayscale(100%);
        }

        .grid-item:hover img { 
            transform: scale(1.03); 
            opacity: 1; 
            filter: grayscale(0%); 
        }

        .grid-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            opacity: 0; transform: translateY(10px);
            transition: 0.4s;
        }
        
        /* En mobile o hover se muestra la info */
        .grid-item:hover .grid-info { opacity: 1; transform: translateY(0); }

        .grid-title {
            font-family: var(--font-serif); font-size: 1.8rem;
            margin-bottom: 5px; color: #fff;
        }
        
        .grid-meta {
            font-family: var(--font-main); font-size: 0.8rem;
            color: #ccc; text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- MODAL VIDEO --- */
        #video-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #video-modal.open { opacity: 1; pointer-events: auto; }

        .modal-close {
            position: absolute; top: 40px; right: 40px; color: #fff;
            font-size: 1.5rem; cursor: pointer; z-index: 2001; mix-blend-mode: difference;
        }
        .video-wrapper { width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Responsive Grid */
        @media(max-width: 768px) {
            nav { padding: 30px; flex-direction: column; gap: 20px; }
            .grid { grid-template-columns: 1fr; gap: 20px; }
            .grid-item.full, .grid-item.half { grid-column: span 1; aspect-ratio: 16/9; }
            #index-overlay { padding: 160px 20px 20px 20px; }
            .project-title { font-size: 2.5rem; }
            .grid-info { opacity: 1; transform: translateY(0); background: rgba(0,0,0,0.5); }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="brand" onclick="closeIndex()">
            leandro bruno
            <span>film editor</span>
        </div>
        <div class="nav-links">
            <a onclick="closeIndex()">selected</a>
            <a onclick="openIndex()">index</a>
            <a href="mailto:hola@tuemail.com">contact</a>
        </div>
    </nav>

    <div class="carousel" id="mainCarousel"></div>
    <div class="controls" id="dotsContainer"></div>

    <div id="index-overlay">
        <div class="grid" id="grid-container">
            </div>
    </div>

    <div id="video-modal">
        <div class="modal-close" onclick="closeVideo()">&times;</div>
        <div class="video-wrapper" id="video-container"></div>
    </div>

    <script>
        // CONFIGURACIÓN MAESTRA
        // layout: "full" (Ocupa 2 columnas) o "half" (Ocupa 1 columna)
        // featured: true (Aparece en el Carrusel principal)
        const allProjects = [
            {
                title: "Menem",
                director: "ariel winograd",
                prod: "prime video",
                yt: "-2AmqmciWXE",
                previewUrl: "./assets/menem_preview.mp4",
                image: "./assets/Menem_Thumbnail_1.jpg",
                featured: true,
                layout: "half"
            },
            {
                title: "Oreo: Sigamos Divirtiéndonos",
                director: "martín jalfen",
                prod: "pop studios",
                yt: "7Cllu0Rme74",
                previewUrl: "./assets/oreo_preview.mp4",
                image: "./assets/Oreo_Thumbnail_5.png",
                featured: true,
                layout: "half"
            },
            {
                title: "Coppola, el representante",
                director: "ariel winograd",
                prod: "disney+",
                yt: "ecr24akKDbs",
                previewUrl: "./assets/coppola_preview.mp4",
                image: "./assets/Coppola_Thumbnail_2.jpg",
                featured: true,
                layout: "full" // DESTACADO GRANDE EN INDEX
            },
            {
                title: "El tiempo de las moscas",
                director: "b. naishtat",
                prod: "netflix",
                yt: "A0d6wnlMRRk",
                previewUrl: "./assets/moscas_preview.mp4",
                image: "./assets/Moscas_Thumbnail_1.jpg",
                featured: true,
                layout: "half"
            },
            // --- VOLUMEN ---
            {
                title: "Levis x Winona Riders",
                director: "nico alarcos",
                prod: "primo",
                yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg",
                image: "./assets/Levis_Thumbnail_v01.jpg",
                layout: "half"
            },
            {
                title: "Blair - Todo lo que tengo",
                director: "dana campanello",
                prod: "poster",
                yt: "ItX5aqhqsmo",
                image: "./assets/Blair_Thumbnail_1.jpg",
                layout: "full" // DESTACADO GRANDE EN INDEX
            },
            {
                title: "Las manos de la abuela",
                director: "camila migliore",
                prod: "calesita films",
                image: "./assets/MA_Thumbnail_1.png",
                layout: "half"
            },
            {
                title: "Ratones Paranoicos",
                director: "alex roux",
                prod: "poster",
                image: "./assets/RP_Thumbmail_1.png",
                layout: "half"
            },
            {
                title: "Besos Brujos",
                director: "karina flonembaum",
                prod: "indie",
                image: "./assets/BB_Thumbnail_1.png",
                layout: "full"
            },
            {
                title: "Las Marias",
                director: "a. berger parrado",
                prod: "navajo films",
                image: "./assets/Marias_Thumbnail_1.png",
                layout: "half"
            },
            {
                title: "Todo lo que recuerdo",
                director: "n. fernandez melian",
                prod: "festival mdq",
                image: "./assets/TodoLoQueRecuerdo_Thumbnail_1.png",
                layout: "half"
            }
        ];

        // --- LÓGICA CARRUSEL (Solo Featured) ---
        const featuredProjects = allProjects.filter(p => p.featured);
        let currentSlide = 0;
        let autoPlayInterval;
        const carouselContainer = document.getElementById('mainCarousel');
        const dotsContainer = document.getElementById('dotsContainer');

        function initCarousel() {
            carouselContainer.innerHTML = '';
            dotsContainer.innerHTML = '';
            
            featuredProjects.forEach((p, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                
                slide.innerHTML = `
                    <video loop muted playsinline poster="./assets/placeholder.jpg">
                        <source src="${p.previewUrl}" type="video/mp4">
                    </video>
                    <div class="slide-info">
                        <h2 class="project-title">${p.title}</h2>
                        <div class="credits">
                            <span><b>Dir:</b> ${p.director}</span>
                            <span><b>Prod:</b> ${p.prod}</span>
                        </div>
                    </div>
                `;
                slide.onclick = () => openVideo(p.yt);
                carouselContainer.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = (e) => { e.stopPropagation(); goToSlide(i); };
                dotsContainer.appendChild(dot);
            });

            playActiveVideo();
            startAutoPlay();
        }

        // --- LÓGICA INDEX (BENTO GRID) ---
        const indexOverlay = document.getElementById('index-overlay');
        const gridContainer = document.getElementById('grid-container');
        const nav = document.getElementById('navbar');

        function renderIndex() {
            gridContainer.innerHTML = '';
            allProjects.forEach(p => {
                const item = document.createElement('div');
                // Aplica clase 'full' o 'half' según data
                item.className = `grid-item ${p.layout || 'half'}`;
                item.onclick = () => {
                    if(p.yt) openVideo(p.yt);
                    else alert('Video no disponible');
                };

                item.innerHTML = `
                    <img src="${p.image}" alt="${p.title}" loading="lazy">
                    <div class="grid-info">
                        <div class="grid-title">${p.title}</div>
                        <div class="grid-meta">${p.prod} | ${p.director}</div>
                    </div>
                `;
                gridContainer.appendChild(item);
            });
        }

        function openIndex() {
            renderIndex();
            indexOverlay.classList.add('open');
            nav.classList.add('index-active');
            clearInterval(autoPlayInterval);
            document.querySelectorAll('video').forEach(v => v.pause());
        }

        function closeIndex() {
            indexOverlay.classList.remove('open');
            nav.classList.remove('index-active');
            playActiveVideo();
            startAutoPlay();
        }

        // --- FUNCIONES COMUNES ---
        function playActiveVideo() {
            document.querySelectorAll('video').forEach(v => v.pause());
            const slides = document.querySelectorAll('.slide');
            if(slides.length > 0) {
                const video = slides[currentSlide].querySelector('video');
                if(video) {
                    video.currentTime = 0;
                    video.play().catch(e => {});
                }
            }
        }

        function updateCarousel() {
            document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === currentSlide));
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
            playActiveVideo();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetAutoPlay();
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % featuredProjects.length;
            updateCarousel();
        }

        function startAutoPlay() {
            autoPlayInterval = setInterval(nextSlide, 7000);
        }

        function resetAutoPlay() {
            clearInterval(autoPlayInterval);
            startAutoPlay();
        }

        // --- MODAL YOUTUBE ---
        const modal = document.getElementById('video-modal');
        const videoContainer = document.getElementById('video-container');

        function openVideo(ytId) {
            if(!ytId) return;
            clearInterval(autoPlayInterval);
            document.querySelectorAll('video').forEach(v => v.pause());
            
            videoContainer.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&controls=1" 
                allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
            modal.classList.add('open');
        }

        function closeVideo() {
            modal.classList.remove('open');
            setTimeout(() => { videoContainer.innerHTML = ''; }, 300);
            
            if(!indexOverlay.classList.contains('open')) {
                playActiveVideo();
                startAutoPlay();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeVideo();
        });

        initCarousel();
    </script>
</body>
</html>
