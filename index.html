<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            /* Cursor de tijera global */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>'), auto !important;
        }

        :root { 
            --bg: #0b0b0b; 
            --text: #ffffff; 
            --line-grid: rgba(255, 255, 255, 0.03); 
            --font-main: 'Manrope', sans-serif;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main); text-transform: lowercase;
            overflow: hidden; letter-spacing: -0.01em;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 220px;
            height: 100vh;
            padding: 35px;
            gap: 30px;
        }

        /* NAVEGACIÓN IZQUIERDA */
        .left-panel { display: flex; flex-direction: column; gap: 60px; z-index: 10; }
        .brand { font-weight: 300; font-size: 1.1rem; line-height: 1.1; text-transform: none; }
        .brand strong { display: block; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; }
        
        .nav-links { display: flex; flex-direction: column; gap: 25px; }
        .lang-switch { font-size: 0.7rem; font-weight: 700; display: flex; gap: 10px; margin-bottom: -10px; opacity: 0.6; }
        .lang-switch span.active-lang { border-bottom: 1px solid #fff; opacity: 1; }

        .custom-select-container { position: relative; }
        .select-selected { font-size: 0.9rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 4px; display: inline-block; }
        .select-items {
            position: absolute; background-color: #111; top: 100%; left: 0; z-index: 99; border: 1px solid rgba(255,255,255,0.05);
            margin-top: 10px; display: none; min-width: 200px;
        }
        .select-items div { padding: 12px 15px; font-size: 0.8rem; }
        .select-items div:hover { background-color: #fff; color: #000; }
        .select-show { display: block; }

        .nav-links a { text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 500; opacity: 0.5; transition: 0.3s; }
        .nav-links a:hover { opacity: 1; }

        /* VISOR CENTRAL */
        .center-panel { width: 100%; position: relative; overflow-y: auto; scrollbar-width: none; }
        .main-viewer {
            width: 100%; max-width: 900px; aspect-ratio: 21 / 9; 
            background: #000; border: 1px solid rgba(255,255,255,0.05); 
            overflow: hidden; position: relative;
        }
        .main-viewer img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 0.6s ease; opacity: 0; 
        }
        .main-viewer img.active-slide { opacity: 1; z-index: 2; }
        
        .slide-nav { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; z-index: 15; pointer-events: none; }
        .nav-arrow { pointer-events: auto; width: 60px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; opacity: 0; transition: 0.3s; color: rgba(255,255,255,0.5); user-select: none; }
        .main-viewer:hover .nav-arrow { opacity: 1; }

        .play-indicator {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 1.5rem; display: none; z-index: 20; opacity: 0.7; transition: 0.3s;
        }
        .main-viewer.has-video:hover .play-indicator { display: block; }

        /* DETALLES DEL PROYECTO - Estructura vertical */
        .project-details { width: 100%; max-width: 900px; margin-top: 35px; padding-bottom: 100px; }
        .project-details h2 { font-size: 4rem; margin: 0; font-weight: 800; line-height: 0.85; text-transform: uppercase; letter-spacing: -0.05em; }
        .category-label { font-size: 0.7rem; font-weight: 700; color: #666; margin-bottom: 15px; display: block; text-transform: uppercase; letter-spacing: 0.15em; }
        
        .meta { font-size: 0.9rem; line-height: 1.8; color: #999; margin-top: 20px; }
        .meta strong { color: #fff; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }

        .p-description { 
            margin-top: 25px; 
            max-width: 650px; 
            text-transform: none; 
            font-weight: 300; 
            color: #777; 
            line-height: 1.6; 
            font-size: 0.95rem;
        }

        /* PANEL DERECHO */
        .right-panel { display: flex; flex-direction: column; gap: 25px; overflow-y: auto; padding-right: 10px; }
        .thumb-item { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; transition: 0.5s; flex-shrink: 0; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); opacity: 0.2; transition: 0.5s; }
        .thumb-item:hover img, .thumb-item.active-thumb img { filter: grayscale(0); opacity: 1; }
        .thumb-item.active-thumb { border-color: rgba(255,255,255,0.4); }

        /* ABOUT */
        #about-section { display: none; width: 100%; gap: 60px; align-items: flex-start; }
        .profile-pic { width: 350px; border: 1px solid rgba(255,255,255,0.05); }
        .imdb-link { display: inline-flex; border: 1px solid #fff; padding: 12px 25px; text-decoration: none; color: #fff; font-weight: 700; font-size: 0.9rem; transition: 0.3s; }
        .imdb-link:hover { background: #fff; color: #000; }

        /* MODAL VIDEO */
        .video-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; z-index: 1000; justify-content: center; align-items: center; }
        .video-wrapper { width: 90%; max-width: 1400px; aspect-ratio: 16 / 9; }
        .close-btn { position: fixed; top: 40px; right: 40px; color: #fff; font-size: 0.8rem; z-index: 1010; font-weight: 700; }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
            .right-panel { flex-direction: row; height: 140px; margin-top: 20px; }
            .thumb-item { width: 220px; }
            .project-details h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout" id="main-grid">
        <section class="left-panel">
            <div class="brand" onclick="showSection('work')"><strong>Leandro Bruno</strong>film editor</div>
            <nav class="nav-links">
                <div class="lang-switch">
                    <span id="btn-es" class="active-lang" onclick="setLanguage('es')">ES</span>
                    <span id="btn-en" onclick="setLanguage('en')">EN</span>
                </div>
                <div class="custom-select-container">
                    <div class="select-selected" id="current-filter-text" onclick="toggleDropdown(event)">proyectos / todos</div>
                    <div class="select-items" id="filter-options">
                        <div onclick="filterBy('all', 'all_projects')">/ todos</div>
                        <div onclick="filterBy('ficción', 'narrative')">/ ficción</div>
                        <div onclick="filterBy('advertising', 'advertising')">/ publicidad</div>
                        <div onclick="filterBy('music video', 'music_video')">/ videoclips</div>
                    </div>
                </div>
                <a id="nav-bio" onclick="showSection('about')">/ biografía</a>
                <a id="nav-contact" href="mailto:leandrobrunoeditor@gmail.com">/ contacto</a>
            </nav>
        </section>

        <section class="center-panel">
            <div id="work-section">
                <div class="main-viewer" id="viewer">
                    <div class="slide-nav">
                        <div class="nav-arrow" onclick="manualSlide(-1)">‹</div>
                        <div class="nav-arrow" onclick="manualSlide(1)">›</div>
                    </div>
                    <div class="play-indicator" onclick="openVideo()">▶</div>
                    <div id="image-container"></div>
                </div>
                
                <div class="project-details" id="p-details">
                    <span class="category-label" id="p-category"></span>
                    <h2 id="p-title"></h2>
                    <div class="meta" id="p-meta-top"></div>
                    <div class="p-description" id="p-description"></div>
                </div>
            </div>

            <div id="about-section">
                <img src="assets/Perfil_LMB.png" class="profile-pic" alt="Leandro Bruno">
                <div class="about-content">
                    <div id="txt-about-body" style="font-size:1.3rem; line-height:1.4; max-width:600px; text-transform:none; font-weight: 300; margin-bottom: 40px;"></div>
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <a id="txt-imdb" href="https://www.imdb.com/name/nm10600109/" target="_blank" class="imdb-link"></a>
                        <a style="font-size: 0.75rem; color: #444; font-weight: 700;" onclick="showSection('work')">[ volver ]</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="right-panel" id="thumbnail-list"></section>
    </main>

    <div class="video-modal" id="modal">
        <div class="close-btn" onclick="closeVideo()">[ CERRAR ]</div>
        <div class="video-wrapper" id="video-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        let currentFilterKey = 'all_projects';
        
        const projects = [
            { title: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg", "assets/Menem_Thumbnail_3.png", "assets/Menem_Thumbnail_4.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem en los años 90. Una exploración sobre el carisma, la política y la cultura argentina de una era inolvidable.", desc_en: "Biopic tracing Carlos Menem's rise to power in the 1990s. An exploration of the charisma, politics, and culture of an unforgettable Argentine era." },
            { title: "OREO - Sigamos divirtiéndonos", category: "advertising", images: ["assets/Oreo_Thumbnail_1.png", "assets/Oreo_Thumbnail_2.png", "assets/Oreo_Thumbnail_3.png", "assets/Oreo_Thumbnail_4.png", "assets/Oreo_Thumbnail_5.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México", desc_es: "Campaña publicitaria global para Oreo, destacando dinamismo y ritmo visual.", desc_en: "Global advertising campaign for Oreo, highlighting dynamism and visual rhythm." },
            { title: "el tiempo de las moscas", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg", "assets/Moscas_Thumbnail_2.png", "assets/Moscas_Thumbnail_3.png", "assets/Moscas_Thumbnail_4.png", "assets/Moscas_Thumbnail_5.png"], yt: "A0d6wnlMRRk", director: "Benjamín Naishtat y Ana Katz", prod: "netflix", desc_es: "Dos mujeres intentan reconstruir sus vidas tras salir de prisión, enfrentando un mundo que ha cambiado radicalmente mientras ellas estaban encerradas.", desc_en: "Two women attempt to rebuild their lives after being released from prison, facing a world that has radically changed while they were locked up." },
            { title: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg", "assets/Levis_Thumbnail_2.png", "assets/Levis_Thumbnail_3.png", "assets/Levis_Thumbnail_5.png", "assets/Levis_Thumbnail_6.png", "assets/Levis_Thumbnail_7.png"], yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", director: "Nico Alarcos", prod: "primo", desc_es: "Campaña de gira de Winona Riders por el norte de Argentina.", desc_en: "Winona Riders commercial tour of northern Argentina." },
            { title: "coppola, el representante", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg", "assets/Coppola_Thumbnail_3.png", "assets/Coppola_Thumbnail_4.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", desc_es: "La historia de Guillermo Coppola, el representante más famoso de Argentina, en una travesía llena de excesos, humor y nostalgia noventera.", desc_en: "The story of Guillermo Coppola, Argentina's most famous manager, in a journey filled with excess, humor, and nineties nostalgia." },
            { title: "blair - Todo lo que tengo", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg", "assets/Blair_Thumbnail_2.png", "assets/Blair_Thumbnail_3.png", "assets/Blair_Thumbnail_4.png", "assets/Blair_Thumbnail_5.png"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "", desc_en: "" },
            { title: "las manos de la abuela", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png", "assets/MA_Thumbnail_3.png", "assets/MA_Thumbnail_4.png", "assets/MA_Thumbnail_5.png"], yt: "", director: "camila migliore", prod: "calesita films", desc_es: "Cortometraje que explora la memoria y el legado familiar a través de los gestos y las historias grabadas en las manos de una abuela.", desc_en: "Short film that exploring memory and family legacy through the gestures and stories etched into a grandmother's hands." },
            { title: "ratones paranoicos", category: "music video", images: ["assets/RP_Thumbmail_1.png", "assets/RP_Thumbmail_2.png", "assets/RP_Thumbmail_3.png", "assets/RP_Thumbmail_4.png"], yt: "", director: "alex roux", prod: "poster", desc_es: "Pieza audiovisual para la legendaria banda de rock argentina.", desc_en: "Audiovisual piece for the legendary Argentine rock band." },
            { title: "besos brujos", category: "cortometraje", images: ["assets/BB_Thumbnail_1.png", "assets/BB_Thumbnail_2.png", "assets/BB_Thumbnail_3.png"], yt: "", director: "karina flonembaum", prod: "", desc_es: "Ficción breve que juega con los límites del deseo y la fantasía en una atmósfera onírica.", desc_en: "Short fiction playing with the limits of desire and fantasy in a dreamlike atmosphere." },
            { title: "las marias", category: "advertising", images: ["assets/Marias_Thumbnail_1.png", "assets/Marias_Thumbnail_2.png", "assets/Marias_Thumbnail_3.png"], yt: "", director: "alejandro berger parrado", prod: "navajo films", desc_es: "Pieza con formato video inmersivo documental publicitaria sobre la tradición yerbatera argentina.", desc_en: "Immersive video documentary advertising piece on the Argentine yerba mate tradition." },
            { title: "todo lo que recuerdo", category: "cortometraje", images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"], yt: "", director: "nicolas fernandez melian", prod: "", desc_es: "Un viaje sensorial por la memoria fragmentada. Selección oficial del Festival Internacional de Cine de Mar del Plata.", desc_en: "A sensory journey through fragmented memory. Official selection at the Mar del Plata International Film Festival." }
        ];

        let filteredProjects = [...projects];
        let currentIndex = 0;
        let slideIndex = 0;
        let rotation, slideRotation;

        const texts = {
            es: { all_projects: "proyectos / todos", narrative: "proyectos / ficción", advertising: "proyectos / publicidad", music_video: "proyectos / videoclips", bio: "/ biografía", contact: "/ contacto", close: "[ CERRAR ]", imdb: "CRÉDITOS_IMDB ↗", dir: "dir", prod: "prod", about: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires. Se especializa en montaje rítmico y narrativa de ficción para plataformas globales como Netflix, Disney+ y Prime Video." },
            en: { all_projects: "projects / all", narrative: "projects / fiction", advertising: "projects / advertising", music_video: "projects / music videos", bio: "/ bio", contact: "/ contact", close: "[ CLOSE ]", imdb: "IMDB_CREDITS ↗", dir: "dir", prod: "prod", about: "Leandro Bruno is a film and advertising editor based in Buenos Aires. He specializes in rhythmic editing and narrative fiction for global platforms such as Netflix, Disney+, and Prime Video." }
        };

        function preloadNext() {
            const nextIdx = (currentIndex + 1) % filteredProjects.length;
            filteredProjects[nextIdx].images.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-es').classList.toggle('active-lang', lang === 'es');
            document.getElementById('btn-en').classList.toggle('active-lang', lang === 'en');
            document.getElementById('nav-bio').innerText = texts[lang].bio;
            document.getElementById('nav-contact').innerText = texts[lang].contact;
            document.getElementById('txt-about-body').innerText = texts[lang].about;
            document.getElementById('txt-imdb').innerText = texts[lang].imdb;
            updateDisplay(true);
        }

        function updateDisplay(onlyText = false) {
            const current = filteredProjects[currentIndex];
            if(!current) return;

            if(!onlyText) {
                const container = document.getElementById('image-container');
                container.innerHTML = '';
                slideIndex = 0;
                current.images.forEach((src, idx) => {
                    const img = document.createElement('img');
                    img.src = src;
                    if(idx === 0) img.classList.add('active-slide');
                    container.appendChild(img);
                });
                preloadNext();
            }

            document.getElementById('p-title').innerText = current.title;
            document.getElementById('p-category').innerText = current.category;
            
            const prodHtml = (current.prod && current.prod !== "") ? `<br><strong>${texts[currentLang].prod}</strong> ${current.prod}` : "";
            document.getElementById('p-meta-top').innerHTML = `<strong>${texts[currentLang].dir}</strong> ${current.director}${prodHtml}`;
            document.getElementById('p-description').innerText = currentLang === 'es' ? current.desc_es : current.desc_en;
            
            const thumbList = document.getElementById('thumbnail-list');
            thumbList.innerHTML = '';
            filteredProjects.forEach((proj, idx) => {
                const div = document.createElement('div');
                div.className = 'thumb-item' + (idx === currentIndex ? ' active-thumb' : '');
                div.innerHTML = `<img src="${proj.images[0]}">`;
                div.onclick = () => { currentIndex = idx; updateDisplay(); resetIntervals(); };
                thumbList.appendChild(div);
            });
            document.getElementById('viewer').classList.toggle('has-video', current.yt !== "");
        }

        function manualSlide(dir) {
            const slides = document.querySelectorAll('#image-container img');
            if(slides.length <= 1) return;
            slides[slideIndex].classList.remove('active-slide');
            slideIndex = (slideIndex + dir + slides.length) % slides.length;
            slides[slideIndex].classList.add('active-slide');
            resetSlideTimer();
        }

        function resetIntervals() {
            clearInterval(rotation);
            rotation = setInterval(() => {
                currentIndex = (currentIndex + 1) % filteredProjects.length;
                updateDisplay();
            }, 8500);
            resetSlideTimer();
        }

        function resetSlideTimer() {
            clearInterval(slideRotation);
            slideRotation = setInterval(() => manualSlide(1), 2500);
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById("filter-options").classList.toggle("select-show");
        }

        function filterBy(val, key) {
            currentFilterKey = key;
            if(val === 'all') filteredProjects = [...projects];
            else if(val === 'ficción') filteredProjects = projects.filter(p => p.category === 'serie' || p.category === 'cortometraje');
            else filteredProjects = projects.filter(p => p.category === val);
            currentIndex = 0;
            updateDisplay();
            resetIntervals();
        }

        function showSection(sec) {
            document.getElementById('work-section').style.display = sec === 'work' ? 'block' : 'none';
            document.getElementById('thumbnail-list').style.display = sec === 'work' ? 'flex' : 'none';
            document.getElementById('about-section').style.display = sec === 'about' ? 'flex' : 'none';
            if(sec === 'work') resetIntervals();
        }

        function openVideo() {
            const id = filteredProjects[currentIndex].yt;
            if(!id) return;
            document.getElementById('modal').style.display = 'flex';
            const embedUrl = id.length > 15 ? `https://drive.google.com/file/d/${id}/preview` : `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('video-player').innerHTML = `<iframe width="100%" height="100%" src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('video-player').innerHTML = '';
        }

        window.onclick = () => document.getElementById("filter-options").classList.remove("select-show");
        window.onload = () => { setLanguage('es'); updateDisplay(); resetIntervals(); };
    </script>
</body>
</html>
