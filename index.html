<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { 
            --bg: #f0f0f0; 
            --text: #1a1a1a; 
            --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); 
            --line-accent: rgba(255, 0, 0, 0.2); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; 
            overflow: hidden; text-transform: lowercase; 
        }

        /* FONDO BLUEPRINT */
        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .guide-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--line-accent); z-index: -1; }

        /* ESTRUCTURA PRINCIPAL */
        .main-layout {
            display: grid;
            grid-template-columns: 22% 1fr 22%;
            height: 100vh;
            align-items: center;
            padding: 0 50px;
        }

        /* IZQUIERDA: LOGO TEXTO */
        .side-left { 
            font-size: 1rem; 
            letter-spacing: 1px; 
            line-height: 1.4;
            color: var(--text);
        }
        .side-left span { display: block; font-weight: 700; font-size: 1.2rem; margin-bottom: 5px; }

        /* DERECHA: MENÚ VERTICAL */
        .side-right { 
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
        }
        .side-right a {
            text-decoration: none;
            color: var(--gray);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .side-right a:hover, .side-right a.active { color: var(--text); }

        /* CARRUSEL */
        .center-frame {
            width: 100%;
            max-width: 950px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            border: 1px solid #bbb;
            position: relative;
            background: #000;
            box-shadow: 0 15px 45px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .swiper { width: 100%; height: 100%; }
        .video-wrapper { width: 100%; height: 100%; position: relative; background: #000; }
        
        .video-wrapper iframe { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            border: none; 
        }

        /* INFO ABAJO CENTRO */
        .bottom-info {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }
        /* NOMBRE DEL PROYECTO ARRIBA DE LOS CRÉDITOS */
        #p-name {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: var(--text);
        }
        .credits-box { 
            font-size: 0.95rem; 
            letter-spacing: 1px; 
            color: var(--gray); 
            line-height: 1.6;
        }
        .credits-box strong { color: var(--text); font-weight: 700; }

        /* SCAN LINE ANIMATION */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.4); z-index: 10; pointer-events: none;
        }
        .scanning { animation: scan 0.8s ease-in-out; }
        @keyframes scan { from { top: 0; opacity: 1; } to { top: 100%; opacity: 0; } }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; padding-top: 50px; }
            .side-left { text-align: center; margin-bottom: 20px; }
            .side-right { align-items: center; flex-direction: row; justify-content: center; gap: 20px; margin-top: 20px; }
            .bottom-info { position: relative; bottom: 0; padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>
    <div class="guide-h"></div>

    <main class="main-layout">
        <div class="side-left">
            <span>leandro bruno</span>
            film editor
        </div>

        <div class="center-frame">
            <div class="scan-line" id="scanner"></div>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" data-title="menem" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video">
                        <div class="video-wrapper"><div id="player1"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="oreo" data-credits="<strong>p.</strong> primo films">
                        <div class="video-wrapper"><div id="player2"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="el tiempo de las moscas" data-credits="<strong>d.</strong> benjamín naishtat, ana katz | <strong>p.</strong> netflix, zona audiovisual">
                        <div class="video-wrapper"><div id="player3"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="coppola" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> disney, pampa films">
                        <div class="video-wrapper"><div id="player4"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="blair" data-credits="<strong>d.</strong> dana campanello | <strong>p.</strong> poster">
                        <div class="video-wrapper"><div id="player5"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-right">
            <a href="index.html" class="active">work</a>
            <a href="about.html">about</a>
            <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
        </div>
    </main>

    <div class="bottom-info">
        <div id="p-name">menem</div>
        <div class="credits-box" id="p-credits">
            <strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let players = [];
        const videoIds = ['-2AmqmciWXE', '7Cllu0Rme74', 'A0d6wnlMRRk', 'ecr24akKDbs', 'ItX5aqhqsmo'];

        function onYouTubeIframeAPIReady() {
            videoIds.forEach((id, index) => {
                players[index] = new YT.Player('player' + (index + 1), {
                    videoId: id,
                    playerVars: { 
                        'autoplay': 1, 
                        'mute': 1, 
                        'loop': 1, 
                        'playlist': id, 
                        'controls': 0, 
                        'modestbranding': 1, 
                        'rel': 0,
                        'enablejsapi': 1,
                        'origin': window.location.origin
                    },
                    events: { 
                        'onReady': (e) => {
                            e.target.playVideo();
                        },
                        'onStateChange': (e) => {
                            // Si por alguna razón se pausa (ej. carga lenta), forzar play
                            if (e.data === YT.PlayerState.PAUSED) e.target.playVideo();
                        }
                    }
                });
            });
        }

        const swiper = new Swiper(".mySwiper", {
            loop: true,
            speed: 1000,
            effect: "fade",
            fadeEffect: { crossFade: true },
            autoplay: { delay: 6000, disableOnInteraction: false },
            on: {
                slideChangeTransitionStart: function () {
                    const scanner = document.getElementById('scanner');
                    scanner.classList.remove('scanning');
                    void scanner.offsetWidth; 
                    scanner.classList.add('scanning');
                },
                slideChange: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    if(activeSlide) {
                        document.getElementById('p-name').innerText = activeSlide.getAttribute('data-title');
                        document.getElementById('p-credits').innerHTML = activeSlide.getAttribute('data-credits');
                    }
                }
            }
        });

        // Fallback: Si el API de YT tarda mucho, intentar play manual al hacer click en cualquier lado
        document.body.addEventListener('mousedown', () => {
            players.forEach(p => { if(p && p.playVideo) p.playVideo(); });
        }, { once: true });
    </script>
</body>
</html>
