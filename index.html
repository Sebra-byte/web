        /* CORRECCIÓN 1: Box-sizing global para evitar desbordes por bordes */
        * { box-sizing: border-box; }

        :root { 
            --bg: #121212; 
            --text: #e0e0e0; 
            --gray: #a0a0a0; 
            --line-grid: rgba(255, 255, 255, 0.05); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; text-transform: lowercase; overflow: hidden;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 20px 20px; z-index: -1;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr 200px;
            height: 100vh;
            padding: 40px;
            gap: 20px;
            position: relative;
        }

        /* PANEL IZQUIERDO */
        .left-panel { display: flex; flex-direction: column; gap: 40px; }
        
        .brand { 
            font-size: 1.4rem; line-height: 1.2; letter-spacing: -1px; 
            cursor: pointer; transition: opacity 0.2s;
        }
        .brand:hover { opacity: 0.7; }
        .brand strong { display: block; font-size: 1.6rem; }
        
        .nav-links { display: flex; flex-direction: column; gap: 12px; }

        .custom-select-container { position: relative; display: inline-block; }

            display: flex; align-items: center; gap: 8px; width: fit-content;
        }
        .select-selected::after {
            content: ''; width: 0; height: 0;
            border-left: 4px solid transparent; border-right: 4px solid transparent;
            border-top: 5px solid var(--text); transition: transform 0.3s;
        }
        .select-selected.select-arrow-active::after { transform: rotate(180deg); }

            margin-top: 5px; display: none; min-width: 180px;
        }
