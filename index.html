<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Editor</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap">
    <style>
        :root { --bg: #000; --text: #fff; --gray: #666; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        nav { display: flex; justify-content: space-between; padding: 40px 5%; align-items: center; }
        .logo { font-weight: 700; letter-spacing: 3px; font-size: 1.1rem; text-transform: uppercase; }
        .menu a { text-decoration: none; color: var(--gray); margin-left: 25px; font-size: 0.75rem; letter-spacing: 1.5px; transition: 0.3s; }
        .menu a:hover { color: white; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45%, 1fr)); gap: 15px; padding: 0 15px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .project { position: relative; cursor: pointer; overflow: hidden; aspect-ratio: 16/9; background: #111; }
        .project img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
        .project:hover img { opacity: 0.3; transform: scale(1.02); }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: 0.4s; }
        .project:hover .overlay { opacity: 1; }
        .overlay h2 { font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
        .overlay p { font-size: 10px; color: #888; letter-spacing: 2px; margin-top: 10px; }

        footer { padding: 100px 5%; font-size: 10px; color: #444; letter-spacing: 1px; text-align: left; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">LEANDRO BRUNO / EDITOR</div>
        <div class="menu">
            <a href="#">WORK</a>
            <a href="#">ABOUT</a>
            <a href="mailto:leandrobrunoeditor@gmail.com">CONTACT</a>
        </div>
    </nav>

    <div class="grid">
        
        <div class="project" onclick="window.open('https://www.youtube.com/watch?v=-2AmqmciWXE', '_blank')">
            <img src="Menem_Thumbnail_3.png" alt="Menem Trailer">
            <div class="overlay">
                <h2>MENEM</h2>
                <p>TRAILER OFICIAL / 2024</p>
            </div>
        </div>

        <div class="project" onclick="window.open('#', '_blank')">
            <img src="https://images.unsplash.com/photo-1536240478700-b869070f9279?auto=format&fit=crop&w=800&q=80" alt="Video 2">
            <div class="overlay">
                <h2>PRÓXIMO PROYECTO</h2>
                <p>MUSIC VIDEO</p>
            </div>
        </div>

    </div>

    <footer>
        © 2026 LEANDRO BRUNO. TODOS LOS DERECHOS RESERVADOS.
    </footer>

</body>
</html>
