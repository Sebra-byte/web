<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grafito: #1a1a1a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
            --transition-smooth: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-grafito);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow-x: hidden;
        }

        /* --- FONDO VIDEO HOME --- */
        .bg-preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: var(--bg-grafito); overflow: hidden;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 2s ease-in-out;
            pointer-events: none;
        }
        .bg-video.active { opacity: 0.35; }
        .bg-video iframe {
            width: 150vw; height: 150vh;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.6);
        }

        /* --- NAVEGACIÓN HOME --- */
        .sidebar-home {
            position: fixed; top: 60px; right: 60px;
            display: flex; flex-direction: column; text-align: right;
            align-items: flex-end; z-index: 5000;
        }
        .brand { margin-bottom: 40px; cursor: pointer; }
        .brand h1 { font-size: 2.6rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.04em; }
        .brand p { font-size: 0.95rem; font-weight: 200; margin-top: 8px; opacity: 0.8; letter-spacing: 0.05em; }

        .side-nav { display: flex; flex-direction: column; gap: 10px; }
        .side-nav a { 
            text-decoration: none; color: var(--hueso); font-size: 1.1rem; 
            font-weight: 500; opacity: 0.5; transition: 0.3s; 
        }
        .side-nav a:hover { opacity: 1; font-style: italic; }

        /* --- MENÚ HAMBURGUESA Y SIDEBAR (ALL PROJECTS) --- */
        .nav-all-projects {
            position: fixed; top: 60px; right: 60px;
            z-index: 9999; display: none;
        }
        .menu-toggle {
            width: 30px; height: 18px; display: flex; flex-direction: column;
            justify-content: space-between; cursor: pointer; z-index: 10001; position: relative;
        }
        .menu-toggle span { display: block; width: 100%; height: 2px; background: var(--hueso); transition: 0.4s; }
        .menu-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .menu-toggle.open span:nth-child(2) { opacity: 0; }
        .menu-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        .side-menu-overlay {
            position: fixed; top: 0; right: -400px; width: 350px; height: 100vh;
            background: rgba(20, 20, 20, 0.98); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; padding: 120px 60px;
            transition: var(--transition-smooth); z-index: 10000;
            border-left: 1px solid rgba(255, 255, 228, 0.05);
            text-align: right;
        }
        .side-menu-overlay.active { right: 0; }
        .side-menu-links { display: flex; flex-direction: column; gap: 20px; }
        .side-menu-links a {
            text-decoration: none; color: var(--hueso); font-size: 1.2rem;
            font-weight: 500; opacity: 0.5; transition: 0.3s;
        }
        .side-menu-links a:hover { opacity: 1; font-style: italic; }

        /* --- SELECTOR IDIOMA --- */
        .lang-switcher {
            position: fixed; bottom: 40px; left: 60px;
            z-index: 5000; display: flex; gap: 15px;
        }
        .lang-btn {
            background: none; border: none; color: var(--hueso);
            font-family: var(--font-main); font-size: 0.8rem; font-weight: 700;
            cursor: pointer; opacity: 0.3; transition: 0.3s;
        }
        .lang-btn.active { opacity: 1; text-decoration: underline; }

        /* --- ALL PROJECTS SECTION --- */
        #all-projects-section {
            display: none; padding: 140px 0 100px;
            position: relative; z-index: 100; background: var(--bg-grafito); 
            height: 100vh; overflow-y: auto;
        }
        
        .all-projects-grid {
            display: grid; 
            grid-template-columns: 200px 1px 1fr;
            gap: 60px; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 40px; 
            align-items: start;
        }

        .cat-nav-column { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .cat-link {
            text-decoration: none; color: var(--hueso); font-size: 0.65rem;
            font-weight: 800; text-transform: uppercase; letter-spacing: 0.25em;
            opacity: 0.2; transition: 0.3s;
        }
        .cat-link:hover { opacity: 1; }
        .v-line { width: 1px; background: rgba(255, 255, 228, 0.08); min-height: 80vh; }

        .category-group { margin-bottom: 60px; }
        .category-separator { 
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 0.4em; opacity: 0.15; padding-bottom: 15px; 
            border-bottom: 1px solid rgba(255, 255, 228, 0.1); margin-bottom: 10px;
        }
        
        .project-row { 
            display: grid; 
            grid-template-columns: 220px 1fr auto;
            gap: 40px; 
            padding: 25px 0; 
            border-bottom: 1px solid rgba(255, 255, 228, 0.05); 
            align-items: center; 
            transition: var(--transition-smooth); 
            text-decoration: none; color: inherit; 
        }
        .project-row:hover { background-color: rgba(255, 255, 228, 0.02); padding-left: 10px; }

        .thumb-box { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; border-radius: 1px; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transition: var(--transition-smooth); }
        .project-row:hover .thumb-box img { opacity: 1; transform: scale(1.05); }

        .info-box h3 { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; line-height: 0.9; margin-bottom: 8px; letter-spacing: -0.02em; }
        .info-box .meta-line { font-size: 0.75rem; opacity: 0.5; font-weight: 400; margin-bottom: 2px; }
        .info-box .meta-line strong { opacity: 0.8; color: var(--hueso); margin-right: 4px; font-weight: 700; }

        .logos-box { display: flex; align-items: center; padding-left: 20px; }
        .logos-box img { 
            max-height: 18px; max-width: 80px; 
            filter: brightness(0) invert(1); object-fit: contain; 
            opacity: 0.2; transition: 0.3s;
        }
        .project-row:hover .logos-box img { opacity: 0.9; }

        /* --- MODAL DETALLE --- */
        #project-detail {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.97); z-index: 20000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(25px);
        }
        .detail-wrapper {
            width: 90vw; height: 82vh; display: grid; grid-template-columns: 7.5fr 2.5fr;
            background: #000; position: relative; overflow: hidden;
        }
        .close-btn { 
            position: fixed; top: 40px; right: 60px; font-size: 0.7rem; 
            font-weight: 800; cursor: pointer; z-index: 20100; 
            text-transform: uppercase; color: var(--hueso); opacity: 0.4; letter-spacing: 0.1em;
        }
        .close-btn:hover { opacity: 1; }

        .detail-video-side { background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .detail-video-side iframe { width: 100%; height: 100%; border: none; }
        .gallery-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        .gallery-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .detail-info-side {
            padding: 50px 40px; display: flex; flex-direction: column;
            justify-content: flex-end; border-left: 1px solid rgba(255,255,228,0.08);
            background: var(--bg-grafito); overflow-y: auto;
        }
        .detail-info-side h2 { font-size: 2rem; font-weight: 800; text-transform: uppercase; line-height: 0.9; margin-bottom: 35px; }
        .detail-meta-group { margin-bottom: 18px; }
        .detail-meta-group strong { display: block; font-size: 0.6rem; opacity: 0.3; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 5px; }
        .detail-meta-group p { font-size: 0.9rem; font-weight: 400; opacity: 0.8; }
        .detail-desc { margin-top: 25px; font-size: 0.8rem; opacity: 0.5; line-height: 1.6; font-weight: 300; }

        /* --- HOME SECTION --- */
        #home-section {
            height: 100vh; width: 100%; display: flex; align-items: center;
            padding-left: 80px; position: relative; z-index: 10;
        }
        .section-label { font-size: 0.75rem; margin-bottom: 25px; font-weight: 700; opacity: 0.3; letter-spacing: 0.15em; text-transform: uppercase; }
        .film-item {
            font-size: 4.5rem; font-weight: 800; text-transform: uppercase;
            line-height: 0.85; letter-spacing: -0.04em; color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2);
            transition: all 0.4s ease; display: block;
            text-decoration: none; margin-bottom: 5px; width: fit-content;
        }
        .film-item.active, .film-item:hover { color: var(--hueso); -webkit-text-stroke: 0px; transform: translateX(20px); }

        @media (max-width: 1100px) {
            .all-projects-grid { grid-template-columns: 1fr; gap: 20px; padding: 0 30px; }
            .cat-nav-column, .v-line { display: none; }
            .project-row { grid-template-columns: 1fr 1fr; gap: 20px; }
            .detail-wrapper { grid-template-columns: 1fr; height: 95vh; }
        }
    </style>
</head>
<body>

    <div class="bg-preview-container" id="bg-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <div class="sidebar-home" id="nav-home">
        <div class="brand" onclick="showSection('home')">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav class="side-nav">
            <a href="#" onclick="showSection('all')">/ <span data-i18n="all_projects">todos los proyectos</span></a>
            <a href="mailto:leandrobrunoeditor@gmail.com">/ <span data-i18n="contact">contacto</span></a>
        </nav>
    </div>

    <div class="nav-all-projects" id="nav-all-projects">
        <div class="menu-toggle" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <nav class="side-menu-overlay" id="side-menu">
            <div class="side-menu-links">
                <a href="#" onclick="showSection('home'); toggleMenu();">/ home</a>
                <a href="#" onclick="showSection('all'); toggleMenu();" data-i18n="all_projects">/ proyectos</a>
                <a href="mailto:leandrobrunoeditor@gmail.com" data-i18n="contact">/ contacto</a>
            </div>
        </nav>
    </div>

    <div class="lang-switcher">
        <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <section id="home-section">
        <div class="list-container">
            <p class="section-label" data-i18n="selected_works">trabajos seleccionados</p>
            <div id="featured-list"></div>
        </div>
    </section>

    <section id="all-projects-section">
        <div class="all-projects-grid">
            <div class="cat-nav-column" id="category-nav"></div>
            <div class="v-line"></div>
            <div class="projects-list-body" id="full-index-list"></div>
        </div>
    </section>

    <div id="project-detail">
        <div class="close-btn" onclick="closeDetail()">[ <span data-i18n="close">cerrar</span> / esc ]</div>
        <div class="detail-wrapper" id="detail-dynamic-content"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const i18n = {
            es: { selected_works: "trabajos seleccionados", all_projects: "todos los proyectos", contact: "contacto", close: "cerrar", director: "director", prod: "producción", editor_label: "editor" },
            en: { selected_works: "selected works", all_projects: "all projects", contact: "contact", close: "close", director: "director", prod: "production", editor_label: "editor" }
        };

        const projects = [
            {
                title_es: "menem",
                title_en: "menem",
                category: "serie",
                images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg", "assets/Menem_Thumbnail_3.png", "assets/Menem_Thumbnail_4.jpg"],
                yt: "-2AmqmciWXE",
                director: "ariel winograd",
                prod: "claxon / prime video",
                desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem en los años 90. Una exploración sobre el carisma, la política y la cultura argentina de una era inolvidable.",
                desc_en: "Biopic tracing Carlos Menem's rise to power in the 1990s. An exploration of the charisma, politics, and culture of an unforgettable Argentine era."
            },
            {
                title_es: "OREO - Sigamos divirtiendonos",
                title_en: "OREO - Keep on playing",
                category: "advertising",
                images: ["assets/Oreo_Thumbnail_5.png", "assets/Oreo_Thumbnail_1.png", "assets/Oreo_Thumbnail_2.png", "assets/Oreo_Thumbnail_3.png", "assets/Oreo_Thumbnail_4.png"],
                yt: "7Cllu0Rme74",
                director: "Martín Jalfen",
                prod: "Pop Studios - México",
                desc_es: "Campaña publicitaria global para Oreo, destacando dinamismo y ritmo visual.",
                desc_en: "Global advertising campaign for Oreo, highlighting dynamism and visual rhythm."
            },
            {
                title_es: "el tiempo de las moscas",
                title_en: "time of the flies",
                category: "serie",
                images: ["assets/Moscas_Thumbnail_1.jpg", "assets/Moscas_Thumbnail_2.png", "assets/Moscas_Thumbnail_3.png", "assets/Moscas_Thumbnail_4.png", "assets/Moscas_Thumbnail_5.png"],
                yt: "A0d6wnlMRRk",
                director: "Benjamín Naishtat y Ana Katz",
                prod: "netflix",
                desc_es: "Dos mujeres intentan reconstruir sus vidas tras salir de prisión, enfrentando un mundo que ha cambiado radicalmente mientras ellas estaban encerradas.",
                desc_en: "Two women attempt to rebuild their lives after being released from prison, facing a world that has radically changed while they were locked up."
            },
            {
                title_es: "levis x winona riders",
                title_en: "levis x winona riders",
                category: "advertising",
                images: ["assets/Levis_Thumbnail_v01.jpg", "assets/Levis_Thumbnail_2.png", "assets/Levis_Thumbnail_3.png", "assets/Levis_Thumbnail_5.png", "assets/Levis_Thumbnail_6.png", "assets/Levis_Thumbnail_7.png"],
                yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg",
                director: "Nico Alarcos",
                prod: "primo",
                desc_es: "Campaña de gira de Winona Riders por el norte de Argentina.",
                desc_en: "Winona Riders commercial tour of northern Argentina."
            },
            {
                title_es: "coppola, el representante",
                title_en: "coppola, the agent",
                category: "serie",
                images: ["assets/Coppola_Thumbnail_2.jpg", "assets/Coppola_Thumbnail_3.png", "assets/Coppola_Thumbnail_4.jpg"],
                yt: "ecr24akKDbs",
                director: "ariel winograd",
                prod: "pampa films / disney+",
                desc_es: "La historia de Guillermo Coppola, el representante más famoso de Argentina, en una travesía llena de excesos, humor y nostalgia noventera.",
                desc_en: "The story of Guillermo Coppola, Argentina's most famous manager, in a journey filled with excess, humor, and nineties nostalgia."
            },
            {
                title_es: "blair - Todo lo que tengo",
                title_en: "blair - All I have",
                category: "music video",
                images: ["assets/Blair_Thumbnail_1.jpg", "assets/Blair_Thumbnail_2.png", "assets/Blair_Thumbnail_3.png", "assets/Blair_Thumbnail_4.png", "assets/Blair_Thumbnail_5.png"],
                yt: "ItX5aqhqsmo",
                director: "dana campanello",
                prod: "poster",
                desc_es: "Primer adelanto del disco Bar Scorpios (2025)",
                desc_en: "First preview of the album Bar Scorpios (2025)"
            },
            {
                title_es: "las manos de la abuela",
                title_en: "grandmother's hands",
                category: "cortometraje",
                images: ["assets/MA_Thumbnail_1.png", "assets/MA_Thumbnail_3.png", "assets/MA_Thumbnail_4.png", "assets/MA_Thumbnail_5.png"],
                yt: "",
                director: "camila migliore",
                prod: "calesita films",
                desc_es: "Cortometraje que explora la memoria y el legado familiar a través de los gestos y las historias grabadas en las manos de una abuela.",
                desc_en: "Short film that exploring memory and family legacy through the gestures and stories etched into a grandmother's hands."
            },
            {
                title_es: "ratones paranoicos",
                title_en: "ratones paranoicos",
                category: "music video",
                images: ["assets/RP_Thumbmail_1.png", "assets/RP_Thumbmail_2.png", "assets/RP_Thumbmail_3.png", "assets/RP_Thumbmail_4.png"],
                yt: "",
                director: "alex roux",
                prod: "poster",
                desc_es: "Pieza audiovisual para la legendaria banda de rock argentina.",
                desc_en: "Audiovisual piece for the legendary Argentine rock band."
            },
            {
                title_es: "besos brujos",
                title_en: "witch kisses",
                category: "cortometraje",
                images: ["assets/BB_Thumbnail_1.png", "assets/BB_Thumbnail_2.png", "assets/BB_Thumbnail_3.png"],
                yt: "",
                director: "karina flonembaum",
                prod: "",
                desc_es: "Ficción breve que juega con los límites del deseo y la fantasía en una atmósfera onírica.",
                desc_en: "Short fiction playing with the limits of desire and fantasy in a dreamlike atmosphere."
            },
            {
                title_es: "las marias",
                title_en: "las marias",
                category: "advertising",
                images: ["assets/Marias_Thumbnail_1.png", "assets/Marias_Thumbnail_2.png", "assets/Marias_Thumbnail_3.png"],
                yt: "",
                director: "alejandro berger parrado",
                prod: "navajo films",
                desc_es: "Pieza con formato video inmersivo documental publicitaria sobre la tradición yerbatera argentina.",
                desc_en: "Immersive video documentary advertising piece on the Argentine yerba mate tradition."
            },
            {
                title_es: "todo lo que recuerdo",
                title_en: "all I remember",
                category: "cortometraje",
                images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"],
                yt: "",
                director: "nicolas fernandez melian",
                prod: "",
                desc_es: "Un viaje sensorial por la memoria fragmentada. Selección oficial del Festival Internacional de Cine de Mar del Plata.",
                desc_en: "A sensory journey through fragmented memory. Official selection at the Mar del Plata International Film Festival."
            }
        ];

        let currentLang = 'es';
        let activePaneId = 1;
        let currentIdx = 0;
        let previewTimer;

        function toggleMenu() {
            document.getElementById('menu-btn').classList.toggle('open');
            document.getElementById('side-menu').classList.toggle('active');
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            renderLists();
        }

        function renderLists() {
            const featList = document.getElementById('featured-list');
            const indexList = document.getElementById('full-index-list');
            const catNav = document.getElementById('category-nav');
            featList.innerHTML = ''; indexList.innerHTML = ''; catNav.innerHTML = '';

            // Solo proyectos con YT para la Home
            const featured = projects.filter(p => p.yt);
            featured.forEach((p, idx) => {
                const a = document.createElement('a');
                a.className = "film-item " + (idx === currentIdx ? 'active' : '');
                a.innerText = p[`title_${currentLang}`];
                a.onmouseenter = () => { 
                    if(idx !== currentIdx) {
                        currentIdx = idx;
                        updateHomeActiveUI();
                        changeHeroProject(idx);
                    }
                };
                a.onclick = (e) => { e.preventDefault(); openDetailByTitle(p.title_es); };
                featList.appendChild(a);
            });

            // Grilla completa agrupada por categorías
            const categories = [...new Set(projects.map(p => p.category))];
            categories.forEach(cat => {
                const catId = `cat-${cat.replace(/\s/g, '')}`;
                const cLink = document.createElement('a');
                cLink.className = "cat-link"; cLink.href = `#${catId}`; cLink.innerText = cat;
                catNav.appendChild(cLink);

                const group = document.createElement('div');
                group.className = "category-group";
                group.innerHTML = `<div class="category-separator" id="${catId}">${cat}</div>`;
                
                projects.filter(p => p.category === cat).forEach(p => {
                    const row = document.createElement('a');
                    row.className = "project-row";
                    row.innerHTML = `
                        <div class="thumb-box"><img src="${p.images[0]}"></div>
                        <div class="info-box">
                            <h3>${p[`title_${currentLang}`]}</h3>
                            <div class="meta-line"><strong>D:</strong> ${p.director}</div>
                            <div class="meta-line"><strong>P:</strong> ${p.prod}</div>
                        </div>
                        <div class="logos-box"></div>`;
                    row.onclick = (e) => { e.preventDefault(); openDetailByTitle(p.title_es); };
                    group.appendChild(row);
                });
                indexList.appendChild(group);
            });
        }

        function updateHomeActiveUI() {
            document.querySelectorAll('.film-item').forEach((el, i) => {
                el.classList.toggle('active', i === currentIdx);
            });
        }

        function changeHeroProject(idx) {
            clearTimeout(previewTimer);
            const featured = projects.filter(p => p.yt);
            if(featured.length === 0) return;
            
            const nextPaneId = activePaneId === 1 ? 2 : 1;
            const currentPane = document.getElementById(`pane-${activePaneId}`);
            const nextPane = document.getElementById(`pane-${nextPaneId}`);
            const p = featured[idx];
            
            const playerDivId = `yt-player-${Date.now()}`;
            nextPane.innerHTML = `<div id="${playerDivId}"></div>`;

            new YT.Player(playerDivId, {
                videoId: p.yt,
                playerVars: { autoplay: 1, mute: 1, controls: 0, modestbranding: 1, rel: 0, start: 10, loop: 1, playlist: p.yt },
                events: {
                    onReady: (e) => {
                        nextPane.classList.add('active');
                        currentPane.classList.remove('active');
                        activePaneId = nextPaneId;
                        setTimeout(() => { currentPane.innerHTML = ''; }, 2000);
                        
                        previewTimer = setTimeout(() => {
                            currentIdx = (currentIdx + 1) % featured.length;
                            updateHomeActiveUI();
                            changeHeroProject(currentIdx);
                        }, 10000);
                    }
                }
            });
        }

        function openDetailByTitle(title) {
            clearTimeout(previewTimer);
            const p = projects.find(proj => proj.title_es === title);
            const detail = document.getElementById('project-detail');
            const container = document.getElementById('detail-dynamic-content');

            let mediaHtml = p.yt ? 
                `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0" allow="autoplay"></iframe>` :
                `<div class="gallery-container"><img src="${p.images[0]}"></div>`;

            container.innerHTML = `
                <div class="detail-video-side">${mediaHtml}</div>
                <div class="detail-info-side">
                    <h2>${p[`title_${currentLang}`]}</h2>
                    <div class="detail-meta-group"><strong>${i18n[currentLang].director}</strong><p>${p.director}</p></div>
                    <div class="detail-meta-group"><strong>${i18n[currentLang].prod}</strong><p>${p.prod}</p></div>
                    <div class="detail-meta-group"><strong>${i18n[currentLang].editor_label}</strong><p>leandro bruno</p></div>
                    <p class="detail-desc">${p[`desc_${currentLang}`] || ''}</p>
                </div>`;
            
            detail.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detail-dynamic-content').innerHTML = '';
            document.getElementById('project-detail').style.display = 'none';
            
            const isAllVisible = document.getElementById('all-projects-section').style.display === 'block';
            if(!isAllVisible) {
                document.body.style.overflow = 'hidden';
                changeHeroProject(currentIdx);
            } else {
                document.body.style.overflowY = 'auto';
            }
        }

        function showSection(sec) {
            const home = document.getElementById('home-section');
            const all = document.getElementById('all-projects-section');
            const bg = document.getElementById('bg-container');
            const navHome = document.getElementById('nav-home');
            const navAll = document.getElementById('nav-all-projects');

            if(sec === 'all') { 
                home.style.display = 'none'; bg.style.display = 'none'; all.style.display = 'block'; 
                navHome.style.display = 'none'; navAll.style.display = 'block';
                document.body.style.overflowY = 'auto';
                clearTimeout(previewTimer);
            } else { 
                home.style.display = 'flex'; bg.style.display = 'block'; all.style.display = 'none'; 
                navHome.style.display = 'flex'; navAll.style.display = 'none';
                document.body.style.overflowY = 'hidden'; 
                changeHeroProject(currentIdx);
            }
        }

        document.addEventListener('keydown', (e) => { if (e.key === "Escape") closeDetail(); });
        window.onload = () => { renderLists(); setTimeout(() => changeHeroProject(0), 1000); };
    </script>
</body>
</html>
