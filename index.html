<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --text: #fff; --gray: #888; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; margin: 0; overflow-x: hidden; }
        
        nav { display: flex; justify-content: space-between; padding: 50px 5%; align-items: center; }
        .logo { font-weight: 200; letter-spacing: 6px; font-size: 1rem; text-transform: uppercase; }
        .menu a { text-decoration: none; color: var(--gray); margin-left: 30px; font-size: 0.7rem; letter-spacing: 3px; font-weight: 200; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45%, 1fr)); gap: 15px; padding: 0 15px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .project { position: relative; cursor: pointer; overflow: hidden; aspect-ratio: 16/9; background: #111; }
        .project img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s ease; }
        .project:hover img { opacity: 0.2; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: 0.5s; }
        .project:hover .overlay { opacity: 1; }
        .overlay h2 { font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; font-weight: 400; }

        /* EL MODAL (VENTANA FLOTANTE) */
        #videoModal {
            display: none; 
            position: fixed; 
            z-index: 9999; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95);
        }
        .modal-content {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 1100px;
            aspect-ratio: 16/9;
        }
        .close-btn {
            position: absolute;
            top: -50px; right: 0;
            color: white;
            font-size: 40px;
            cursor: pointer;
            line-height: 1;
        }
        iframe { width: 100%; height: 100%; border: none; }

        footer { padding: 80px 5%; font-size: 9px; color: #333; letter-spacing: 2px; font-weight: 200; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">LEANDRO BRUNO / EDITOR</div>
        <div class="menu">
            <a href="#">WORK</a>
            <a href="#">ABOUT</a>
            <a href="mailto:leandrobrunoeditor@gmail.com">CONTACT</a>
        </div>
    </nav>

    <div class="grid">
        <div class="project" onclick="playThis('-2AmqmciWXE')">
            <img src="Menem_Thumbnail_3.png" alt="Menem">
            <div class="overlay">
                <h2>MENEM</h2>
                <p style="font-size:9px; margin-top:10px; color:#888;">TRAILER OFICIAL / 2024</p>
            </div>
        </div>
    </div>

    <div id="videoModal">
        <div class="modal-content">
            <span class="close-btn" onclick="stopVideo()">&times;</span>
            <div id="player"></div>
        </div>
    </div>

    <footer>© 2026 LEANDRO BRUNO.</footer>

    <script>
        function playThis(id) {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('player');
            // Insertamos el iframe directamente
            player.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden'; // Bloquea el scroll de fondo
        }

        function stopVideo() {
            const modal = document.getElementById('videoModal');
            const player = document.getElementById('player');
            player.innerHTML = ''; // Borra el video para que pare el sonido
            modal.style.display = 'none';
            document.body.style.overflow = 'auto'; // Devuelve el scroll
        }

        // Si hacen clic fuera del video, también se cierra
        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target == modal) { stopVideo(); }
        }
    </script>

</body>
</html>
