<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23FFFFE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>'), auto !important;
        }

        :root { 
            --bg: #161B16; 
            --text: #FFFFE4; 
            --line-grid: rgba(255, 255, 228, 0.03); 
            --font-main: 'Manrope', sans-serif;
            --transition-speed: 0.5s;
            --thumb-height: 124px; /* Altura de la miniatura + gap */
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main); text-transform: lowercase;
            overflow: hidden; letter-spacing: -0.01em;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        #transition-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 220px;
            height: 100vh;
            padding: 35px;
            gap: 30px;
        }

        /* Paneles */
        .left-panel { display: flex; flex-direction: column; gap: 60px; z-index: 100; }
        .brand { font-weight: 300; font-size: 1.1rem; line-height: 1.1; text-transform: none; cursor: pointer; color: var(--text); }
        .brand strong { display: block; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; text-transform: uppercase; }
        
        .nav-links { display: flex; flex-direction: column; gap: 25px; }
        
        .lang-switch { 
            font-size: 0.85rem; font-weight: 800; display: flex; gap: 5px; margin-bottom: 5px; margin-left: -8px;
        }
        .lang-switch span { 
            cursor: pointer; position: relative; padding: 8px 12px; opacity: 0.2; transition: 0.3s;
        }
        .lang-switch span.active-lang { opacity: 1; }

        .custom-select-container { position: relative; }
        .select-selected { font-size: 0.9rem; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 228, 0.2); padding-bottom: 4px; cursor: pointer; }
        .select-items {
            position: absolute; background-color: #0b0d0b; top: 100%; left: 0; z-index: 99; border: 1px solid rgba(255, 255, 228, 0.05);
            margin-top: 10px; display: none; min-width: 200px;
        }
        .select-items div { padding: 12px 15px; font-size: 0.8rem; cursor: pointer; }
        .select-items div:hover { background-color: var(--text); color: #000; }
        .select-show { display: block; }

        .nav-links a { text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 500; opacity: 0.5; transition: 0.3s; cursor: pointer; }
        .nav-links a:hover { opacity: 1; }

        /* Centro */
        .center-panel { width: 100%; position: relative; overflow-y: auto; scrollbar-width: none; }
        .center-panel::-webkit-scrollbar { display: none; }

        .main-viewer {
            width: 100%; max-width: 900px; aspect-ratio: 21 / 9; 
            background: #000; border: 1px solid rgba(255, 255, 228, 0.05); 
            overflow: hidden; position: relative;
        }
        
        .main-viewer img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 0.6s ease; opacity: 0; 
        }
        .main-viewer img.active-slide { opacity: 1; z-index: 2; }
        
        .slide-nav { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; z-index: 15; pointer-events: none; }
        .nav-arrow { pointer-events: auto; width: 60px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; opacity: 0; transition: 0.3s; color: rgba(255, 255, 228, 0.5); }
        .main-viewer:hover .nav-arrow { opacity: 1; }

        .project-details { width: 100%; max-width: 900px; margin-top: 35px; padding-bottom: 100px; transition: opacity 0.5s; }
        .project-details h2 { font-size: 4rem; margin: 0; font-weight: 800; line-height: 0.85; text-transform: uppercase; letter-spacing: -0.05em; }
        .category-label { font-size: 0.7rem; font-weight: 700; color: rgba(255, 255, 228, 0.3); margin-bottom: 15px; display: block; text-transform: uppercase; letter-spacing: 0.15em; }
        
        .meta { font-size: 0.9rem; line-height: 1.8; color: rgba(255, 255, 228, 0.5); margin-top: 20px; }
        .meta strong { color: var(--text); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }

        .p-description { margin-top: 25px; max-width: 650px; text-transform: none; font-weight: 300; color: rgba(255, 255, 228, 0.4); line-height: 1.6; }

        /* SLIDER FOTOGRAMAS (Derecha) */
        .right-panel { 
            position: relative;
            height: 100%;
            overflow: hidden; /* Cortamos para que parezca que pasan los fotogramas */
            display: flex;
            align-items: center; /* Centramos el "cabezal" visualmente */
        }

        /* Guía visual del "Cabezal de reproducción" (opcional, le da el toque de editor) */
        .right-panel::before {
            content: '';
            position: absolute;
            left: -10px;
            width: 2px;
            height: 120px;
            background: var(--text);
            z-index: 10;
            opacity: 0.5;
        }

        #thumbnail-list { 
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); /* Movimiento suave de carrete */
            width: 100%;
        }

        .thumb-item { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            border: 1px solid rgba(255, 255, 228, 0.05); 
            overflow: hidden; 
            transition: 0.5s; 
            flex-shrink: 0; 
            cursor: pointer; 
            opacity: 0.3;
            filter: grayscale(1);
        }
        
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .thumb-item.active-thumb { 
            opacity: 1; 
            filter: grayscale(0); 
            border-color: var(--text);
            transform: scale(1.05); /* Un pequeño pop al estar seleccionado */
        }

        /* Modales */
        .video-modal, .gallery-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); display: none; z-index: 1000; 
            justify-content: center; align-items: center; 
        }
        .video-wrapper, .gallery-wrapper { width: 80%; max-width: 1200px; aspect-ratio: 16 / 9; position: relative; }
        .gallery-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        .close-btn { position: fixed; top: 40px; right: 40px; color: var(--text); font-size: 0.8rem; z-index: 1010; cursor: pointer; }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; height: auto; }
            .right-panel { height: 200px; align-items: center; justify-content: center; }
            #thumbnail-list { flex-direction: row; width: auto; }
            .thumb-item { width: 180px; }
            .right-panel::before { display: none; }
        }
    </style>
</head>
<body>

    <div id="transition-overlay"></div>
    <div class="blueprint-bg"></div>

    <main class="main-layout">
        <section class="left-panel">
            <div class="brand" onclick="showSection('work')"><strong>Leandro Bruno</strong>film editor</div>
            <nav class="nav-links">
                <div class="lang-switch">
                    <span id="btn-es" onclick="setLanguage('es')">ES</span>
                    <span id="btn-en" onclick="setLanguage('en')">EN</span>
                </div>
                <div class="custom-select-container">
                    <div class="select-selected" id="current-filter-text" onclick="toggleDropdown(event)"></div>
                    <div class="select-items" id="filter-options">
                        <div id="opt-all" onclick="filterBy('all', 'all_projects')"></div>
                        <div id="opt-narrative" onclick="filterBy('ficción', 'narrative')"></div>
                        <div id="opt-advertising" onclick="filterBy('advertising', 'advertising')"></div>
                        <div id="opt-music" onclick="filterBy('music video', 'music_video')"></div>
                    </div>
                </div>
                <a id="nav-about" onclick="showSection('about')"></a>
                <a id="nav-contact" href="mailto:leandrobrunoeditor@gmail.com"></a>
            </nav>
        </section>

        <section class="center-panel">
            <div id="work-section">
                <div class="main-viewer" id="viewer" onclick="handleMainClick()">
                    <div class="slide-nav">
                        <div class="nav-arrow" onclick="event.stopPropagation(); manualSlide(-1)">‹</div>
                        <div class="nav-arrow" onclick="event.stopPropagation(); manualSlide(1)">›</div>
                    </div>
                    <div id="image-container"></div>
                </div>
                
                <div class="project-details" id="p-details">
                    <span class="category-label" id="p-category"></span>
                    <h2 id="p-title"></h2>
                    <div class="meta" id="p-meta-top"></div>
                    <div class="p-description" id="p-description"></div>
                </div>
            </div>

            <div id="about-section" style="display:none;">
                <div id="txt-about-body" style="font-size:1.3rem; line-height:1.4; max-width:600px; font-weight: 300;"></div>
            </div>
        </section>

        <section class="right-panel">
            <div id="thumbnail-list"></div>
        </section>
    </main>

    <div class="video-modal" id="modal-v">
        <div class="close-btn" onclick="closeModals()">[ CERRAR ]</div>
        <div class="video-wrapper" id="video-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        let currentIndex = 0;
        let slideIndex = 0;
        let slideRotation, mainRotation;
        let ytPlayer;
        let currentFilterKey = 'all_projects';

        const projects = [
            { title_es: "menem", title_en: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem.", desc_en: "Biopic tracing Carlos Menem's rise to power." },
            { title_es: "OREO - Diversión", title_en: "OREO - Play", category: "advertising", images: ["assets/Oreo_Thumbnail_1.png", "assets/Oreo_Thumbnail_2.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios", desc_es: "Campaña global para Oreo.", desc_en: "Global campaign for Oreo." },
            { title_es: "el tiempo de las moscas", title_en: "time of the flies", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg"], yt: "A0d6wnlMRRk", director: "Ana Katz", prod: "netflix", desc_es: "Dos mujeres tras salir de prisión.", desc_en: "Two women after prison." },
            { title_es: "levis x winona riders", title_en: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", director: "Nico Alarcos", prod: "primo", desc_es: "Winona Riders tour.", desc_en: "Winona Riders tour." },
            { title_es: "coppola", title_en: "coppola", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "disney+", desc_es: "La historia del representante.", desc_en: "The agent's story." }
        ];

        let filteredProjects = [...projects];

        const translations = {
            es: { all_projects: "todos", narrative: "ficción", advertising: "publicidad", music_video: "videoclips", about: "/ biografía", contact: "/ contacto", projects: "proyectos", dir: "dir", prod: "prod", about_body: "Editor basado en Buenos Aires..." },
            en: { all_projects: "all", narrative: "fiction", advertising: "advertising", music_video: "music videos", about: "/ biography", contact: "/ contact", projects: "projects", dir: "dir", prod: "prod", about_body: "Editor based in Buenos Aires..." }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-es').className = lang === 'es' ? 'active-lang' : '';
            document.getElementById('btn-en').className = lang === 'en' ? 'active-lang' : '';
            document.getElementById('nav-about').innerText = translations[lang].about;
            document.getElementById('nav-contact').innerText = translations[lang].contact;
            document.getElementById('current-filter-text').innerText = translations[lang].projects + ' / ' + translations[lang][currentFilterKey];
            updateDisplay(true);
        }

        function filterBy(val, dictKey) {
            currentFilterKey = dictKey;
            if(val === 'all') filteredProjects = [...projects];
            else filteredProjects = projects.filter(p => p.category === val);
            currentIndex = 0;
            updateDisplay();
            resetIntervals();
        }

        function updateDisplay(onlyText = false) {
            const current = filteredProjects[currentIndex];
            if(!current) return;

            if(!onlyText) {
                document.getElementById('image-container').innerHTML = current.images.map((src, idx) => `<img src="${src}" class="${idx === 0 ? 'active-slide' : ''}">`).join('');
                slideIndex = 0;
                renderThumbnails();
                resetSlideTimer();
            }
            
            document.getElementById('p-title').innerText = currentLang === 'es' ? current.title_es : current.title_en;
            document.getElementById('p-category').innerText = current.category;
            document.getElementById('p-description').innerText = currentLang === 'es' ? current.desc_es : current.desc_en;
            document.getElementById('p-meta-top').innerHTML = `<strong>${translations[currentLang].dir}:</strong> ${current.director}<br><strong>${translations[currentLang].prod}:</strong> ${current.prod}`;
            
            alignThumbnails();
        }

        function renderThumbnails() {
            document.getElementById('thumbnail-list').innerHTML = filteredProjects.map((p, idx) => `
                <div class="thumb-item ${idx === currentIndex ? 'active-thumb' : ''}" onclick="selectProject(${idx})">
                    <img src="${p.images[0]}">
                </div>
            `).join('');
        }

        // ESTA ES LA FUNCIÓN CLAVE PARA EL MOVIMIENTO DE FOTOGRAMAS
        function alignThumbnails() {
            const list = document.getElementById('thumbnail-list');
            const items = document.querySelectorAll('.thumb-item');
            if(items.length === 0) return;

            const activeItem = items[currentIndex];
            const listRect = document.querySelector('.right-panel').getBoundingClientRect();
            const itemRect = activeItem.getBoundingClientRect();
            
            // Calculamos cuánto desplazar el contenedor para que el item activo esté en el centro visual
            const offset = (listRect.height / 2) - (activeItem.offsetTop + activeItem.offsetHeight / 2);
            
            list.style.transform = `translateY(${offset}px)`;
        }

        function selectProject(idx) { currentIndex = idx; updateDisplay(); resetIntervals(); }

        function handleMainClick() {
            const p = filteredProjects[currentIndex];
            if(p.yt) {
                document.getElementById('modal-v').style.display = 'flex';
                const isDrive = p.yt.length > 20;
                document.getElementById('video-player').innerHTML = isDrive 
                    ? `<iframe src="https://drive.google.com/file/d/${p.yt}/preview" width="100%" height="100%"></iframe>`
                    : `<div id="yt-player"></div>`;
                if(!isDrive) {
                    ytPlayer = new YT.Player('yt-player', { videoId: p.yt, playerVars: { 'autoplay': 1 } });
                }
            }
        }

        function closeModals() {
            document.getElementById('modal-v').style.display = 'none';
            document.getElementById('video-player').innerHTML = '';
        }

        function manualSlide(dir) {
            const imgs = document.querySelectorAll('#image-container img');
            if(imgs.length <= 1) return;
            imgs[slideIndex].classList.remove('active-slide');
            slideIndex = (slideIndex + dir + imgs.length) % imgs.length;
            imgs[slideIndex].classList.add('active-slide');
            resetSlideTimer();
        }

        function resetIntervals() {
            clearInterval(mainRotation);
            mainRotation = setInterval(() => { currentIndex = (currentIndex + 1) % filteredProjects.length; updateDisplay(); }, 8000);
        }

        function resetSlideTimer() {
            clearInterval(slideRotation);
            if(document.querySelectorAll('#image-container img').length > 1) {
                slideRotation = setInterval(() => manualSlide(1), 3000);
            }
        }

        function showSection(sec) {
            document.getElementById('work-section').style.display = sec === 'work' ? 'block' : 'none';
            document.getElementById('about-section').style.display = sec === 'about' ? 'block' : 'none';
        }

        function toggleDropdown(e) { 
            e.stopPropagation(); 
            document.getElementById("filter-options").classList.toggle("select-show"); 
        }

        window.onclick = () => document.getElementById("filter-options").classList.remove("select-show");
        window.onload = () => { setLanguage('es'); updateDisplay(); resetIntervals(); };
        window.onresize = alignThumbnails; // Re-alinear si cambia el tamaño de la ventana
    </script>
</body>
</html>
