<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow: hidden;
        }

        /* --- NAVEGACIÓN --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 40px 50px;
            z-index: 1000;
            mix-blend-mode: difference;
        }

        .brand h1 { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.03em; }
        .brand p { font-size: 0.9rem; font-weight: 300; margin-top: 5px; }

        nav ul { list-style: none; text-align: right; }
        nav ul li a { text-decoration: none; color: var(--hueso); font-size: 0.85rem; font-weight: 500; opacity: 0.6; transition: 0.3s; }
        nav ul li a:hover, .active-nav { opacity: 1; }

        /* --- SECCIÓN LISTADO (FILMS) --- */
        #films-list-section {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            position: relative;
        }

        .bg-preview {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .bg-preview.active { opacity: 0.4; }
        .bg-preview iframe { width: 100vw; height: 100vh; object-fit: cover; pointer-events: none; }

        .list-container { z-index: 10; }
        .list-container p { font-size: 0.9rem; margin-bottom: 20px; font-weight: 500; }

        .film-item {
            font-size: 5.5rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -0.04em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.3);
            transition: all 0.3s ease;
            display: block;
            text-decoration: none;
            margin-bottom: 5px;
        }

        .film-item:hover, .film-item.selected {
            color: var(--hueso);
            -webkit-text-stroke: 0px;
        }

        /* --- SECCIÓN DETALLE (SINGLE PROJECT) --- */
        #project-detail-section {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 2000;
            display: none;
            flex-direction: column;
            padding: 120px 50px 50px;
            overflow-y: auto;
        }

        .back-btn {
            position: absolute;
            top: 40px; right: 50px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--hueso);
            cursor: pointer;
            z-index: 2100;
        }

        .detail-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            margin-bottom: 40px;
        }

        .detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 100px;
        }

        .detail-info h2 {
            font-size: 4rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.85;
            margin-bottom: 20px;
        }

        .detail-meta {
            font-size: 0.9rem;
            line-height: 1.8;
            opacity: 0.8;
            text-transform: none;
        }

        .detail-meta strong {
            text-transform: uppercase;
            font-weight: 800;
            font-size: 0.75rem;
            display: block;
            margin-top: 15px;
        }

        @media (max-width: 900px) {
            .film-item { font-size: 2.5rem; }
            .detail-info { grid-template-columns: 1fr; gap: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1 onclick="showSection('films')">Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active-nav" onclick="showSection('films')">/ films</a></li>
                <li><a href="mailto:leandrobrunoeditor@gmail.com">/ contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="films-list-section">
        <div id="bg-container"></div>
        
        <div class="list-container">
            <p>selected work</p>
            <div id="films-anchor-list">
                </div>
        </div>
    </section>

    <section id="project-detail-section">
        <div class="back-btn" onclick="closeDetail()">[ close ]</div>
        <div id="detail-content">
            </div>
    </section>

    <script>
        const featuredProjects = [
            {
                title: "menem",
                cat: "serie",
                yt: "-2AmqmciWXE",
                dir: "ariel winograd",
                prod: "claxon / prime video",
                desc: "biopic que recorre el ascenso al poder de carlos menem en los años 90. una exploración sobre el carisma, la política y la cultura argentina de una era inolvidable. [cite: 292, 293]"
            },
            {
                title: "oreo",
                cat: "advertising",
                yt: "7Cllu0Rme74",
                dir: "martín jalfen",
                prod: "pop studios - méxico",
                desc: "campaña publicitaria global para oreo, destacando dinamismo y ritmo visual. [cite: 295, 296]"
            },
            {
                title: "el tiempo de las moscas",
                cat: "serie",
                yt: "A0d6wnlMRRk",
                dir: "benjamín naishtat y ana katz",
                prod: "netflix",
                desc: "dos mujeres intentan reconstruir sus vidas tras salir de prisión, enfrentando un mundo que ha cambiado radicalmente mientras ellas estaban encerradas. [cite: 297, 298]"
            },
            {
                title: "blair",
                cat: "music video",
                yt: "ItX5aqhqsmo",
                dir: "dana campanello",
                prod: "poster",
                desc: "primer adelanto del disco bar scorpios (2025). [cite: 305]"
            },
            {
                title: "coppola",
                cat: "serie",
                yt: "ecr24akKDbs",
                dir: "ariel winograd",
                prod: "pampa films / disney+",
                desc: "la historia de guillermo coppola, el representante más famoso de argentina, en una travesía llena de excesos, humor y nostalgia noventera. [cite: 302, 303]"
            }
        ];

        function initFilms() {
            const list = document.getElementById('films-anchor-list');
            const bgContainer = document.getElementById('bg-container');

            featuredProjects.forEach((p, idx) => {
                // Crear links de la lista
                const a = document.createElement('a');
                a.href = "#";
                a.className = "film-item";
                a.innerText = p.title;
                
                // Efecto hover para el background
                a.onmouseenter = () => {
                    bgContainer.innerHTML = `<div class="bg-preview active">
                        <iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${p.yt}" frameborder="0"></iframe>
                    </div>`;
                };
                a.onmouseleave = () => { bgContainer.innerHTML = ''; };
                
                // Click para abrir detalle
                a.onclick = (e) => {
                    e.preventDefault();
                    openDetail(p);
                };

                list.appendChild(a);
            });
        }

        function openDetail(p) {
            const section = document.getElementById('project-detail-section');
            const content = document.getElementById('detail-content');
            
            section.style.display = 'flex';
            content.innerHTML = `
                <div class="detail-video">
                    <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="detail-info">
                    <div>
                        <h2>${p.title}</h2>
                        <p style="opacity:0.6">${p.cat}</p>
                    </div>
                    <div class="detail-meta">
                        <p>${p.desc}</p>
                        <strong>director</strong>
                        <p>${p.dir}</p>
                        <strong>production companies</strong>
                        <p>${p.prod}</p>
                    </div>
                </div>
            `;
        }

        function closeDetail() {
            document.getElementById('project-detail-section').style.display = 'none';
            document.getElementById('detail-content').innerHTML = '';
        }

        function showSection(sec) {
            // En esta arquitectura, 'films' es la raíz
            closeDetail();
        }

        window.onload = initFilms;
    </script>
</body>
</html>
