<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grafito: #1a1a1a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
            --transition-smooth: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-grafito);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow-x: hidden;
        }

        /* --- FONDO VIDEO HOME --- */
        .bg-preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: var(--bg-grafito); overflow: hidden;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 2s ease-in-out;
            pointer-events: none;
        }
        .bg-video.active { opacity: 0.35; }
        .bg-video iframe {
            width: 150vw; height: 150vh;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.6);
        }

        /* --- HEADER ESTILO ARMALEO --- */
        .header-main {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 50px 80px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 9999; transition: all 0.5s var(--transition-smooth);
            pointer-events: none;
        }
        .header-main * { pointer-events: auto; }
        
        /* Estado cuando scrolleas o estás fuera del home */
        .header-main.scrolled {
            padding: 30px 80px;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 228, 0.05);
        }

        .brand-header { cursor: pointer; }
        .brand-header h2 { font-size: 2.2rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.04em; }
        .brand-header p { font-size: 0.8rem; font-weight: 200; margin-top: 6px; opacity: 0.8; letter-spacing: 0.05em; }

        .nav-menu { display: flex; gap: 45px; margin-top: 10px; }
        .nav-item { position: relative; }
        .nav-link {
            text-decoration: none; color: var(--hueso); font-size: 1.05rem;
            font-weight: 500; opacity: 0.5; transition: 0.3s; cursor: pointer;
        }
        .nav-link:hover { opacity: 1; }
        
        /* Dropdown Work */
        .dropdown-work {
            position: absolute; top: 100%; left: 0; padding-top: 20px;
            display: none; flex-direction: column; gap: 12px; min-width: 180px;
        }
        .nav-item:hover .dropdown-work { display: flex; }
        .dropdown-link {
            text-decoration: none; color: var(--hueso); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.2em; opacity: 0.3; transition: 0.3s;
        }
        .dropdown-link:hover { opacity: 1; padding-left: 8px; }

        /* --- SECCIONES --- */
        section { display: none; position: relative; z-index: 100; min-height: 100vh; }

        /* HOME */
        #home-section { display: flex; align-items: center; padding: 0 80px; }
        .film-item { 
            font-size: 4.8rem; font-weight: 800; text-transform: uppercase; line-height: 0.85; 
            letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2); 
            display: block; text-decoration: none; margin-bottom: 8px; transition: 0.5s;
        }
        .film-item.active, .film-item:hover { color: var(--hueso); -webkit-text-stroke: 0px; transform: translateX(25px); }

        /* --- LAYOUTS DE PROYECTOS --- */
        #work-section { padding: 180px 80px 100px; }

        /* 1. Lista técnica (Para "All") */
        .list-layout .project-row { 
            display: grid; grid-template-columns: 420px 1.4fr 1.2fr; gap: 60px; 
            padding: 45px 0; border-bottom: 1px solid rgba(255, 255, 228, 0.05);
            text-decoration: none; color: inherit; align-items: start;
        }
        .list-layout .thumb-box { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; }
        .list-layout .thumb-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 0.6s; }
        .list-layout .project-row:hover .thumb-box img { opacity: 1; }
        .list-layout .info-box h3 { font-size: 2.8rem; font-weight: 800; text-transform: uppercase; line-height: 0.85; margin-bottom: 18px; }
        .list-layout .meta-line { font-size: 0.9rem; opacity: 0.45; margin-bottom: 5px; }
        .list-layout .desc-box { font-size: 0.95rem; opacity: 0.45; line-height: 1.6; font-weight: 300; }

        /* 2. Grid 2 Columnas (Para Categorías) */
        .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
        .grid-card { position: relative; aspect-ratio: 16/9; overflow: hidden; cursor: pointer; background: #000; }
        .grid-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: 0.8s var(--transition-smooth); }
        .grid-card:hover img { transform: scale(1.05); opacity: 0.4; }
        .grid-card .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            opacity: 0; transition: 0.4s;
        }
        .grid-card:hover .card-info { opacity: 1; }
        .grid-card h3 { font-size: 2rem; font-weight: 800; text-transform: uppercase; }

        /* ABOUT */
        #about-section { padding: 0 80px; display: none; align-items: center; background: var(--bg-grafito); }
        .about-text { max-width: 1000px; font-size: 3rem; font-weight: 500; line-height: 1.1; letter-spacing: -0.02em; }
        .about-text strong { font-weight: 800; }

        /* --- MODAL DETALLE --- */
        #project-detail { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 20000; display: none; overflow: hidden; }
        .detail-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .detail-background iframe, .detail-background img { width: 100%; height: 100%; object-fit: cover; border: none; }
        .detail-content { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 80px; pointer-events: none; }
        .detail-content * { pointer-events: auto; }
        .detail-header h2 { font-size: 5rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; margin-bottom: 40px; }
        .close-btn { position: fixed; top: 40px; right: 60px; z-index: 20100; cursor: pointer; background: rgba(0,0,0,0.3); padding: 12px 25px; border-radius: 50px; backdrop-filter: blur(10px); text-transform: uppercase; font-size: 0.75rem; font-weight: 800; }
        
        .gallery-nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; z-index: 10; pointer-events: none; }
        .nav-arrow { width: 60px; height: 60px; background: rgba(0,0,0,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; font-size: 1.5rem; opacity: 0.5; color: white; transition: 0.3s; }
        .nav-arrow:hover { opacity: 1; background: rgba(0,0,0,0.5); }
        .gallery-counter { position: fixed; top: 45px; left: 60px; z-index: 20100; font-size: 0.8rem; font-weight: 800; opacity: 0.5; }

        /* IDIOMAS */
        .lang-switcher { position: fixed; bottom: 40px; right: 60px; z-index: 5000; display: flex; gap: 15px; }
        .lang-btn { background: none; border: none; color: var(--hueso); font-size: 0.8rem; font-weight: 700; cursor: pointer; opacity: 0.3; }
        .lang-btn.active { opacity: 1; text-decoration: underline; }

        @media (max-width: 1200px) {
            .list-layout .project-row { grid-template-columns: 1fr; }
            .grid-layout { grid-template-columns: 1fr; }
            .about-text { font-size: 1.8rem; }
            .header-main { padding: 30px 40px; }
        }
    </style>
</head>
<body>

    <div class="bg-preview-container" id="bg-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <header class="header-main" id="main-header">
        <div class="brand-header" onclick="showSection('home')">
            <h2>Leandro Bruno</h2>
            <p>film editor</p>
        </div>
        <nav class="nav-menu">
            <div class="nav-item">
                <a class="nav-link" onclick="showSection('all')">work</a>
                <div class="dropdown-work" id="cat-dropdown"></div>
            </div>
            <div class="nav-item"><a class="nav-link" onclick="showSection('about')">about</a></div>
            <div class="nav-item"><a class="nav-link" href="mailto:leandrobrunoeditor@gmail.com">contact</a></div>
        </nav>
    </header>

    <div class="lang-switcher">
        <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <section id="home-section">
        <div id="featured-list"></div>
    </section>

    <section id="work-section">
        <div id="work-content"></div>
    </section>

    <section id="about-section">
        <div class="about-text" id="about-content"></div>
    </section>

    <div id="project-detail">
        <div class="gallery-counter" id="img-counter"></div>
        <div class="close-btn" onclick="closeDetail()">[ <span id="close-label">cerrar</span> ]</div>
        <div class="gallery-nav" id="gallery-ui" style="display:none">
            <div class="nav-arrow" onclick="changeImg(-1)">&#10094;</div>
            <div class="nav-arrow" onclick="changeImg(1)">&#10095;</div>
        </div>
        <div class="detail-background" id="detail-bg"></div>
        <div class="detail-content" id="detail-dynamic-content"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const i18n = {
            es: { close: "cerrar", director: "director", prod: "producción", about_text: "<strong>leandro bruno</strong> es un editor de cine y publicidad con base en buenos aires. se especializa en montaje rítmico y narrativa para plataformas globales como netflix, disney+ y prime video." },
            en: { close: "close", director: "director", prod: "production", about_text: "<strong>leandro bruno</strong> is a film and advertising editor based in buenos aires. he specializes in rhythmic editing and narrative for global platforms such as netflix, disney+, and prime video." }
        };

        const projects = [
            { title_es: "menem", category: "serie", episodes: 8, platform: "prime", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "biopic que recorre el ascenso al poder de carlos menem en los años 90." },
            { title_es: "OREO - Sigamos divirtiendonos", category: "advertising", images: ["assets/Oreo_Thumbnail_5.png", "assets/Oreo_Thumbnail_1.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México", desc_es: "campaña publicitaria global para oreo." },
            { title_es: "el tiempo de las moscas", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg"], yt: "A0d6wnlMRRk", director: "ana katz", prod: "netflix", desc_es: "dos mujeres intentan reconstruir sus vidas tras salir de prisión." },
            { title_es: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "mb2RPesGf7Q", director: "nico alarcos", prod: "primo", desc_es: "campaña de gira de winona riders." },
            { title_es: "coppola, el representante", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films", desc_es: "la historia de guillermo coppola." },
            { title_es: "blair - Todo lo que tengo", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "adelanto del disco bar scorpios." },
            { title_es: "las manos de la abuela", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png", "assets/MA_Thumbnail_2.png", "assets/MA_Thumbnail_3.png"], yt: "", director: "camila migliore", prod: "calesita films", desc_es: "cortometraje sobre memoria y legado." },
            { title_es: "ratones paranoicos", category: "music video", images: ["assets/RP_Thumbmail_1.png"], yt: "", director: "alex roux", prod: "poster", desc_es: "pieza audiovisual para la banda de rock." }
        ];

        let currentLang = 'es', activePaneId = 1, currentIdx = 0, previewTimer, currentProject = null, currentImgIdx = 0;

        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            const isHome = document.getElementById('home-section').style.display === 'flex';
            if (window.scrollY > 50 || !isHome) header.classList.add('scrolled');
            else header.classList.remove('scrolled');
        });

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            document.getElementById('about-content').innerHTML = i18n[currentLang].about_text;
            document.getElementById('close-label').innerText = i18n[currentLang].close;
            renderLists();
        }

        function renderLists() {
            // Dropdown de categorías
            const drop = document.getElementById('cat-dropdown');
            drop.innerHTML = '';
            const cats = [...new Set(projects.map(p => p.category))];
            cats.forEach(c => {
                const a = document.createElement('a'); a.className = 'dropdown-link'; a.innerText = c;
                a.onclick = () => showSection(c);
                drop.appendChild(a);
            });

            // Home List
            const featList = document.getElementById('featured-list');
            featList.innerHTML = '';
            const featured = projects.filter(p => p.yt);
            featured.forEach((p, idx) => {
                const a = document.createElement('a'); a.className = "film-item " + (idx === 0 ? 'active' : '');
                a.innerText = p.title_es;
                a.onmouseenter = () => { updateHomeUI(idx); changeHeroProject(idx); };
                a.onclick = () => openDetail(p);
                featList.appendChild(a);
            });
        }

        function showSection(type) {
            const sections = { home: 'home-section', work: 'work-section', about: 'about-section' };
            Object.values(sections).forEach(id => document.getElementById(id).style.display = 'none');
            
            const workDiv = document.getElementById('work-content');
            const bg = document.getElementById('bg-container');
            const header = document.getElementById('main-header');

            if (type === 'home') {
                document.getElementById('home-section').style.display = 'flex';
                bg.style.display = 'block';
                header.classList.remove('scrolled');
                changeHeroProject(0);
            } else if (type === 'about') {
                document.getElementById('about-section').style.display = 'flex';
                bg.style.display = 'none';
                header.classList.add('scrolled');
                clearTimeout(previewTimer);
            } else {
                document.getElementById('work-section').style.display = 'block';
                bg.style.display = 'none';
                header.classList.add('scrolled');
                clearTimeout(previewTimer);

                if (type === 'all') {
                    workDiv.className = 'list-layout';
                    workDiv.innerHTML = projects.map(p => `
                        <a class="project-row" onclick="openDetailByName('${p.title_es}')">
                            <div class="thumb-box"><img src="${p.images[0]}"></div>
                            <div class="info-box"><h3>${p.title_es}</h3><div class="meta-line">d: ${p.director}</div><div class="meta-line">p: ${p.prod}</div></div>
                            <div class="desc-box">${p.desc_es}</div>
                        </a>
                    `).join('');
                } else {
                    workDiv.className = 'grid-layout';
                    const filtered = projects.filter(p => p.category === type);
                    workDiv.innerHTML = filtered.map(p => `
                        <div class="grid-card" onclick="openDetailByName('${p.title_es}')">
                            <img src="${p.images[0]}">
                            <div class="card-info"><h3>${p.title_es}</h3><p>${p.director}</p></div>
                        </div>
                    `).join('');
                }
            }
            window.scrollTo(0,0);
        }

        function openDetailByName(name) { openDetail(projects.find(p => p.title_es === name)); }

        function openDetail(p) {
            currentProject = p; currentImgIdx = 0;
            const det = document.getElementById('project-detail');
            const bg = document.getElementById('detail-bg');
            const ui = document.getElementById('gallery-ui');
            
            if(p.yt) {
                bg.innerHTML = `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0" style="width:100%;height:100%;"></iframe>`;
                ui.style.display = 'none';
                document.getElementById('img-counter').innerText = '';
            } else {
                updateGalleryImg();
                ui.style.display = p.images.length > 1 ? 'flex' : 'none';
            }
            
            document.getElementById('detail-dynamic-content').innerHTML = `
                <div class="detail-header"><h2>${p.title_es}</h2></div>
                <div style="font-size:1rem; opacity:0.6">director: ${p.director} | producción: ${p.prod}</div>
            `;
            det.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function updateGalleryImg() {
            document.getElementById('detail-bg').innerHTML = `<img src="${currentProject.images[currentImgIdx]}" style="width:100%;height:100%;object-fit:cover;">`;
            document.getElementById('img-counter').innerText = `${currentImgIdx + 1} / ${currentProject.images.length}`;
        }

        function changeImg(dir) {
            currentImgIdx = (currentImgIdx + dir + currentProject.images.length) % currentProject.images.length;
            updateGalleryImg();
        }

        function closeDetail() {
            document.getElementById('project-detail').style.display = 'none';
            document.getElementById('detail-bg').innerHTML = '';
            document.body.style.overflow = 'auto';
            if(document.getElementById('home-section').style.display === 'flex') changeHeroProject(currentIdx);
        }

        function updateHomeUI(idx) { 
            currentIdx = idx;
            document.querySelectorAll('.film-item').forEach((el, i) => el.classList.toggle('active', i === idx)); 
        }

        function changeHeroProject(idx) {
            clearTimeout(previewTimer);
            const featured = projects.filter(p => p.yt);
            const nextPaneId = activePaneId === 1 ? 2 : 1;
            const nextPane = document.getElementById(`pane-${nextPaneId}`);
            const p = featured[idx];
            nextPane.innerHTML = `<div id="yt-${Date.now()}"></div>`;
            new YT.Player(nextPane.firstChild.id, {
                videoId: p.yt, 
                playerVars: { autoplay: 1, mute: 1, controls: 0, start: 15, loop: 1, playlist: p.yt },
                events: { onReady: (e) => { 
                    nextPane.classList.add('active'); 
                    document.getElementById(`pane-${activePaneId}`).classList.remove('active');
                    activePaneId = nextPaneId;
                    previewTimer = setTimeout(() => {
                        let nIdx = (idx + 1) % featured.length;
                        updateHomeUI(nIdx); changeHeroProject(nIdx);
                    }, 8000);
                } }
            });
        }

        window.onload = () => { setLang('es'); showSection('home'); };
    </script>
</body>
</html>
