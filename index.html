<!DOCTYPE html>

<head>

    <title>Tu Nombre | Portfolio</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap">
    <style>
        :root { --bg: #000; --text: #fff; --gray: #666; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; }
        
        nav { display: flex; justify-content: space-between; padding: 40px 5%; align-items: center; }
        .logo { font-weight: 700; letter-spacing: 3px; font-size: 1.1rem; text-transform: uppercase; }
        .menu a { text-decoration: none; color: var(--gray); margin-left: 25px; font-size: 0.75rem; letter-spacing: 1.5px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(45%, 1fr)); gap: 15px; padding: 0 15px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .project { position: relative; cursor: pointer; overflow: hidden; aspect-ratio: 16/9; background: #111; }
        .project img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
        .project:hover img { opacity: 0.3; transform: scale(1.02); }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: 0.4s; }
        .project:hover .overlay { opacity: 1; }
        .overlay h2 { font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; }

        /* Estilo para el reproductor de video */
        .video-container { padding: 56.25% 0 0 0; position: relative; width: 80%; margin: auto; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
