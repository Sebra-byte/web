<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230F0F0F'/><text x='50' y='65' font-family='Playfair Display, serif' font-size='50' fill='%23E8E6E1' text-anchor='middle'>lb</text></svg>">
    
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* --- PALETA MONOCROMÁTICA --- */
            --bg-color: #0F0F0F; 
            --text: #E8E6E1;     
            
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --grid-gap: 0px; 
            --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%; width: 100%;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden; 
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background-color: var(--bg-color); }
        ::-webkit-scrollbar-thumb {
            background-color: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #555; }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; 
            padding: 30px 50px; 
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 500; pointer-events: none; 
            background: transparent;
            transition: background 0.4s ease, padding 0.4s ease;
        }
        
        nav.solid-bg { 
            background-color: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            pointer-events: auto; 
            border-bottom: 1px solid rgba(232, 230, 225, 0.05);
        }
        
        .brand, .nav-links a, .lang-container, .hamburger { pointer-events: auto; cursor: pointer; }
        
        .brand {
            font-size: clamp(1.45rem, 2vw, 2.35rem); 
            font-weight: 600; letter-spacing: -0.5px; text-transform: lowercase;
            line-height: 1; font-family: var(--font-serif); color: var(--text);
            z-index: 501; position: relative;
            transition: transform 0.3s ease;
        }
        .brand:hover { transform: scale(1.02); }

        .brand span {
            display: block; font-family: var(--font-main); font-size: 0.45em;
            letter-spacing: 2px; opacity: 0.8; margin-top: 4px;
            text-transform: uppercase; font-weight: 400;
        }
        
        .nav-links { display: flex; gap: 10px; padding-top: 0; align-items: center; }
        
        .nav-links a {
            color: var(--text); text-decoration: none; 
            font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.7;
            transition: all 0.3s ease; position: relative;
            display: inline-block; padding: 20px 15px; margin: -10px 0;
        }
        
        .nav-links a:hover { opacity: 1; transform: translateY(-2px); }
        .nav-hidden { opacity: 0 !important; pointer-events: none; transform: translateY(-10px); }

        /* --- LANGUAGE TOGGLE --- */
        .lang-container {
            position: relative; overflow: hidden; height: 32px; min-width: 44px;
            border: 1px solid rgba(232, 230, 225, 0.3); border-radius: 4px;
            margin-left: 25px; margin-right: 0; transition: border-color 0.3s ease;
        }
        .lang-container:hover { border-color: var(--text); }
        .lang-track {
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .lang-opt {
            height: 30px; display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.75rem; text-transform: uppercase;
        }
        .lang-container.es-active .lang-track { transform: translateY(-30px); }

        /* --- MOBILE MENU --- */
        .hamburger {
            display: none; font-size: 1.5rem; color: var(--text); z-index: 600;
            padding: 15px; margin: -15px; transition: transform 0.3s ease;
        }
        
        #mobile-menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 15, 15, 0.98);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 550; display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #mobile-menu-overlay.open { opacity: 1; pointer-events: auto; }
        
        .mobile-links { display: flex; flex-direction: column; gap: 40px; text-align: center; }
        .mobile-links a {
            font-family: var(--font-serif); font-size: 2.2rem; color: var(--text);
            text-decoration: none; cursor: pointer; opacity: 0; transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease; padding: 20px;
        }
        
        #mobile-menu-overlay.open .mobile-links a:nth-child(1) { transition-delay: 0.1s; opacity: 1; transform: translateY(0); }
        #mobile-menu-overlay.open .mobile-links a:nth-child(2) { transition-delay: 0.2s; opacity: 1; transform: translateY(0); }
        #mobile-menu-overlay.open .mobile-links a:nth-child(3) { transition-delay: 0.3s; opacity: 1; transform: translateY(0); }
        #mobile-menu-overlay.open .mobile-links .mobile-lang-container { transition-delay: 0.4s; opacity: 1; transform: translateY(0); }

        .mobile-lang-container {
            position: relative; overflow: hidden; height: 42px; width: 80px;
            border: 1px solid var(--text); border-radius: 50px;
            margin: 20px auto 0; cursor: pointer; opacity: 0; transform: translateY(20px);
            transition: all 0.3s ease;
        }
        .mobile-lang-container .lang-opt { height: 40px; font-size: 1rem; }
        .mobile-lang-container.es-active .lang-track { transform: translateY(-40px); }

        /* --- CAROUSEL --- */
        .carousel { height: 100vh; width: 100vw; position: relative; z-index: 1; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
            padding: 0 0 60px 60px; cursor: pointer;
        }
        .slide.active { opacity: 1; z-index: 1; }
        .bg-media {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            object-fit: cover; transform: translate(-50%, -50%) scale(1.08);
            transition: transform 7s ease-out; z-index: 0;
            opacity: 0.85; 
        }
        .slide.active .bg-media { transform: translate(-50%, -50%) scale(1); }
        
        .slide-info {
            position: relative; z-index: 2; max-width: 1100px; opacity: 0;
            transform: translateY(30px); transition: all 1s var(--transition-smooth) 0.3s;
            text-align: left; 
        }
        .slide.active .slide-info { opacity: 1; transform: translateY(0); }

        .label-text {
            font-family: var(--font-main); font-size: 0.65rem; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text); opacity: 0.8; margin-bottom: 15px;
            display: block; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .project-title {
            font-family: var(--font-serif); font-size: clamp(2.5rem, 4vw, 4rem); 
            margin-bottom: 15px; letter-spacing: -1px; line-height: 0.9; color: var(--text);
            text-shadow: 0 2px 20px rgba(0,0,0,0.8); display: block; font-weight: 400;
        }
        .credits {
            display: flex; gap: 20px; font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 10px; color: var(--text); opacity: 0.8;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); font-family: var(--font-main);
        }
        .credits span b { color: var(--text); margin-right: 5px; font-weight: 600; text-transform: lowercase; }
        
        /* FLECHAS DESKTOP */
        .carousel-arrows {
            position: absolute; top: 50%; width: 100%; transform: translateY(-50%);
            display: flex; justify-content: space-between; padding: 0 30px; z-index: 10;
            pointer-events: none; 
        }
        .arrow {
            color: rgba(232, 230, 225, 0.3); font-size: 1.5rem; cursor: pointer;
            pointer-events: auto; transition: all 0.3s ease; padding: 20px;
        }
        .arrow:hover { color: var(--text); transform: scale(1.2); }
        
        /* --- A24 UI --- */
        .a24-ui {
            display: flex; flex-direction: column; align-items: flex-end;
            position: absolute; bottom: 40px; right: 50px; z-index: 20;
            color: var(--text); font-family: var(--font-main); pointer-events: none; 
        }
        
        .counter-box {
            font-size: 1.1rem; font-weight: 500; letter-spacing: 1px;
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .progress-container {
            width: 100%; height: 2px; background: rgba(232, 230, 225, 0.1);
            margin-bottom: 25px; position: relative; width: 60px;
        }
        
        .progress-bar {
            height: 100%; background: var(--text); width: 0%;
            transition: width 0.1s linear; box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .scroll-down-btn {
            font-size: 1.5rem; cursor: pointer; pointer-events: auto;
            opacity: 0.8; animation: bounce 2s infinite; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        /* --- GRID SYSTEM --- */
        .project-grid {
            display: grid; grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: 350px; grid-auto-flow: dense; 
            gap: var(--grid-gap); 
            max-width: 1800px; margin: 0 auto; 
            width: 100%;
        }

        .grid-item { position: relative; overflow: hidden; cursor: pointer; background-color: #0c0c0c; }
        .grid-item.half { grid-column: span 6; } 
        .grid-item.third { grid-column: span 4; } 
        .grid-item.three-quarters { grid-column: span 9; } 
        .grid-item.quarter { grid-column: span 3; } 
        .grid-item.tall { grid-row: span 2; } 

        .grid-item img, .grid-item video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; 
            transition: opacity 0.6s ease, transform 0.6s var(--transition-smooth), filter 0.3s ease;
        }
        
        .grid-item img { filter: grayscale(20%) brightness(0.9); opacity: 0; z-index: 1; }
        .grid-item img.img-loaded { opacity: 1; }
        
        .grid-item video {
            z-index: 2; opacity: 0; filter: grayscale(10%); pointer-events: none;
        }
        .grid-item video.is-playing { opacity: 1; }

        .grid-item:hover img { transform: scale(1.05); filter: grayscale(0%) brightness(1); }
        .grid-item:hover video { transform: scale(1.05); filter: grayscale(0%); }

        .item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(15, 15, 15, 0.95) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s ease;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; 
            pointer-events: none; z-index: 3;
        }
        .grid-item:hover .item-overlay { opacity: 1; }
        
        .item-title {
            font-family: var(--font-serif); font-size: 1.4rem; color: var(--text);
            margin-bottom: 8px; line-height: 1.1; display: inline-block;
            border-bottom: 1px solid rgba(232, 230, 225, 0.2); padding-bottom: 4px;
        }
        .item-meta {
            font-family: var(--font-main); font-size: 0.7rem; color: var(--text);
            letter-spacing: 0.5px; text-transform: uppercase; margin-top: 5px; opacity: 0.8;
        }
        .item-meta span { margin-right: 15px; }

        /* --- BOTTOM FOOTER --- */
        .grid-footer {
            display: flex; justify-content: center; align-items: center;
            padding: 80px 0;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.3s ease;
            background: transparent;
        }
        .grid-footer:hover { opacity: 0.7; }
        
        .back-to-top-text {
            font-family: var(--font-main);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .back-to-top-text span { font-size: 1.5rem; color: var(--text); }

        /* --- OVERLAYS --- */
        .overlay-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 400; 
            padding: 120px 40px 0px 40px; 
            overflow-y: auto; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s var(--transition-smooth); 
            transform: translateY(30px);
        }
        .overlay-section.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        /* --- PROJECT DETAIL STYLES (3-COLUMN LAYOUT) --- */
        .project-detail-container {
            max-width: 1800px; margin: 0 auto;
            color: var(--text);
            display: grid;
            grid-template-columns: 350px 1fr 200px; /* INFO | MEDIA | NAV */
            gap: 60px;
            padding-bottom: 100px;
        }
        
        .pd-left-col { position: sticky; top: 120px; height: fit-content; text-align: left; }
        .pd-center-col { display: flex; flex-direction: column; gap: 40px; }
        
        /* 3ra Columna para el Botón Siguiente */
        .pd-right-col { 
            position: sticky; top: 0; height: 100vh; 
            display: flex; flex-direction: column;
            justify-content: flex-end; /* Botón abajo */
            align-items: flex-end; /* Alineado a la derecha */
            padding-bottom: 80px; /* Espacio desde el fondo */
        }

        .pd-header { margin-bottom: 40px; }
        .pd-title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 3vw, 3.5rem);
            line-height: 1.1; margin-bottom: 15px; font-weight: 400;
        }
        .pd-meta {
            font-family: var(--font-main); font-size: 0.85rem; letter-spacing: 1.5px;
            opacity: 0.7; text-transform: uppercase; color: var(--text);
        }
        .pd-synopsis {
            font-family: var(--font-main); font-size: 1rem; line-height: 1.7;
            font-weight: 300; opacity: 0.9; margin-bottom: 40px;
        }
        .pd-credits-list { display: flex; flex-direction: column; gap: 15px; }
        .pd-credit-row { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(232, 230, 225, 0.1); padding-bottom: 8px;}
        .pd-role { font-family: var(--font-main); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; opacity: 0.6; }
        .pd-name { font-family: var(--font-main); font-size: 0.85rem; text-align: right; font-weight: 400; }
        
        .pd-hero { 
            width: 100%; aspect-ratio: 16/9; background: #000; position: relative; 
            display: flex; justify-content: center; align-items: center;
        }
        .pd-hero iframe, .pd-hero img { width: 100%; height: 100%; object-fit: cover; border: none; }
        .pd-gallery { display: flex; flex-direction: column; gap: 40px; }
        .pd-gallery img { width: 100%; height: auto; object-fit: cover; filter: grayscale(10%); transition: filter 0.3s; }
        .pd-gallery img:hover { filter: grayscale(0%); }

        .pd-nav-btn { 
            text-align: right; cursor: pointer; opacity: 0.5; 
            transition: opacity 0.3s ease, transform 0.3s ease; 
        }
        .pd-nav-btn:hover { opacity: 1; transform: translateX(5px); }
        
        .pd-next-label { 
            display: block; font-family: var(--font-main); font-size: 0.9rem; 
            text-transform: uppercase; letter-spacing: 2px; color: var(--text); 
            font-weight: 600; 
        }

        /* --- ABOUT & MODAL --- */
        /* Ajuste para que el contenedor del About sea más ancho */
        .about-container { max-width: 1200px; margin: 0 auto; padding-top: 100px; padding-bottom: 100px; }

        /* --- ABOUT NEW LAYOUT --- */
        .about-split {
            display: grid;
            grid-template-columns: 350px 1fr; /* Fija el ancho de la foto */
            gap: 60px;
            align-items: start; /* Alinea foto y texto arriba */
            text-align: left;
        }
        .about-img-col {
            width: 100%;
            /* aspect-ratio eliminado para que no fuerce la altura */
            overflow: hidden;
        }
        .about-portrait {
            width: 100%;
            height: auto; /* Altura automática según la imagen */
            max-height: 450px; /* Límite de altura para equilibrar con el texto */
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.5s ease;
        }
        .about-portrait:hover { filter: grayscale(0%); }

        /* Título H3 eliminado del CSS porque ya no está en el HTML */

        .about-bio-text {
            font-family: var(--font-main);
            font-size: 1.1rem;
            line-height: 1.7;
            opacity: 0.8;
            margin-bottom: 25px;
            font-weight: 300;
        }
        .about-bio-text strong { font-weight: 600; color: var(--text); opacity: 1; }

        /* NICE IMDB & CONTACT BUTTONS */
        .about-buttons {
            margin-top: 50px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .about-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            border: 1px solid var(--text);
            color: var(--text);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
        }
        .about-btn:hover {
            background: var(--text);
            color: var(--bg-color);
        }
        .about-btn svg { width: 18px; height: 18px; fill: currentColor; }

        #modal-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-color); z-index: 2000; overflow-y: auto; 
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #modal-container.open { opacity: 1; pointer-events: auto; }
        
        .modal-close {
            position: fixed; top: 30px; right: 40px; color: var(--text);
            font-size: 2rem; cursor: pointer; z-index: 2005; transition: transform 0.3s ease;
        }
        .modal-close:hover { transform: rotate(90deg); color: var(--text); }
        
        .modal-content { width: 100%; min-height: 100%; display: block; padding-top: 120px; padding-left: 40px; padding-right: 40px; }

        @media (max-width: 1400px) {
            .project-detail-container { grid-template-columns: 300px 1fr; gap: 40px; }
            .pd-right-col { 
                position: static; height: auto; 
                grid-column: 2; margin-top: 40px; 
                justify-content: flex-end; padding-bottom: 0; 
            }
        }
        @media (max-width: 1200px) {
            .project-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 300px; }
            .grid-item.half, .grid-item.third, .grid-item.three-quarters, .grid-item.quarter { grid-column: span 1; }
            .grid-item.half.tall { grid-row: span 2; }
            
            /* Responsive Modal */
            .project-detail-container { grid-template-columns: 1fr; }
            .pd-left-col { position: static; height: auto; margin-bottom: 40px; }
            .pd-right-col { grid-column: 1; justify-content: center; margin-top: 60px; align-items: center; }
            .pd-nav-btn { text-align: center; }

            /* Responsive About */
            .about-container { max-width: 100%; padding: 100px 20px; }
            .about-split { grid-template-columns: 1fr; gap: 40px; text-align: center; }
            .about-img-col { max-width: 300px; margin: 0 auto 30px auto; } /* Foto más chica en mobile */
            .about-buttons { justify-content: center; }
        }
        @media(max-width: 768px) {
            .carousel, body, html { height: 100dvh; } 
            .project-grid { display: flex; flex-direction: column; } 
            .grid-item, .grid-item.half, .grid-item.third, .grid-item.quarter { width: 100%; height: 500px; grid-column: auto; grid-row: auto; }
            .overlay-section { padding: 100px 0 0px 0; }
            .item-overlay { opacity: 1 !important; background: linear-gradient(to top, rgba(15,15,15,0.95) 0%, transparent 60%); padding: 20px 30px; }
            .item-title { font-size: 1.8rem; }
            .modal-content { padding: 100px 20px 40px 20px; }
            .project-detail-container { display: flex; flex-direction: column; gap: 40px; }
            .pd-left-col { position: static; }
            .pd-right-col { position: static; height: auto; justify-content: center; align-items: center; }
            .pd-title { font-size: 2.2rem; }
            .pd-hero { aspect-ratio: 16/9; }
            .pd-nav-btn { text-align: center; }
            nav { padding: 20px 30px; align-items: center; }
            .nav-links { display: none; }
            .hamburger { display: block; }
            .brand { font-size: 1.5rem; }
            .slide { padding: 0 30px 100px 30px; justify-content: flex-end; } 
            .slide-info { transform: translateY(0); opacity: 1; max-width: 90%; }
            .project-title { font-size: 2.8rem; border: none; }
            .credits { display: none; }
            .label-text { display: none; }
            .a24-ui { bottom: 30px; right: 30px; }
            .carousel-arrows { display: none; }
        }
    </style>
</head>
<body id="body-main">

    <nav id="navbar">
        <div class="brand" onclick="goHome()">
            leandro bruno
            <span>film editor</span>
        </div>
        
        <div class="nav-links">
            <a onclick="openIndex()" id="nav-projects">Projects</a>
            <a onclick="openAbout()" id="nav-about">About</a>
            <a href="mailto:leandrobrunoeditor@gmail.com" id="nav-contact">Contact</a>
            
            <div class="lang-container" onclick="toggleLanguage()">
                <div class="lang-track">
                    <span class="lang-opt">EN</span>
                    <span class="lang-opt">ES</span>
                </div>
            </div>
        </div>

        <div class="hamburger" onclick="toggleMobileMenu()">&#9776;</div>
    </nav>

    <div id="mobile-menu-overlay">
        <div class="mobile-links">
            <a onclick="openIndex(); toggleMobileMenu()" id="mob-nav-projects">Projects</a>
            <a onclick="openAbout(); toggleMobileMenu()" id="mob-nav-about">About</a>
            <a href="mailto:leandrobrunoeditor@gmail.com" id="mob-nav-contact">Contact</a>
            
            <div class="mobile-lang-container" onclick="toggleLanguage()">
                <div class="lang-track">
                    <span class="lang-opt">EN</span>
                    <span class="lang-opt">ES</span>
                </div>
            </div>
        </div>
    </div>

                        video.play().then(() => video.classList.add('is-playing')).catch(e => {});
                    } else {
                        video.pause();
                        video.classList.remove('is-playing');
                    }

                if(p.previewUrl) {
                    const vid = item.querySelector('video');
                    if(vid) videoObserver.observe(vid);
                }

                if(!p.previewUrl && p.images && p.images.length > 1) {
                    let hoverInterval; let imgIndex = 0;
                    item.onmouseenter = () => {
                        const img = item.querySelector('img');
                        p.images.forEach(src => { const i = new Image(); i.src = src; });
                        hoverInterval = setInterval(() => { imgIndex = (imgIndex + 1) % p.images.length; img.src = p.images[imgIndex]; }, 700);
                    };
                    item.onmouseleave = () => { clearInterval(hoverInterval); imgIndex = 0; item.querySelector('img').src = p.image; };
                }
            });
        }

        function playActiveVideo() {
            document.querySelectorAll('.carousel video').forEach(v => v.pause());
            const slides = document.querySelectorAll('.slide');
            if(slides.length > 0) {
                const video = slides[currentSlide].querySelector('video');
                if(video) { video.currentTime = 0; video.play().catch(e => {}); }
            }
        }

        function updateCarousel() {
            document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === currentSlide));
            uiCurrentDisplay.innerText = currentSlide + 1;
            uiProgressBar.style.width = '0%';
            playActiveVideo();
        }

        function goToSlide(index) { currentSlide = index; updateCarousel(); resetAutoPlay(); }
        function nextSlide() { currentSlide = (currentSlide + 1) % featuredProjects.length; updateCarousel(); resetAutoPlay(); }
        function prevSlide() { currentSlide = (currentSlide - 1 + featuredProjects.length) % featuredProjects.length; updateCarousel(); resetAutoPlay(); }
        
        function animateProgressBar() {
            const now = Date.now();
            const elapsed = now - progressStartTime;
            const percentage = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
            uiProgressBar.style.width = `${percentage}%`;
            if (percentage < 100) { progressInterval = requestAnimationFrame(animateProgressBar); }
        }

        function startAutoPlay() { 
            clearInterval(autoPlayInterval);
            cancelAnimationFrame(progressInterval);
            progressStartTime = Date.now();
            animateProgressBar(); 
            autoPlayInterval = setInterval(() => { nextSlide(); }, SLIDE_DURATION); 
        }
        function resetAutoPlay() { startAutoPlay(); }
        function onPlayerStateChange(event) { if (event.data === 0) { } }

        // --- NEW: SMART PROJECT DETAIL LOGIC (3-COLUMN SPLIT) ---
        function openProject(p) {
            pauseHero();
            modalContainer.classList.add('open');
            
            const title = getProjectTitle(p);
            const synopsis = p.synopsis ? (p.synopsis[currentLang] || p.synopsis.en || "") : "";
            const genre = p.genre || "";
            const year = p.year || "";
            const episodes = p.episodes ? (p.episodes[currentLang] || p.episodes.en || "") : "";
            
            let creditsHTML = '';
            if (p.credits) {
                for (const [role, name] of Object.entries(p.credits)) {
                    creditsHTML += `<div class="pd-credit-row"><span class="pd-role">${role}</span><span class="pd-name">${name}</span></div>`;
                }
            } else {
                creditsHTML = `<div class="pd-credit-row"><span class="pd-role">Director</span><span class="pd-name">${p.director}</span></div>
                               <div class="pd-credit-row"><span class="pd-role">Production</span><span class="pd-name">${p.prod}</span></div>`;
            }

            // SMART MEDIA LOGIC
            let heroMedia = '';
            let galleryImages = [];

            if (p.yt) {
                // If video exists: Hero = Video, Gallery = All images
                heroMedia = `<div class="pd-hero"><div id="player"></div></div>`;
                galleryImages = p.images || (p.image ? [p.image] : []);
            } else {
                // If NO video: Hero = Image 1, Gallery = Remaining images (sliced)
                const allImages = p.images || (p.image ? [p.image] : []);
                if (allImages.length > 0) {
                    heroMedia = `<div class="pd-hero"><img src="${allImages[0]}" alt="${title}"></div>`;
                    galleryImages = allImages.slice(1); // Skip the first one
                }
            }

            let galleryHTML = '';
            if (galleryImages.length > 0) {
                galleryHTML = galleryImages.map(src => `<img src="${src}" loading="lazy">`).join('');
            }
            
            const currentIndex = allProjects.indexOf(p);
            const nextIndex = (currentIndex + 1) % allProjects.length;
            const nextProject = allProjects[nextIndex];

            const content = `
                <div class="project-detail-container">
                    <div class="pd-left-col">
                        <div class="pd-header">
                            <div class="pd-meta">${year} ${genre ? '• ' + genre : ''} ${episodes ? '• ' + episodes : ''}</div>
                            <h1 class="pd-title">${title}</h1>
                        </div>
                        ${synopsis ? `<div class="pd-synopsis">${synopsis}</div>` : ''}
                        <div class="pd-credits-list">${creditsHTML}</div>
                    </div>
                    
                    <div class="pd-center-col">
                        ${heroMedia}
                        <div class="pd-gallery">${galleryHTML}</div>
                    </div>

                    <div class="pd-right-col">
                        <div class="pd-nav-btn" id="nextProjectBtn">
                            <span class="pd-next-label">NEXT PROJECT &#8594;</span>
                        </div>
                    </div>
                </div>
            `;
            
            modalContent.innerHTML = content;
            document.getElementById('modal-container').scrollTop = 0; 
            document.getElementById('nextProjectBtn').onclick = () => openProject(nextProject);

            if (p.yt) {
                ytPlayer = new YT.Player('player', {
                    height: '100%', width: '100%', videoId: p.yt,
                    playerVars: { 'autoplay': 0, 'rel': 0, 'controls': 1 },
                    events: { 'onStateChange': onPlayerStateChange }
                });
            }
        }

        function closeModal() {
            modalContainer.classList.remove('open');
            if(ytPlayer && typeof ytPlayer.destroy === 'function') { ytPlayer.destroy(); ytPlayer = null; }
            setTimeout(() => { modalContent.innerHTML = ''; }, 300);
            if(!indexOverlay.classList.contains('open') && !aboutOverlay.classList.contains('open')) { playActiveVideo(); startAutoPlay(); }
        }

        document.addEventListener('keydown', (e) => { 
            if (e.key === "Escape") closeModal(); 
            if (!modalContainer.classList.contains('open')) {
                if (e.key === "ArrowRight" && !indexOverlay.classList.contains('open') && !aboutOverlay.classList.contains('open')) nextSlide();
                if (e.key === "ArrowLeft" && !indexOverlay.classList.contains('open') && !aboutOverlay.classList.contains('open')) prevSlide();
            }
        });

        initCarousel();
    </script>
</body>
</html>
