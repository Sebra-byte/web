<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f0f0f0; --text: #1a1a1a; --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; text-transform: lowercase; overflow: hidden;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--line-grid) 1px, transparent 1px), linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr 200px;
            height: 100vh;
            padding: 40px;
            gap: 20px;
            box-sizing: border-box;
        }

        .left-panel { display: flex; flex-direction: column; gap: 30px; }
        .brand { font-size: 1.2rem; line-height: 1.4; }
        .brand strong { display: block; font-size: 1.4rem; }
        .nav-links a { text-decoration: none; color: var(--text); font-size: 1.1rem; font-weight: 700; display: block; margin-bottom: 10px; }

        /* CENTRO: VISOR ACHICADO */
        .center-panel { display: flex; flex-direction: column; align-items: center; }
        .main-viewer {
            width: 90%; 
            aspect-ratio: 16 / 9; background: #000;
            border: 1px solid #ddd; overflow: hidden; cursor: pointer; position: relative;
        }
        .main-viewer img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }
        
        .project-details {
            width: 90%; margin-top: 20px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        }
        .project-details h2 { font-size: 3rem; margin: 0; letter-spacing: -2px; font-weight: 700; }
        .project-details .category-label { font-size: 0.8rem; font-weight: 700; color: var(--text); }
        .project-details .meta { font-size: 0.9rem; line-height: 1.6; color: var(--gray); }

        /* DERECHA: LISTA CON SCROLL */
        .right-panel { 
            display: flex; flex-direction: column; gap: 15px; 
            overflow-y: auto; padding-right: 5px;
        }
        .right-panel::-webkit-scrollbar { width: 2px; }
        .right-panel::-webkit-scrollbar-thumb { background: #ccc; }

        .thumb-item {
            width: 100%; aspect-ratio: 16 / 10; background: #000;
            border: 1px solid #ccc; overflow: hidden; cursor: pointer; flex-shrink: 0;
        }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: 0.3s; opacity: 0.8; }
        .thumb-item:hover img { filter: grayscale(0); opacity: 1; }

        /* MODAL VIDEO */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; z-index: 1000;
            justify-content: center; align-items: center;
        }
        .video-wrapper { width: 90%; max-width: 1400px; aspect-ratio: 16 / 9; position: relative; }
        #video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .close-modal { position: absolute; top: 30px; right: 50px; color: white; cursor: pointer; font-size: 1.5rem; font-weight: 700; z-index: 1010; }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout">
        <section class="left-panel">
            <div class="brand"><strong>leandro bruno</strong>film editor</div>
            <nav class="nav-links">
                <a href="about.html">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </nav>
        </section>

        <section class="center-panel">
            <div class="main-viewer" onclick="openVideo()">
                <img id="main-img" src="" alt="feature project">
            </div>
            <div class="project-details">
                <div>
                    <span class="category-label" id="p-category"></span>
                    <h2 id="p-title"></h2>
                </div>
                <div class="meta">
                    <div id="p-meta-top"></div>
                    <div id="p-description" style="margin-top: 15px;"></div>
                </div>
            </div>
        </section>

        <section class="right-panel" id="thumbnail-list"></section>
    </main>

    <div class="video-modal" id="modal">
        <span class="close-modal" onclick="closeVideo()">✕ close</span>
        <div class="video-wrapper"><div id="video-player"></div></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // ORDEN SOLICITADO: Menem, Oreo, Moscas, Levis, Blair, RP, Marias
        const projects = [
            {
                title: "menem",
                category: "serie",
                img: "assets/Menem_Thumbnail_1.jpg",
                yt: "-2AmqmciWXE",
                director: "ariel winograd",
                prod: "claxon, yavu, prime video",
                desc: "serie original de prime video."
            },
            {
                title: "oreo",
                category: "advertising",
                img: "assets/BesosBrujos-Thumbnail.jpg", // Usando BesosBrujos como placeholder para Oreo si no está el archivo exacto
                yt: "7Cllu0Rme74",
                director: "primo films",
                prod: "primo",
                desc: "campaña publicitaria global."
            },
            {
                title: "el tiempo de las moscas",
                category: "film",
                img: "assets/Marias_Thumbnail.png", // Usando Marias.png como placeholder para Moscas
                yt: "A0d6wnlMRRk",
                director: "ana katz",
                prod: "netflix",
                desc: "largometraje de ficción."
            },
            {
                title: "levis",
                category: "advertising",
                img: "assets/Levis_Thumbnail_v01.jpg",
                yt: "7Cllu0Rme74",
                director: "lorenzo shakespear",
                prod: "levis argentina",
                desc: "501 campaign."
            },
            {
                title: "blair",
                category: "music video",
                img: "assets/Blair_Thumbnail_v01.jpg",
                yt: "ItX5aqhqsmo",
                director: "dana campanello",
                prod: "poster",
                desc: "videoclip oficial."
            },
            {
                title: "rp",
                category: "advertising",
                img: "assets/RP_Thumnmail.jpg",
                yt: "yt_id_aca",
                director: "pendiente",
                prod: "poster",
                desc: "comercial institucional."
            },
            {
                title: "marias",
                category: "advertising",
                img: "assets/Marias_Thumbnail.jpg",
                yt: "A0d6wnlMRRk",
                director: "ana katz",
                prod: "poster",
                desc: "comercial para galletitas marías."
            }
        ];

        let currentIndex = 0;
        let player;

        function updateDisplay() {
            const current = projects[currentIndex];
            const mainImg = document.getElementById('main-img');
            
            mainImg.style.opacity = 0;
            
            setTimeout(() => {
                mainImg.src = current.img;
                document.getElementById('p-title').innerText = current.title;
                document.getElementById('p-category').innerText = current.category;
                document.getElementById('p-meta-top').innerHTML = `<strong>d.</strong> ${current.director}<br><strong>p.</strong> ${current.prod}`;
                document.getElementById('p-description').innerText = current.desc;
                mainImg.style.opacity = 1;
            }, 300);

            const thumbList = document.getElementById('thumbnail-list');
            thumbList.innerHTML = '';
            
            projects.forEach((proj, index) => {
                if(index !== currentIndex) {
                    const item = document.createElement('div');
                    item.className = 'thumb-item';
                    item.innerHTML = `<img src="${proj.img}" onerror="this.src='https://via.placeholder.com/200x125?text=Img+Missing'">`;
                    item.onclick = () => {
                        currentIndex = index;
                        updateDisplay();
                        resetInterval();
                    };
                    thumbList.appendChild(item);
                }
            });
        }

        function openVideo() {
            const modal = document.getElementById('modal');
            const ytId = projects[currentIndex].yt;
            modal.style.display = 'flex';
            if (player) {
                player.loadVideoById(ytId);
            } else {
                player = new YT.Player('video-player', {
                    height: '100%', width: '100%', videoId: ytId,
                    playerVars: { 'autoplay': 1, 'rel': 0, 'modestbranding': 1 },
                    events: { 'onStateChange': (e) => { if(e.data === YT.PlayerState.ENDED) closeVideo(); } }
                });
            }
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            if (player) player.stopVideo();
        }

        let rotation = setInterval(() => { currentIndex = (currentIndex + 1) % projects.length; updateDisplay(); }, 6000);
        function resetInterval() { clearInterval(rotation); rotation = setInterval(() => { currentIndex = (currentIndex + 1) % projects.length; updateDisplay(); }, 6000); }

        updateDisplay();
    </script>
</body>
</html>
