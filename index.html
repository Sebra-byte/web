<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { 
            --bg: #f5f5f0; 
            --text: #1a1a1a; 
            --accent: #666;
            --font-main: 'Manrope', sans-serif;
        }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main); overflow: hidden;
        }

        .split-container { display: flex; height: 100vh; width: 100vw; }

        /* PANEL IZQUIERDA: SLIDER PRINCIPAL */
        .left-panel {
            flex: 1.3; height: 100%; background: #000;
            position: relative; overflow: hidden; cursor: pointer;
        }
        .slider-wrapper {
            display: flex; height: 100%;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .slide { min-width: 100%; height: 100%; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }

        /* PANEL DERECHA: CONTENIDO */
        .right-panel {
            flex: 1; height: 100%; overflow-y: auto;
            padding: 60px; background: var(--bg);
            border-left: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
        }

        /* NUEVO LOGO EN TEXTO */
        .brand-logo { margin-bottom: 50px; cursor: pointer; }
        .brand-logo h1 { 
            font-size: 2.2rem; font-weight: 800; margin: 0; 
            line-height: 1; text-transform: uppercase; letter-spacing: -0.02em; 
        }
        .brand-logo p { 
            font-size: 0.9rem; font-weight: 400; margin: 5px 0 0 0; 
            text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent);
        }

        .nav-links {
            display: flex; gap: 25px; font-size: 0.75rem;
            text-transform: uppercase; font-weight: 700;
            border-top: 1px solid rgba(0,0,0,0.1); padding-top: 15px; margin-bottom: 40px;
        }
        .nav-links a { text-decoration: none; color: var(--accent); cursor: pointer; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }

        .content-section { display: none; }
        .content-section.active { display: block; }

        .filter-bar {
            margin-bottom: 25px; font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800;
        }
        .filter-bar span { margin-right: 15px; cursor: pointer; opacity: 0.4; }
        .filter-bar span.active-filter { opacity: 1; text-decoration: underline; }

        .project-row {
            display: flex; gap: 20px; padding: 20px 0;
            border-top: 1px solid rgba(0,0,0,0.08); cursor: pointer;
        }
        .project-row.selected { background: #fff; padding-left: 10px; }

        .thumb { width: 100px; aspect-ratio: 16/9; object-fit: cover; background: #eee; }
        .p-info { flex: 1; }
        .p-title { font-weight: 800; font-size: 0.85rem; text-transform: uppercase; margin: 0; }
        .p-cat { font-size: 0.7rem; color: var(--accent); text-transform: uppercase; margin-top: 2px; }
        .more-btn { font-size: 0.7rem; font-weight: 800; margin-top: 10px; text-decoration: underline; display: inline-block; }

        .bio-text { font-size: 1.1rem; line-height: 1.6; max-width: 500px; margin-bottom: 30px; }

        /* VISTA DETALLE EXPANDIDA 90% */
        .project-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 5000; display: none;
            justify-content: center; align-items: center;
        }
        .project-overlay.active { display: flex; animation: fadeIn 0.4s ease; }

        .overlay-media-container {
            width: 90vw; height: 90vh; position: relative;
            display: flex; justify-content: center; align-items: center; background: #000;
        }
        #overlay-player { width: 100%; height: 100%; }

        /* Capa de Información Flotante */
        .overlay-info-panel {
            position: absolute; bottom: 40px; left: 40px;
            background: rgba(245, 245, 240, 0.95);
            padding: 40px; max-width: 450px;
            color: var(--text); border-radius: 2px;
            transform: translateY(20px); opacity: 0;
            transition: 0.5s all ease 0.2s;
            pointer-events: auto;
        }
        .project-overlay.active .overlay-info-panel { transform: translateY(0); opacity: 1; }

        .overlay-info-panel h1 { font-size: 2.2rem; text-transform: uppercase; margin: 0 0 10px 0; line-height: 0.9; font-weight: 800; }
        .overlay-info-panel .meta { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }
        .overlay-info-panel .credits { font-size: 0.8rem; line-height: 1.6; margin-bottom: 20px; text-transform: uppercase; }
        .overlay-info-panel .desc { font-size: 0.95rem; line-height: 1.5; }

        .close-overlay {
            position: absolute; top: 30px; right: 40px; color: #fff;
            font-size: 0.8rem; font-weight: 800; cursor: pointer; z-index: 6000;
        }

        /* Slider para proyectos sin video en Overlay */
        .overlay-img-slider { width: 100%; height: 100%; overflow: hidden; position: relative; }
        .overlay-slider-inner { display: flex; height: 100%; transition: transform 0.5s ease; }
        .overlay-slide { min-width: 100%; height: 100%; }
        .overlay-slide img { width: 100%; height: 100%; object-fit: contain; }

        .footer-lang { margin-top: auto; padding-top: 40px; font-size: 0.7rem; font-weight: 800; opacity: 0.5; }
        .footer-lang span { cursor: pointer; }
        .footer-lang span.active { opacity: 1; text-decoration: underline; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 1024px) {
            .split-container { flex-direction: column; overflow-y: auto; }
            .left-panel { height: 40vh; flex: none; }
            .right-panel { flex: none; padding: 40px 20px; }
            .overlay-media-container { width: 100vw; height: 50vh; }
            .overlay-info-panel { position: relative; bottom: 0; left: 0; width: 100%; max-width: none; padding: 30px; transform: none; }
        }
    </style>
</head>
<body>

    <div class="split-container">
        <div class="left-panel" onclick="manualSlideNext()">
            <div class="slider-wrapper" id="main-slider"></div>
        </div>

        <div class="right-panel">
            <header class="brand-logo" onclick="showSection('work')">
                <h1>Leandro Bruno</h1>
                <p>film editor</p>
            </header>

            <nav class="nav-links">
                <a id="nav-work" class="active" onclick="showSection('work')">Work</a>
                <a id="nav-bio" onclick="showSection('bio')">Bio</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">Contact</a>
                <a href="https://www.instagram.com/leandrombruno/" target="_blank">Instagram</a>
            </nav>

            <section id="section-work" class="content-section active">
                <div class="filter-bar" id="filter-bar">
                    <span class="active-filter" onclick="filterBy('all')">/ Todos</span>
                    <span onclick="filterBy('ficción')">/ Ficción</span>
                    <span onclick="filterBy('advertising')">/ Publicidad</span>
                </div>
                <div id="project-list"></div>
            </section>

            <section id="section-bio" class="content-section">
                <div class="bio-text" id="bio-text"></div>
                <a href="https://www.imdb.com/name/nm10600109/" target="_blank" style="color:#000; font-weight:800; font-size:0.75rem; text-decoration:none; border:1px solid #000; padding:10px 20px;">IMDB CREDITS ↗</a>
            </section>

            <div class="footer-lang">
                <span id="l-es" onclick="changeLang('es')">ES</span> / 
                <span id="l-en" onclick="changeLang('en')">EN</span>
            </div>
        </div>
    </div>

    <div class="project-overlay" id="project-overlay">
        <div class="close-overlay" onclick="closeOverlay()">[ CLOSE ]</div>
        <div class="overlay-media-container">
            <div id="overlay-player-wrapper" style="width:100%; height:100%; display:none;">
                <div id="overlay-player"></div>
            </div>
            <div id="overlay-image-slider" class="overlay-img-slider" style="display:none;" onclick="moveOverlaySlide()">
                <div class="overlay-slider-inner" id="overlay-slider-inner"></div>
            </div>

            <div class="overlay-info-panel" id="info-panel">
                </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        let currentIndex = 0;
        let overlaySlideIdx = 0;
        let ytPlayer;
        let autoPlayInterval;

        const projects = [
            { title: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic sobre Carlos Menem.", desc_en: "Biopic about Carlos Menem." },
            { title: "oreo", category: "advertising", images: ["https://img.youtube.com/vi/7Cllu0Rme74/maxresdefault.jpg"], yt: "7Cllu0Rme74", director: "primo films", prod: "primo", desc_es: "Campaña global para Oreo.", desc_en: "Global campaign for Oreo." },
            { title: "el tiempo de las moscas", category: "serie", images: ["assets/Moscas_Thumbnail_v01.png"], yt: "A0d6wnlMRRk", director: "ana katz", prod: "netflix", desc_es: "Serie original de Netflix.", desc_en: "Netflix original series." },
            { title: "coppola", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", desc_es: "Miniserie de Disney+.", desc_en: "Disney+ original series." },
            { title: "las manos de la abuela", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png", "assets/MA_Thumbnail_2.png"], yt: "", director: "camila mediocre", prod: "", desc_es: "Ensayo poético sobre la memoria.", desc_en: "Poetic essay on memory." }
        ];

        let activeProjects = [...projects];

        const content = {
            es: { bio: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires. Se especializa en montaje rítmico y narrativa de ficción para plataformas globales.", dir: "Director", prod: "Producción", more: "Ver más →" },
            en: { bio: "Leandro Bruno is a film and advertising editor based in Buenos Aires. Specialized in rhythmic editing and narrative fiction for global platforms.", dir: "Director", prod: "Production", more: "See more →" }
        };

        function initSlider() {
            document.getElementById('main-slider').innerHTML = activeProjects.map(p => `<div class="slide"><img src="${p.images[0]}"></div>`).join('');
        }

        function renderList() {
            document.getElementById('project-list').innerHTML = activeProjects.map((p, i) => `
                <div class="project-row ${i === currentIndex ? 'selected' : ''}" onclick="selectProject(${i})">
                    <img src="${p.images[0]}" class="thumb">
                    <div class="p-info">
                        <p class="p-title">${p.title}</p>
                        <p class="p-cat">${p.category}</p>
                        <span class="more-btn" onclick="openOverlay(${i}, event)">${content[currentLang].more}</span>
                    </div>
                </div>
            `).join('');
        }

        function selectProject(i) {
            currentIndex = i;
            document.getElementById('main-slider').style.transform = `translateX(-${i * 100}%)`;
            renderList();
            resetAutoPlay();
        }

        function manualSlideNext() { selectProject((currentIndex + 1) % activeProjects.length); }
        function resetAutoPlay() { clearInterval(autoPlayInterval); autoPlayInterval = setInterval(manualSlideNext, 5000); }

        function openOverlay(idx, e) {
            e.stopPropagation();
            const p = activeProjects[idx];
            document.getElementById('project-overlay').classList.add('active');
            
            document.getElementById('info-panel').innerHTML = `
                <h1>${p.title}</h1>
                <div class="meta">${p.category}</div>
                <div class="credits"><strong>${content[currentLang].dir}:</strong> ${p.director} ${p.prod ? `<br><strong>${content[currentLang].prod}:</strong> ${p.prod}` : ''}</div>
                <div class="desc">${currentLang === 'es' ? p.desc_es : p.desc_en}</div>
            `;

            if(p.yt) {
                document.getElementById('overlay-player-wrapper').style.display = 'block';
                document.getElementById('overlay-image-slider').style.display = 'none';
                if(ytPlayer) ytPlayer.loadVideoById(p.yt);
                else ytPlayer = new YT.Player('overlay-player', { videoId: p.yt, playerVars: { 'autoplay': 1 } });
            } else {
                document.getElementById('overlay-player-wrapper').style.display = 'none';
                document.getElementById('overlay-image-slider').style.display = 'block';
                overlaySlideIdx = 0;
                document.getElementById('overlay-slider-inner').innerHTML = p.images.map(img => `<div class="overlay-slide"><img src="${img}"></div>`).join('');
                updateOverlaySlider();
            }
            clearInterval(autoPlayInterval);
        }

        function moveOverlaySlide() {
            const count = document.querySelectorAll('.overlay-slide').length;
            overlaySlideIdx = (overlaySlideIdx + 1) % count;
            updateOverlaySlider();
        }

        function updateOverlaySlider() {
            document.getElementById('overlay-slider-inner').style.transform = `translateX(-${overlaySlideIdx * 100}%)`;
        }

        function closeOverlay() {
            document.getElementById('project-overlay').classList.remove('active');
            if(ytPlayer) ytPlayer.stopVideo();
            resetAutoPlay();
        }

        function filterBy(cat) {
            document.querySelectorAll('#filter-bar span').forEach(s => s.classList.remove('active-filter'));
            event.target.classList.add('active-filter');
            activeProjects = (cat === 'all') ? [...projects] : projects.filter(p => p.category === cat || (cat === 'ficción' && (p.category === 'serie' || p.category === 'cortometraje')));
            currentIndex = 0; initSlider(); renderList(); selectProject(0);
        }

        function showSection(id) {
            document.querySelectorAll('.content-section, .nav-links a').forEach(el => el.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('active');
        }

        function changeLang(lang) {
            currentLang = lang;
            document.getElementById('l-es').className = lang === 'es' ? 'active' : '';
            document.getElementById('l-en').className = lang === 'en' ? 'active' : '';
            document.getElementById('bio-text').innerText = content[lang].bio;
            renderList();
        }

        window.onload = () => { changeLang('es'); initSlider(); selectProject(0); };
    </script>
</body>
</html>
