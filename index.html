<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f0f0f0; 
            --text: #1a1a1a; 
            --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; text-transform: lowercase;
            overflow: hidden;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--line-grid) 1px, transparent 1px), linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        .main-container {
            display: grid;
            grid-template-columns: 220px 1fr 280px; /* Miniaturas más anchas */
            height: 100vh;
            padding: 50px;
            box-sizing: border-box;
            gap: 40px;
        }

        /* IZQUIERDA */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .brand { font-size: 1.2rem; line-height: 1.4; }
        .brand strong { display: block; font-size: 1.4rem; }
        .nav-links a {
            text-decoration: none; color: var(--text);
            font-size: 1.1rem; font-weight: 700;
            display: block; margin-bottom: 10px;
        }

        /* CENTRO: VISOR AJUSTADO */
        .center-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .main-viewer {
            width: 100%;
            max-width: 900px; /* Achicado para dar aire */
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        .main-viewer img {
            width: 100%; height: 100%; object-fit: cover;
            transition: opacity 0.6s ease-in-out;
        }

        /* INFO SUBIDA DESDE EL MARGEN */
        .project-details {
            margin-top: 30px; /* Más espacio respecto al visor */
            padding-bottom: 60px; /* Sube el texto desde el margen inferior */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }
        .project-details h2 { 
            font-size: 3.5rem; margin: 5px 0 0 0; letter-spacing: -3px; font-weight: 700; 
        }
        .project-details .meta { 
            font-size: 0.95rem; line-height: 1.7; color: var(--gray);
        }
        .project-details .meta strong { color: var(--text); }

        /* DERECHA: MINIATURAS AGRANDADAS */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .thumb-item {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid #bbb;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }
        .thumb-item:hover { transform: scale(1.02); border-color: var(--text); }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: 0.3s; }
        .thumb-item:hover img { opacity: 1; }

        /* Scrollbar sutil */
        .right-panel::-webkit-scrollbar { width: 4px; }
        .right-panel::-webkit-scrollbar-thumb { background: #ccc; }

        @media (max-width: 1200px) {
            .main-container { grid-template-columns: 200px 1fr 200px; padding: 30px; }
            .project-details h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-container">
        <section class="left-panel">
            <div class="brand">
                <strong>leandro bruno</strong>
                film editor
            </div>
            <nav class="nav-links">
                <a href="about.html">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </nav>
        </section>

        <section class="center-panel">
            <div class="main-viewer">
                <img id="main-img" src="" alt="feature project">
            </div>
            <div class="project-details">
                <div>
                    <span style="font-size: 0.8rem; font-weight: 700;">project name</span>
                    <h2 id="p-title"></h2>
                </div>
                <div class="meta">
                    <div id="p-meta-top"></div>
                    <div id="p-description" style="margin-top: 15px;"></div>
                </div>
            </div>
        </section>

        <section class="right-panel" id="thumbnail-list">
            </section>
    </main>

    <script>
        // Configuración de tus proyectos usando los nombres de archivos en assets
        const projects = [
            {
                title: "menem",
                img: "assets/thumb_menem.jpg",
                director: "ariel winograd",
                prod: "claxon, yavu, prime video",
                desc: "serie original de prime video. montaje cinematográfico enfocado en la narrativa política y dramática de los años 90."
            },
            {
                title: "oreo",
                img: "assets/thumb_oreo.jpg",
                director: "primo films",
                prod: "primo",
                desc: "campaña publicitaria de alto impacto visual. ritmo rítmico y montaje dinámico."
            },
            {
                title: "moscas",
                img: "assets/thumb_moscas.jpg",
                director: "ana katz",
                prod: "netflix",
                desc: "largometraje de ficción. exploración de tiempos narrativos y clima dramático."
            },
            {
                title: "coppola",
                img: "assets/thumb_coppola.jpg",
                director: "ariel winograd",
                prod: "disney+",
                desc: "miniserie biográfica. edición de ritmo frenético y reconstrucción de época."
            },
            {
                title: "blair",
                img: "assets/thumb_blair.jpg",
                director: "dana campanello",
                prod: "poster",
                desc: "proyecto documental con enfoque en la textura de imagen y narrativa no lineal."
            }
        ];

        let currentIndex = 0;

        function updateDisplay() {
            const current = projects[currentIndex];
            const mainImg = document.getElementById('main-img');
            
            mainImg.style.opacity = 0;
            
            setTimeout(() => {
                mainImg.src = current.img;
                document.getElementById('p-title').innerText = current.title;
                document.getElementById('p-meta-top').innerHTML = `<strong>d.</strong> ${current.director}<br><strong>p.</strong> ${current.prod}`;
                document.getElementById('p-description').innerText = current.desc;
                mainImg.style.opacity = 1;
            }, 300);

            const thumbList = document.getElementById('thumbnail-list');
            thumbList.innerHTML = '';
            
            // Mostrar todos los proyectos en la derecha (incluyendo el actual pero con indicación o solo los siguientes)
            projects.forEach((proj, index) => {
                if(index !== currentIndex) {
                    const item = document.createElement('div');
                    item.className = 'thumb-item';
                    item.innerHTML = `<img src="${proj.img}">`;
                    item.onclick = () => {
                        currentIndex = index;
                        updateDisplay();
                        resetInterval();
                    };
                    thumbList.appendChild(item);
                }
            });
        }

        let rotation = setInterval(() => {
            currentIndex = (currentIndex + 1) % projects.length;
            updateDisplay();
        }, 5000);

        function resetInterval() {
            clearInterval(rotation);
            rotation = setInterval(() => {
                currentIndex = (currentIndex + 1) % projects.length;
                updateDisplay();
            }, 5000);
        }

        updateDisplay();
    </script>
</body>
</html>
