<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Portfolio | Tenthree Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f8f8;
            --dark: #121212;
            --accent: #888;
            --gap: 30px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--dark);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            z-index: 1000;
            mix-blend-mode: difference;
            color: white;
        }

        .logo { font-weight: 700; letter-spacing: 2px; text-transform: uppercase; font-size: 1.1rem; }
        
        .filters { display: flex; gap: 20px; }
        .filter-btn { 
            cursor: pointer; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            opacity: 0.6;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active { opacity: 1; }

        /* --- HEADER --- */
        header {
            padding: 160px 40px 80px 40px;
        }

        header h1 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 700;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -4px;
        }

        /* --- PORTFOLIO GRID --- */
        #portfolio-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: var(--gap);
            padding: 0 40px 100px 40px;
        }

        .project {
            grid-column: span 6;
            cursor: pointer;
            margin-bottom: 40px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Clases de tamaño para el ritmo visual */
        .project.large { grid-column: span 12; }
        .project.medium { grid-column: span 8; }
        .project.small { grid-column: span 4; }

        .img-container {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #e0e0e0;
            position: relative;
        }

        .project img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: transform 0.8s ease, filter 0.8s ease;
        }

        .project:hover img {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        .project-meta {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .project-title {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1rem;
            letter-spacing: -0.5px;
        }

        .project-info-sub {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            text-align: right;
        }

        /* --- MODAL --- */
        #modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark);
            z-index: 2000;
            display: none;
            color: white;
            overflow-y: auto;
            padding: 60px 40px;
        }

        .close-modal {
            position: fixed; top: 40px; right: 40px;
            cursor: pointer; font-size: 1rem; text-transform: uppercase;
        }

        .modal-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0;
            margin-bottom: 40px; background: #000;
        }

        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* --- FOOTER --- */
        footer {
            padding: 100px 40px;
            background: var(--dark);
            color: white;
        }
        
        .footer-cta { font-size: clamp(2rem, 5vw, 4rem); font-weight: 700; margin-bottom: 40px; }

        @media (max-width: 768px) {
            .project.large, .project.medium, .project.small, .project { grid-column: span 12; }
            nav { padding: 20px; }
            .filters { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">TU NOMBRE</div>
        <div class="filters">
            <div class="filter-btn active" onclick="filterProjects('all')">All</div>
            <div class="filter-btn" onclick="filterProjects('serie')">Series</div>
            <div class="filter-btn" onclick="filterProjects('advertising')">Ad</div>
            <div class="filter-btn" onclick="filterProjects('music video')">Music</div>
            <div class="filter-btn" onclick="filterProjects('cortometraje')">Films</div>
        </div>
    </nav>

    <header>
        <h1>FILM<br>EDITOR</h1>
    </header>

    <main id="portfolio-grid"></main>

    <div id="modal">
        <div class="close-modal" onclick="closeModal()">Close / Volver</div>
        <div class="modal-content" id="modal-body"></div>
    </div>

    <footer>
        <div class="footer-cta">Let's build the cut.</div>
        <p>Email: hola@tunombre.com</p>
        <p>Based in Argentina / Worldwide</p>
    </footer>

    <script>
        const projects = [
            { title_es: "Menem", category: "serie", size: "large", images: ["assets/Menem_Thumbnail_1.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem en los años 90." },
            { title_es: "OREO - Sigamos divirtiendonos", category: "advertising", size: "medium", images: ["assets/Oreo_Thumbnail_5.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México", desc_es: "Campaña publicitaria global para Oreo." },
            { title_es: "El tiempo de las moscas", category: "serie", size: "small", images: ["assets/Moscas_Thumbnail_1.jpg"], yt: "A0d6wnlMRRk", director: "Benjamín Naishtat y Ana Katz", prod: "netflix", desc_es: "Dos mujeres intentan reconstruir sus vidas tras salir de prisión." },
            { title_es: "Coppola, el representante", category: "serie", size: "medium", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", desc_es: "La historia del representante más famoso de Argentina." },
            { title_es: "Levis x Winona Riders", category: "advertising", size: "small", images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "7Cllu0Rme74", director: "Nico Alarcos", prod: "primo", desc_es: "Campaña de gira de Winona Riders." },
            { title_es: "Blair - Todo lo que tengo", category: "music video", size: "small", images: ["assets/Blair_Thumbnail_1.jpg"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "Primer adelanto del disco Bar Scorpios (2025)" },
            { title_es: "Las manos de la abuela", category: "cortometraje", size: "small", images: ["assets/MA_Thumbnail_1.png"], yt: "", director: "camila migliore", prod: "calesita films", desc_es: "Cortometraje sobre la memoria y el legado familiar." },
            { title_es: "Ratones Paranoicos", category: "music video", size: "small", images: ["assets/RP_Thumbmail_1.png"], yt: "", director: "alex roux", prod: "poster", desc_es: "Pieza audiovisual para la legendaria banda de rock." },
            { title_es: "Besos Brujos", category: "cortometraje", size: "small", images: ["assets/BB_Thumbnail_1.png"], yt: "", director: "karina flonembaum", prod: "Indie", desc_es: "Ficción breve que juega con los límites del deseo." },
            { title_es: "Las Marias", category: "advertising", size: "small", images: ["assets/Marias_Thumbnail_1.png"], yt: "", director: "alejandro berger parrado", prod: "navajo films", desc_es: "Documental publicitario sobre la tradición yerbatera." },
            { title_es: "Todo lo que recuerdo", category: "cortometraje", size: "small", images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"], yt: "", director: "nicolas fernandez melian", prod: "Festival MDQ", desc_es: "Viaje sensorial por la memoria fragmentada." }
        ];

        const grid = document.getElementById('portfolio-grid');

        function renderProjects(filter = 'all') {
            grid.innerHTML = '';
            projects.forEach((p, index) => {
                if (filter !== 'all' && p.category !== filter) return;

                const div = document.createElement('div');
                div.className = `project ${p.size || ''}`;
                div.innerHTML = `
                    <div class="img-container" onclick="openModal(${index})">
                        <img src="${p.images[0]}" alt="${p.title_es}">
                    </div>
                    <div class="project-meta">
                        <div class="project-title">${p.title_es}</div>
                        <div class="project-info-sub">${p.category} / ${p.prod}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function openModal(index) {
            const p = projects[index];
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            
            let videoHTML = p.yt ? `
                <div class="video-wrapper">
                    <iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1" frameborder="0" allowfullscreen></iframe>
                </div>` : `<div style="padding: 100px; text-align: center; border: 1px solid #333;">Video próximamente / Link privado</div>`;

            body.innerHTML = `
                ${videoHTML}
                <h2 style="font-size: 3rem; margin-bottom: 20px; text-transform: uppercase;">${p.title_es}</h2>
                <p style="font-size: 1.2rem; max-width: 800px; margin-bottom: 40px; opacity: 0.8;">${p.desc_es}</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px solid #333; padding-top: 20px;">
                    <div><strong>DIRECTOR:</strong> ${p.director}</div>
                    <div><strong>PROD:</strong> ${p.prod}</div>
                </div>
            `;
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-body').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function filterProjects(cat) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProjects(cat);
        }

        // Initial Render
        renderProjects();
    </script>
</body>
</html>
