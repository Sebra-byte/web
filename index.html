<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* PALETA VERDE OLIVA */
            --bg: #798476;
            --text: #F2F2F2;
            --accent: rgba(242, 242, 242, 0.7);
            --border: rgba(242, 242, 242, 0.2);
            
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; padding: 40px 60px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 500; pointer-events: none; 
            background: linear-gradient(to bottom, rgba(121, 132, 118, 0.9), transparent);
            transition: background 0.3s;
        }
        nav.index-active { background: var(--bg); pointer-events: auto; }
        .brand, .nav-links a { pointer-events: auto; cursor: pointer; }
        .brand {
            font-size: clamp(1.5rem, 2vw, 2.5rem); 
            font-weight: 600; letter-spacing: -1px; text-transform: lowercase;
            line-height: 1; font-family: var(--font-serif); color: var(--text);
        }
        .brand span {
            display: block; font-family: var(--font-main); font-size: 0.4em;
            letter-spacing: 2px; opacity: 0.8; margin-top: 5px;
            text-transform: uppercase; font-weight: 400;
        }
        .nav-links { display: flex; gap: 40px; padding-top: 10px; }
        .nav-links a {
            color: var(--text); text-decoration: none; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.8;
            transition: opacity 0.3s; position: relative;
        }
        .nav-links a:hover { opacity: 1; }

        /* --- CAROUSEL (HOME) --- */
        .carousel { height: 100vh; width: 100vw; position: relative; z-index: 1; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
            padding: 40px 60px 80px 60px; cursor: pointer;
        }
        .slide.active { opacity: 1; z-index: 1; }
        .bg-media {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            object-fit: cover; transform: translate(-50%, -50%) scale(1.08);
            transition: transform 7s ease-out; z-index: 0;
        }
        .slide.active .bg-media { transform: translate(-50%, -50%) scale(1); }
        .slide::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(0deg, rgba(47, 53, 46, 0.9) 0%, rgba(47, 53, 46, 0.2) 50%, rgba(47, 53, 46, 0.4) 100%);
        }
        .slide-info {
            position: relative; z-index: 2; max-width: 1100px; opacity: 0;
            transform: translateY(30px); transition: all 1s ease 0.3s;
        }
        .slide.active .slide-info { opacity: 1; transform: translateY(0); }
        
        /* CAMBIO: Tipografía del título reducida un 25% */
        .project-title {
            font-family: var(--font-serif); 
            /* Antes: clamp(3rem, 7vw, 6.5rem); */
            font-size: clamp(2.25rem, 5.25vw, 5rem); 
            margin-bottom: 15px; letter-spacing: -1px; line-height: 1.1; color: var(--text);
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .credits {
            display: flex; gap: 30px; font-size: 0.9rem; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 20px; color: rgba(242, 242, 242, 0.8);
        }
        .credits span b { color: var(--text); margin-right: 5px; }
        .controls {
            position: absolute; bottom: 50px; right: 60px; z-index: 10;
            display: flex; gap: 15px;
        }
        .dot {
            width: 40px; height: 3px; background: rgba(242, 242, 242, 0.3);
            cursor: pointer; transition: 0.3s;
        }
        .dot.active { background: var(--text); width: 60px; }

        /* --- INDEX OVERLAY (LIST STYLE) --- */
        #index-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 400; 
            padding: 140px 60px 60px 60px; 
            overflow-y: auto; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: translateY(20px);
        }
        #index-overlay.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .project-list { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; padding-bottom: 100px; }
        .list-item {
            display: grid; grid-template-columns: 360px 1fr 200px; gap: 80px; 
            align-items: center; padding: 50px 0; border-bottom: 1px solid var(--border);
            cursor: pointer; transition: background 0.3s;
        }
        .list-item:hover { background: rgba(255,255,255,0.03); }
        .list-thumb {
            width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 4px;
            background: #4a5248; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .list-thumb img {
            width: 100%; height: 100%; object-fit: cover; filter: grayscale(30%);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .list-item:hover .list-thumb img { filter: grayscale(0%); transform: scale(1.03); }
        .list-info { display: flex; flex-direction: column; gap: 12px; justify-content: center; }
        .list-title {
            font-family: var(--font-main); font-weight: 700; font-size: 2.2rem; 
            text-transform: uppercase; letter-spacing: -1px; color: var(--text); margin-bottom: 5px;
        }
        .list-details {
            font-family: var(--font-main); font-size: 0.9rem; line-height: 1.6; color: var(--accent);
        }
        .list-details span { display: block; }
        .list-details b { color: var(--text); font-weight: 600; margin-right: 8px; }
        .list-platform {
            text-align: right; font-family: var(--font-main); font-weight: 700; 
            font-size: 1rem; color: var(--text); opacity: 0.9; text-transform: uppercase; letter-spacing: 1px;
        }

        /* --- MODAL VIDEO & GALLERY --- */
        #modal-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #2F352E; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #modal-container.open { opacity: 1; pointer-events: auto; }

        .modal-close {
            position: absolute; top: 40px; right: 40px; color: var(--text);
            font-size: 1.5rem; cursor: pointer; z-index: 2005;
        }

        .modal-content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        /* Estilos específicos para Video */
        .video-wrapper { width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Estilos específicos para Galería */
        .gallery-wrapper {
            width: 100%; height: 100%;
            display: flex;
            overflow-x: auto; /* Scroll horizontal */
            scroll-snap-type: x mandatory; /* Efecto magnético */
            align-items: center;
        }
        .gallery-item {
            min-width: 100vw; height: 100vh;
            scroll-snap-align: center;
            display: flex; justify-content: center; align-items: center;
            padding: 60px;
        }
        .gallery-item img {
            max-width: 100%; max-height: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        /* Flechas de galería */
        .gallery-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: var(--text); opacity: 0.5; font-size: 0.8rem; text-transform: uppercase;
        }

        @media(max-width: 1200px) {
            .list-item { grid-template-columns: 300px 1fr auto; gap: 40px; }
        }
        @media(max-width: 768px) {
            nav { padding: 30px; flex-direction: column; gap: 20px; }
            #index-overlay { padding: 160px 20px 20px 20px; }
            .list-item { grid-template-columns: 1fr; gap: 20px; text-align: left; padding: 30px 0; }
            .list-thumb { width: 100%; max-width: none; }
            .list-title { font-size: 1.5rem; }
            .list-platform { text-align: left; margin-top: -10px; font-size: 0.8rem; opacity: 0.6; }
        }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="brand" onclick="closeIndex()">
            leandro bruno
            <span>film editor</span>
        </div>
        <div class="nav-links">
            <a onclick="closeIndex()">selected</a>
            <a onclick="openIndex()">index</a>
            <a href="mailto:hola@tuemail.com">contact</a>
        </div>
    </nav>

    <div class="carousel" id="mainCarousel"></div>
    <div class="controls" id="dotsContainer"></div>

    <div id="index-overlay">
        <div class="project-list" id="list-container"></div>
    </div>

    <div id="modal-container">
        <div class="modal-close" onclick="closeModal()">&times;</div>
        <div class="modal-content" id="modal-content-area"></div>
    </div>

    <script>
        // DATA MASTER COMPLETA (Orden actualizado)
        const allProjects = [
            {
                title: "Menem",
                director: "Ariel Winograd",
                prod: "Claxon",
                platform: "Prime Video",
                yt: "-2AmqmciWXE",
                previewUrl: "./assets/menem_preview.mp4",
                image: "./assets/Menem_Thumbnail_1.jpg",
                featured: true // Posición 1
            },
            {
                title: "Oreo: Keep Playful",
                director: "Martín Jalfen",
                prod: "Pop Studios",
                platform: "Global Campaign",
                yt: "7Cllu0Rme74",
                previewUrl: "./assets/oreo_preview.mp4",
                image: "./assets/Oreo_Thumbnail_5.png",
                featured: true // Posición 2
            },
            {
                title: "El tiempo de las moscas",
                director: "B. Naishtat",
                prod: "K&S Films",
                platform: "Netflix",
                yt: "A0d6wnlMRRk",
                previewUrl: "./assets/moscas_preview.mp4",
                image: "./assets/Moscas_Thumbnail_1.jpg",
                featured: true // Posición 3
            },
            {
                title: "Coppola, el representante",
                director: "Ariel Winograd",
                prod: "Pampa Films",
                platform: "Disney+",
                yt: "ecr24akKDbs",
                previewUrl: "./assets/coppola_preview.mp4",
                image: "./assets/Coppola_Thumbnail_2.jpg",
                featured: true // Posición 4
            },
            // --- VOLUMEN ---
            {
                title: "Levis x Winona Riders",
                director: "Nico Alarcos",
                prod: "Primo",
                platform: "Web / Social",
                yt: "mb2RPesGf7Q", // Link actualizado
                image: "./assets/Levis_Thumbnail_v01.jpg"
            },
            {
                title: "Blair - Todo lo que tengo",
                director: "Dana Campanello",
                prod: "Poster",
                platform: "Music Video",
                yt: "ItX5aqhqsmo",
                image: "./assets/Blair_Thumbnail_1.jpg"
            },
            {
                title: "Las manos de la abuela",
                director: "Camila Migliore",
                prod: "Calesita Films",
                platform: "Short Film",
                image: "./assets/MA_Thumbnail_1.png",
                yt: "",
                images: ["./assets/MA_Thumbnail_1.png", "./assets/MA_Thumbnail_3.png", "./assets/MA_Thumbnail_4.png", "./assets/MA_Thumbnail_5.png"]
            },
            {
                title: "Ratones Paranoicos",
                director: "Alex Roux",
                prod: "Poster",
                platform: "Music Video",
                yt: "",
                image: "./assets/RP_Thumbmail_1.png",
                images: ["./assets/RP_Thumbmail_1.png", "./assets/RP_Thumbmail_2.png", "./assets/RP_Thumbmail_3.png"]
            },
            {
                title: "Besos Brujos",
                director: "Karina Flonembaum",
                prod: "Indie",
                platform: "Short Film",
                yt: "",
                image: "./assets/BB_Thumbnail_1.png",
                images: ["./assets/BB_Thumbnail_1.png", "./assets/BB_Thumbnail_2.png", "./assets/BB_Thumbnail_3.png"]
            },
            {
                title: "Las Marias",
                director: "A. Berger Parrado",
                prod: "Navajo Films",
                platform: "Documentary",
                yt: "",
                image: "./assets/Marias_Thumbnail_1.png",
                images: ["./assets/Marias_Thumbnail_1.png", "./assets/Marias_Thumbnail_2.png", "./assets/Marias_Thumbnail_3.png"]
            },
            {
                title: "Todo lo que recuerdo",
                director: "N. Fernandez Melian",
                prod: "Festival MDQ",
                platform: "Short Film",
                yt: "",
                image: "./assets/TodoLoQueRecuerdo_Thumbnail_1.png",
                images: ["./assets/TodoLoQueRecuerdo_Thumbnail_1.png"]
            }
        ];

        // --- LÓGICA CARRUSEL ---
        const featuredProjects = allProjects.filter(p => p.featured);
        let currentSlide = 0;
        let autoPlayInterval;
        const carouselContainer = document.getElementById('mainCarousel');
        const dotsContainer = document.getElementById('dotsContainer');

        function initCarousel() {
            carouselContainer.innerHTML = '';
            dotsContainer.innerHTML = '';
            
            featuredProjects.forEach((p, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                
                let mediaHTML = '';
                if(p.previewUrl) {
                    mediaHTML = `<video class="bg-media" loop muted playsinline poster="./assets/placeholder.jpg">
                                    <source src="${p.previewUrl}" type="video/mp4">
                                 </video>`;
                } else {
                    mediaHTML = `<img class="bg-media" src="${p.image}" alt="${p.title}">`;
                }

                slide.innerHTML = `
                    ${mediaHTML}
                    <div class="slide-info">
                        <h2 class="project-title">${p.title}</h2>
                        <div class="credits">
                            <span><b>Dir:</b> ${p.director}</span>
                            <span><b>Prod:</b> ${p.prod}</span>
                        </div>
                    </div>
                `;
                slide.onclick = () => openProject(p);
                carouselContainer.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = (e) => { e.stopPropagation(); goToSlide(i); };
                dotsContainer.appendChild(dot);
            });

            playActiveVideo();
            startAutoPlay();
        }

        // --- LÓGICA INDEX (LISTA) ---
        const indexOverlay = document.getElementById('index-overlay');
        const listContainer = document.getElementById('list-container');
        const nav = document.getElementById('navbar');

        function renderIndex() {
            listContainer.innerHTML = '';
            allProjects.forEach(p => {
                const item = document.createElement('div');
                item.className = 'list-item';
                
                item.onclick = () => openProject(p);

                item.innerHTML = `
                    <div class="list-thumb">
                        <img src="${p.image}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="list-info">
                        <div class="list-title">${p.title}</div>
                        <div class="list-details">
                            <span><b>Director:</b> ${p.director}</span>
                            <span><b>Prod Co:</b> ${p.prod}</span>
                            <span><b>Editor:</b> Leandro Bruno</span> 
                        </div>
                    </div>
                    <div class="list-platform">${p.platform || ''}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        function openIndex() {
            renderIndex();
            indexOverlay.classList.add('open');
            nav.classList.add('index-active');
            clearInterval(autoPlayInterval);
            document.querySelectorAll('video').forEach(v => v.pause());
        }

        function closeIndex() {
            indexOverlay.classList.remove('open');
            nav.classList.remove('index-active');
            playActiveVideo();
            startAutoPlay();
        }

        function playActiveVideo() {
            document.querySelectorAll('video').forEach(v => v.pause());
            const slides = document.querySelectorAll('.slide');
            if(slides.length > 0) {
                const video = slides[currentSlide].querySelector('video');
                if(video) {
                    video.currentTime = 0;
                    video.play().catch(e => {});
                }
            }
        }

        function updateCarousel() {
            document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === currentSlide));
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
            playActiveVideo();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetAutoPlay();
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % featuredProjects.length;
            updateCarousel();
        }

        function startAutoPlay() {
            autoPlayInterval = setInterval(nextSlide, 7000);
        }

        function resetAutoPlay() {
            clearInterval(autoPlayInterval);
            startAutoPlay();
        }

        // --- LÓGICA UNIFICADA DE MODAL ---
        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content-area');

        function openProject(p) {
            clearInterval(autoPlayInterval);
            document.querySelectorAll('video').forEach(v => v.pause());
            
            if (p.yt && p.yt.length > 0) {
                modalContent.innerHTML = `
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0&controls=1" 
                        allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                `;
            } else if (p.images && p.images.length > 0) {
                const imagesHTML = p.images.map(imgSrc => 
                    `<div class="gallery-item"><img src="${imgSrc}" loading="lazy"></div>`
                ).join('');
                modalContent.innerHTML = `
                    <div class="gallery-wrapper">${imagesHTML}</div>
                    <div class="gallery-hint">Scroll Horizontal &#8594;</div>
                `;
            } else {
                modalContent.innerHTML = `<img src="${p.image}" style="max-height:90vh; max-width:90vw;">`;
            }
            modalContainer.classList.add('open');
        }

        function closeModal() {
            modalContainer.classList.remove('open');
            setTimeout(() => { modalContent.innerHTML = ''; }, 300);
            if(!indexOverlay.classList.contains('open')) {
                playActiveVideo();
                startAutoPlay();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeModal();
        });

        initCarousel();
    </script>
</body>
</html>
