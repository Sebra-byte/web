<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;800&display=swap" rel="stylesheet">
    <style>
        /* Reset de estilos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000; /* Fondo negro */
            font-family: 'Manrope', sans-serif;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor del logo */
        .brand-logo {
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        /* LEANDRO BRUNO */
        .name {
            font-size: 4.5rem;
            font-weight: 800; /* ExtraBold */
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -0.04em; /* Interletrado ajustado para look premium */
            margin: 0;
        }

        /* FILM EDITOR */
        .subtitle {
            font-size: 1rem;
            font-weight: 200; /* ExtraLight para contraste */
            text-transform: uppercase;
            letter-spacing: 0.6em; /* Espaciado amplio */
            margin-top: 10px;
            padding-left: 5px; /* Alineación visual con el nombre */
            color: #a0a0a0; /* Gris sutil para jerarquía */
        }

        /* Ajustes para dispositivos móviles */
        @media (max-width: 768px) {
            .name {
                font-size: 2.5rem;
                letter-spacing: -0.02em;
            }
            .subtitle {
                font-size: 0.7rem;
                letter-spacing: 0.4em;
            }
        }
    </style>
</head>
<body>

    <div class="brand-logo">
        <h1 class="name">Leandro Bruno</h1>
        <span class="subtitle">Film Editor</span>
    </div>

</body>
</html>
