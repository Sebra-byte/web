<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { 
            --bg: #f2f2f2; 
            --text: #1a1a1a; 
            --accent: #666;
            --font-main: 'Manrope', sans-serif;
            --font-mono: 'Space Mono', monospace; /* Para ese look de Cargo */
        }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main); overflow: hidden;
        }

        /* LAYOUT DIVIDIDO */
        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* IZQUIERDA: VISOR FIJO */
        .left-panel {
            flex: 1.2; /* Un poco más ancho que la derecha */
            height: 100%;
            background: #e5e5e5;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
        }

        .play-btn-main {
            position: absolute;
            z-index: 5;
            background: #fff;
            padding: 15px 30px;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            letter-spacing: 0.1em;
            display: none;
        }
        .left-panel:hover .play-btn-main { display: block; }

        /* DERECHA: CONTENIDO SCROLLEABLE */
        .right-panel {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            padding: 60px;
            background: var(--bg);
            border-left: 1px solid #ddd;
        }

        /* TEXTO SUPERIOR (ABOUT) */
        .about-header {
            font-size: 1.4rem;
            line-height: 1.4;
            margin-bottom: 40px;
            font-weight: 400;
            max-width: 500px;
        }

        /* NAVEGACIÓN */
        .nav-links {
            display: flex;
            gap: 30px;
            margin-bottom: 60px;
            border-top: 1px solid #ccc;
            padding-top: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
        }
        .nav-links a { text-decoration: none; color: var(--accent); cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }

        /* LOGO TIPO CARGO */
        .big-logo {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 60px;
            line-height: 0.9;
        }

        /* LISTA DE PROYECTOS */
        .project-list {
            display: flex;
            flex-direction: column;
        }

        .project-row {
            display: flex;
            gap: 20px;
            padding: 25px 0;
            border-top: 1px solid #ddd;
            cursor: pointer;
            transition: background 0.3s;
        }
        .project-row:hover { background: rgba(0,0,0,0.02); }
        .project-row.active { background: #fff; }

        .thumb-small {
            width: 120px;
            aspect-ratio: 16/9;
            background: #ddd;
            object-fit: cover;
        }

        .project-row-info {
            flex: 1;
            font-size: 0.85rem;
        }
        .project-row-title {
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .project-row-desc {
            color: var(--accent);
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .more-link {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* FILTROS */
        .filter-bar {
            margin-bottom: 30px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .filter-bar span { margin-right: 15px; cursor: pointer; opacity: 0.5; }
        .filter-bar span.active-filter { opacity: 1; font-weight: 800; text-decoration: underline; }

        /* MODAL VIDEO */
        .video-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: none; z-index: 1000; justify-content: center; align-items: center; }
        .close-video { position: absolute; top: 30px; right: 40px; cursor: pointer; font-weight: 800; }
        .video-container { width: 90%; max-width: 1200px; aspect-ratio: 16/9; }

        /* IDIOMA */
        .lang-toggle { font-size: 0.7rem; margin-top: 40px; font-weight: 800; opacity: 0.4; }
        .lang-toggle span { cursor: pointer; }
        .lang-toggle span.active-lang { color: #000; opacity: 1; text-decoration: underline; }

        @media (max-width: 1024px) {
            .split-container { flex-direction: column; overflow-y: auto; }
            .left-panel { height: 50vh; flex: none; }
            .right-panel { flex: none; height: auto; padding: 30px; }
            .big-logo { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="split-container">
        <div class="left-panel" id="viewer">
            <button class="play-btn-main" id="btn-play-main" onclick="openVideo()">[ Reproducir ]</button>
            <img id="active-image" src="" class="main-image">
        </div>

        <div class="right-panel">
            <div class="about-header" id="txt-about">
                </div>

            <nav class="nav-links">
                <a onclick="showView('work')" id="nav-work" class="active">Work</a>
                <a onclick="showView('about')" id="nav-bio">Bio</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">Email</a>
                <a href="#">Instagram</a>
            </nav>

            <div class="big-logo" id="main-brand-text">/cargo_profile</div>

            <div class="filter-bar" id="filters">
                <span class="active-filter" onclick="filterBy('all')">/ todos</span>
                <span onclick="filterBy('ficción')">/ ficción</span>
                <span onclick="filterBy('advertising')">/ publicidad</span>
            </div>

            <div class="project-list" id="project-list">
                </div>

            <div class="lang-toggle">
                <span id="btn-es" onclick="setLanguage('es')">ES</span> / 
                <span id="btn-en" onclick="setLanguage('en')">EN</span>
            </div>
        </div>
    </div>

    <div class="video-modal" id="modal">
        <div class="close-video" onclick="closeVideo()">[ CERRAR ]</div>
        <div class="video-container">
            <div id="video-player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        let currentIndex = 0;
        let player;

        const texts = {
            es: {
                about: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires. Se especializa en montaje rítmico y narrativa de ficción para plataformas globales.",
                play: "[ Reproducir ]",
                more: "Ver más →",
                close: "[ CERRAR ]",
                brand: "/leandro_bruno"
            },
            en: {
                about: "Leandro Bruno is a film and advertising editor based in Buenos Aires. Specialized in rhythmic editing and narrative fiction for global platforms.",
                play: "[ Play Video ]",
                more: "More →",
                close: "[ CLOSE ]",
                brand: "/leandro_bruno"
            }
        };

        const projects = [
            { title: "menem", category: "serie", image: "assets/Menem_Thumbnail_1.jpg", yt: "-2AmqmciWXE", desc_es: "Biopic sobre Carlos Menem.", desc_en: "Biopic about Carlos Menem." },
            { title: "oreo", category: "advertising", image: "https://img.youtube.com/vi/7Cllu0Rme74/maxresdefault.jpg", yt: "7Cllu0Rme74", desc_es: "Campaña global para Oreo.", desc_en: "Global campaign for Oreo." },
            { title: "el tiempo de las moscas", category: "serie", image: "assets/Moscas_Thumbnail_v01.png", yt: "A0d6wnlMRRk", desc_es: "Serie original de Netflix.", desc_en: "Netflix original series." },
            { title: "coppola", category: "serie", image: "assets/Coppola_Thumbnail_2.jpg", yt: "ecr24akKDbs", desc_es: "Miniserie de Disney+.", desc_en: "Disney+ original series." },
            { title: "blair", category: "music video", image: "assets/Blair_Thumbnail_v01.jpg", yt: "ItX5aqhqsmo", desc_es: "Videoclip musical.", desc_en: "Music video." }
        ];

        let filtered = [...projects];

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-es').className = lang === 'es' ? 'active-lang' : '';
            document.getElementById('btn-en').className = lang === 'en' ? 'active-lang' : '';
            document.getElementById('txt-about').innerText = texts[lang].about;
            document.getElementById('btn-play-main').innerText = texts[lang].play;
            document.getElementById('main-brand-text').innerText = texts[lang].brand;
            renderList();
        }

        function renderList() {
            const list = document.getElementById('project-list');
            list.innerHTML = '';
            filtered.forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = `project-row ${idx === currentIndex ? 'active' : ''}`;
                row.onclick = () => selectProject(idx);
                row.innerHTML = `
                    <img src="${p.image}" class="thumb-small">
                    <div class="project-row-info">
                        <div class="project-row-title">${p.title}</div>
                        <div class="project-row-desc">${currentLang === 'es' ? p.desc_es : p.desc_en}</div>
                        <div class="more-link">${texts[currentLang].more}</div>
                    </div>
                `;
                list.appendChild(row);
            });
            updateViewer();
        }

        function selectProject(idx) {
            currentIndex = idx;
            renderList();
        }

        function updateViewer() {
            const img = document.getElementById('active-image');
            img.style.opacity = 0;
            setTimeout(() => {
                img.src = filtered[currentIndex].image;
                img.style.opacity = 1;
            }, 200);
            document.getElementById('btn-play-main').style.display = filtered[currentIndex].yt ? 'block' : 'none';
        }

        function filterBy(cat) {
            document.querySelectorAll('#filters span').forEach(s => s.classList.remove('active-filter'));
            event.target.classList.add('active-filter');
            if(cat === 'all') filtered = [...projects];
            else filtered = projects.filter(p => p.category === cat);
            currentIndex = 0;
            renderList();
        }

        function openVideo() {
            const ytId = filtered[currentIndex].yt;
            if(!ytId) return;
            document.getElementById('modal').style.display = 'flex';
            if(player) player.loadVideoById(ytId);
            else player = new YT.Player('video-player', { videoId: ytId, playerVars: { 'autoplay': 1 } });
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            if(player) player.stopVideo();
        }

        window.onload = () => {
            setLanguage('es');
        };
    </script>
</body>
</html>
