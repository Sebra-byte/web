<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111111;
            --text: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow-x: hidden;
        }

        /* --- NAV ESTILO EDIT DOULA --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 40px 50px;
            z-index: 1000;
            mix-blend-mode: difference;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.8;
            letter-spacing: -0.03em;
        }

        .logo p { font-size: 0.9rem; font-weight: 300; margin-top: 5px; }

        nav ul { list-style: none; text-align: right; }
        nav ul li { margin-bottom: 5px; }
        nav ul li a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.6;
            transition: 0.3s;
        }
        nav ul li a:hover { opacity: 1; }

        /* --- HERO SECTION (FULLSCREEN PREVIEW) --- */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 50px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        .hero-bg img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }

        .hero-info h2 {
            font-size: 4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            line-height: 0.9;
        }

        .hero-info p {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        /* --- GRID SECTION --- */
        .work-container {
            padding: 100px 50px;
        }

        .filters {
            display: flex;
            gap: 20px;
            margin-bottom: 50px;
            justify-content: flex-start;
        }

        .filter-btn {
            font-size: 0.8rem;
            font-weight: 700;
            opacity: 0.4;
            transition: 0.3s;
        }

        .filter-btn.active, .filter-btn:hover { opacity: 1; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 40px;
            row-gap: 80px;
        }

        .project-card {
            width: 100%;
        }

        .img-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .img-wrapper img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-card:hover img { transform: scale(1.05); }

        .project-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .project-meta h3 {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .project-details {
            font-size: 0.75rem;
            text-align: right;
            opacity: 0.6;
            line-height: 1.4;
        }

        /* --- MODAL VIDEO --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content { width: 90%; max-width: 1200px; aspect-ratio: 16/9; }
        .close-btn { position: absolute; top: 40px; right: 50px; font-weight: 800; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .hero-info h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1 onclick="window.scrollTo({top: 0, behavior: 'smooth'})">Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <ul>
                <li><a href="#work">/ films</a></li>
                <li><a href="#" onclick="alert('Biografía pronto disponible')">/ about</a></li>
                <li><a href="mailto:leandrobrunoeditor@gmail.com">/ contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" id="hero">
        <div class="hero-bg" id="hero-bg">
            <img src="assets/Menem_Thumbnail_1.jpg" id="hero-img">
        </div>
        <div class="hero-info">
            <p id="hero-cat">serie</p>
            <h2 id="hero-title">menem</h2>
        </div>
    </section>

    <section class="work-container" id="work">
        <div class="filters">
            <span class="filter-btn active" onclick="filterProjects('all', this)">all films</span>
            <span class="filter-btn" onclick="filterProjects('serie', this)">series</span>
            <span class="filter-btn" onclick="filterProjects('advertising', this)">advertising</span>
            <span class="filter-btn" onclick="filterProjects('music video', this)">music videos</span>
        </div>

        <div class="grid" id="grid">
            </div>
    </section>

    <div class="modal" id="modal">
        <div class="close-btn" onclick="closeVideo()">[ CLOSE ]</div>
        <div class="modal-content" id="modal-inner"></div>
    </div>

    <script>
        const data = [
            { title: "menem", cat: "serie", thumb: "assets/Menem_Thumbnail_1.jpg", yt: "-2AmqmciWXE", dir: "ariel winograd", prod: "claxon / prime video" },
            { title: "OREO - Sigamos divirtiendonos", cat: "advertising", thumb: "assets/Oreo_Thumbnail_5.png", yt: "7Cllu0Rme74", dir: "Martín Jalfen", prod: "Pop Studios - México" },
            { title: "el tiempo de las moscas", cat: "serie", thumb: "assets/Moscas_Thumbnail_1.jpg", yt: "A0d6wnlMRRk", dir: "Benjamín Naishtat y Ana Katz", prod: "netflix" },
            { title: "levis x winona riders", cat: "advertising", thumb: "assets/Levis_Thumbnail_v01.jpg", yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", dir: "Nico Alarcos", prod: "primo" },
            { title: "coppola, el representante", cat: "serie", thumb: "assets/Coppola_Thumbnail_2.jpg", yt: "ecr24akKDbs", dir: "ariel winograd", prod: "pampa films / disney+" },
            { title: "blair - Todo lo que tengo", cat: "music video", thumb: "assets/Blair_Thumbnail_1.jpg", yt: "ItX5aqhqsmo", dir: "dana campanello", prod: "poster" },
            { title: "las manos de la abuela", cat: "cortometraje", thumb: "assets/MA_Thumbnail_1.png", yt: "", dir: "camila migliore", prod: "calesita films" },
            { title: "ratones paranoicos", cat: "music video", thumb: "assets/RP_Thumbmail_1.png", yt: "", dir: "alex roux", prod: "poster" },
            { title: "besos brujos", cat: "cortometraje", thumb: "assets/BB_Thumbnail_1.png", yt: "", dir: "karina flonembaum", prod: "" },
            { title: "las marias", cat: "advertising", thumb: "assets/Marias_Thumbnail_1.png", yt: "", dir: "alejandro berger parrado", prod: "navajo films" },
            { title: "todo lo que recuerdo", cat: "cortometraje", thumb: "assets/TodoLoQueRecuerdo_Thumbnail_1.png", yt: "", dir: "nicolas fernandez melian", prod: "" }
        ];

        function renderGrid(items) {
            const grid = document.getElementById('grid');
            grid.innerHTML = items.map(p => `
                <div class="project-card" onclick="openVideo('${p.yt}', '${p.thumb}')">
                    <div class="img-wrapper">
                        <img src="${p.thumb}" alt="${p.title}">
                    </div>
                    <div class="project-meta">
                        <h3>${p.title}</h3>
                        <div class="project-details">
                            dir: ${p.dir}<br>
                            ${p.prod ? 'prod: ' + p.prod : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProjects(cat, el) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat === 'all' ? data : data.filter(p => p.cat === cat);
            renderGrid(filtered);
        }

        // Rotación automática del Hero (Pantalla completa)
        let heroIndex = 0;
        function rotateHero() {
            heroIndex = (heroIndex + 1) % data.length;
            const p = data[heroIndex];
            document.getElementById('hero-img').src = p.thumb;
            document.getElementById('hero-title').innerText = p.title;
            document.getElementById('hero-cat').innerText = p.cat;
        }
        setInterval(rotateHero, 5000);

        function openVideo(id, img) {
            const modal = document.getElementById('modal');
            const inner = document.getElementById('modal-inner');
            modal.style.display = 'flex';
            if(id) {
                const src = id.length < 20 ? `https://www.youtube.com/embed/${id}?autoplay=1` : `https://drive.google.com/file/d/${id}/preview`;
                inner.innerHTML = `<iframe width="100%" height="100%" src="${src}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            } else {
                inner.innerHTML = `<img src="${img}" style="width:100%; height:100%; object-fit:contain;">`;
            }
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-inner').innerHTML = '';
        }

        window.onload = () => renderGrid(data);
    </script>
</body>
</html>
