<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { 
            --bg: #ffffff; 
            --text: #111111; 
            --accent: #666666;
            --sidebar-width: 320px;
            --font-main: 'Manrope', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main);
            overflow-x: hidden;
        }

        /* ESTRUCTURA CARGO: Sidebar Fijo + Contenido Desplazable */
        .main-container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR IZQUIERDO */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0; top: 0;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #f0f0f0;
            z-index: 100;
            background: var(--bg);
        }

        .brand { 
            cursor: pointer; 
            text-decoration: none;
            color: var(--text);
        }
        .brand h1 { 
            font-size: 1.8rem; font-weight: 800; margin: 0; 
            line-height: 1; letter-spacing: -0.03em;
        }
        .brand span { 
            display: block; font-size: 0.9rem; font-weight: 400; 
            margin-top: 5px; color: var(--accent); 
        }

        .nav-group { margin-top: 50px; }
        .nav-item {
            display: block;
            text-decoration: none;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .nav-item:hover { color: var(--accent); }
        .nav-item.active { border-bottom: 2px solid var(--text); display: inline-block; }

        .filters { margin-top: 40px; border-top: 1px solid #eee; padding-top: 30px; }
        .filter-link {
            display: block;
            font-size: 0.8rem;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-link:hover, .filter-link.active { color: var(--text); font-weight: 600; }

        .sidebar-footer { font-size: 0.75rem; line-height: 1.6; color: var(--accent); }
        .lang-switch { margin-bottom: 20px; font-weight: 800; }
        .lang-switch span { cursor: pointer; margin-right: 10px; opacity: 0.3; }
        .lang-switch span.active-lang { opacity: 1; text-decoration: underline; }

        /* CONTENIDO DERECHO (FEED) */
        .content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 50px 80px;
        }

        .project-block {
            margin-bottom: 120px;
            opacity: 0;
            transform: translateY(30px);
            transition: 0.8s all ease-out;
        }
        .project-block.visible { opacity: 1; transform: translateY(0); }

        .project-media {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #f9f9f9;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .project-media img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .project-media:hover img { transform: scale(1.03); }

        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.1); opacity: 0; transition: 0.3s;
        }
        .project-media:hover .play-overlay { opacity: 1; }
        .play-btn-circle {
            width: 80px; height: 80px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
        }

        .project-info {
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .project-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            margin: 0;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .project-meta {
            font-size: 0.85rem;
            line-height: 1.8;
            color: var(--accent);
        }
        .project-meta strong { color: var(--text); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em; }

        /* ABOUT SECTION (OCULTA POR DEFECTO) */
        #about-section { display: none; max-width: 800px; animation: fadeIn 0.8s ease; }
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; margin-top: 40px; }
        .about-image img { width: 100%; filter: grayscale(1); }
        .about-text { font-size: 1.2rem; line-height: 1.6; font-weight: 300; }
        .imdb-link {
            margin-top: 30px; display: inline-block; padding: 15px 30px;
            border: 1px solid var(--text); text-decoration: none; color: var(--text);
            font-weight: 800; font-size: 0.8rem; transition: 0.3s;
        }
        .imdb-link:hover { background: var(--text); color: #fff; }

        /* MODAL VIDEO */
        .video-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: none; z-index: 1000; justify-content: center; align-items: center; }
        .close-modal { position: fixed; top: 40px; right: 40px; cursor: pointer; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; }
        .video-container { width: 90%; max-width: 1400px; aspect-ratio: 16/9; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #eee; }
            .content { margin-left: 0; padding: 40px 20px; }
            .main-container { flex-direction: column; }
            .project-info { grid-template-columns: 1fr; gap: 20px; }
            .project-title { font-size: 2rem; }
            .about-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <div class="top-nav">
                <a class="brand" onclick="showSection('work')">
                    <h1>Leandro Bruno</h1>
                    <span>film editor</span>
                </a>

                <nav class="nav-group">
                    <a class="nav-item active" id="nav-work" onclick="showSection('work')">Index</a>
                    <a class="nav-item" id="nav-bio" onclick="showSection('about')">Bio</a>
                    <a class="nav-item" id="nav-contact" href="mailto:leandrobrunoeditor@gmail.com">Contact</a>
                </nav>

                <div class="filters" id="filters-container">
                    <span class="filter-link active" onclick="filterBy('all')">/ All Projects</span>
                    <span class="filter-link" onclick="filterBy('ficción')">/ Fiction</span>
                    <span class="filter-link" onclick="filterBy('advertising')">/ Advertising</span>
                    <span class="filter-link" onclick="filterBy('music video')">/ Music Videos</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="lang-switch">
                    <span id="btn-es" class="active-lang" onclick="setLanguage('es')">ES</span>
                    <span id="btn-en" onclick="setLanguage('en')">EN</span>
                </div>
                <p>&copy; 2024 Leandro Bruno<br>Based in Buenos Aires</p>
            </div>
        </aside>

        <main class="content">
            <div id="work-feed"></div>

            <div id="about-section">
                <div class="about-grid">
                    <div class="about-image">
                        <img src="assets/Perfil_LMB.png" alt="Leandro Bruno" onerror="this.src='https://via.placeholder.com/600x800'">
                    </div>
                    <div>
                        <div class="about-text" id="txt-about-body"></div>
                        <a href="https://www.imdb.com/name/nm10600109/" target="_blank" class="imdb-link" id="txt-imdb">IMDB CREDITS ↗</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="video-modal" id="modal">
        <div class="close-modal" onclick="closeVideo()">[ Close ]</div>
        <div class="video-container">
            <div id="video-player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        let player;

        const texts = {
            es: {
                work: "Índice", bio: "Biografía", contact: "Contacto",
                all: "/ Todos los proyectos", fiction: "/ Ficción",
                adv: "/ Publicidad", mv: "/ Videoclips",
                dir: "Director", prod: "Productora",
                about: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires. Se especializa en montaje rítmico y narrativa de ficción para plataformas globales como Netflix, Disney+ y Prime Video. Su enfoque combina la precisión técnica con una sensibilidad artística desarrollada en el cine independiente.",
                play: "Ver"
            },
            en: {
                work: "Index", bio: "Biography", contact: "Contact",
                all: "/ All Projects", fiction: "/ Fiction",
                adv: "/ Advertising", mv: "/ Music Videos",
                dir: "Director", prod: "Production",
                about: "Leandro Bruno is a film and advertising editor based in Buenos Aires. He specializes in rhythmic editing and narrative fiction for global platforms such as Netflix, Disney+, and Prime Video. His approach combines technical precision with an artistic sensitivity developed in independent cinema.",
                play: "Play"
            }
        };

        const projects = [
            { title: "menem", category: "serie", image: "assets/Menem_Thumbnail_1.jpg", yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic sobre Carlos Menem.", desc_en: "Biopic about Carlos Menem." },
            { title: "oreo", category: "advertising", image: "https://img.youtube.com/vi/7Cllu0Rme74/maxresdefault.jpg", yt: "7Cllu0Rme74", director: "primo films", prod: "primo", desc_es: "Campaña global.", desc_en: "Global campaign." },
            { title: "el tiempo de las moscas", category: "serie", image: "assets/Moscas_Thumbnail_v01.png", yt: "A0d6wnlMRRk", director: "ana katz", prod: "netflix", desc_es: "Serie original de Netflix.", desc_en: "Netflix original series." },
            { title: "coppola", category: "serie", image: "assets/Coppola_Thumbnail_2.jpg", yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", desc_es: "Miniserie sobre el representante.", desc_en: "Miniseries about the manager." },
            { title: "blair", category: "music video", image: "assets/Blair_Thumbnail_v01.jpg", yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "Videoclip musical.", desc_en: "Music video." },
            { title: "levis", category: "advertising", image: "assets/Levis_Thumbnail_v01.jpg", yt: "7Cllu0Rme74", director: "lorenzo shakespear", prod: "levis argentina", desc_es: "Campaña 501.", desc_en: "501 Campaign." }
        ];

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-switch span').forEach(s => s.classList.remove('active-lang'));
            document.getElementById('btn-' + lang).classList.add('active-lang');
            
            document.getElementById('nav-work').innerText = texts[lang].work;
            document.getElementById('nav-bio').innerText = texts[lang].bio;
            document.getElementById('nav-contact').innerText = texts[lang].contact;
            document.getElementById('txt-about-body').innerText = texts[lang].about;
            
            renderProjects();
        }

        function renderProjects(filter = 'all') {
            const feed = document.getElementById('work-feed');
            feed.innerHTML = '';

            const filtered = filter === 'all' ? projects : 
                             filter === 'ficción' ? projects.filter(p => p.category === 'serie' || p.category === 'cortometraje') :
                             projects.filter(p => p.category === filter);

            filtered.forEach(p => {
                const block = document.createElement('div');
                block.className = 'project-block';
                block.innerHTML = `
                    <div class="project-media" onclick="openVideo('${p.yt}')">
                        <img src="${p.image}" alt="${p.title}">
                        <div class="play-overlay">
                            <div class="play-btn-circle">${texts[currentLang].play}</div>
                        </div>
                    </div>
                    <div class="project-info">
                        <h2 class="project-title">${p.title}</h2>
                        <div class="project-meta">
                            <strong>${texts[currentLang].dir}</strong> ${p.director}<br>
                            <strong>${texts[currentLang].prod}</strong> ${p.prod}<br>
                            <p>${currentLang === 'es' ? p.desc_es : p.desc_en}</p>
                        </div>
                    </div>
                `;
                feed.appendChild(block);
            });

            // Animación de entrada al hacer scroll
            setTimeout(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('visible');
                    });
                }, { threshold: 0.1 });
                document.querySelectorAll('.project-block').forEach(b => observer.observe(b));
            }, 100);
        }

        function filterBy(cat) {
            document.querySelectorAll('.filter-link').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');
            renderProjects(cat);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSection(section) {
            const work = document.getElementById('work-feed');
            const about = document.getElementById('about-section');
            const filters = document.getElementById('filters-container');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(section === 'about') {
                work.style.display = 'none';
                about.style.display = 'block';
                filters.style.display = 'none';
                document.getElementById('nav-bio').classList.add('active');
            } else {
                work.style.display = 'block';
                about.style.display = 'none';
                filters.style.display = 'block';
                document.getElementById('nav-work').classList.add('active');
                renderProjects();
            }
        }

        function openVideo(id) {
            if(!id) return;
            document.getElementById('modal').style.display = 'flex';
            if (player) player.loadVideoById(id);
            else player = new YT.Player('video-player', { videoId: id, playerVars: { 'autoplay': 1 } });
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            if(player) player.stopVideo();
        }

        window.onload = () => {
            setLanguage('es');
            showSection('work');
        };
    </script>
</body>
</html>
