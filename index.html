<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23FFFFE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>'), auto !important;
        }

        :root { 
            --bg: #1E1E1E; /* Color Grafito solicitado */
            --text: #FFFFE4; 
            --line-grid: rgba(255, 255, 228, 0.03); 
            --font-main: 'Manrope', sans-serif;
            --transition-speed: 0.8s;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main); text-transform: lowercase;
            overflow: hidden; letter-spacing: -0.01em;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 220px;
            height: 100vh;
            padding: 35px;
            gap: 30px;
        }

        /* Paneles */
        .left-panel { display: flex; flex-direction: column; gap: 60px; z-index: 100; }
        .brand { font-weight: 300; font-size: 1.1rem; line-height: 1.1; text-transform: none; cursor: pointer; color: var(--text); }
        .brand strong { display: block; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; text-transform: uppercase; }
        
        .nav-links { display: flex; flex-direction: column; gap: 25px; }
        .lang-switch { font-size: 0.85rem; font-weight: 800; display: flex; gap: 5px; margin-bottom: 5px; margin-left: -8px; }
        .lang-switch span { cursor: pointer; position: relative; padding: 8px 12px; opacity: 0.2; transition: 0.3s; }
        .lang-switch span.active-lang { opacity: 1; }
        .lang-switch span.active-lang::after { content: ''; position: absolute; bottom: 5px; left: 12px; width: calc(100% - 24px); height: 2px; background-color: var(--text); }

        .custom-select-container { position: relative; }
        .select-selected { font-size: 0.9rem; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 228, 0.2); padding-bottom: 4px; cursor: pointer; }
        .select-items { position: absolute; background-color: #121212; top: 100%; left: 0; z-index: 99; border: 1px solid rgba(255, 255, 228, 0.05); margin-top: 10px; display: none; min-width: 200px; }
        .select-items div { padding: 12px 15px; font-size: 0.8rem; cursor: pointer; }
        .select-items div:hover { background-color: var(--text); color: #000; }
        .select-show { display: block; }

        .center-panel { width: 100%; position: relative; overflow: hidden; }

        /* Destaque del Viewer */
        .main-viewer {
            width: 100%; max-width: 900px; aspect-ratio: 21 / 9; 
            background: #000; border: 1px solid rgba(255, 255, 228, 0.15); 
            overflow: hidden; position: relative;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.6s ease;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        .main-viewer:hover { transform: scale(1.02); border-color: rgba(255, 255, 228, 0.6); }
        
        #image-container img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 1.2s ease-in-out; opacity: 0; 
        }
        #image-container img.active-slide { opacity: 1; z-index: 2; }
        
        .fade-transition { opacity: 0 !important; transform: translateY(10px); transition: 0.4s ease-in-out; }

        /* Detalles Proyecto */
        .project-details { width: 100%; max-width: 900px; margin-top: 35px; transition: 0.5s ease; }
        .project-details h2 { font-size: 4rem; margin: 0; font-weight: 800; line-height: 0.85; text-transform: uppercase; letter-spacing: -0.05em; }
        .category-label { font-size: 0.7rem; font-weight: 700; color: rgba(255, 255, 228, 0.3); margin-bottom: 15px; display: block; text-transform: uppercase; letter-spacing: 0.15em; }
        .meta { font-size: 0.9rem; line-height: 1.8; color: rgba(255, 255, 228, 0.5); margin-top: 20px; }
        .meta strong { color: var(--text); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }

        /* Right Panel con Scrollbar */
        .right-panel { 
            display: flex; flex-direction: column; gap: 20px; 
            overflow-y: scroll; padding-right: 12px;
            scroll-behavior: smooth;
        }
        /* Custom Scrollbar Styles */
        .right-panel::-webkit-scrollbar { width: 3px; }
        .right-panel::-webkit-scrollbar-track { background: rgba(255, 255, 228, 0.02); }
        .right-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 228, 0.2); border-radius: 10px; }
        .right-panel::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 228, 0.5); }

        .thumb-item { 
            width: 100%; aspect-ratio: 16 / 9; background: #000; 
            border: 1px solid rgba(255, 255, 228, 0.1); 
            overflow: hidden; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            flex-shrink: 0; cursor: pointer; opacity: 0.3;
        }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: 0.5s; }
        
        /* Destaque miniatura activa */
        .thumb-item.active-thumb { 
            opacity: 1; border-color: var(--text); 
            transform: translateX(-12px); 
            box-shadow: -10px 10px 30px rgba(0,0,0,0.4);
        }
        .thumb-item.active-thumb img { filter: grayscale(0); }

        /* Modales */
        .video-modal, .gallery-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: none; z-index: 1000; justify-content: center; align-items: center; }
        .video-wrapper { width: 80%; aspect-ratio: 16 / 9; }
        .close-btn { position: fixed; top: 40px; right: 40px; color: var(--text); font-size: 0.8rem; font-weight: 700; cursor: pointer; z-index: 1100; }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; height: auto; overflow-y: auto; }
            .right-panel { flex-direction: row; height: 140px; overflow-x: scroll; overflow-y: hidden; }
            .thumb-item { width: 220px; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout">
        <section class="left-panel">
            <div class="brand" onclick="location.reload()"><strong>Leandro Bruno</strong>film editor</div>
            <nav class="nav-links">
                <div class="lang-switch">
                    <span id="btn-es" onclick="setLanguage('es')">ES</span>
                    <span id="btn-en" onclick="setLanguage('en')">EN</span>
                </div>
                <div class="custom-select-container">
                    <div class="select-selected" id="current-filter-text" onclick="toggleDropdown(event)"></div>
                    <div class="select-items" id="filter-options">
                        <div onclick="filterBy('all', 'all_projects')">/ todos</div>
                        <div onclick="filterBy('ficción', 'narrative')">/ ficción</div>
                        <div onclick="filterBy('advertising', 'advertising')">/ publicidad</div>
                        <div onclick="filterBy('music video', 'music_video')">/ videoclips</div>
                    </div>
                </div>
                <a id="nav-about" onclick="showSection('about')"></a>
                <a id="nav-contact" href="mailto:leandrobrunoeditor@gmail.com">/ contacto</a>
            </nav>
        </section>

        <section class="center-panel">
            <div id="work-section">
                <div class="main-viewer" id="viewer" onclick="handleMainClick()">
                    <div id="image-container"></div>
                </div>
                <div class="project-details" id="p-details">
                    <span class="category-label" id="p-category"></span>
                    <h2 id="p-title"></h2>
                    <div class="meta" id="p-meta-top"></div>
                    <div class="p-description" id="p-description" style="margin-top:20px; opacity:0.6; font-weight:300;"></div>
                </div>
            </div>

            <div id="about-section" style="display:none; padding-top: 50px;">
                <div id="txt-about-body" style="font-size:1.3rem; line-height:1.4; max-width:600px; font-weight: 300; margin-bottom: 40px; opacity: 0.6;"></div>
                <span id="txt-back" style="cursor:pointer; text-decoration: underline;" onclick="showSection('work')"></span>
            </div>
        </section>

        <section class="right-panel" id="thumbnail-list"></section>
    </main>

    <div class="video-modal" id="modal-v">
        <div class="close-btn" onclick="closeModals()">[ CERRAR ]</div>
        <div class="video-wrapper" id="video-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        let currentIndex = 0;
        let slideIndex = 0;
        let mainRotation, slideRotation;
        let isWheelLocked = false;

        const projects = [
            { title_es: "menem", title_en: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg", "assets/Menem_Thumbnail_3.png"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem.", desc_en: "Biopic tracing Carlos Menem's rise to power." },
            { title_es: "OREO - Sigamos divirtiéndonos", title_en: "OREO - Keep on playing", category: "advertising", images: ["assets/Oreo_Thumbnail_1.png", "assets/Oreo_Thumbnail_2.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios", desc_es: "Campaña publicitaria global.", desc_en: "Global advertising campaign." },
            { title_es: "el tiempo de las moscas", title_en: "time of the flies", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg", "assets/Moscas_Thumbnail_2.png"], yt: "A0d6wnlMRRk", director: "Ana Katz", prod: "netflix", desc_es: "Dos mujeres reconstruyendo sus vidas.", desc_en: "Two women rebuilding their lives." },
            { title_es: "coppola, el representante", title_en: "coppola, the agent", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg", "assets/Coppola_Thumbnail_3.png"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", desc_es: "La historia del representante más famoso.", desc_en: "The story of the most famous manager." },
            { title_es: "blair - Todo lo que tengo", title_en: "blair - All I have", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg", "assets/Blair_Thumbnail_2.png"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "Adelanto Bar Scorpios (2025)", desc_en: "Preview Bar Scorpios (2025)" }
        ];

        let filteredProjects = [...projects];

        const translations = {
            es: { all_projects: "todos", narrative: "ficción", advertising: "publicidad", music_video: "videoclips", dir: "dir", prod: "prod", about: "/ biografía", back: "[ volver ]", about_body: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires." },
            en: { all_projects: "all", narrative: "fiction", advertising: "advertising", music_video: "music videos", dir: "dir", prod: "prod", about: "/ biography", back: "[ back ]", about_body: "Leandro Bruno is a film and advertising editor based in Buenos Aires." }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-es').className = lang === 'es' ? 'active-lang' : '';
            document.getElementById('btn-en').className = lang === 'en' ? 'active-lang' : '';
            document.getElementById('nav-about').innerText = translations[lang].about;
            document.getElementById('txt-back').innerText = translations[lang].back;
            document.getElementById('txt-about-body').innerText = translations[lang].about_body;
            updateDisplay(true);
        }

        function toggleDropdown(e) { e.stopPropagation(); document.getElementById('filter-options').classList.toggle('select-show'); }
        window.onclick = () => document.getElementById('filter-options').classList.remove('select-show');

        function filterBy(val, key) {
            if(val === 'all') filteredProjects = [...projects];
            else if(val === 'ficción') filteredProjects = projects.filter(p => p.category === 'serie' || p.category === 'cortometraje');
            else filteredProjects = projects.filter(p => p.category === val);
            currentIndex = 0;
            updateDisplay();
            resetTimers();
        }

        function updateDisplay(onlyText = false) {
            const current = filteredProjects[currentIndex];
            const container = document.getElementById('image-container');
            const details = document.getElementById('p-details');

            if(!onlyText) {
                container.classList.add('fade-transition');
                details.classList.add('fade-transition');
                
                setTimeout(() => {
                    container.innerHTML = current.images.map((src, i) => `<img src="${src}" class="${i === 0 ? 'active-slide' : ''}">`).join('');
                    slideIndex = 0;
                    renderText(current);
                    renderThumbnails();
                    container.classList.remove('fade-transition');
                    details.classList.remove('fade-transition');
                    scrollThumbIntoView();
                    startSlideShow();
                }, 400);
            } else { renderText(current); }
        }

        function renderText(p) {
            document.getElementById('p-title').innerText = currentLang === 'es' ? p.title_es : p.title_en;
            document.getElementById('p-category').innerText = p.category;
            document.getElementById('p-description').innerText = currentLang === 'es' ? p.desc_es : p.desc_en;
            document.getElementById('p-meta-top').innerHTML = `<strong>${translations[currentLang].dir}:</strong> ${p.director}<br><strong>${translations[currentLang].prod}:</strong> ${p.prod}`;
        }

        function renderThumbnails() {
            document.getElementById('thumbnail-list').innerHTML = filteredProjects.map((p, i) => `
                <div class="thumb-item ${i === currentIndex ? 'active-thumb' : ''}" onclick="goToProject(${i})">
                    <img src="${p.images[0]}">
                </div>
            `).join('');
        }

        function goToProject(i) { currentIndex = i; updateDisplay(); resetTimers(); }

        function scrollThumbIntoView() {
            const active = document.querySelector('.active-thumb');
            if(active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function resetTimers() {
            clearInterval(mainRotation);
            mainRotation = setInterval(() => {
                currentIndex = (currentIndex + 1) % filteredProjects.length;
                updateDisplay();
            }, 7500);
        }

        function startSlideShow() {
            clearInterval(slideRotation);
            const imgs = document.querySelectorAll('#image-container img');
            if(imgs.length > 1) {
                slideRotation = setInterval(() => {
                    imgs[slideIndex].classList.remove('active-slide');
                    slideIndex = (slideIndex + 1) % imgs.length;
                    imgs[slideIndex].classList.add('active-slide');
                }, 3000);
            }
        }

        window.addEventListener('wheel', (e) => {
            if(isWheelLocked || document.getElementById('about-section').style.display === 'block') return;
            isWheelLocked = true;
            if(e.deltaY > 0) currentIndex = (currentIndex + 1) % filteredProjects.length;
            else currentIndex = (currentIndex - 1 + filteredProjects.length) % filteredProjects.length;
            updateDisplay();
            resetTimers();
            setTimeout(() => isWheelLocked = false, 1100);
        });

        function showSection(sec) {
            document.getElementById('work-section').style.display = sec === 'work' ? 'block' : 'none';
            document.getElementById('about-section').style.display = sec === 'about' ? 'block' : 'none';
            if(sec === 'about') clearInterval(mainRotation); else resetTimers();
        }

        function handleMainClick() {
            const p = filteredProjects[currentIndex];
            if(p.yt) {
                document.getElementById('modal-v').style.display = 'flex';
                document.getElementById('video-player').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${p.yt}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                clearInterval(mainRotation);
            }
        }

        function closeModals() {
            document.getElementById('modal-v').style.display = 'none';
            document.getElementById('video-player').innerHTML = '';
            resetTimers();
        }

        setLanguage('es');
        resetTimers();
    </script>
</body>
</html>
