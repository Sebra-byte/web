<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { 
            --bg: #ececec; 
            --text: #1a1a1a; 
            --gray: #666; 
            --transition-speed: 0.6s;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; overflow: hidden; 
        }

        /* UI ESTATICA */
        .ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; pointer-events: none; z-index: 100;
        }

        .side-brand { pointer-events: auto; }
        .side-brand h1 { font-size: 1.1rem; font-weight: 700; margin: 0; line-height: 1.2; letter-spacing: -0.5px; }
        .side-brand p { font-size: 0.9rem; margin: 0; color: var(--gray); }

        .side-nav { pointer-events: auto; text-align: right; display: flex; flex-direction: column; gap: 40px; align-items: flex-end; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; }
        .nav-links a { text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 700; transition: 0.3s; }
        .nav-links a:hover { opacity: 0.5; }
        .arrow-next { cursor: pointer; font-size: 1.5rem; transition: transform 0.3s ease; }
        .arrow-next:hover { transform: translateX(5px); }

        /* INFO INFERIOR CON ANIMACIÓN */
        .project-info {
            position: fixed; bottom: 45px; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 100; width: 100%;
        }

        .info-wrapper {
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
            opacity: 1;
            transform: translateY(0);
        }

        /* Clase para disparar la animación de salida */
        .info-wrapper.changing {
            opacity: 0;
            transform: translateY(10px);
        }

        .project-info h2 { font-size: 1.4rem; font-weight: 700; margin: 0 0 5px 0; letter-spacing: 2px; }
        .project-info p { font-size: 0.85rem; color: var(--gray); margin: 0; }

        /* CONTENEDOR DEL SLIDER */
        .slider-container {
            width: 100%; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        .center-frame {
            width: 65%;
            max-width: 950px;
            aspect-ratio: 16 / 9;
            position: relative;
        }

        .swiper { width: 100%; height: 100%; overflow: visible !important; }

        .swiper-slide {
            width: 100%; height: 100%;
            background: #000;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.12);
            border-radius: 2px;
        }

        .video-wrapper { width: 100%; height: 100%; position: relative; background: #000; }
        .video-wrapper iframe { 
            width: 100%; height: 114%; border: none; 
            position: absolute; top: -7%; left: 0;
            pointer-events: none; 
        }

        /* Capa de interacción */
        .click-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50; cursor: pointer;
        }

        @media (max-width: 1024px) {
            .center-frame { width: 90%; }
            .ui-overlay { padding: 0 25px; }
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="side-brand">
            <h1>leandro bruno</h1>
            <p>film editor</p>
        </div>

        <div class="side-nav">
            <div class="arrow-next" id="js-next">→</div>
            <div class="nav-links">
                <a href="#">work</a>
                <a href="#">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </div>
        </div>
    </div>

    <div class="project-info">
        <div class="info-wrapper" id="info-anim-target">
            <h2 id="p-title">oreo</h2>
            <p id="p-credits">p. primo films</p>
        </div>
    </div>

    <div class="slider-container">
        <div class="center-frame">
            <div class="click-layer" onclick="swiper.slideNext()"></div>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    
                    <div class="swiper-slide" data-title="oreo" data-credits="p. primo films">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/7Cllu0Rme74?autoplay=1&mute=1&loop=1&playlist=7Cllu0Rme74&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                        </div>
                    </div>

                    <div class="swiper-slide" data-title="menem" data-credits="d. ariel winograd | p. claxon, prime video">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/-2AmqmciWXE?autoplay=1&mute=1&loop=1&playlist=-2AmqmciWXE&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                        </div>
                    </div>

                    <div class="swiper-slide" data-title="coppola" data-credits="d. ariel winograd | p. pampa films">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/ecr24akKDbs?autoplay=1&mute=1&loop=1&playlist=ecr24akKDbs&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const infoWrapper = document.getElementById('info-anim-target');
        const pTitle = document.getElementById('p-title');
        const pCredits = document.getElementById('p-credits');

        const swiper = new Swiper(".mySwiper", {
            direction: 'vertical',
            loop: true,
            speed: 1200,
            allowTouchMove: true,
            effect: 'creative',
            creativeEffect: {
                prev: {
                    translate: [0, "110%", 0],
                    opacity: 0,
                },
                next: {
                    // El STACK ARRIBA
                    translate: [0, "-24%", -250], 
                    rotate: [0, 0, 0],
                    opacity: 0.4,
                    scale: 0.86,
                },
            },
            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
            },
            on: {
                slideChangeTransitionStart: function () {
                    // Iniciamos animación de salida del texto
                    infoWrapper.classList.add('changing');
                },
                slideChange: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    if(activeSlide) {
                        // Esperamos un momento breve para cambiar el contenido mientras está invisible
                        setTimeout(() => {
                            pTitle.innerText = activeSlide.getAttribute('data-title');
                            pCredits.innerHTML = activeSlide.getAttribute('data-credits');
                            // Quitamos la clase para que el texto vuelva a aparecer
                            infoWrapper.classList.remove('changing');
                        }, 300); 
                    }
                }
            }
        });

        document.getElementById('js-next').addEventListener('click', () => {
            swiper.slideNext();
        });
    </script>
</body>
</html>
