<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leandro bruno | film editor</title>

<link rel="icon" type="image/png" href="assets/favicom_250120.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23FFFFE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>'), auto;
}

:root {
    --bg:#1E1E1E;
    --text:#FFFFE4;
    --line-grid:rgba(255,255,228,0.04);
    --font-main:'Manrope',sans-serif;
}

body,html{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-main);
    overflow:hidden;
}

.blueprint-bg{
    position:fixed;
    inset:0;
    background:
        linear-gradient(var(--line-grid) 1px, transparent 1px),
        linear-gradient(90deg,var(--line-grid) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;
}

.main-layout{
    display:grid;
    grid-template-columns:280px 1fr 220px;
    height:100vh;
    padding:35px;
    gap:30px;
}

.left-panel{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.brand{
    font-weight:300;
    cursor:pointer;
}
.brand strong{
    display:block;
    font-size:2.2rem;
    font-weight:800;
    text-transform:uppercase;
}

.nav-links{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.custom-select-container{position:relative;}
.select-selected{
    font-weight:700;
    border-bottom:1px solid rgba(255,255,228,.2);
    cursor:pointer;
}
.select-items{
    position:absolute;
    background:#111;
    top:100%;
    left:0;
    display:none;
    min-width:220px;
    border:1px solid rgba(255,255,228,.05);
}
.select-items div{
    padding:12px 15px;
    cursor:pointer;
}
.select-items div:hover{
    background:var(--text);
    color:#000;
}
.select-show{display:block;}

.contenedor-resultado{
    padding:15px;
    border-top:1px solid rgba(255,255,228,.1);
    background:#111;
}
.contenedor-resultado button{
    background:transparent;
    color:var(--text);
    border:1px solid var(--text);
    padding:5px 10px;
    cursor:pointer;
}

.center-panel{
    overflow-y:auto;
    scroll-behavior:smooth;
}

.main-viewer{
    width:100%;
    aspect-ratio:21/9;
    background:#000;
    position:relative;
    cursor:pointer;
}

.main-viewer img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transition:.6s;
}
.main-viewer img.active-slide{opacity:1;}

.slide-nav{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}
.nav-arrow{
    pointer-events:auto;
    width:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:.3s;
}
.main-viewer:hover .nav-arrow{opacity:1;}

.play-indicator{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    font-size:1.5rem;
    opacity:.7;
}

.project-details{margin-top:35px;}
.project-details h2{
    font-size:4rem;
    margin:0;
    text-transform:uppercase;
}

.right-panel{
    display:flex;
    flex-direction:column;
    gap:25px;
    overflow-y:auto;
}

.thumb-item{
    aspect-ratio:16/9;
    background:#000;
    cursor:pointer;
}
.thumb-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.2;
    transition:.5s;
}
.thumb-item.active-thumb img{
    opacity:1;
}
</style>
</head>

<body>

<div class="blueprint-bg"></div>

<main class="main-layout">

<section class="left-panel">
<div>
<div class="brand" onclick="showSection('work')">
<strong>Leandro Bruno</strong>film editor
</div>

<nav class="nav-links">
<div class="custom-select-container">
<div class="select-selected" id="current-filter-text" onclick="toggleDropdown(event)"></div>
<div class="select-items" id="filter-options">
<div onclick="filterBy('all','all_projects')"></div>
<div onclick="filterBy('narrative','narrative')"></div>
<div onclick="filterBy('advertising','advertising')"></div>
<div onclick="filterBy('music_video','music_video')"></div>

<div class="contenedor-resultado" onclick="event.stopPropagation()">
<p>
<span id="txt-calc-text"></span>
<span id="resultado-valor">0</span>
</p>
<button id="btn-calc" onclick="calcular()">actualizar datos</button>
</div>
</div>
</div>

<a id="nav-about" onclick="showSection('about')"></a>
<a id="nav-contact" href="mailto:leandrobrunoeditor@gmail.com"></a>
</nav>
</div>

<div class="lang-switch">
<span id="btn-es" onclick="setLanguage('es')">ES</span>
<span id="btn-en" onclick="setLanguage('en')">EN</span>
</div>
</section>

<section class="center-panel">
<div id="work-section">
<div class="main-viewer" onclick="handleMainClick()">
<div class="slide-nav">
<div class="nav-arrow" onclick="event.stopPropagation();manualSlide(-1)">‹</div>
<div class="nav-arrow" onclick="event.stopPropagation();manualSlide(1)">›</div>
</div>
<div class="play-indicator" id="play-icon"></div>
<div id="image-container"></div>
</div>

<div class="project-details">
<h2 id="p-title"></h2>
<div id="p-meta-top"></div>
<div id="p-description"></div>
</div>
</div>

<div id="about-section" style="display:none;">
<div id="txt-about-body"></div>
<span id="txt-back" onclick="showSection('work')"></span>
</div>
</section>

<section class="right-panel" id="thumbnail-list"></section>

</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let currentLang='es';
let currentIndex=0;
let slideIndex=0;
let slideRotation,mainRotation;
let ytPlayer;
let currentFilterKey='all_projects';

const projects=[
{title_es:"menem",title_en:"menem",category:"narrative",images:["assets/Menem_Thumbnail_1.jpg"],yt:"-2AmqmciWXE",director:"ariel winograd",prod:"prime video",desc_es:"Biopic...",desc_en:"Biopic..."},
{title_es:"oreo",title_en:"oreo",category:"advertising",images:["assets/Oreo_Thumbnail_1.png"],yt:"7Cllu0Rme74",director:"Martín Jalfen",prod:"Pop Studios",desc_es:"Campaña Oreo",desc_en:"Oreo campaign"}
];

let filteredProjects=[...projects];

const translations={
es:{
all_projects:"todos",
narrative:"ficción",
advertising:"publicidad",
music_video:"videoclips",
projects:"proyectos",
about:"/ biografía",
contact:"/ contacto",
back:"[ volver ]",
calc_label:"el resultado es: ",
calc_btn:"actualizar datos",
about_body:"Editor basado en Buenos Aires."
},
en:{
all_projects:"all",
narrative:"fiction",
advertising:"advertising",
music_video:"music videos",
projects:"projects",
about:"/ biography",
contact:"/ contact",
back:"[ back ]",
calc_label:"the result is: ",
calc_btn:"update data",
about_body:"Film editor based in Buenos Aires."
}
};

function setLanguage(lang){
currentLang=lang;
const t=translations[lang];
nav_about.innerText=t.about;
nav_contact.innerText=t.contact;
optText();
txt_back.innerText=t.back;
txt_about_body.innerText=t.about_body;
txt_calc_text.innerText=t.calc_label;
btn_calc.innerText=t.calc_btn;
updateDisplay(true);
}

function optText(){
const t=translations[currentLang];
current_filter_text.innerText=t.projects+" / "+t[currentFilterKey];
filter_options.children[0].innerText="/ "+t.all_projects;
filter_options.children[1].innerText="/ "+t.narrative;
filter_options.children[2].innerText="/ "+t.advertising;
filter_options.children[3].innerText="/ "+t.music_video;
}

function filterBy(val,key){
currentFilterKey=key;
filteredProjects= val==='all' ? [...projects] : projects.filter(p=>p.category===val);
currentIndex=0;
optText();
updateDisplay();
resetIntervals();
}

function updateDisplay(onlyText=false){
const p=filteredProjects[currentIndex];
if(!p) return;
if(!onlyText){
image_container.innerHTML=p.images.map((src,i)=>`<img src="${src}" class="${i===0?'active-slide':''}">`).join('');
slideIndex=0;
}
p_title.innerText=currentLang==='es'?p.title_es:p.title_en;
p_description.innerText=currentLang==='es'?p.desc_es:p.desc_en;
play_icon.innerText=p.yt?'▶':'＋';
renderThumbnails();
resetSlideTimer();
}

function renderThumbnails(){
thumbnail_list.innerHTML=filteredProjects.map((p,i)=>`
<div class="thumb-item ${i===currentIndex?'active-thumb':''}" onclick="selectProject(${i})">
<img src="${p.images[0]}">
</div>`).join('');
}

function selectProject(i){
currentIndex=i;
updateDisplay();
resetIntervals();
}

function manualSlide(dir){
const imgs=document.querySelectorAll('#image-container img');
if(imgs.length<=1) return;
imgs[slideIndex].classList.remove('active-slide');
slideIndex=(slideIndex+dir+imgs.length)%imgs.length;
imgs[slideIndex].classList.add('active-slide');
resetSlideTimer();
}

function resetSlideTimer(){
clearInterval(slideRotation);
slideRotation=setInterval(()=>manualSlide(1),2800);
}

function resetIntervals(){
clearInterval(mainRotation);
if(!filteredProjects.length) return;
mainRotation=setInterval(()=>{
currentIndex=(currentIndex+1)%filteredProjects.length;
updateDisplay();
},8000);
}

function toggleDropdown(e){
e.stopPropagation();
filter_options.classList.toggle('select-show');
}

document.addEventListener('click',()=>{
filter_options.classList.remove('select-show');
});

function calcular(){
resultado_valor.innerText=Math.floor(Math.random()*100);
}

window.onload=()=>{
setLanguage('es');
resetIntervals();
};
</script>

</body>
</html>
