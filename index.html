<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .nav-links a:hover { opacity: 1; }

        /* --- CAROUSEL --- */
        .carousel {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
        }

        .slide.active { opacity: 1; }

        /* Overlay para legibilidad */
        .slide::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 30%);
            z-index: 1;
        }

        .slide-info {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .project-title {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .credits {
            display: flex;
            gap: 15px;
            font-size: 0.7rem;
            text-transform: lowercase;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .credits span { display: flex; gap: 5px; }
        .credits b { font-weight: 400; opacity: 0.6; }

        /* --- CONTROLS --- */
        .controls {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 10;
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active { background: #fff; transform: scale(1.2); }

        /* Flechas sutiles */
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            cursor: pointer;
            opacity: 0.3;
            transition: 0.3s;
            padding: 20px;
            font-size: 1.5rem;
            user-select: none;
        }
        .arrow:hover { opacity: 1; }
        .prev { left: 10px; }
        .next { right: 10px; }

    </style>
</head>
<body>

    <nav>
        <div class="brand">leandro bruno <span style="opacity: 0.5">film editor</span></div>
        <div class="nav-links">
            <a href="#">work</a>
            <a href="#">about</a>
            <a href="#">contact</a>
        </div>
    </nav>

    <div class="carousel" id="mainCarousel">
        <div class="arrow prev" onclick="moveSlide(-1)">&#8249;</div>
        <div class="arrow next" onclick="moveSlide(1)">&#8250;</div>
        
        </div>

    <div class="controls" id="dotsContainer"></div>

    <script>
        const projects = [
            {
                title: "menem",
                director: "ariel winograd",
                prod: "claxon / prime video",
                editor: "leandro bruno",
                img: "assets/Menem_Thumbnail_1.jpg"
            },
            {
                title: "oreo - sigamos divirtiendonos",
                director: "martín jalfen",
                prod: "pop studios mx",
                editor: "leandro bruno",
                img: "assets/Oreo_Thumbnail_5.png"
            },
            {
                title: "coppola, el representante",
                director: "ariel winograd",
                prod: "pampa films",
                editor: "leandro bruno",
                img: "assets/Coppola_Thumbnail_2.jpg"
            }
        ];

        let currentSlide = 0;
        const container = document.getElementById('mainCarousel');
        const dotsContainer = document.getElementById('dotsContainer');

        function initCarousel() {
            projects.forEach((p, i) => {
                // Crear Slide
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                slide.style.backgroundImage = `url('${p.img}')`;
                slide.innerHTML = `
                    <div class="slide-info">
                        <h2 class="project-title">${p.title}</h2>
                        <div class="credits">
                            <span><b>d:</b> ${p.director}</span>
                            <span><b>p:</b> ${p.prod}</span>
                            <span><b>e:</b> ${p.editor}</span>
                        </div>
                    </div>
                `;
                container.appendChild(slide);

                // Crear Dot
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = () => goToSlide(i);
                dotsContainer.appendChild(dot);
            });
        }

        function updateCarousel() {
            document.querySelectorAll('.slide').forEach((s, i) => {
                s.classList.toggle('active', i === currentSlide);
            });
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === currentSlide);
            });
        }

        function moveSlide(step) {
            currentSlide = (currentSlide + step + projects.length) % projects.length;
            updateCarousel();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
        }

        // Auto-play opcional
        // setInterval(() => moveSlide(1), 5000);

        initCarousel();
    </script>
</body>
</html>
