<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grafito: #1a1a1a;
            --bg-grafito-claro: #2a2a2a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg-grafito);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 40px 50px;
            z-index: 5000;
            mix-blend-mode: difference;
        }

        .brand h1 { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.03em; cursor: pointer; }
        .brand p { font-size: 0.85rem; font-weight: 300; margin-top: 5px; opacity: 0.8; }

        nav ul { list-style: none; text-align: right; display: flex; gap: 30px; }
        nav ul li a { text-decoration: none; color: var(--hueso); font-size: 1rem; font-weight: 500; opacity: 0.6; transition: 0.3s; }
        nav ul li a:hover, .active-nav { opacity: 1; }

        /* --- FONDO VIDEO (HOME) --- */
        .bg-preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: var(--bg-grafito); overflow: hidden;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .bg-video.active { opacity: 0.35; }
        .bg-video iframe {
            width: 150vw; height: 150vh;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            pointer-events: none;
        }

        /* --- HOME SECTION --- */
        #home-section {
            height: 100vh; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; padding-left: 50px;
            position: relative; z-index: 10;
        }
        .list-container p { 
            font-size: 0.8rem; margin-bottom: 25px; font-weight: 700; 
            opacity: 0.4; letter-spacing: 0.1em; text-transform: uppercase;
        }
        .film-item {
            font-size: 4.5rem; font-weight: 800; text-transform: uppercase;
            line-height: 0.85; letter-spacing: -0.04em; color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2);
            transition: all 0.4s ease; display: block;
            text-decoration: none; margin-bottom: 2px; width: fit-content;
        }
        .film-item.active, .film-item:hover {
            color: var(--hueso); -webkit-text-stroke: 0px; transform: translateX(15px);
        }

        /* --- ALL PROJECTS SECTION --- */
        #all-projects-section {
            display: none;
            padding: 150px 50px 100px;
            position: relative;
            z-index: 100;
            background: var(--bg-grafito);
            min-height: 100vh;
        }

        .category-separator {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--hueso);
            opacity: 0.3;
            padding: 60px 0 20px;
            border-bottom: 1px solid rgba(255, 255, 228, 0.1);
            margin-bottom: 20px;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .project-row {
            display: grid;
            grid-template-columns: 450px 1fr 250px;
            gap: 60px;
            padding: 45px 20px;
            border-bottom: 1px solid rgba(255, 255, 228, 0.05);
            align-items: center;
            transition: background 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .project-row:hover {
            background-color: var(--bg-grafito-claro);
        }

        .project-row .thumb-box {
            width: 100%; aspect-ratio: 16/9;
            overflow: hidden; background: #000;
        }

        .project-row .thumb-box img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s ease;
        }

        .project-row:hover .thumb-box img { transform: scale(1.05); }

        .project-row .info-box h3 {
            font-size: 2.8rem; /* Letra más grande */
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            line-height: 0.9;
        }

        .project-row .info-box p {
            font-size: 1rem;
            line-height: 1.4;
            opacity: 0.7;
            margin-bottom: 6px;
            text-transform: none;
        }

        .project-row .info-box strong { font-weight: 700; color: var(--hueso); margin-right: 8px; }

        .project-row .logos-box {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            align-items: center;
        }

        .project-row .logos-box img {
            max-height: 45px; /* Logos más grandes */
            max-width: 120px;
            filter: brightness(0) invert(1);
            opacity: 0.9;
        }

        /* --- MODAL DETALLE --- */
        #project-detail {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-grafito); z-index: 6000;
            display: none; flex-direction: column;
            padding: 100px 50px 50px; overflow-y: auto;
        }
        .close-btn {
            position: fixed; top: 40px; right: 50px;
            font-size: 0.8rem; font-weight: 800; color: var(--hueso);
            cursor: pointer; z-index: 6100; text-transform: uppercase;
        }
        .detail-video-box { width: 100%; aspect-ratio: 21/9; background: #000; margin-bottom: 50px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; padding-bottom: 100px; }
        .detail-grid h2 { font-size: 4rem; font-weight: 800; text-transform: uppercase; line-height: 0.85; }

        @media (max-width: 1200px) {
            .project-row { grid-template-columns: 350px 1fr 150px; gap: 30px; }
            .project-row .info-box h3 { font-size: 2rem; }
        }

        @media (max-width: 900px) {
            .project-row { grid-template-columns: 1fr; gap: 20px; padding: 30px 20px; }
            .project-row .logos-box { justify-content: flex-start; }
            .film-item { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="showSection('home')">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <ul>
                <li><a href="#" id="nav-all" onclick="showSection('all')">/ all projects</a></li>
                <li><a href="mailto:leandrobrunoeditor@gmail.com">/ contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="bg-preview-container" id="bg-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <section id="home-section">
        <div class="list-container">
            <p>selected works</p>
            <div id="featured-list"></div>
        </div>
    </section>

    <section id="all-projects-section">
        <div class="projects-list" id="full-index-list">
            </div>
    </section>

    <div id="project-detail">
        <div class="close-btn" onclick="closeDetail()">[ close ]</div>
        <div id="detail-dynamic-content"></div>
    </div>

    <script>
        const projects = [
            { title_es: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", platform: "https://upload.wikimedia.org/wikipedia/commons/f/f1/Prime_Video.png" },
            { title_es: "el tiempo de las moscas", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg"], yt: "A0d6wnlMRRk", director: "Benjamín Naishtat y Ana Katz", prod: "netflix", platform: "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" },
            { title_es: "coppola, el representante", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", platform: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" },
            
            { title_es: "OREO - Sigamos divirtiendonos", category: "advertising", images: ["assets/Oreo_Thumbnail_5.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México", platform: "" },
            { title_es: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", director: "Nico Alarcos", prod: "primo", platform: "" },
            { title_es: "las marias", category: "advertising", images: ["assets/Marias_Thumbnail_1.png"], yt: "", director: "alejandro berger parrado", prod: "navajo films", platform: "" },

            { title_es: "blair - Todo lo que tengo", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", platform: "" },
            { title_es: "ratones paranoicos", category: "music video", images: ["assets/RP_Thumbmail_1.png"], yt: "", director: "alex roux", prod: "poster", platform: "" },

            { title_es: "las manos de la abuela", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png"], yt: "", director: "camila migliore", prod: "calesita films", platform: "" },
            { title_es: "besos brujos", category: "cortometraje", images: ["assets/BB_Thumbnail_1.png"], yt: "", director: "karina flonembaum", prod: "calesita films", platform: "" },
            { title_es: "todo lo que recuerdo", category: "cortometraje", images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"], yt: "", director: "nicolas fernandez melian", prod: "u n m a", platform: "" }
        ];

        let currentIdx = 0;
        let activePane = 1;
        let isHovering = false;
        let rotationTimer;

        function init() {
            const featList = document.getElementById('featured-list');
            const indexList = document.getElementById('full-index-list');

            // 1. Llenar Home (Featured)
            projects.filter(p => p.yt).slice(0, 6).forEach((p, idx) => {
                const a = document.createElement('a');
                a.className = "film-item";
                a.innerText = p.title_es;
                a.onmouseenter = () => { isHovering = true; changeHeroProject(idx); };
                a.onmouseleave = () => { isHovering = false; };
                a.onclick = (e) => { e.preventDefault(); openDetail(p); };
                featList.appendChild(a);
            });

            // 2. Llenar All Projects con Separadores
            const categories = [...new Set(projects.map(p => p.category))];
            categories.forEach(cat => {
                const sep = document.createElement('div');
                sep.className = "category-separator";
                sep.innerText = cat;
                indexList.appendChild(sep);

                projects.filter(p => p.category === cat).forEach(p => {
                    const row = document.createElement('a');
                    row.href = "#";
                    row.className = "project-row";
                    row.innerHTML = `
                        <div class="thumb-box"><img src="${p.images[0]}" alt="${p.title_es}"></div>
                        <div class="info-box">
                            <h3>${p.title_es}</h3>
                            <p><strong>Director:</strong> ${p.director}</p>
                            <p><strong>Production:</strong> ${p.prod}</p>
                            <p><strong>Editor:</strong> Leandro Bruno</p>
                        </div>
                        <div class="logos-box">
                            ${p.platform ? `<img src="${p.platform}">` : ''}
                        </div>
                    `;
                    row.onclick = (e) => { e.preventDefault(); openDetail(p); };
                    indexList.appendChild(row);
                });
            });

            changeHeroProject(0);
            startRotation();
        }

        function changeHeroProject(idx) {
            const featuredOnes = projects.filter(p => p.yt);
            const items = document.querySelectorAll('.film-item');
            items.forEach(item => item.classList.remove('active'));
            if(items[idx]) items[idx].classList.add('active');

            const nextPaneIdx = activePane === 1 ? 2 : 1;
            const currentPane = document.getElementById(`pane-${activePane}`);
            const nextPane = document.getElementById(`pane-${nextPaneIdx}`);

            const p = featuredOnes[idx];
            if(p) {
                nextPane.innerHTML = `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${p.yt}&modestbranding=1&rel=0" frameborder="0"></iframe>`;
                setTimeout(() => {
                    nextPane.classList.add('active');
                    currentPane.classList.remove('active');
                    activePane = nextPaneIdx;
                    setTimeout(() => { currentPane.innerHTML = ''; }, 1500);
                }, 500);
            }
            currentIdx = idx;
        }

        function startRotation() {
            rotationTimer = setInterval(() => {
                if (!isHovering) {
                    const featuredOnes = projects.filter(p => p.yt);
                    currentIdx = (currentIdx + 1) % featuredOnes.length;
                    changeHeroProject(currentIdx);
                }
            }, 6000);
        }

        function showSection(sec) {
            const home = document.getElementById('home-section');
            const all = document.getElementById('all-projects-section');
            const bg = document.getElementById('bg-container');
            if(sec === 'all') {
                home.style.display = 'none'; bg.style.display = 'none';
                all.style.display = 'block'; document.body.style.overflowY = 'auto';
            } else {
                home.style.display = 'flex'; bg.style.display = 'block';
                all.style.display = 'none'; document.body.style.overflowY = 'hidden';
            }
            document.getElementById('nav-all').classList.toggle('active-nav', sec === 'all');
        }

        function openDetail(p) {
            const detail = document.getElementById('project-detail');
            detail.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            document.getElementById('detail-dynamic-content').innerHTML = `
                <div class="detail-video-box">
                    ${p.yt ? `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${p.yt}?autoplay=1" frameborder="0" allowfullscreen></iframe>` : `<img src="${p.images[0]}" style="width:100%; height:100%; object-fit:cover;">`}
                </div>
                <div class="detail-grid">
                    <div><h2>${p.title_es}</h2><p style="opacity:0.4; margin-top:10px; font-weight:800; text-transform:uppercase;">${p.category}</p></div>
                    <div style="font-size:1.1rem; line-height:1.6; opacity:0.8; text-transform:none;">
                        <p><strong>director:</strong> ${p.director}</p>
                        <p><strong>production:</strong> ${p.prod}</p>
                    </div>
                </div>
            `;
        }

        function closeDetail() { 
            document.getElementById('project-detail').style.display = 'none'; 
            document.body.style.overflowY = document.getElementById('all-projects-section').style.display === 'block' ? 'auto' : 'hidden';
        }

        window.onload = init;
    </script>
</body>
</html>
