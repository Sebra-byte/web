<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #050505;
            --text: #ffffff;
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden; /* Evita scroll mientras navegas el carrusel */
        }

        /* --- NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }

        .brand, .nav-links a { pointer-events: auto; }

        .brand {
            font-size: clamp(1.5rem, 2vw, 2.5rem); 
            font-weight: 600;
            letter-spacing: -1px;
            text-transform: lowercase;
            line-height: 1;
            font-family: var(--font-serif);
        }
        
        .brand span {
            display: block;
            font-family: var(--font-main);
            font-size: 0.4em;
            letter-spacing: 2px;
            opacity: 0.7;
            margin-top: 5px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            padding-top: 10px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            transition: opacity 0.3s;
            position: relative;
        }

        .nav-links a::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 0%; height: 1px; background: white; transition: 0.3s;
        }
        .nav-links a:hover { opacity: 1; }
        .nav-links a:hover::after { width: 100%; }

        /* --- CAROUSEL --- */
        .carousel {
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px 60px 80px 60px;
            cursor: pointer;
        }

        .slide.active { opacity: 1; z-index: 1; }

        /* VIDEO BACKGROUND STYLES */
        .slide video {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: translate(-50%, -50%) scale(1.05);
            transition: transform 6s ease;
            z-index: 0;
        }

        /* Efecto Ken Burns (Zoom lento) */
        .slide.active video {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Overlay oscuro para legibilidad */
        .slide::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.4) 100%);
        }

        .slide-info {
            position: relative;
            z-index: 2;
            max-width: 900px;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease 0.3s;
        }

        .slide.active .slide-info {
            opacity: 1;
            transform: translateY(0);
        }

        .project-title {
            font-family: var(--font-serif);
            font-size: clamp(4rem, 8vw, 7rem);
            margin-bottom: 10px;
            letter-spacing: -2px;
            line-height: 0.9;
            color: #fff;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .project-title i {
            font-family: var(--font-main);
            font-style: normal;
            font-size: 0.3em;
            vertical-align: middle;
            border: 1px solid white;
            border-radius: 50%;
            padding: 10px 14px 10px 16px;
            margin-left: 20px;
            opacity: 0;
            transition: 0.4s;
            font-weight: 300;
        }

        .slide:hover .project-title i { opacity: 1; background: white; color: black; }

        .credits {
            display: flex;
            gap: 30px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
            color: rgba(255,255,255,0.8);
        }

        .credits span b { color: #fff; margin-right: 5px; }

        /* --- CONTROLS --- */
        .controls {
            position: absolute;
            bottom: 50px;
            right: 60px;
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        .dot {
            width: 40px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active { background: #fff; width: 60px; }

        /* --- MODAL (Full Screen Youtube) --- */
        #video-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #video-modal.open { opacity: 1; pointer-events: auto; }

        .modal-close {
            position: absolute;
            top: 40px; right: 40px;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 2001;
            mix-blend-mode: difference;
        }

        .video-wrapper {
            width: 100%; height: 100%;
        }

        iframe { width: 100%; height: 100%; border: none; }
        
        /* Mobile adjustment */
        @media(max-width: 768px) {
            nav { padding: 30px; flex-direction: column; gap: 20px; }
            .slide { padding: 30px; }
            .project-title { font-size: 3rem; }
            .controls { right: auto; left: 30px; bottom: 30px; }
            .credits { flex-direction: column; gap: 5px; font-size: 0.7rem; }
        }

    </style>
</head>
<body>

    <nav>
        <div class="brand">
            leandro bruno
            <span>film editor</span>
        </div>
        <div class="nav-links">
            <a href="#">selected</a>
            <a href="#">index</a>
            <a href="mailto:hola@tuemail.com">contact</a>
        </div>
    </nav>

    <div class="carousel" id="mainCarousel"></div>

    <div class="controls" id="dotsContainer"></div>

    <div id="video-modal">
        <div class="modal-close" onclick="closeVideo()">&times;</div>
        <div class="video-wrapper" id="video-container"></div>
    </div>

    <script>
        // CONFIGURACIÓN DE TUS PROYECTOS
        // 1. 'previewUrl': Es el video de fondo (MP4 en carpeta assets).
        // 2. 'yt': Es el ID del video de YouTube (lo que va después de v=).
        const projects = [
            {
                title: "Menem",
                director: "ariel winograd",
                prod: "prime video",
                yt: "-2AmqmciWXE",
                previewUrl: "assets/menem_preview.mp4" 
            },
            {
                title: "Oreo",
                director: "martín jalfen",
                prod: "pop studios",
                yt: "7Cllu0Rme74",
                previewUrl: "assets/oreo_preview.mp4"
            },
            {
                title: "Coppola",
                director: "ariel winograd",
                prod: "disney+",
                yt: "ecr24akKDbs",
                previewUrl: "assets/coppola_preview.mp4"
            },
            {
                title: "Moscas",
                director: "b. naishtat",
                prod: "netflix",
                yt: "A0d6wnlMRRk",
                previewUrl: "assets/moscas_preview.mp4"
            }
        ];

        let currentSlide = 0;
        let autoPlayInterval;
        const container = document.getElementById('mainCarousel');
        const dotsContainer = document.getElementById('dotsContainer');

        function initCarousel() {
            projects.forEach((p, i) => {
                // Crear Slide
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                
                // HTML interno con Video de fondo y textos
                slide.innerHTML = `
                    <video loop muted playsinline poster="assets/placeholder.jpg">
                        <source src="${p.previewUrl}" type="video/mp4">
                    </video>
                    <div class="slide-info">
                        <h2 class="project-title">${p.title} <i>&#9658;</i></h2>
                        <div class="credits">
                            <span><b>Dir:</b> ${p.director}</span>
                            <span><b>Prod:</b> ${p.prod}</span>
                        </div>
                    </div>
                `;
                
                // Click para abrir Modal
                slide.onclick = () => openVideo(p.yt);
                container.appendChild(slide);

                // Crear Dot (Línea)
                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = (e) => {
                    e.stopPropagation();
                    goToSlide(i);
                };
                dotsContainer.appendChild(dot);
            });

            // Iniciar el video del primer slide
            playActiveVideo();
            // Iniciar Auto-Play del carrusel
            startAutoPlay();
        }

        function playActiveVideo() {
            // Pausar todos los videos para ahorrar recursos
            document.querySelectorAll('video').forEach(v => v.pause());
            
            // Reproducir solo el activo
            const activeSlide = document.querySelectorAll('.slide')[currentSlide];
            const video = activeSlide.querySelector('video');
            if(video) {
                video.currentTime = 0;
                video.play().catch(e => console.log("Interacción requerida para play"));
            }
        }

        function updateCarousel() {
            document.querySelectorAll('.slide').forEach((s, i) => {
                s.classList.toggle('active', i === currentSlide);
            });
            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === currentSlide);
            });
            playActiveVideo();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetAutoPlay();
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % projects.length;
            updateCarousel();
        }

        // Auto Play Lógica (Cambia cada 7 segundos)
        function startAutoPlay() {
            autoPlayInterval = setInterval(nextSlide, 7000);
        }

        function resetAutoPlay() {
            clearInterval(autoPlayInterval);
            startAutoPlay();
        }

        // --- VIDEO MODAL LOGIC ---
        const modal = document.getElementById('video-modal');
        const videoContainer = document.getElementById('video-container');

        function openVideo(ytId) {
            clearInterval(autoPlayInterval); // Parar carrusel
            // Pausar video de fondo
            document.querySelectorAll('video').forEach(v => v.pause());
            
            videoContainer.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&controls=1" 
                allow="autoplay; encrypted-media" allowfullscreen></iframe>
            `;
            modal.classList.add('open');
        }

        function closeVideo() {
            modal.classList.remove('open');
            setTimeout(() => { videoContainer.innerHTML = ''; }, 300);
            playActiveVideo(); // Volver a reproducir fondo
            startAutoPlay(); // Reiniciar carrusel
        }

        // Cerrar con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeVideo();
        });

        initCarousel();
    </script>
</body>
</html>
