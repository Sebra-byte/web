<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* PALETA */
            --bg: #757c71;
            --text: #eae5dc;
            --accent: rgba(234, 229, 220, 0.8);
            
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* --- CUSTOM SCROLLBAR --- */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb {
            background-color: var(--text);
            border-radius: 10px;
            border: 3px solid var(--bg);
            opacity: 0.5;
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #fff; }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; 
            padding: 30px 50px; 
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 500; pointer-events: none; 
            background: transparent;
            transition: background 0.3s;
        }
        nav.solid-bg { background: var(--bg); pointer-events: auto; }
        
        .brand, .nav-links a, .lang-toggle { pointer-events: auto; cursor: pointer; }
        
        .brand {
            font-size: clamp(1.45rem, 2vw, 2.35rem); 
            font-weight: 600; letter-spacing: -0.5px; text-transform: lowercase;
            line-height: 1; font-family: var(--font-serif); color: var(--text);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .brand span {
            display: block; font-family: var(--font-main); font-size: 0.45em;
            letter-spacing: 2px; opacity: 0.8; margin-top: 4px;
            text-transform: uppercase; font-weight: 400;
        }
        
        .nav-links { display: flex; gap: 30px; padding-top: 8px; align-items: center; }
        
        .nav-links a, .lang-toggle {
            color: var(--text); text-decoration: none; 
            font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.9;
            transition: opacity 0.3s; position: relative;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .nav-links a:hover, .lang-toggle:hover { opacity: 1; }
        
        .lang-toggle {
            font-weight: 600;
            border: 1px solid rgba(234, 229, 220, 0.3);
            padding: 4px 8px; border-radius: 4px; margin-right: 10px; 
        }

        /* --- CAROUSEL --- */
        .carousel { height: 100vh; width: 100vw; position: relative; z-index: 1; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
            padding: 0 0 60px 60px; cursor: pointer;
        }
        .slide.active { opacity: 1; z-index: 1; }
        .bg-media {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            object-fit: cover; transform: translate(-50%, -50%) scale(1.08);
            transition: transform 7s ease-out; z-index: 0;
        }
        .slide.active .bg-media { transform: translate(-50%, -50%) scale(1); }
        .slide-info {
            position: relative; z-index: 2; max-width: 1100px; opacity: 0;
            transform: translateY(20px); transition: all 0.8s ease 0.4s;
            text-align: left; 
        }
        .slide.active .slide-info { opacity: 1; transform: translateY(0); }
        .project-title {
            font-family: var(--font-serif); font-size: clamp(1.8rem, 3vw, 2.5rem); 
            margin-bottom: 15px; letter-spacing: -0.5px; line-height: 1; color: var(--text);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5); display: inline-block; 
            border-bottom: 1px solid rgba(234, 229, 220, 0.6); padding-bottom: 5px;
        }
        .credits {
            display: flex; gap: 20px; font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 10px; color: var(--accent);
            text-shadow: 0 1px 5px rgba(0,0,0,0.5); font-family: var(--font-main);
        }
        .credits span b { color: var(--text); margin-right: 5px; font-weight: 400; text-transform: lowercase; }
        .carousel-arrows {
            position: absolute; top: 50%; width: 100%; transform: translateY(-50%);
            display: flex; justify-content: space-between; padding: 0 30px; z-index: 10;
            pointer-events: none; 
        }
        .arrow {
            color: rgba(234, 229, 220, 0.4); font-size: 1.5rem; cursor: pointer;
            pointer-events: auto; transition: color 0.3s, transform 0.3s; padding: 20px;
        }
        .arrow:hover { color: var(--text); transform: scale(1.1); }
        .controls { display: none; } 

        /* --- GRID --- */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            auto-rows: 350px; gap: 0; 
            max-width: 1800px; margin: 0 auto; padding-bottom: 100px;
        }
        .grid-item { position: relative; overflow: hidden; cursor: pointer; border: none; min-height: 100%; }
        .grid-item.half { grid-column: span 6; } 
        .grid-item.third { grid-column: span 4; } 
        .grid-item.three-quarters { grid-column: span 9; } 
        .grid-item.quarter { grid-column: span 3; } 
        .grid-item.tall { grid-row: span 2; } 

        .grid-item img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(20%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s;
            display: block; 
        }
        .grid-item:hover img { transform: scale(1.05); filter: grayscale(0%); }

        .item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s ease;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 30px; pointer-events: none; 
        }
        .grid-item:hover .item-overlay { opacity: 1; }
        .item-title {
            font-family: var(--font-serif); font-size: 1.4rem; color: var(--text);
            margin-bottom: 8px; line-height: 1.1; display: inline-block;
            border-bottom: 1px solid rgba(234, 229, 220, 0.6); padding-bottom: 4px;
        }
        .item-meta {
            font-family: var(--font-main); font-size: 0.7rem; color: var(--accent);
            letter-spacing: 0.5px; text-transform: uppercase; margin-top: 5px;
        }
        .item-meta span { margin-right: 15px; }

        /* --- ABOUT & MODAL --- */
        .about-container {
            max-width: 800px; margin: 0 auto; padding-top: 100px;
            display: flex; flex-direction: column; justify-content: center; text-align: center; 
        }
        .about-text p {
            font-family: var(--font-main); font-size: 1.3rem; line-height: 1.6;
            color: var(--text); margin-bottom: 30px; font-weight: 300;
        }
        .about-text strong { font-weight: 600; color: var(--text); }
        .imdb-link {
            display: inline-flex; align-items: center; gap: 5px; justify-content: center;
            color: var(--text); text-decoration: none; font-weight: 600;
            border-bottom: 1px solid transparent; transition: border 0.3s;
            margin-top: 10px; font-size: 0.9rem; letter-spacing: 0.5px;
        }
        .imdb-link:hover { border-bottom: 1px solid var(--text); }
        .overlay-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 400; padding: 120px 40px 60px 40px; 
            overflow-y: auto; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease; transform: translateY(20px);
        }
        .overlay-section.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #modal-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #2F352E; z-index: 2000; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #modal-container.open { opacity: 1; pointer-events: auto; }
        .modal-close {
            position: absolute; top: 40px; right: 40px; color: var(--text);
            font-size: 1.5rem; cursor: pointer; z-index: 2005;
        }
        .modal-content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .video-wrapper { width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        .gallery-wrapper {
            width: 100%; height: 100%; display: flex; overflow-x: auto;
            scroll-snap-type: x mandatory; align-items: center;
            scroll-behavior: smooth;
        }
        .gallery-item {
            min-width: 100vw; height: 100vh; scroll-snap-align: center;
            display: flex; justify-content: center; align-items: center; padding: 60px;
        }
        .gallery-item img {
            max-width: 100%; max-height: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 4px;
        }
        .gallery-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: var(--text); opacity: 0.5; font-size: 0.8rem; text-transform: uppercase;
        }

        /* --- MOBILE --- */
        @media(max-width: 1024px) {
            .project-grid { display: flex; flex-direction: column; } 
            .grid-item.half, .grid-item.third, .grid-item.three-quarters, .grid-item.quarter, .grid-item.tall { 
                width: 100%; height: 300px; grid-column: auto; grid-row: auto; 
            }
            .item-overlay { opacity: 1; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 70%); }
            nav { padding: 20px 30px; }
            .brand { font-size: 1.5rem; }
            .nav-links { gap: 15px; }
            .nav-links a { font-size: 0.6rem; }
            .slide { padding: 0 0 80px 30px; } 
            .slide-info { transform: translateY(0); opacity: 1; }
            .project-title { font-size: 2rem; }
            .overlay-section { padding: 100px 20px 40px 20px; }
        }
    </style>
</head>

        let currentLang = 'en';

        // --- DATA MASTER ---

            {

                platform: "Netflix", 
                yt: "A0d6wnlMRRk",

                image: "./assets/Moscas_Thumbnail_2.png", 
                images: ["./assets/Moscas_Thumbnail_2.png", "./assets/Moscas_Thumbnail_1.png", "./assets/Moscas_Thumbnail_3.png", "./assets/Moscas_Thumbnail_4.png", "./assets/Moscas_Thumbnail_5.png"],
                featured: true,

            },
            {

            },
            {

                director: "N. Fernandez Melian", 
                prod: "", 
                platform: "Fiction", 
                yt: "", 
                image: "./assets/Agujeros_Thumbnail_1.png", 
                size: 'quarter' 
            }
        ];

        // --- CORE LOGIC ---
        const featuredProjects = allProjects.filter(p => p.featured);
        let currentSlide = 0;
        let autoPlayInterval;
        const carouselContainer = document.getElementById('mainCarousel');
        const dotsContainer = document.getElementById('dotsContainer');
        const indexOverlay = document.getElementById('index-overlay');
        const aboutOverlay = document.getElementById('about-overlay');
        const nav = document.getElementById('navbar');
        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content-area');

        function getProjectTitle(p) {
            return (typeof p.title === 'object') ? p.title[currentLang] : p.title;
        }

        function updateLanguageUI() {
            const t = translations[currentLang];
            document.getElementById('nav-projects').innerText = t.nav_projects;
            document.getElementById('nav-about').innerText = t.nav_about;
            document.getElementById('nav-contact').innerText = t.nav_contact;
            document.getElementById('about-content').innerHTML = t.bio;
            document.querySelector('.lang-toggle').innerText = currentLang === 'en' ? 'ES' : 'EN';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            initCarousel();
        }

        function initCarousel() {
            updateLanguageUI();
            carouselContainer.innerHTML = '';
            dotsContainer.innerHTML = '';
            
            featuredProjects.forEach((p, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                
                let mediaHTML = p.previewUrl ? 
                    `<video class="bg-media" loop muted playsinline poster="./assets/placeholder.jpg"><source src="${p.previewUrl}" type="video/mp4"></video>` : 
                    `<img class="bg-media" src="${p.image}" alt="${getProjectTitle(p)}">`;

                slide.innerHTML = `
                    ${mediaHTML}
                    <div class="slide-info">
                        <h2 class="project-title">${getProjectTitle(p)}</h2>
                        <div class="credits">
                            <span><b>d:</b> ${p.director}</span>
                            <span><b>p:</b> ${p.prod}</span>
                        </div>
                    </div>
                `;
                slide.onclick = () => openProject(p);
                carouselContainer.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dotsContainer.appendChild(dot);
            });

            playActiveVideo();
            startAutoPlay();
            renderIndex();
        }

        function goHome() { closeAllOverlays(); }
        function openIndex() { closeAllOverlays(false); indexOverlay.classList.add('open'); nav.classList.add('solid-bg'); pauseHero(); }
        function openAbout() { closeAllOverlays(false); aboutOverlay.classList.add('open'); nav.classList.add('solid-bg'); pauseHero(); }
        function closeAllOverlays(resumeHero = true) {
            indexOverlay.classList.remove('open'); aboutOverlay.classList.remove('open'); nav.classList.remove('solid-bg');
            if(resumeHero) { playActiveVideo(); startAutoPlay(); }
        }
        function pauseHero() { clearInterval(autoPlayInterval); document.querySelectorAll('video').forEach(v => v.pause()); }

        function renderIndex() {
            const gridContainer = document.getElementById('grid-container');
            gridContainer.innerHTML = '';
            allProjects.forEach(p => {
                const item = document.createElement('div');
                item.className = `grid-item ${p.size || 'third'}`; 
                item.onclick = () => openProject(p);
                
                item.innerHTML = `
                    <img src="${p.image}" alt="${getProjectTitle(p)}" loading="lazy">
                    <div class="item-overlay">
                        <div class="item-title">${getProjectTitle(p)}</div>
                        <div class="item-meta">
                            <span>d: ${p.director}</span>
                            <span>p: ${p.prod}</span>
                        </div>
                    </div>
                `;
                gridContainer.appendChild(item);

                if(p.images && p.images.length > 1) {
                    let hoverInterval;
                    let imgIndex = 0;
                    item.onmouseenter = () => {
                        const img = item.querySelector('img');
                        p.images.forEach(src => { const i = new Image(); i.src = src; });
                        hoverInterval = setInterval(() => {
                            imgIndex = (imgIndex + 1) % p.images.length;
                            img.src = p.images[imgIndex];
                        }, 700);
                    };
                    item.onmouseleave = () => {
                        clearInterval(hoverInterval);
                        imgIndex = 0;
                        item.querySelector('img').src = p.image;
                    };
                }
            });
        }

        function playActiveVideo() {
            document.querySelectorAll('.carousel video').forEach(v => v.pause());
            const slides = document.querySelectorAll('.slide');
            if(slides.length > 0) {
                const video = slides[currentSlide].querySelector('video');
                if(video) { video.currentTime = 0; video.play().catch(e => {}); }
            }
        }

        function updateCarousel() {
            document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === currentSlide));
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
            playActiveVideo();
        }

        function goToSlide(index) { currentSlide = index; updateCarousel(); resetAutoPlay(); }
        function nextSlide() { currentSlide = (currentSlide + 1) % featuredProjects.length; updateCarousel(); resetAutoPlay(); }
        function prevSlide() { currentSlide = (currentSlide - 1 + featuredProjects.length) % featuredProjects.length; updateCarousel(); resetAutoPlay(); }
        
        function startAutoPlay() { autoPlayInterval = setInterval(nextSlide, 7000); }
        function resetAutoPlay() { clearInterval(autoPlayInterval); startAutoPlay(); }

        function openProject(p) {
            pauseHero();
            if (p.yt && p.yt.length > 0) {
                modalContent.innerHTML = `<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0&controls=1" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
            } else if (p.images && p.images.length > 0) {
                const imagesHTML = p.images.map(img => `<div class="gallery-item"><img src="${img}" loading="lazy"></div>`).join('');
                modalContent.innerHTML = `<div class="gallery-wrapper">${imagesHTML}</div><div class="gallery-hint">Scroll Horizontal &#8594;</div>`;
            } else {
                modalContent.innerHTML = `<img src="${p.image}" style="max-height:90vh; max-width:90vw;">`;
            }
            modalContainer.classList.add('open');
        }

        function closeModal() {
            modalContainer.classList.remove('open');
            setTimeout(() => { modalContent.innerHTML = ''; }, 300);
            if(!indexOverlay.classList.contains('open') && !aboutOverlay.classList.contains('open')) {
                playActiveVideo();
                startAutoPlay();
            }
        }

        document.addEventListener('keydown', (e) => { 
            if (e.key === "Escape") closeModal(); 
            if (e.key === "ArrowRight") {
                if(modalContainer.classList.contains('open')) {
                    const wrapper = document.querySelector('.gallery-wrapper');
                    if(wrapper) wrapper.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
                } else if (!indexOverlay.classList.contains('open')) nextSlide();
            }
            if (e.key === "ArrowLeft") {
                if(modalContainer.classList.contains('open')) {
                    const wrapper = document.querySelector('.gallery-wrapper');
                    if(wrapper) wrapper.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
                } else if (!indexOverlay.classList.contains('open')) prevSlide();
            }
        });

        initCarousel();
    </script>
</body>
</html>
