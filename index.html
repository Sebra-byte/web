<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { 
            --bg: #121212; 
            --text: #e0e0e0; 
            --line-grid: rgba(255, 255, 255, 0.05); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; text-transform: lowercase;
            overflow: hidden;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 20px 20px; z-index: -1;
        }

        /* LAYOUT */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr 200px;
            height: 100vh;
            padding: 40px;
            gap: 30px;
            position: relative;
        }

        .left-panel { display: flex; flex-direction: column; gap: 40px; z-index: 10; }
        .brand { font-size: 1.4rem; line-height: 1.2; letter-spacing: -1px; cursor: pointer; }
        .brand strong { display: block; font-size: 1.6rem; }
        .nav-links { display: flex; flex-direction: column; gap: 15px; }

        /* DROPDOWN */
        .custom-select-container { position: relative; }
        .select-selected {
            font-size: 0.9rem; font-weight: 700; cursor: pointer;
            border-bottom: 1px solid var(--text); padding-bottom: 2px;
            display: flex; align-items: center; gap: 8px; width: fit-content;
        }
        .select-items {
            position: absolute; background-color: #1a1a1a;
            top: 100%; left: 0; z-index: 99; border: 1px solid rgba(255,255,255,0.1);
            margin-top: 5px; display: none; min-width: 200px;
        }
        .select-items div { padding: 10px; cursor: pointer; font-size: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .select-items div:hover { background-color: var(--text); color: #000; }
        .select-show { display: block; }

        .nav-links a { text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 700; cursor: pointer; }

        /* VIEWER - TRANSICIÓN DE FUNDIDO */
        .center-panel { width: 100%; position: relative; overflow-y: auto; scrollbar-width: none; }
        .center-panel::-webkit-scrollbar { display: none; }
        
        .main-viewer {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .main-viewer.has-video { cursor: pointer; }
        .main-viewer img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 1.2s ease-in-out; opacity: 0;
        }
        .main-viewer img.active-slide { opacity: 1; z-index: 2; }
        .main-viewer img.fade-out { opacity: 0; z-index: 1; }
        
        .play-indicator {
            position: absolute; top: 20px; right: 20px; background: var(--text);
            padding: 6px 12px; font-weight: 700; font-size: 0.7rem; display: none; color: #000; z-index: 10;
        }
        .main-viewer.has-video:hover .play-indicator { display: block; }

        .project-details {
            width: 100%; margin-top: 35px; 
            display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; padding-bottom: 60px;
            transition: opacity 0.8s ease-in-out;
        }
        .project-details.fading { opacity: 0; }
        
        .project-details h2 { font-size: 3.8rem; margin: 0; letter-spacing: -3px; font-weight: 700; line-height: 0.85; }
        .category-label { font-size: 0.65rem; font-weight: 700; background: var(--text); color: #000; padding: 2px 8px; margin-bottom: 10px; display: inline-block; }
        .meta { font-size: 0.9rem; line-height: 1.6; }

        /* RIGHT PANEL */
        .right-panel { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; }
        .thumb-item { width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; cursor: pointer; flex-shrink: 0; transition: 0.3s; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); opacity: 0.3; transition: 0.3s; }
        .thumb-item:hover img, .thumb-item.active-thumb img { filter: grayscale(0); opacity: 1; }
        .thumb-item.active-thumb { border: 1px solid var(--text); }

        /* ABOUT */
        #about-section { display: none; width: 100%; gap: 60px; align-items: center; justify-content: center; min-height: 70vh; animation: fadeIn 0.8s ease; }
        .profile-pic { width: 280px; filter: grayscale(1); border: 1px solid rgba(255,255,255,0.1); transition: 0.5s; }
        .profile-pic:hover { filter: grayscale(0); border-color: var(--text); }
        .about-text { font-size: 1.1rem; line-height: 1.6; max-width: 500px; }

        /* VIDEO MODAL */
        .video-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); display: none; z-index: 1000; 
            justify-content: center; align-items: center; 
        }
        .video-wrapper { 
            width: 92%; max-width: 1400px; aspect-ratio: 16 / 9; 
            position: relative;
        }
        #video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .close-btn { 
            position: fixed; top: 30px; right: 30px; 
            color: #000; background: #fff; padding: 10px 20px; 
            cursor: pointer; font-weight: 700; font-size: 0.75rem; 
            z-index: 1010;
        }

        /* MOBILE */
        @media (max-width: 900px) {
            body { overflow-y: auto; }
            .main-layout { display: flex; flex-direction: column; padding: 20px; height: auto; gap: 30px; }
            .left-panel { gap: 20px; }
            .project-details { grid-template-columns: 1fr; gap: 20px; }
            .project-details h2 { font-size: 2.2rem; }
            .right-panel { flex-direction: row; overflow-x: auto; height: 110px; padding-bottom: 10px; border-top: 1px solid var(--line-grid); padding-top: 15px; }
            .thumb-item { width: 160px; }
            #about-section { flex-direction: column; text-align: center; gap: 30px; }
            .video-wrapper { width: 100%; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout">
        <section class="left-panel">
            <div class="brand" onclick="showSection('work')"><strong>leandro bruno</strong>film editor</div>
            <nav class="nav-links">
                <div class="custom-select-container">
                    <div class="select-selected" id="current-filter-text" onclick="toggleDropdown(event)">work / all</div>
                    <div class="select-items" id="filter-options">
                        <div onclick="filterBy('all', 'work / all')">/ all</div>
                        <div onclick="filterBy('serie/film', 'work / serie & film')">/ serie & film</div>
                        <div onclick="filterBy('advertising', 'work / advertising')">/ advertising</div>
                        <div onclick="filterBy('music video', 'work / music video')">/ music video</div>
                    </div>
                </div>
                <a id="nav-about" onclick="showSection('about')">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </nav>
        </section>

        <section class="center-panel">
            <div id="work-section">
                <div class="main-viewer" id="viewer" onclick="openVideo()">
                    <div class="play-indicator">WATCH VIDEO</div>
                </div>
                <div class="project-details" id="p-details">
                    <div>
                        <span class="category-label" id="p-category"></span>
                        <h2 id="p-title"></h2>
                    </div>
                    <div class="meta">
                        <div id="p-meta-top"></div>
                        <div id="p-description" style="margin-top: 15px; color: #aaa;"></div>
                    </div>
                </div>
            </div>

            <div id="about-section">
                <img src="assets/Perfil_LMB.png" class="profile-pic" alt="Leandro Bruno" onerror="this.src='https://via.placeholder.com/280x350'">
                <div class="about-content">
                    <div class="about-text">
                        <strong>leandro bruno</strong> es un editor de cine y publicidad con base en buenos aires. especializado en montaje rítmico y narrativa cinematográfica para plataformas globales.
                    </div>
                    <div style="margin-top:30px;">
                        <button style="background:none; border:1px solid var(--text); color:var(--text); padding:8px 20px; cursor:pointer; font-family: inherit;" onclick="showSection('work')">← back</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="right-panel" id="thumbnail-list"></section>
    </main>

    <div class="video-modal" id="modal">
        <div class="close-btn" onclick="closeVideo()">✕ CLOSE</div>
        <div class="video-wrapper">
            <div id="video-player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const projects = [
            { 
                title: "menem", category: "serie/film", 
                images: ["assets/Menem_Thumbnail_3.jpg", "assets/Menem_Thumbnail_2.jpg", "assets/Menem_Thumbnail_4.jpg", "assets/Menem_Thumbnail_1.jpg"], 
                yt: "-2AmqmciWXE", 
                director: "ariel winograd", prod: "claxon / prime video", 
                desc: "serie original de prime video." 
            },
            { 
                title: "oreo", category: "advertising", 
                images: ["https://img.youtube.com/vi/7Cllu0Rme74/maxresdefault.jpg"], yt: "7Cllu0Rme74", 
                director: "primo films", prod: "primo", desc: "campaña global." 
            },
            { 
                title: "el tiempo de las moscas", category: "serie/film", 
                images: ["assets/Moscas_Thumbnail_v01.png"], yt: "A0d6wnlMRRk", 
                director: "ana katz", prod: "netflix", 
                desc: "serie original netflix." 
            },
            { 
                title: "levis", category: "advertising", 
                images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "7Cllu0Rme74", 
                director: "lorenzo shakespear", prod: "levis argentina", desc: "501 campaign." 
            },
            { 
                title: "coppola, el representante", category: "serie/film", 
                images: ["assets/Coppola_Thumbnail_2.jpg", "assets/Coppola_Thumbnail_3.png", "assets/Coppola_Thumbnail_4.png"], 
                yt: "D1vD9z-E_Yk", director: "ariel winograd", prod: "pampa films / disney+", 
                desc: "serie original de star+ / disney+." 
            },
            { 
                title: "blair - todo lo que recuerdo", category: "music video", 
                images: ["assets/Blair_Thumbnail_v01.jpg"], yt: "ItX5aqhqsmo", 
                director: "dana campanello", prod: "poster", desc: "videoclip oficial." 
            },
            { 
                title: "las manos de la abuela", category: "serie/film", 
                images: ["assets/MA_Thumbnail_1.png", "assets/MA_Thumbnail_2.png", "assets/MA_Thumbnail_3.png", "assets/MA_Thumbnail_4.png", "assets/MA_Thumbnail_5.png"], 
                yt: "", director: "camila migliore", prod: "independiente", 
                desc: "cortometraje (2026). próximamente." 
            },
            { 
                title: "marias", category: "advertising", 
                images: ["assets/Marias_Thumbnail.jpg"], yt: "", 
                director: "tba", prod: "tba", 
                desc: "campaña publicitaria." 
            },
            { 
                title: "besos brujos", category: "serie/film", 
                images: ["assets/BesosBrujos-Thumbnail.jpg"], yt: "", 
                director: "karina flonembaum", prod: "tba", 
                desc: "cortometraje (largometraje actualmente en rodaje)." 
            }
        ];

        let filteredProjects = [...projects];
        let currentIndex = 0;
        let slideIndex = 0;
        let rotation, slideRotation;
        let player;

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById("filter-options").classList.toggle("select-show");
        }

        function filterBy(val, label) {
            document.getElementById("current-filter-text").innerText = label;
            filteredProjects = (val === 'all') ? [...projects] : projects.filter(p => p.category === val);
            currentIndex = 0;
            updateDisplay();
            resetIntervals();
        }

        window.onclick = () => document.getElementById("filter-options").classList.remove("select-show");

        function updateDisplay() {
            const thumbList = document.getElementById('thumbnail-list');
            const viewer = document.getElementById('viewer');
            const details = document.getElementById('p-details');
            const current = filteredProjects[currentIndex];
            
            // 1. Iniciamos fundido de salida del texto
            details.classList.add('fading');

            // 2. Manejo de imágenes con crossfade
            // Marcamos las imágenes actuales para que se desvanezcan
            const oldImages = viewer.querySelectorAll('img');
            oldImages.forEach(img => {
                img.classList.remove('active-slide');
                img.classList.add('fade-out');
                // Limpiar del DOM después de la transición
                setTimeout(() => img.remove(), 1200);
            });

            slideIndex = 0;
            current.images.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src;
                if(idx === 0) {
                    // Pequeño delay para que la nueva imagen empiece a aparecer
                    setTimeout(() => img.classList.add('active-slide'), 50);
                }
                img.onerror = function() { this.src='https://via.placeholder.com/1280x720?text=Still'; };
                viewer.appendChild(img);
            });

            // 3. Actualizamos datos y fundido de entrada del texto
            setTimeout(() => {
                document.getElementById('p-title').innerText = current.title;
                document.getElementById('p-category').innerText = current.category;
                document.getElementById('p-meta-top').innerHTML = `<strong>d.</strong> ${current.director}<br><strong>p.</strong> ${current.prod}`;
                document.getElementById('p-description').innerText = current.desc;
                details.classList.remove('fading');
            }, 400);
            
            if(current.yt !== "") viewer.classList.add('has-video');
            else viewer.classList.remove('has-video');

            // 4. Miniaturas
            thumbList.innerHTML = '';
            filteredProjects.forEach((proj, index) => {
                const item = document.createElement('div');
                item.className = 'thumb-item' + (index === currentIndex ? ' active-thumb' : '');
                item.innerHTML = `<img src="${proj.images[0]}">`;
                item.onclick = () => { 
                    if(currentIndex === index) return;
                    currentIndex = index; 
                    updateDisplay(); 
                    resetIntervals(); 
                };
                thumbList.appendChild(item);
            });
        }

        function nextSlide() {
            const slides = document.querySelectorAll('#viewer img:not(.fade-out)');
            if(slides.length <= 1) return;
            slides[slideIndex].classList.remove('active-slide');
            slideIndex = (slideIndex + 1) % slides.length;
            slides[slideIndex].classList.add('active-slide');
        }

        function resetIntervals() {
            clearInterval(rotation); clearInterval(slideRotation);
            rotation = setInterval(() => {
                if(filteredProjects.length > 1) {
                    currentIndex = (currentIndex + 1) % filteredProjects.length;
                    updateDisplay();
                }
            }, 8500); // Un poco más de tiempo para apreciar el fundido
            slideRotation = setInterval(nextSlide, 3500);
        }

        function showSection(section) {
            const work = document.getElementById('work-section');
            const about = document.getElementById('about-section');
            if(section === 'about') {
                work.style.display = 'none'; about.style.display = 'flex';
                clearInterval(rotation); clearInterval(slideRotation);
            } else {
                about.style.display = 'none'; work.style.display = 'block';
                updateDisplay(); resetIntervals();
            }
        }

        function openVideo() {
            const ytId = filteredProjects[currentIndex].yt;
            if(!ytId) return;
            document.getElementById('modal').style.display = 'flex';
            if (player) {
                player.loadVideoById(ytId);
            } else {
                player = new YT.Player('video-player', {
                    videoId: ytId,
                    playerVars: { 'autoplay': 1, 'modestbranding': 1, 'rel': 0, 'showinfo': 0, 'controls': 1 }
                });
            }
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            if (player) player.stopVideo();
        }

        updateDisplay();
        resetIntervals();
    </script>
</body>
</html>
