<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #000; 
            --text: #fff; 
            --gray: #888; 
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Manrope', sans-serif; 
            margin: 0; 
            -webkit-font-smoothing: antialiased; /* Para que la letra se vea más nítida */
        }
        
        /* Navegación con estilo minimalista */
        nav { 
            display: flex; 
            justify-content: space-between; 
            padding: 50px 5%; 
            align-items: center; 
        }
        
        .logo { 
            font-weight: 200; /* Letra ultra fina */
            letter-spacing: 6px; /* Mucho espacio entre letras */
            font-size: 1rem; 
            text-transform: uppercase; 
        }
        
        .menu a { 
            text-decoration: none; 
            color: var(--gray); 
            margin-left: 30px; 
            font-size: 0.7rem; 
            letter-spacing: 3px; 
            font-weight: 200;
            transition: 0.4s ease; 
        }
        
        .menu a:hover { 
            color: white; 
        }

        /* Grilla de Proyectos */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(45%, 1fr)); 
            gap: 15px; 
            padding: 0 15px; 
        }
        
        @media (max-width: 768px) { 
            .grid { grid-template-columns: 1fr; } 
        }

        .project { 
            position: relative; 
            cursor: pointer; 
            overflow: hidden; 
            aspect-ratio: 16/9; 
            background: #111; 
        }
        
        .project img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1); 
        }
        
        .project:hover img { 
            opacity: 0.2; 
            transform: scale(1.03); 
        }

        .overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            transition: 0.5s; 
        }
        
        .project:hover .overlay { 
            opacity: 1; 
        }
        
        .overlay h2 { 
            font-size: 0.8rem; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            font-weight: 400;
            margin: 0; 
        }
        
        .overlay p { 
            font-size: 9px; 
            color: var(--gray); 
            letter-spacing: 2px; 
            margin-top: 12px; 
            text-transform: uppercase;
        }

        footer { 
            padding: 100px 5%; 
            font-size: 9px; 
            color: #333; 
            letter-spacing: 2px; 
            text-align: left; 
            font-weight: 200;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">LEANDRO BRUNO / EDITOR</div>
        <div class="menu">
            <a href="#">WORK</a>
            <a href="#">ABOUT</a>
            <a href="mailto:leandrobrunoeditor@gmail.com">CONTACT</a>
        </div>
    </nav>

    <div class="grid">
        
        <div class="project" onclick="window.open('https://www.youtube.com/watch?v=-2AmqmciWXE', '_blank')">
            <img src="Menem_Thumbnail_3.png" alt="Menem Trailer">
            <div class="overlay">
                <h2>MENEM</h2>
                <p>TRAILER OFICIAL / 2024</p>
            </div>
        </div>

        <div class="project" onclick="window.open('#', '_blank')">
            <img src="https://images.unsplash.com/photo-1536240478700-b869070f9279?auto=format&fit=crop&w=800&q=80" alt="Video 2">
            <div class="overlay">
                <h2>PRÓXIMO PROYECTO</h2>
                <p>MUSIC VIDEO / EDIT</p>
            </div>
        </div>

    </div>

    <footer>
        © 2026 LEANDRO BRUNO. TODOS LOS DERECHOS RESERVADOS.
    </footer>

</body>
</html>
