<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
            --line-grid: rgba(255, 255, 228, 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow: hidden;
        }

        /* Grilla de fondo sutil de tu Opción 1 */
        .blueprint-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        /* --- VIDEOS DE FONDO (CROSSFADE) --- */
        .bg-preview-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; /* Detrás de los textos */
            background: var(--bg);
            overflow: hidden;
        }

        .bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .bg-video.active { opacity: 0.3; } /* Opacidad para que el texto sea legible */

        .bg-video iframe {
            width: 150vw;
            height: 150vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.6); /* Zoom para ocultar controles */
            pointer-events: none;
        }

        /* --- NAVEGACIÓN SUPERIOR --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 40px 50px;
            z-index: 100;
            mix-blend-mode: difference;
        }

        .brand h1 { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.03em; }
        .brand p { font-size: 0.8rem; font-weight: 300; margin-top: 5px; opacity: 0.8; }

        nav ul { list-style: none; text-align: right; }
        nav ul li a { text-decoration: none; color: var(--hueso); font-size: 0.8rem; font-weight: 500; opacity: 0.6; transition: 0.3s; }
        nav ul li a:hover { opacity: 1; }

        /* --- LISTADO A LA IZQUIERDA --- */
        #main-content {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            align-items: center;
            padding-left: 50px;
        }

        .list-container p { 
            font-size: 0.7rem; 
            margin-bottom: 25px; 
            font-weight: 700; 
            opacity: 0.5; 
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .film-item {
            font-size: 4.2rem;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 0.82;
            letter-spacing: -0.04em;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: block;
            text-decoration: none;
            margin-bottom: 5px;
            width: fit-content;
        }

        .film-item.active, .film-item:hover {
            color: var(--hueso);
            -webkit-text-stroke: 0px;
            transform: translateX(20px);
        }

        /* --- VISTA DETALLE --- */
        #project-detail {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 100px 50px;
            overflow-y: auto;
        }

        .close-btn {
            position: fixed; top: 40px; right: 50px;
            font-size: 0.75rem; font-weight: 800; color: var(--hueso);
            cursor: pointer; text-transform: uppercase;
        }

        .video-player-box { width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 50px; }

        @media (max-width: 900px) {
            #main-content { padding-left: 20px; }
            .film-item { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <header>
        <div class="brand">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <ul>
                <li><a href="#">/ films</a></li>
                <li><a href="mailto:leandrobrunoeditor@gmail.com">/ contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="bg-preview-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <section id="main-content">
        <div class="list-container">
            <p>selected works</p>
            <div id="films-list"></div>
        </div>
    </section>

    <section id="project-detail">
        <div class="close-btn" onclick="closeDetail()">[ close ]</div>
        <div id="detail-content"></div>
    </section>

    <script>
        const projects = [
            { title: "menem", yt: "-2AmqmciWXE", cat: "serie", desc: "biopic sobre el ascenso al poder de carlos menem." },
            { title: "oreo", yt: "7Cllu0Rme74", cat: "advertising", desc: "campaña publicitaria global para oreo." },
            { title: "moscas", yt: "A0d6wnlMRRk", cat: "serie", desc: "dos mujeres reconstruyendo sus vidas." },
            { title: "blair", yt: "ItX5aqhqsmo", cat: "music video", desc: "pieza rítmica y atmosférica." },
            { title: "coppola", yt: "ecr24akKDbs", cat: "serie", desc: "la historia del representante más famoso." }
        ];

        let currentIdx = 0;
        let isHovering = false;
        let activePane = 1;
        let rotationTimer;

        function init() {
            const list = document.getElementById('films-list');
            projects.forEach((p, idx) => {
                const a = document.createElement('a');
                a.className = "film-item";
                a.innerText = p.title;
                a.onmouseenter = () => { isHovering = true; changeProject(idx); };
                a.onmouseleave = () => { isHovering = false; };
                a.onclick = (e) => { e.preventDefault(); openDetail(p); };
                list.appendChild(a);
            });

            changeProject(0);
            startRotation();
        }

        function changeProject(idx) {
            const items = document.querySelectorAll('.film-item');
            items.forEach(item => item.classList.remove('active'));
            if(items[idx]) items[idx].classList.add('active');

            const nextPaneIdx = activePane === 1 ? 2 : 1;
            const currentPane = document.getElementById(`pane-${activePane}`);
            const nextPane = document.getElementById(`pane-${nextPaneIdx}`);

            const p = projects[idx];
            // Inyectar video con zoom y sin controles
            nextPane.innerHTML = `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${p.yt}&modestbranding=1&rel=0&iv_load_policy=3" frameborder="0"></iframe>`;
            
            setTimeout(() => {
                nextPane.classList.add('active');
                currentPane.classList.remove('active');
                activePane = nextPaneIdx;
                setTimeout(() => { currentPane.innerHTML = ''; }, 1200);
            }, 400);

            currentIdx = idx;
        }

        function startRotation() {
            rotationTimer = setInterval(() => {
                if (!isHovering) {
                    currentIdx = (currentIdx + 1) % projects.length;
                    changeProject(currentIdx);
                }
            }, 6000);
        }

        function openDetail(p) {
            const detail = document.getElementById('project-detail');
            detail.style.display = 'flex';
            document.getElementById('detail-content').innerHTML = `
                <div class="video-player-box">
                    <iframe width="100%" height="100%" src="https://www.youtube.com/embed/${p.yt}?autoplay=1" frameborder="0" allowfullscreen></iframe>
                </div>
                <h2>${p.title}</h2>
                <p style="margin-top:20px; opacity:0.7;">${p.desc}</p>
            `;
        }

        function closeDetail() {
            document.getElementById('project-detail').style.display = 'none';
            document.getElementById('detail-content').innerHTML = '';
        }

        window.onload = init;
    </script>
</body>
</html>
