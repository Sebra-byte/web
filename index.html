<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111111;
            --text: #FFFFE4;
            --accent: #555555;
            --font-main: 'Manrope', sans-serif;
            --grid-gap: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            text-transform: lowercase;
            padding: 40px;
            line-height: 1.4;
        }

        /* --- NAVEGACIÓN (Estilo Edit Doula) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 60px;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 100;
            padding-bottom: 20px;
        }

        .brand {
            cursor: pointer;
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        .brand p {
            font-weight: 300;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .filters span, nav a {
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.3s;
            text-decoration: none;
            color: var(--text);
        }

        .filters span.active, .filters span:hover, nav a:hover {
            opacity: 1;
        }

        .lang-switch {
            font-size: 0.7rem;
            font-weight: 700;
            opacity: 0.3;
            margin-top: 5px;
        }

        .lang-switch span { cursor: pointer; padding: 0 5px; }
        .lang-switch span.active-lang { opacity: 1; text-decoration: underline; }

        /* --- GRILLA DE PROYECTOS --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: var(--grid-gap);
        }

        .project-card {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.4s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1a1a1a;
            overflow: hidden;
        }

        .thumbnail-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
        }

        .project-info {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .project-meta {
            font-size: 0.8rem;
            opacity: 0.6;
            font-weight: 300;
            text-align: right;
        }

        /* --- SECCIONES EXTRA --- */
        #about-section {
            display: none;
            max-width: 800px;
            margin-top: 40px;
        }

        .about-text {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 30px;
        }

        /* --- MODAL (Video/Galería) --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            z-index: 2000;
            justify-content: center; align-items: center;
        }

        .modal-content {
            width: 85%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
        }

        .close-modal {
            position: absolute;
            top: 30px; right: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            body { padding: 20px; }
            header { flex-direction: column; align-items: center; text-align: center; }
            nav { align-items: center; margin-top: 20px; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="showSection('work')">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <div class="filters">
                <span class="active" onclick="filterBy('all', this)">/ todos</span>
                <span onclick="filterBy('serie', this)">/ series</span>
                <span onclick="filterBy('advertising', this)">/ publicidad</span>
                <span onclick="filterBy('music video', this)">/ videoclips</span>
                <span onclick="filterBy('cortometraje', this)">/ cortos</span>
            </div>
            <a href="#" onclick="showSection('about')">/ biografía</a>
            <a href="mailto:leandrobrunoeditor@gmail.com">/ contacto</a>
            <div class="lang-switch">
                <span id="btn-es" class="active-lang" onclick="changeLang('es')">ES</span> | 
                <span id="btn-en" onclick="changeLang('en')">EN</span>
            </div>
        </nav>
    </header>

    <main>
        <section id="work-section" class="projects-grid">
            </section>

        <section id="about-section">
            <div class="about-text" id="about-content">
                </div>
            <a href="https://www.imdb.com/es/name/nm11460466/" target="_blank" style="color:var(--text); font-weight:700;">IMDB CREDITS</a>
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="close-modal" onclick="closeModal()">[ CERRAR ]</div>
        <div class="modal-content" id="modal-body"></div>
    </div>

    <script>
        const projects = [
            { title_es: "menem", title_en: "menem", category: "serie", thumb: "assets/Menem_Thumbnail_1.jpg", yt: "-2AmqmciWXE", dir: "ariel winograd", prod: "claxon / prime video" },
            { title_es: "OREO - Sigamos divirtiendonos", title_en: "OREO - Keep on playing", category: "advertising", thumb: "assets/Oreo_Thumbnail_5.png", yt: "7Cllu0Rme74", dir: "Martín Jalfen", prod: "Pop Studios - México" },
            { title_es: "el tiempo de las moscas", title_en: "time of the flies", category: "serie", thumb: "assets/Moscas_Thumbnail_1.jpg", yt: "A0d6wnlMRRk", dir: "Benjamín Naishtat y Ana Katz", prod: "netflix" },
            { title_es: "levis x winona riders", title_en: "levis x winona riders", category: "advertising", thumb: "assets/Levis_Thumbnail_v01.jpg", yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", dir: "Nico Alarcos", prod: "primo" },
            { title_es: "coppola, el representante", title_en: "coppola, the agent", category: "serie", thumb: "assets/Coppola_Thumbnail_2.jpg", yt: "ecr24akKDbs", dir: "ariel winograd", prod: "pampa films / disney+" },
            { title_es: "blair - Todo lo que tengo", title_en: "blair - All I have", category: "music video", thumb: "assets/Blair_Thumbnail_1.jpg", yt: "ItX5aqhqsmo", dir: "dana campanello", prod: "poster" },
            { title_es: "las manos de la abuela", title_en: "grandmother's hands", category: "cortometraje", thumb: "assets/MA_Thumbnail_1.png", yt: "", dir: "camila migliore", prod: "calesita films" },
            { title_es: "ratones paranoicos", title_en: "ratones paranoicos", category: "music video", thumb: "assets/RP_Thumbmail_1.png", yt: "", dir: "alex roux", prod: "poster" },
            { title_es: "besos brujos", title_en: "witch kisses", category: "cortometraje", thumb: "assets/BB_Thumbnail_1.png", yt: "", dir: "karina flonembaum", prod: "" },
            { title_es: "las marias", title_en: "las marias", category: "advertising", thumb: "assets/Marias_Thumbnail_1.png", yt: "", dir: "alejandro berger parrado", prod: "navajo films" },
            { title_es: "todo lo que recuerdo", title_en: "all I remember", category: "cortometraje", thumb: "assets/TodoLoQueRecuerdo_Thumbnail_1.png", yt: "", dir: "nicolas fernandez melian", prod: "" }
        ];

        let currentLang = 'es';
        const aboutText = {
            es: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires. Se especializa en montaje rítmico y narrativa para plataformas globales como Netflix, Disney+ y Prime Video.",
            en: "Leandro Bruno is a film and advertising editor based in Buenos Aires. He specializes in rhythmic editing and narrative for global platforms such as Netflix, Disney+, and Prime Video."
        };

        function renderProjects(filter = 'all') {
            const grid = document.getElementById('work-section');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? projects : projects.filter(p => p.category === filter);

            filtered.forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.onclick = () => openProject(p);
                
                const title = currentLang === 'es' ? p.title_es : p.title_en;
                
                card.innerHTML = `
                    <div class="thumbnail-wrapper">
                        <img src="${p.thumb}" alt="${title}">
                    </div>
                    <div class="project-info">
                        <div class="project-title">${title}</div>
                        <div class="project-meta">
                            dir: ${p.dir}<br>
                            ${p.prod ? 'prod: ' + p.prod : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterBy(cat, el) {
            document.querySelectorAll('.filters span').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            renderProjects(cat);
        }

        function showSection(sec) {
            if (sec === 'work') {
                document.getElementById('work-section').style.display = 'grid';
                document.getElementById('about-section').style.display = 'none';
            } else {
                document.getElementById('work-section').style.display = 'none';
                document.getElementById('about-section').style.display = 'block';
                document.getElementById('about-content').innerText = aboutText[currentLang];
            }
        }

        function openProject(p) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modal-body');
            modal.style.display = 'flex';

            if (p.yt) {
                // Si es un ID de video de YouTube o Google Drive
                const src = p.yt.length < 20 
                    ? `https://www.youtube.com/embed/${p.yt}?autoplay=1` 
                    : `https://drive.google.com/file/d/${p.yt}/preview`;
                body.innerHTML = `<iframe width="100%" height="100%" src="${src}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            } else {
                body.innerHTML = `<img src="${p.thumb}" style="width:100%; height:100%; object-fit:contain;">`;
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-body').innerHTML = '';
        }

        function changeLang(lang) {
            currentLang = lang;
            document.getElementById('btn-es').className = lang === 'es' ? 'active-lang' : '';
            document.getElementById('btn-en').className = lang === 'en' ? 'active-lang' : '';
            renderProjects();
            if (document.getElementById('about-section').style.display === 'block') {
                showSection('about');
            }
        }

        window.onload = () => renderProjects();
        window.onclick = (e) => { if(e.target.className === 'modal') closeModal(); }
    </script>
</body>
</html>
