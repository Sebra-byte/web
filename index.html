<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* COLOR SÓLIDO ORIGINAL (Limpio) */
            --bg-color: #757c71; 
            
            --text: #eae5dc;
            --accent: rgba(234, 229, 220, 0.8);
            --font-main: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
            --grid-gap: 0px; 
            --transition-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%; width: 100%;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden; 
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background-color: var(--bg-color); }
        ::-webkit-scrollbar-thumb {
            background-color: var(--text);
            border-radius: 10px;
            border: 3px solid var(--bg-color);
            opacity: 0.5;
        }
        ::-webkit-scrollbar-thumb:hover { background-color: #fff; }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; 
            padding: 30px 50px; 
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 500; pointer-events: none; 
            background: transparent;
            transition: background 0.4s ease, padding 0.4s ease;
        }
        
        nav.solid-bg { 
            background-color: rgba(117, 124, 113, 0.95);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            pointer-events: auto; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .brand, .nav-links a, .lang-container, .hamburger { pointer-events: auto; cursor: pointer; }
        
        .brand {
            font-size: clamp(1.45rem, 2vw, 2.35rem); 
            font-weight: 600; letter-spacing: -0.5px; text-transform: lowercase;
            line-height: 1; font-family: var(--font-serif); color: var(--text);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            z-index: 501; position: relative;
            transition: transform 0.3s ease;
        }
        .brand:hover { transform: scale(1.02); }

        .brand span {
            display: block; font-family: var(--font-main); font-size: 0.45em;
            letter-spacing: 2px; opacity: 0.8; margin-top: 4px;
            text-transform: uppercase; font-weight: 400;
        }
        
        .nav-links { display: flex; gap: 10px; padding-top: 0; align-items: center; }
        
        .nav-links a {
            color: var(--text); text-decoration: none; 
            font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 1px; opacity: 0.9;
            transition: all 0.3s ease; position: relative;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            display: inline-block; padding: 20px 15px; margin: -10px 0;
        }
        
        .nav-links a:hover { opacity: 1; transform: translateY(-2px); }
        .nav-hidden { opacity: 0 !important; pointer-events: none; transform: translateY(-10px); }

        /* --- LANGUAGE TOGGLE --- */
        .lang-container {
            position: relative; overflow: hidden; height: 32px; min-width: 44px;
            border: 1px solid rgba(234, 229, 220, 0.3); border-radius: 4px;
            margin-left: 25px; margin-right: 0; transition: border-color 0.3s ease;
        }
        .lang-container:hover { border-color: var(--text); }
        .lang-track {
            display: flex; flex-direction: column; align-items: center;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .lang-opt {
            height: 30px; display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 0.75rem; text-transform: uppercase;
        }
        .lang-container.es-active .lang-track { transform: translateY(-30px); }

        /* --- MOBILE MENU --- */
        .hamburger {
            display: none; font-size: 1.5rem; color: var(--text); z-index: 600;
            padding: 15px; margin: -15px; transition: transform 0.3s ease;
        }
        
        #mobile-menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(117, 124, 113, 0.98);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 550; display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #mobile-menu-overlay.open { opacity: 1; pointer-events: auto; }
        
        .mobile-links { display: flex; flex-direction: column; gap: 40px; text-align: center; }
        .mobile-links a {
            font-family: var(--font-serif); font-size: 2.2rem; color: var(--text);
            text-decoration: none; cursor: pointer; opacity: 0; transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease; padding: 20px;
        }
        
        #mobile-menu-overlay.open .mobile-links a:nth-child(1) { transition-delay: 0.1s; opacity: 1; transform: translateY(0); }
        #mobile-menu-overlay.open .mobile-links a:nth-child(2) { transition-delay: 0.2s; opacity: 1; transform: translateY(0); }
        #mobile-menu-overlay.open .mobile-links a:nth-child(3) { transition-delay: 0.3s; opacity: 1; transform: translateY(0); }
        #mobile-menu-overlay.open .mobile-links .mobile-lang-container { transition-delay: 0.4s; opacity: 1; transform: translateY(0); }

        .mobile-lang-container {
            position: relative; overflow: hidden; height: 42px; width: 80px;
            border: 1px solid var(--text); border-radius: 50px;
            margin: 20px auto 0; cursor: pointer; opacity: 0; transform: translateY(20px);
            transition: all 0.3s ease;
        }
        .mobile-lang-container .lang-opt { height: 40px; font-size: 1rem; }
        .mobile-lang-container.es-active .lang-track { transform: translateY(-40px); }

        /* --- CAROUSEL --- */
        .carousel { height: 100vh; width: 100vw; position: relative; z-index: 1; }
        .slide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
            padding: 0 0 60px 60px; cursor: pointer;
        }
        .slide.active { opacity: 1; z-index: 1; }
        .bg-media {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            object-fit: cover; transform: translate(-50%, -50%) scale(1.08);
            transition: transform 7s ease-out; z-index: 0;
        }
        .slide.active .bg-media { transform: translate(-50%, -50%) scale(1); }
        
        .slide-info {
            position: relative; z-index: 2; max-width: 1100px; opacity: 0;
            transform: translateY(30px); transition: all 1s var(--transition-smooth) 0.3s;
            text-align: left; 
        }
        .slide.active .slide-info { opacity: 1; transform: translateY(0); }

        .label-text {
            font-family: var(--font-main); font-size: 0.65rem; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text); opacity: 0.7; margin-bottom: 15px;
            display: block; text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .project-title {
            font-family: var(--font-serif); font-size: clamp(2.5rem, 4vw, 4rem); 
            margin-bottom: 15px; letter-spacing: -1px; line-height: 0.9; color: var(--text);
            text-shadow: 0 2px 20px rgba(0,0,0,0.5); display: block; font-weight: 400;
        }
        .credits {
            display: flex; gap: 20px; font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1px; margin-top: 10px; color: var(--accent);
            text-shadow: 0 1px 5px rgba(0,0,0,0.5); font-family: var(--font-main);
        }
        .credits span b { color: var(--text); margin-right: 5px; font-weight: 400; text-transform: lowercase; }
        
        /* FLECHAS DESKTOP */
        .carousel-arrows {
            position: absolute; top: 50%; width: 100%; transform: translateY(-50%);
            display: flex; justify-content: space-between; padding: 0 30px; z-index: 10;
            pointer-events: none; 
        }
        .arrow {
            color: rgba(234, 229, 220, 0.4); font-size: 1.5rem; cursor: pointer;
            pointer-events: auto; transition: all 0.3s ease; padding: 20px;
        }
        .arrow:hover { color: var(--text); transform: scale(1.2); }
        
        /* --- A24 UI --- */
        .a24-ui {
            display: flex; flex-direction: column; align-items: flex-end;
            position: absolute; bottom: 40px; right: 50px; z-index: 20;
            color: var(--text); font-family: var(--font-main); pointer-events: none; 
        }
        
        .counter-box {
            font-size: 1.1rem; font-weight: 500; letter-spacing: 1px;
            margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .progress-container {
            width: 100%; height: 2px; background: rgba(255,255,255,0.2);
            margin-bottom: 25px; position: relative; width: 60px;
        }
        
        .progress-bar {
            height: 100%; background: var(--text); width: 0%;
            transition: width 0.1s linear; box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        
        .scroll-down-btn {
            font-size: 1.5rem; cursor: pointer; pointer-events: auto;
            opacity: 0.8; animation: bounce 2s infinite; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        /* --- GRID SYSTEM --- */
        .project-grid {
            display: grid; grid-template-columns: repeat(12, 1fr);
            grid-auto-rows: 350px; grid-auto-flow: dense; 
            gap: var(--grid-gap); 
            max-width: 1800px; margin: 0 auto; padding-bottom: 0px; 
            width: 100%;
        }

        .grid-item { position: relative; overflow: hidden; cursor: pointer; background-color: #0c0c0c; }
        .grid-item.half { grid-column: span 6; } 
        .grid-item.third { grid-column: span 4; } 
        .grid-item.three-quarters { grid-column: span 9; } 
        .grid-item.quarter { grid-column: span 3; } 
        .grid-item.tall { grid-row: span 2; } 

        .grid-item img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(20%); opacity: 0; 
            transition: opacity 0.6s ease, transform 0.6s var(--transition-smooth), filter 0.3s ease;
        }
        .grid-item img.img-loaded { opacity: 1; }
        .grid-item:hover img { transform: scale(1.05); filter: grayscale(0%); }

        .item-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s ease;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; pointer-events: none; 
        }
        .grid-item:hover .item-overlay { opacity: 1; }
        
        .item-title {
            font-family: var(--font-serif); font-size: 1.4rem; color: var(--text);
            margin-bottom: 8px; line-height: 1.1; display: inline-block;
            border-bottom: 1px solid rgba(234, 229, 220, 0.6); padding-bottom: 4px;
        }
        .item-meta {
            font-family: var(--font-main); font-size: 0.7rem; color: var(--accent);
            letter-spacing: 0.5px; text-transform: uppercase; margin-top: 5px;
        }
        .item-meta span { margin-right: 15px; }

        /* --- BOTTOM FOOTER (Back to Top) --- */
        .grid-footer {
            grid-column: 1 / -1; 
            display: flex; justify-content: center; align-items: center;
            padding: 60px 0;
            cursor: pointer;
            transition: opacity 0.3s ease;
            background: transparent;
        }
        .grid-footer:hover { opacity: 0.7; }
        
        .back-to-top-text {
            font-family: var(--font-main);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .back-to-top-text span { font-size: 1.5rem; }

        /* --- OVERLAYS & MODAL --- */
        .overlay-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 400; 
            padding: 120px 40px 0px 40px; 
            overflow-y: auto; opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s var(--transition-smooth); 
            transform: translateY(30px);
        }

        .overlay-section.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
        
        .about-container { max-width: 800px; margin: 0 auto; padding-top: 100px; padding-bottom: 100px; text-align: center; }
        .about-text p { font-family: var(--font-main); font-size: 1.3rem; line-height: 1.6; color: var(--text); margin-bottom: 30px; font-weight: 300; }
        .about-text strong { font-weight: 600; color: var(--text); }
        .imdb-link {
            display: inline-flex; align-items: center; gap: 5px; justify-content: center;
            color: var(--text); text-decoration: none; font-weight: 600;
            border-bottom: 1px solid transparent; transition: border 0.3s;
            margin-top: 10px; font-size: 0.9rem; letter-spacing: 0.5px;
        }
        .imdb-link:hover { border-bottom: 1px solid var(--text); }

        #modal-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(47, 53, 46, 0.95); backdrop-filter: blur(10px); 
            z-index: 2000; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #modal-container.open { opacity: 1; pointer-events: auto; }
        .modal-close {
            position: absolute; top: 40px; right: 40px; color: var(--text);
            font-size: 2rem; cursor: pointer; z-index: 2005; transition: transform 0.3s ease;
        }
        .modal-close:hover { transform: rotate(90deg); }
        
        .modal-content { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        .video-wrapper { width: 100%; height: 100%; }
        #player { width: 100%; height: 100%; }
        
        .gallery-wrapper {
            width: 100%; height: 100%; display: flex; overflow-x: auto;
            scroll-snap-type: x mandatory; align-items: center; scroll-behavior: smooth;
        }
        .gallery-item {
            min-width: 100vw; height: 100vh; scroll-snap-align: center;
            display: flex; justify-content: center; align-items: center; padding: 60px;
        }
        .gallery-item img { max-width: 100%; max-height: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-radius: 4px; }
        .gallery-hint {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: var(--text); opacity: 0.5; font-size: 0.8rem; text-transform: uppercase;
        }

        /* --- BREAKPOINTS --- */
        @media (max-width: 1200px) {
            .project-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 300px; }
            .grid-item.half, .grid-item.third, .grid-item.three-quarters, .grid-item.quarter { grid-column: span 1; }
            .grid-item.half.tall { grid-row: span 2; }
        }

        /* --- MOBILE STYLES --- */
        @media(max-width: 768px) {
            .carousel, body, html { height: 100dvh; } 
            .project-grid { display: flex; flex-direction: column; } 
            .grid-item, .grid-item.half, .grid-item.third, .grid-item.quarter { 
                width: 100%; height: 500px; grid-column: auto; grid-row: auto; 
            }
            .overlay-section { padding: 100px 0 0px 0; }
            
            .item-overlay {
                opacity: 1 !important; 
                background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%); 
                padding: 20px 30px; 
            }
            .item-title { font-size: 1.8rem; }
            
            nav { padding: 20px 30px; align-items: center; }
            .nav-links { display: none; }
            .hamburger { display: block; }
            .brand { font-size: 1.5rem; }
            
            .slide { padding: 0 30px 100px 30px; justify-content: flex-end; } 
            .slide-info { transform: translateY(0); opacity: 1; max-width: 90%; }
            .project-title { font-size: 2.8rem; border: none; }
            .credits { display: none; }
            .label-text { display: none; }
            .a24-ui { bottom: 30px; right: 30px; }
            .carousel-arrows { display: none; }
        }
    </style>
</head>

                director: "N. Fernandez Melian", 
                prod: "",

                yt: "", 
                image: "./assets/Agujeros_Thumbnail_1.webp", 
                images: [
                    "./assets/Agujeros_Thumbnail_1.webp", 
                    "./assets/Agujeros_Thumbnail_2.webp", 
                    "./assets/Agujeros_Thumbnail_3.webp", 
                    "./assets/Agujeros_Thumbnail_4.webp"
                ], 
                size: 'quarter' 
            }
        ];

        // --- CORE LOGIC ---
        const featuredProjects = allProjects.filter(p => p.featured);
        let currentSlide = 0;
        let autoPlayInterval;
        const SLIDE_DURATION = 7000;
        let progressStartTime;
        let progressInterval;

        const carouselContainer = document.getElementById('mainCarousel');
        const indexOverlay = document.getElementById('index-overlay');
        const aboutOverlay = document.getElementById('about-overlay');
        const nav = document.getElementById('navbar');
        const modalContainer = document.getElementById('modal-container');
        const modalContent = document.getElementById('modal-content-area');
        const bodyMain = document.getElementById('body-main');
        const mobileMenu = document.getElementById('mobile-menu-overlay');
        
        const uiCurrentDisplay = document.getElementById('ui-current');
        const uiTotalDisplay = document.getElementById('ui-total');
        const uiProgressBar = document.getElementById('ui-progress');
        
        // --- BACK TO TOP LOGIC ---
        function scrollToTop() {
            indexOverlay.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getProjectTitle(p) {
            return (typeof p.title === 'object') ? p.title[currentLang] : p.title;
        }

        function updateLanguageUI() {
            const t = translations[currentLang];
            document.getElementById('nav-projects').innerText = t.nav_projects;
            document.getElementById('nav-about').innerText = t.nav_about;
            document.getElementById('nav-contact').innerText = t.nav_contact;
            document.getElementById('mob-nav-projects').innerText = t.nav_projects;
            document.getElementById('mob-nav-about').innerText = t.nav_about;
            document.getElementById('mob-nav-contact').innerText = t.nav_contact;
            
            document.getElementById('about-content').innerHTML = t.bio;
            
            const desktopToggle = document.querySelector('.lang-container');
            const mobileToggle = document.querySelector('.mobile-lang-container');
            
            if (currentLang === 'es') {
                desktopToggle.classList.add('es-active');
                mobileToggle.classList.add('es-active');
            } else {
                desktopToggle.classList.remove('es-active');
                mobileToggle.classList.remove('es-active');
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            initCarousel();
        }

        function toggleMobileMenu() {
            const ham = document.querySelector('.hamburger');
            if (mobileMenu.classList.contains('open')) {
                mobileMenu.classList.remove('open');
                ham.innerHTML = '&#9776;'; 
            } else {
                mobileMenu.classList.add('open');
                ham.innerHTML = '&times;'; 
            }
        }

        function initCarousel() {
            updateLanguageUI();
            carouselContainer.innerHTML = '';
            uiTotalDisplay.innerText = featuredProjects.length;
            
            featuredProjects.forEach((p, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                
                let mediaHTML = p.previewUrl ? 
                    `<video class="bg-media" loop muted playsinline poster="./assets/placeholder.webp"><source src="${p.previewUrl}" type="video/mp4"></video>` : 
                    `<img class="bg-media" src="${p.image}" alt="${getProjectTitle(p)}">`;

                slide.innerHTML = `
                    ${mediaHTML}
                    <div class="slide-info">
                        <span class="label-text">${translations[currentLang].home_label}</span>
                        <h2 class="project-title">${getProjectTitle(p)}</h2>
                        <div class="credits">
                            <span><b>d:</b> ${p.director}</span>
                            <span><b>p:</b> ${p.prod}</span>
                        </div>
                    </div>
                `;
                slide.onclick = () => openProject(p);
                carouselContainer.appendChild(slide);
            });

            playActiveVideo();
            startAutoPlay();
            renderIndex();
        }

        function goHome() { 
            closeAllOverlays(); 
            if(mobileMenu.classList.contains('open')) toggleMobileMenu();
        }
        
        function openIndex() { 
            closeAllOverlays(false); 
            indexOverlay.classList.add('open'); 
            nav.classList.add('solid-bg'); 
            document.getElementById('nav-projects').classList.add('nav-hidden'); 
            pauseHero(); 
        }
        
        function openAbout() { 
            closeAllOverlays(false); 
            aboutOverlay.classList.add('open'); 
            nav.classList.add('solid-bg'); 
            pauseHero(); 
        }
        
        function closeAllOverlays(resumeHero = true) {
            indexOverlay.classList.remove('open'); 
            aboutOverlay.classList.remove('open'); 
            nav.classList.remove('solid-bg');
            document.getElementById('nav-projects').classList.remove('nav-hidden');
            if(resumeHero) { playActiveVideo(); startAutoPlay(); }
        }
        
        function pauseHero() { 
            clearInterval(autoPlayInterval); 
            cancelAnimationFrame(progressInterval);
            document.querySelectorAll('video').forEach(v => v.pause()); 
        }

        function renderIndex() {
            const gridContainer = document.getElementById('grid-container');
            // Limpiamos solo los items de la grilla, no el footer
            const gridItems = gridContainer.querySelectorAll('.grid-item');
            gridItems.forEach(item => item.remove());
            
            const footer = document.querySelector('.grid-footer');

            allProjects.forEach(p => {
                const item = document.createElement('div');
                let gridClass = p.size || 'third';
                item.className = `grid-item ${gridClass}`; 
                item.onclick = () => openProject(p);
                item.innerHTML = `
                    <img src="${p.image}" alt="${getProjectTitle(p)}" loading="lazy" onload="this.classList.add('img-loaded')" onerror="this.style.display='none'">
                    <div class="item-overlay">
                        <div class="item-title">${getProjectTitle(p)}</div>
                        <div class="item-meta">
                            <span>d: ${p.director}</span>
                            <span>p: ${p.prod}</span>
                        </div>
                    </div>
                `;
                // Insertamos antes del footer
                gridContainer.insertBefore(item, footer);

                if(p.images && p.images.length > 1) {
                    let hoverInterval;
                    let imgIndex = 0;
                    item.onmouseenter = () => {
                        const img = item.querySelector('img');
                        p.images.forEach(src => { const i = new Image(); i.src = src; });
                        hoverInterval = setInterval(() => {
                            imgIndex = (imgIndex + 1) % p.images.length;
                            img.src = p.images[imgIndex];
                        }, 700);
                    };
                    item.onmouseleave = () => {
                        clearInterval(hoverInterval);
                        imgIndex = 0;
                        item.querySelector('img').src = p.image;
                    };
                }
            });
        }

        function playActiveVideo() {
            document.querySelectorAll('.carousel video').forEach(v => v.pause());
            const slides = document.querySelectorAll('.slide');
            if(slides.length > 0) {
                const video = slides[currentSlide].querySelector('video');
                if(video) { video.currentTime = 0; video.play().catch(e => {}); }
            }
        }

        function updateCarousel() {
            document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('active', i === currentSlide));
            uiCurrentDisplay.innerText = currentSlide + 1;
            uiProgressBar.style.width = '0%';
            playActiveVideo();
        }

        function goToSlide(index) { currentSlide = index; updateCarousel(); resetAutoPlay(); }
        function nextSlide() { currentSlide = (currentSlide + 1) % featuredProjects.length; updateCarousel(); resetAutoPlay(); }
        function prevSlide() { currentSlide = (currentSlide - 1 + featuredProjects.length) % featuredProjects.length; updateCarousel(); resetAutoPlay(); }
        
        function animateProgressBar() {
            const now = Date.now();
            const elapsed = now - progressStartTime;
            const percentage = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
            uiProgressBar.style.width = `${percentage}%`;
            if (percentage < 100) { progressInterval = requestAnimationFrame(animateProgressBar); }
        }

        function startAutoPlay() { 
            clearInterval(autoPlayInterval);
            cancelAnimationFrame(progressInterval);
            progressStartTime = Date.now();
            animateProgressBar(); 
            autoPlayInterval = setInterval(() => { nextSlide(); }, SLIDE_DURATION); 
        }
        
        function resetAutoPlay() { startAutoPlay(); }

        // --- YOUTUBE API HANDLER ---
        function onPlayerStateChange(event) {
            // Si el video termina (Estado 0), cerrar modal automáticamente
            if (event.data === 0) {
                closeModal();
            }
        }

        function openProject(p) {
            pauseHero();
            modalContainer.classList.add('open');
            
            if (p.yt && p.yt.length > 0) {
                // Inyectamos el div para la API
                modalContent.innerHTML = `<div class="video-wrapper"><div id="player"></div></div>`;
                
                // Creamos el player de YouTube
                ytPlayer = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: p.yt,
                    playerVars: {
                        'autoplay': 1,
                        'rel': 0,
                        'controls': 1,
                        'fs': 1
                    },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });

            } else if (p.images && p.images.length > 0) {
                const imagesHTML = p.images.map(img => `<div class="gallery-item"><img src="${img}" loading="lazy" onerror="this.style.display='none'"></div>`).join('');
                modalContent.innerHTML = `<div class="gallery-wrapper">${imagesHTML}</div><div class="gallery-hint">Use Arrows &#8596;</div>`;
            } else {
                modalContent.innerHTML = `<img src="${p.image}" style="max-height:90vh; max-width:90vw;">`;
            }
        }

        function closeModal() {
            modalContainer.classList.remove('open');
            
            // Destruir player para cortar audio
            if(ytPlayer && typeof ytPlayer.destroy === 'function') {
                ytPlayer.destroy();
                ytPlayer = null;
            }
            
            setTimeout(() => { modalContent.innerHTML = ''; }, 300);
            if(!indexOverlay.classList.contains('open') && !aboutOverlay.classList.contains('open')) {
                playActiveVideo();
                startAutoPlay();
            }
        }

        // --- KEYBOARD NAVIGATION LOGIC ---
        document.addEventListener('keydown', (e) => { 
            if (e.key === "Escape") closeModal(); 
            
            if (e.key === "ArrowRight") {
                // Caso 1: Galería de fotos abierta (Modal)
                if (modalContainer.classList.contains('open')) {
                    const wrapper = document.querySelector('.gallery-wrapper');
                    if(wrapper) wrapper.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
                } 
                // Caso 2: Navegación Home (solo si no hay overlays)
                else if (!indexOverlay.classList.contains('open') && !aboutOverlay.classList.contains('open')) {
                    nextSlide();
                }
            }
            
            if (e.key === "ArrowLeft") {
                // Caso 1: Galería de fotos abierta (Modal)
                if (modalContainer.classList.contains('open')) {
                    const wrapper = document.querySelector('.gallery-wrapper');
                    if(wrapper) wrapper.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
                } 
                // Caso 2: Navegación Home
                else if (!indexOverlay.classList.contains('open') && !aboutOverlay.classList.contains('open')) {
                    prevSlide();
                }
            }
        });

        initCarousel();
    </script>
