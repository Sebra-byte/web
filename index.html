<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        :root { --bg: #000; --text: #fff; --gray: #888; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* NAV PREMIUM */
        nav { 
            display: flex; justify-content: space-between; padding: 40px 5%; align-items: center;
            position: fixed; top: 0; width: 90%; z-index: 1000;
        }
        .logo img { height: 50px; width: auto; }
        .menu { display: flex; }
        .menu-item { position: relative; margin-left: 35px; }
        .menu-item a { text-decoration: none; color: var(--gray); font-size: 0.7rem; letter-spacing: 3px; font-weight: 200; text-transform: uppercase; transition: 0.3s; }
        .menu-item a::after { content: ''; position: absolute; width: 0; height: 1px; bottom: -5px; left: 0; background: #fff; transition: 0.3s; }
        .menu-item:hover a::after { width: 100%; }
        .menu-item:hover a { color: #fff; }

        /* SLIDER CON ZOOM PARA OCULTAR LOGOS */
        .swiper { width: 100%; height: 100vh; background: #000; }
        .swiper-slide { position: relative; overflow: hidden; }
        
        .video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .video-background iframe {
            width: 130vw; /* Mucho más ancho que la pantalla */
            height: 130vh; /* Mucho más alto que la pantalla */
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.3); /* Zoom agresivo para esconder logos */
            border: none;
        }

        /* Overlay de texto */
        .slide-info {
            position: absolute; bottom: 80px; left: 5%;
            z-index: 10;
            pointer-events: none;
        }
        .slide-info h2 { font-size: 1.2rem; letter-spacing: 6px; text-transform: uppercase; font-weight: 400; margin: 0; }
        .slide-info p { font-size: 0.6rem; color: var(--gray); letter-spacing: 3px; margin-top: 8px; }

        /* Flechas Minimalistas */
        .swiper-button-next, .swiper-button-prev { color: #fff !important; opacity: 0.3; transition: 0.3s; }
        .swiper-button-next:hover, .swiper-button-prev:hover { opacity: 1; }
        .swiper-button-next::after, .swiper-button-prev::after { font-size: 25px; font-weight: 200; }

        /* Grilla inferior */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; background: #000; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        
        footer { padding: 60px 5%; font-size: 9px; color: #222; letter-spacing: 2px; text-align: center; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html"><img src="LOGO_Manrope_v01.png" alt="Leandro Bruno"></a></div>
        <div class="menu">
            <div class="menu-item"><a href="index.html">HOME</a></div>
            <div class="menu-item"><a href="#">WORK</a></div>
            <div class="menu-item"><a href="about.html">ABOUT</a></div>
            <div class="menu-item"><a href="mailto:leandrobrunoeditor@gmail.com">CONTACT</a></div>
        </div>
    </nav>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            
            <div class="swiper-slide">
                <div class="video-background">
                    <iframe src="https://www.youtube.com/embed/-2AmqmciWXE?autoplay=1&mute=1&loop=1&playlist=-2AmqmciWXE&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" frameborder="0"></iframe>
                </div>
                <div class="slide-info">
                    <h2>MENEM</h2>
                    <p>SERIE DOCUMENTAL / PRIME VIDEO</p>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="video-background">
                    <iframe src="https://www.youtube.com/embed/ItX5aqhqsmo?autoplay=1&mute=1&loop=1&playlist=ItX5aqhqsmo&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" frameborder="0"></iframe>
                </div>
                <div class="slide-info">
                    <h2>BLAIR</h2>
                    <p>TODO LO QUE TENGO / MUSIC VIDEO</p>
                </div>
            </div>

            <div class="swiper-slide">
                <div class="video-background">
                    <iframe src="https://www.youtube.com/embed/Mms9D8967fM?autoplay=1&mute=1&loop=1&playlist=Mms9D8967fM&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" frameborder="0"></iframe>
                </div>
                <div class="slide-info">
                    <h2>COPPOLA</h2>
                    <p>EL REPRESENTANTE / STAR+</p>
                </div>
            </div>

        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div class="grid" id="work-grid"></div>

    <footer>© 2026 LEANDRO BRUNO.</footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper(".mySwiper", {
            loop: true,
            speed: 1000,
            autoplay: { delay: 5000, disableOnInteraction: false },
            navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
            effect: "fade",
            fadeEffect: { crossFade: true }
        });
    </script>
</body>
</html>
