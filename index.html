<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23FFFFE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>'), auto !important;
        }

        :root { 
            /* Color Grafito */
            --bg: #1C1C1C; 
            --text: #FFFFE4; 
            --line-grid: rgba(255, 255, 228, 0.03); 
            --font-main: 'Manrope', sans-serif;
            --transition-speed: 0.5s;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main); text-transform: lowercase;
            overflow: hidden; letter-spacing: -0.01em;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 220px;
            height: 100vh;
            padding: 35px;
            gap: 30px;
        }

        /* Paneles */
        .left-panel { display: flex; flex-direction: column; gap: 60px; z-index: 100; }
        .brand { font-weight: 300; font-size: 1.1rem; line-height: 1.1; cursor: pointer; color: var(--text); text-decoration: none;}
        .brand strong { display: block; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 2px; text-transform: uppercase; }
        
        .nav-links { display: flex; flex-direction: column; gap: 25px; }
        .lang-switch { font-size: 0.85rem; font-weight: 800; display: flex; gap: 5px; margin-left: -8px; }
        .lang-switch span { cursor: pointer; padding: 8px 12px; opacity: 0.2; transition: 0.3s; }
        .lang-switch span.active-lang { opacity: 1; }

        .custom-select-container { position: relative; }
        .select-selected { font-size: 0.9rem; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 228, 0.2); padding-bottom: 4px; cursor: pointer; }
        .select-items {
            position: absolute; background-color: #111; top: 100%; left: 0; z-index: 99; border: 1px solid rgba(255, 255, 228, 0.05);
            margin-top: 10px; display: none; min-width: 200px;
        }
        .select-items div { padding: 12px 15px; font-size: 0.8rem; cursor: pointer; }
        .select-items div:hover { background-color: var(--text); color: #000; }
        .select-show { display: block; }

        .nav-links a { text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 500; opacity: 0.5; transition: 0.3s; cursor: pointer; }
        .nav-links a:hover { opacity: 1; }

        /* Centro */
        .center-panel { width: 100%; position: relative; overflow-y: auto; scrollbar-width: none; }
        .center-panel::-webkit-scrollbar { display: none; }

        .main-viewer {
            width: 100%; max-width: 900px; aspect-ratio: 21 / 9; 
            background: #000; border: 1px solid rgba(255, 255, 228, 0.05); 
            overflow: hidden; position: relative;
        }
        
        .main-viewer img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 0.6s ease; opacity: 0; 
        }
        .main-viewer img.active-slide { opacity: 1; z-index: 2; }
        
        .project-details { width: 100%; max-width: 900px; margin-top: 35px; padding-bottom: 100px; }
        .project-details h2 { font-size: 4rem; margin: 0; font-weight: 800; line-height: 0.85; text-transform: uppercase; letter-spacing: -0.05em; }
        .category-label { font-size: 0.7rem; font-weight: 700; color: rgba(255, 255, 228, 0.3); margin-bottom: 15px; display: block; text-transform: uppercase; letter-spacing: 0.15em; }
        
        .meta { font-size: 0.9rem; line-height: 1.8; color: rgba(255, 255, 228, 0.5); margin-top: 20px; }
        .meta strong { color: var(--text); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; }
        .p-description { margin-top: 25px; max-width: 650px; text-transform: none; font-weight: 300; color: rgba(255, 255, 228, 0.4); line-height: 1.6; }

        /* SLIDER LOOP DERECHA */
        .right-panel { 
            position: relative;
            height: 100%;
            overflow: hidden; 
            display: flex;
            align-items: center;
        }

        #thumbnail-list { 
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            will-change: transform;
        }

        .thumb-item { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            background: #000; 
            border: 1px solid rgba(255, 255, 228, 0.05); 
            overflow: hidden; 
            transition: opacity 0.4s, transform 0.4s, border-color 0.4s; 
            flex-shrink: 0; 
            cursor: pointer; 
            opacity: 0.2;
            filter: grayscale(1);
        }
        
        .thumb-item.active-thumb { 
            opacity: 1; 
            filter: grayscale(0); 
            border-color: var(--text);
            transform: scale(1.02);
        }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        /* Modales */
        .video-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; z-index: 1000; 
            justify-content: center; align-items: center; 
        }
        .video-wrapper { width: 85%; max-width: 1200px; aspect-ratio: 16 / 9; }
        .close-btn { position: fixed; top: 40px; right: 40px; color: var(--text); font-weight: 800; cursor: pointer; }

        @media (max-width: 1100px) {
            .main-layout { grid-template-columns: 1fr; }
            .right-panel { display: none; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout">
        <section class="left-panel">
            <div class="brand" onclick="location.reload()"><strong>Leandro Bruno</strong>film editor</div>
            <nav class="nav-links">
                <div class="lang-switch">
                    <span id="btn-es" onclick="setLanguage('es')" class="active-lang">ES</span>
                    <span id="btn-en" onclick="setLanguage('en')">EN</span>
                </div>
                <div class="custom-select-container">
                    <div class="select-selected" id="current-filter-text" onclick="toggleDropdown(event)">proyectos / todos</div>
                    <div class="select-items" id="filter-options">
                        <div onclick="filterBy('all', 'all_projects')">/ todos</div>
                        <div onclick="filterBy('ficción', 'narrative')">/ ficción</div>
                        <div onclick="filterBy('advertising', 'advertising')">/ publicidad</div>
                        <div onclick="filterBy('music video', 'music_video')">/ videoclips</div>
                    </div>
                </div>
                <a id="nav-about" onclick="showSection('about')">/ biografía</a>
                <a id="nav-contact" href="mailto:leandrobrunoeditor@gmail.com">/ contacto</a>
            </nav>
        </section>

        <section class="center-panel">
            <div id="work-section">
                <div class="main-viewer" id="viewer" onclick="handleMainClick()">
                    <div id="image-container"></div>
                </div>
                
                <div class="project-details" id="p-details">
                    <span class="category-label" id="p-category"></span>
                    <h2 id="p-title"></h2>
                    <div class="meta" id="p-meta-top"></div>
                    <div class="p-description" id="p-description"></div>
                </div>
            </div>

            <div id="about-section" style="display:none;">
                <p id="txt-about-body" style="font-size:1.3rem; line-height:1.6; max-width:600px; font-weight: 300;"></p>
            </div>
        </section>

        <section class="right-panel">
            <div id="thumbnail-list"></div>
        </section>
    </main>

    <div class="video-modal" id="modal-v">
        <div class="close-btn" onclick="closeModals()">[ CERRAR ]</div>
        <div class="video-wrapper" id="video-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        let currentIndex = 0;
        let slideIndex = 0;
        let mainRotation;
        let filteredProjects = [];
        let currentFilterKey = 'all_projects';

        const projects = [
            { title_es: "menem", title_en: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem.", desc_en: "Biopic tracing Carlos Menem's rise to power." },
            { title_es: "OREO - Diversión", title_en: "OREO - Play", category: "advertising", images: ["assets/Oreo_Thumbnail_1.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios", desc_es: "Campaña global para Oreo.", desc_en: "Global campaign for Oreo." },
            { title_es: "el tiempo de las moscas", title_en: "time of the flies", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg"], yt: "A0d6wnlMRRk", director: "Ana Katz", prod: "netflix", desc_es: "Dos mujeres intentan reconstruir sus vidas.", desc_en: "Two women rebuild their lives." },
            { title_es: "levis x winona riders", title_en: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", director: "Nico Alarcos", prod: "primo", desc_es: "Campaña de gira de Winona Riders.", desc_en: "Winona Riders tour campaign." },
            { title_es: "coppola", title_en: "coppola", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "disney+", desc_es: "La historia de Guillermo Coppola.", desc_en: "The story of Guillermo Coppola." },
            { title_es: "blair - Todo lo que tengo", title_en: "blair - All I have", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "Adelanto del disco Bar Scorpios.", desc_en: "Bar Scorpios album preview." },
            { title_es: "las manos de la abuela", title_en: "grandmother's hands", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png"], yt: "", director: "camila migliore", prod: "calesita films", desc_es: "Memoria y legado familiar.", desc_en: "Memory and family legacy." },
            { title_es: "ratones paranoicos", title_en: "ratones paranoicos", category: "music video", images: ["assets/RP_Thumbmail_1.png"], yt: "", director: "alex roux", prod: "poster", desc_es: "Pieza para la legendaria banda de rock.", desc_en: "Piece for the legendary rock band." },
            { title_es: "besos brujos", title_en: "witch kisses", category: "cortometraje", images: ["assets/BB_Thumbnail_1.png"], yt: "", director: "karina flonembaum", prod: "", desc_es: "Ficción breve sobre el deseo.", desc_en: "Short fiction about desire." },
            { title_es: "las marias", title_en: "las marias", category: "advertising", images: ["assets/Marias_Thumbnail_1.png"], yt: "", director: "alejandro berger", prod: "navajo films", desc_es: "Tradición yerbatera argentina.", desc_en: "Argentine mate tradition." },
            { title_es: "todo lo que recuerdo", title_en: "all I remember", category: "cortometraje", images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"], yt: "", director: "nicolas melian", prod: "", desc_es: "Un viaje sensorial por la memoria.", desc_en: "A sensory journey through memory." }
        ];

        const translations = {
            es: { all_projects: "todos", narrative: "ficción", advertising: "publicidad", music_video: "videoclips", about: "/ biografía", contact: "/ contacto", projects: "proyectos", dir: "dir", prod: "prod", about_body: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires. Se especializa en montaje rítmico y narrativa para plataformas globales como Netflix, Disney+ y Prime Video." },
            en: { all_projects: "all", narrative: "fiction", advertising: "advertising", music_video: "music videos", about: "/ biography", contact: "/ contact", projects: "projects", dir: "dir", prod: "prod", about_body: "Leandro Bruno is a film and advertising editor based in Buenos Aires. He specializes in rhythmic editing and narrative for global platforms such as Netflix, Disney+, and Prime Video." }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-switch span').forEach(s => s.classList.remove('active-lang'));
            document.getElementById(`btn-${lang}`).classList.add('active-lang');
            document.getElementById('nav-about').innerText = translations[lang].about;
            document.getElementById('nav-contact').innerText = translations[lang].contact;
            document.getElementById('txt-about-body').innerText = translations[lang].about_body;
            updateFilterText();
            updateDisplay(true);
        }

        function filterBy(val, dictKey) {
            currentFilterKey = dictKey;
            filteredProjects = val === 'all' ? [...projects] : projects.filter(p => p.category === val || (val === 'ficción' && (p.category === 'serie' || p.category === 'cortometraje')));
            currentIndex = 0;
            updateFilterText();
            updateDisplay();
            startAutoRotation();
        }

        function updateFilterText() {
            document.getElementById('current-filter-text').innerText = `${translations[currentLang].projects} / ${translations[currentLang][currentFilterKey]}`;
        }

        function renderThumbnails() {
            const list = document.getElementById('thumbnail-list');
            // Triple render para asegurar el loop infinito visual
            const itemsHTML = filteredProjects.map((p, idx) => `
                <div class="thumb-item ${idx === currentIndex ? 'active-thumb' : ''}" onclick="selectProject(${idx})">
                    <img src="${p.images[0]}">
                </div>
            `).join('');
            list.innerHTML = itemsHTML + itemsHTML + itemsHTML; 
            alignThumbnails(false);
        }

        function alignThumbnails(smooth = true) {
            const list = document.getElementById('thumbnail-list');
            const items = list.querySelectorAll('.thumb-item');
            if(items.length === 0) return;

            const panelHeight = document.querySelector('.right-panel').offsetHeight;
            const singleSetHeight = list.scrollHeight / 3;
            const activeItem = items[currentIndex + filteredProjects.length]; // Usamos el set del medio
            
            const targetY = (panelHeight / 2) - (activeItem.offsetTop + activeItem.offsetHeight / 2);
            
            list.style.transition = smooth ? "transform 0.6s cubic-bezier(0.23, 1, 0.32, 1)" : "none";
            list.style.transform = `translateY(${targetY}px)`;
        }

        function updateDisplay(onlyText = false) {
            const current = filteredProjects[currentIndex];
            if(!current) return;

            if(!onlyText) {
                document.getElementById('image-container').innerHTML = current.images.map((src, idx) => `<img src="${src}" class="${idx === 0 ? 'active-slide' : ''}">`).join('');
                renderThumbnails();
            }
            
            document.getElementById('p-title').innerText = currentLang === 'es' ? current.title_es : current.title_en;
            document.getElementById('p-category').innerText = current.category;
            document.getElementById('p-description').innerText = currentLang === 'es' ? current.desc_es : current.desc_en;
            document.getElementById('p-meta-top').innerHTML = `<strong>${translations[currentLang].dir}:</strong> ${current.director}${current.prod ? `<br><strong>${translations[currentLang].prod}:</strong> ${current.prod}` : ''}`;
            
            alignThumbnails(true);
        }

        function selectProject(idx) { currentIndex = idx; updateDisplay(); startAutoRotation(); }

        function startAutoRotation() {
            clearInterval(mainRotation);
            mainRotation = setInterval(() => {
                currentIndex = (currentIndex + 1) % filteredProjects.length;
                updateDisplay();
            }, 8000);
        }

        function handleMainClick() {
            const p = filteredProjects[currentIndex];
            if(!p.yt) return;
            document.getElementById('modal-v').style.display = 'flex';
            const isDrive = p.yt.length > 20;
            document.getElementById('video-player').innerHTML = isDrive 
                ? `<iframe src="https://drive.google.com/file/d/${p.yt}/preview" width="100%" height="100%" frameborder="0" allow="autoplay"></iframe>`
                : `<div id="yt-player"></div>`;
            if(!isDrive) new YT.Player('yt-player', { videoId: p.yt, playerVars: { 'autoplay': 1 } });
        }

        function closeModals() {
            document.getElementById('modal-v').style.display = 'none';
            document.getElementById('video-player').innerHTML = '';
        }

        function showSection(sec) {
            document.getElementById('work-section').style.display = sec === 'work' ? 'block' : 'none';
            document.getElementById('about-section').style.display = sec === 'about' ? 'block' : 'none';
            if(sec === 'work') alignThumbnails(false);
        }

        function toggleDropdown(e) { e.stopPropagation(); document.getElementById("filter-options").classList.toggle("select-show"); }

        window.onclick = () => document.getElementById("filter-options").classList.remove("select-show");
        window.onload = () => { filterBy('all', 'all_projects'); setLanguage('es'); };
        window.onresize = () => alignThumbnails(false);
    </script>
</body>
</html>
