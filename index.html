<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f0f0f0; --text: #1a1a1a; --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); --line-accent: rgba(255, 0, 0, 0.15); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; text-transform: lowercase; overflow: hidden;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--line-grid) 1px, transparent 1px), linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 20% 1fr 20%;
            height: 100vh;
            align-items: center;
            padding: 0 50px;
            gap: 30px;
        }

        /* IZQUIERDA: LOGO + ABOUT */
        .side-left { display: flex; flex-direction: column; gap: 20px; }
        .brand { font-size: 1.2rem; line-height: 1.4; }
        .brand span { display: block; font-weight: 700; font-size: 1.4rem; }
        .side-left a { text-decoration: none; color: var(--gray); font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; }

        /* CENTRO: VISOR ACHICADO */
        .center-panel { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .main-viewer {
            width: 85%; /* Achicado para subir la info */
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid #aaa;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }
        .main-viewer img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }
        .play-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: white; opacity: 0; transition: 0.3s;
        }
        .main-viewer:hover .play-overlay { opacity: 0.8; }

        /* INFO SUBIDA */
        .project-info {
            width: 85%;
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        .project-info h2 { font-size: 3rem; margin: 0; letter-spacing: -2px; font-weight: 700; }
        .project-info .meta { font-size: 1rem; line-height: 1.6; color: var(--gray); }

        /* DERECHA: MINIATURAS */
        .side-right { display: flex; flex-direction: column; gap: 15px; align-items: flex-end; }
        .thumb-box {
            width: 180px; aspect-ratio: 16 / 9;
            background: #000; border: 1px solid #ccc;
            cursor: pointer; overflow: hidden;
        }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.3s; }
        .thumb-box:hover img { opacity: 1; }

        /* MODAL VIDEO */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; z-index: 1000;
            justify-content: center; align-items: center;
        }
        .video-modal iframe { width: 80%; aspect-ratio: 16 / 9; border: none; }
        .close-modal { position: absolute; top: 30px; right: 50px; color: white; font-size: 2rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout">
        <section class="side-left">
            <div class="brand"><span>leandro bruno</span>film editor</div>
            <a href="about.html">about</a>
            <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
        </section>

        <section class="center-panel">
            <div class="main-viewer" onclick="openVideo()">
                <div class="play-overlay">▶</div>
                <img id="feat-img" src="" alt="feature">
            </div>
            <div class="project-info">
                <div>
                    <h2 id="feat-title"></h2>
                </div>
                <div class="meta" id="feat-meta"></div>
            </div>
        </section>

        <section class="side-right" id="thumbs-container"></section>
    </main>

    <div class="video-modal" id="modal">
        <span class="close-modal" onclick="closeVideo()">✕ close</span>
        <div id="video-player"></div>
    </div>

    <script>
        const projects = [
            { title: "menem", img: "assets/thumb_menem.jpg", yt: "-2AmqmciWXE", credits: "<strong>d.</strong> ariel winograd<br><strong>p.</strong> claxon, yavu, prime video" },
            { title: "oreo", img: "assets/thumb_oreo.jpg", yt: "7Cllu0Rme74", credits: "<strong>p.</strong> primo films" },
            { title: "moscas", img: "assets/thumb_moscas.jpg", yt: "A0d6wnlMRRk", credits: "<strong>d.</strong> ana katz<br><strong>p.</strong> netflix" },
            { title: "coppola", img: "assets/thumb_coppola.jpg", yt: "ecr24akKDbs", credits: "<strong>d.</strong> ariel winograd<br><strong>p.</strong> disney+" }
        ];

        let currentIdx = 0;

        function render() {
            const p = projects[currentIdx];
            const img = document.getElementById('feat-img');
            img.style.opacity = 0;
            
            setTimeout(() => {
                img.src = p.img;
                document.getElementById('feat-title').innerText = p.title;
                document.getElementById('feat-meta').innerHTML = p.credits;
                img.style.opacity = 1;
            }, 300);

            const container = document.getElementById('thumbs-container');
            container.innerHTML = '';
            projects.forEach((proj, i) => {
                if(i !== currentIdx) {
                    const box = document.createElement('div');
                    box.className = 'thumb-box';
                    box.innerHTML = `<img src="${proj.img}" onerror="this.src='https://via.placeholder.com/180x101?text=Error+Path'">`;
                    box.onclick = () => { currentIdx = i; render(); resetTimer(); };
                    container.appendChild(box);
                }
            });
        }

        function openVideo() {
            const modal = document.getElementById('modal');
            const player = document.getElementById('video-player');
            const p = projects[currentIdx];
            modal.style.display = 'flex';
            player.innerHTML = `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('video-player').innerHTML = '';
        }

        let timer = setInterval(() => { currentIdx = (currentIdx + 1) % projects.length; render(); }, 6000);
        function resetTimer() { clearInterval(timer); timer = setInterval(() => { currentIdx = (currentIdx + 1) % projects.length; render(); }, 6000); }

        window.onload = render;
    </script>
</body>
</html>
