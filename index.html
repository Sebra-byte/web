<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f0f0f0; --text: #1a1a1a; --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; text-transform: lowercase; overflow: hidden;
        }

        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--line-grid) 1px, transparent 1px), linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 250px 1fr 200px;
            height: 100vh;
            padding: 40px;
            gap: 20px;
            box-sizing: border-box;
        }

        /* IZQUIERDA: MARCA + ABOUT */
        .left-panel { display: flex; flex-direction: column; gap: 30px; }
        .brand { font-size: 1.2rem; line-height: 1.4; }
        .brand strong { display: block; font-size: 1.4rem; }
        .nav-links a { text-decoration: none; color: var(--text); font-size: 1.1rem; font-weight: 700; display: block; margin-bottom: 10px; }

        /* CENTRO: VISOR Y INFO */
        .center-panel { display: flex; flex-direction: column; }
        .main-viewer {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border: 1px solid #ddd; overflow: hidden; cursor: pointer; position: relative;
        }
        .main-viewer img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; }
        
        .project-details {
            margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        }
        .project-details h2 { font-size: 3rem; margin: 0; letter-spacing: -2px; font-weight: 700; }
        .project-details .meta { font-size: 0.9rem; line-height: 1.6; color: var(--gray); }

        /* DERECHA: MINIATURAS */
        .right-panel { display: flex; flex-direction: column; gap: 15px; }
        .thumb-item {
            width: 100%; aspect-ratio: 16 / 10; background: #ddd;
            border: 1px solid #ccc; overflow: hidden; cursor: pointer;
        }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); transition: 0.3s; }
        .thumb-item:hover img { filter: grayscale(0); }

        /* MODAL VIDEO - TAMAÑO GRANDE */
        .video-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: none; z-index: 1000;
            justify-content: center; align-items: center;
        }
        
        .video-wrapper {
            width: 90%; 
            max-width: 1400px; 
            aspect-ratio: 16 / 9; 
            position: relative;
        }

        #video-player { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; 
        }

        .close-modal { 
            position: absolute; top: 30px; right: 50px; color: white; 
            cursor: pointer; font-size: 1.5rem; font-weight: 700; letter-spacing: 2px;
            z-index: 1010;
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout">
        <section class="left-panel">
            <div class="brand"><strong>leandro bruno</strong>film editor</div>
            <nav class="nav-links">
                <a href="about.html">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </nav>
        </section>

        <section class="center-panel">
            <div class="main-viewer" onclick="openVideo()">
                <img id="main-img" src="" alt="feature project">
            </div>
            <div class="project-details">
                <div>
                    <span style="font-size: 0.8rem;">project name</span>
                    <h2 id="p-title"></h2>
                </div>
                <div class="meta">
                    <div id="p-meta-top"></div>
                    <div id="p-description" style="margin-top: 15px;"></div>
                </div>
            </div>
        </section>

        <section class="right-panel" id="thumbnail-list"></section>
    </main>

    <div class="video-modal" id="modal">
        <span class="close-modal" onclick="closeVideo()">✕ close</span>
        <div class="video-wrapper">
            <div id="video-player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Nombres de archivos basados en tu estructura de GitHub
        const projects = [
            {
                title: "menem",
                img: "assets/Menem_Thumbnail_1.jpg",
                yt: "-2AmqmciWXE",
                director: "ariel winograd",
                prod: "claxon, yavu, prime video",
                desc: "serie original de prime video. montaje cinematográfico enfocado en la narrativa política y dramática de los años 90."
            },
            {
                title: "coppola",
                img: "assets/Coppola_Thumbnail_2.jpg",
                yt: "ecr24akKDbs",
                director: "ariel winograd",
                prod: "pampa films, disney+",
                desc: "miniserie biográfica. edición de ritmo frenético y reconstrucción de época."
            },
            {
                title: "blair",
                img: "assets/Blair_Thumbnail_v01.jpg",
                yt: "ItX5aqhqsmo",
                director: "dana campanello",
                prod: "poster",
                desc: "proyecto documental con enfoque en la textura de imagen y narrativa no lineal."
            },
            {
                title: "levis",
                img: "assets/Levis_Thumbnail_v01.jpg",
                yt: "7Cllu0Rme74",
                director: "lorenzo shakespear",
                prod: "levis",
                desc: "campaña comercial con estética lo-fi y montaje rítmico."
            }
        ];

        let currentIndex = 0;
        let player;

        function updateDisplay() {
            const current = projects[currentIndex];
            const mainImg = document.getElementById('main-img');
            
            mainImg.style.opacity = 0;
            
            setTimeout(() => {
                mainImg.src = current.img;
                document.getElementById('p-title').innerText = current.title;
                document.getElementById('p-meta-top').innerHTML = `<strong>d.</strong> ${current.director}<br><strong>p.</strong> ${current.prod}`;
                document.getElementById('p-description').innerText = current.desc;
                mainImg.style.opacity = 1;
            }, 300);

            const thumbList = document.getElementById('thumbnail-list');
            thumbList.innerHTML = '';
            
            projects.forEach((proj, index) => {
                if(index !== currentIndex) {
                    const item = document.createElement('div');
                    item.className = 'thumb-item';
                    item.innerHTML = `<img src="${proj.img}">`;
                    item.onclick = () => {
                        currentIndex = index;
                        updateDisplay();
                        resetInterval();
                    };
                    thumbList.appendChild(item);
                }
            });
        }

        // Función para abrir el video y detectar el final
        function openVideo() {
            const modal = document.getElementById('modal');
            const ytId = projects[currentIndex].yt;
            modal.style.display = 'flex';

            if (player) {
                player.loadVideoById(ytId);
            } else {
                player = new YT.Player('video-player', {
                    height: '100%',
                    width: '100%',
                    videoId: ytId,
                    playerVars: {
                        'autoplay': 1,
                        'rel': 0,
                        'modestbranding': 1
                    },
                    events: {
                        'onStateChange': onPlayerStateChange
                    }
                });
            }
        }

        // Cerrar al terminar
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                closeVideo();
            }
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            if (player) {
                player.stopVideo();
            }
        }

        let rotation = setInterval(() => {
            currentIndex = (currentIndex + 1) % projects.length;
            updateDisplay();
        }, 5000);

        function resetInterval() {
            clearInterval(rotation);
            rotation = setInterval(() => {
                currentIndex = (currentIndex + 1) % projects.length;
                updateDisplay();
            }, 5000);
        }

        updateDisplay();
    </script>
</body>
</html>
