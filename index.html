<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { 
            --bg: #f0f0f0; /* Color cemento claro / papel técnico */
            --text: #1a1a1a; 
            --gray: #999; 
            --line-grid: rgba(0, 0, 0, 0.05); 
            --line-accent: rgba(255, 0, 0, 0.2); /* Línea guía técnica roja */
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; 
            overflow: hidden; text-transform: lowercase; 
        }

        /* FONDO BLUEPRINT */
        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        /* LÍNEAS TÉCNICAS ROJAS */
        .guide-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--line-accent); z-index: -1; }

        /* NAVEGACIÓN SUPERIOR */
        nav {
            position: fixed; top: 40px; width: 100%;
            display: flex; justify-content: center; gap: 50px;
            z-index: 100;
        }
        nav a { text-decoration: none; color: var(--gray); font-size: 0.7rem; letter-spacing: 2px; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--text); }

        /* ESTRUCTURA PRINCIPAL */
        .main-layout {
            display: grid;
            grid-template-columns: 20% 1fr 20%;
            height: 100vh;
            align-items: center;
            padding: 0 40px;
        }

        /* LOGO TEXTO (IZQUIERDA - HORIZONTAL) */
        .side-left { 
            font-size: 0.65rem; 
            letter-spacing: 1px; 
            line-height: 1.4;
            color: var(--text);
            font-weight: 400;
        }
        .side-left span { display: block; font-weight: 700; font-size: 0.75rem; margin-bottom: 4px; }

        /* NOMBRE PROYECTO (DERECHA - HORIZONTAL) */
        .side-right { 
            text-align: right;
            font-size: 0.75rem; 
            letter-spacing: 3px; 
            font-weight: 700;
        }

        /* CARRUSEL CENTRADO */
        .center-frame {
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            border: 1px solid #ccc;
            position: relative;
            background: transparent; /* Eliminado el fondo negro */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .swiper { width: 100%; height: 100%; }
        .video-wrapper { width: 100%; height: 100%; background: #000; } /* El video mantiene su fondo */
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }

        /* INFO ABAJO CENTRO */
        .bottom-info {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }
        .credits-box { 
            font-size: 0.6rem; 
            letter-spacing: 1px; 
            color: var(--gray); 
            line-height: 1.6;
        }
        .credits-box strong { color: var(--text); }

        /* SCAN LINE */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 1px;
            background: rgba(0,0,0,0.2); z-index: 10; pointer-events: none;
        }
        .scanning { animation: scan 0.8s ease-out; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; gap: 20px; text-align: center; padding-top: 100px; }
            .side-left, .side-right { text-align: center; }
            .bottom-info { position: relative; bottom: 0; padding: 40px 0; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>
    <div class="guide-h"></div>

    <nav>
        <a href="index.html" class="active">work</a>
        <a href="about.html">about</a>
        <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
    </nav>

    <main class="main-layout">
        <div class="side-left">
            <span>leandro bruno</span>
            film editor
        </div>

        <div class="center-frame">
            <div class="scan-line" id="scanner"></div>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" data-title="menem" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video">
                        <div class="video-wrapper"><div id="player1"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="oreo" data-credits="<strong>p.</strong> primo films">
                        <div class="video-wrapper"><div id="player2"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="el tiempo de las moscas" data-credits="<strong>d.</strong> benjamín naishtat, ana katz | <strong>p.</strong> netflix, zona audiovisual">
                        <div class="video-wrapper"><div id="player3"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="coppola" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> disney, pampa films">
                        <div class="video-wrapper"><div id="player4"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="blair" data-credits="<strong>d.</strong> dana campanello | <strong>p.</strong> poster">
                        <div class="video-wrapper"><div id="player5"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-right">
            <div id="p-name">menem</div>
        </div>
    </main>

    <div class="bottom-info">
        <div class="credits-box" id="p-credits">
            <strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let players = [];
        const videoIds = ['-2AmqmciWXE', '7Cllu0Rme74', 'A0d6wnlMRRk', 'ecr24akKDbs', 'ItX5aqhqsmo'];

        function onYouTubeIframeAPIReady() {
            videoIds.forEach((id, index) => {
                players[index] = new YT.Player('player' + (index + 1), {
                    videoId: id,
                    playerVars: { 
                        'autoplay': 1, 'mute': 1, 'loop': 1, 'playlist': id, 
                        'controls': 0, 'modestbranding': 1, 'rel': 0, 'iv_load_policy': 3 
                    },
                    events: { 'onReady': (e) => e.target.playVideo() }
                });
            });
        }

        const swiper = new Swiper(".mySwiper", {
            loop: true,
            speed: 1000,
            effect: "fade",
            fadeEffect: { crossFade: true },
            autoplay: { delay: 6000, disableOnInteraction: false },
            on: {
                slideChangeTransitionStart: function () {
                    const scanner = document.getElementById('scanner');
                    scanner.classList.remove('scanning');
                    void scanner.offsetWidth; 
                    scanner.classList.add('scanning');
                },
                slideChange: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    if(activeSlide) {
                        document.getElementById('p-name').innerText = activeSlide.getAttribute('data-title');
                        document.getElementById('p-credits').innerHTML = activeSlide.getAttribute('data-credits');
                    }
                }
            }
        });
    </script>
</body>
</html>
