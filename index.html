<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | Film Editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow-x: hidden;
        }

        /* --- NAVEGACIÓN (Edit Doula Style) --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 40px 50px;
            z-index: 1000;
            mix-blend-mode: difference;
        }

        .brand h1 { font-size: 1.8rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.03em; }
        .brand p { font-size: 0.9rem; font-weight: 300; margin-top: 5px; }

        nav ul { list-style: none; text-align: right; }
        nav ul li a { text-decoration: none; color: var(--text); font-size: 0.85rem; font-weight: 500; opacity: 0.6; transition: 0.3s; }
        nav ul li a:hover { opacity: 1; }

        /* --- HERO (FULLSCREEN VIDEO PREVIEW) --- */
        #hero-container {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 50px;
        }

        .video-background {
            position: absolute;
            top: 50%; left: 50%;
            width: 100vw; height: 100vh;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Ajuste para que el iframe cubra todo el fondo */
        .video-background iframe {
            width: 100vw; height: 56.25vw; /* 16:9 ratio */
            min-height: 100vh; min-width: 177.77vh;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .hero-content { z-index: 10; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; }
        .hero-title h2 { font-size: 5rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.04em; line-height: 0.85; }
        
        .view-all-btn {
            padding: 15px 30px;
            border: 1px solid var(--text);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.4s;
            background: transparent;
            color: var(--text);
        }
        .view-all-btn:hover { background: var(--text); color: var(--bg); }

        /* --- GRID LIST (INDEX) --- */
        .work-section { padding: 100px 50px; }
        .grid-header { 
            display: flex; justify-content: space-between; 
            border-bottom: 1px solid rgba(255,255,228, 0.2);
            padding-bottom: 20px; margin-bottom: 50px;
        }
        .grid-header h3 { font-weight: 800; text-transform: uppercase; }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            column-gap: 40px;
            row-gap: 80px;
        }

        .project-card { width: 100%; transition: 0.4s; }
        .thumb-box { 
            width: 100%; aspect-ratio: 16/9; 
            background: #000; overflow: hidden; margin-bottom: 20px; 
        }
        .thumb-box img { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .project-card:hover img { transform: scale(1.05); }

        .project-info { display: flex; justify-content: space-between; align-items: baseline; }
        .project-info h4 { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }
        .project-credits { font-size: 0.75rem; text-align: right; opacity: 0.5; }

        /* --- MODAL --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); display: none; z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content { width: 90%; max-width: 1200px; aspect-ratio: 16/9; }

        @media (max-width: 900px) {
            .project-grid { grid-template-columns: 1fr; }
            .hero-title h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <ul>
                <li><a href="#work">/ all films</a></li>
                <li><a href="mailto:leandrobrunoeditor@gmail.com">/ contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="hero-container">
        <div class="video-background" id="hero-video-box">
            </div>
        <div class="hero-content">
            <div class="hero-title">
                <p id="hero-cat" style="margin-bottom: 10px; font-weight: 500; opacity: 0.7;"></p>
                <h2 id="hero-name"></h2>
            </div>
            <button class="view-all-btn" onclick="document.getElementById('work').scrollIntoView({behavior:'smooth'})">view index</button>
        </div>
    </section>

    <section class="work-section" id="work">
        <div class="grid-header">
            <h3>selected work / index</h3>
            <div id="filter-display" style="opacity: 0.5; font-size: 0.8rem;">( 11 projects )</div>
        </div>

        <div class="project-grid" id="main-grid">
            </div>
    </section>

    <div class="modal" id="modal">
        <div style="position:absolute; top:40px; right:50px; font-weight:800;" onclick="closeVideo()">[ CLOSE ]</div>
        <div class="modal-content" id="modal-inner"></div>
    </div>

    <script>
        // Proyectos para el HERO (Solo los 5 solicitados)
        const heroProjects = [
            { title: "menem", cat: "serie", yt: "-2AmqmciWXE" },
            { title: "OREO - Sigamos divirtiéndonos", cat: "advertising", yt: "7Cllu0Rme74" },
            { title: "el tiempo de las moscas", cat: "serie", yt: "A0d6wnlMRRk" },
            { title: "blair - todo lo que tengo", cat: "music video", yt: "ItX5aqhqsmo" },
            { title: "coppola", cat: "serie", yt: "ecr24akKDbs" }
        ];

        // Listado completo (11 proyectos)
        const allProjects = [
            { title: "menem", cat: "serie", thumb: "assets/Menem_Thumbnail_1.jpg", yt: "-2AmqmciWXE", dir: "ariel winograd", prod: "prime video" },
            { title: "OREO", cat: "advertising", thumb: "assets/Oreo_Thumbnail_5.png", yt: "7Cllu0Rme74", dir: "Martín Jalfen", prod: "pop studios" },
            { title: "el tiempo de las moscas", cat: "serie", thumb: "assets/Moscas_Thumbnail_1.jpg", yt: "A0d6wnlMRRk", dir: "b. naishtat & a. katz", prod: "netflix" },
            { title: "levis x winona riders", cat: "advertising", thumb: "assets/Levis_Thumbnail_v01.jpg", yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", dir: "nico alarcos", prod: "primo" },
            { title: "coppola", cat: "serie", thumb: "assets/Coppola_Thumbnail_2.jpg", yt: "ecr24akKDbs", dir: "ariel winograd", prod: "disney+" },
            { title: "blair", cat: "music video", thumb: "assets/Blair_Thumbnail_1.jpg", yt: "ItX5aqhqsmo", dir: "dana campanello", prod: "poster" },
            { title: "las manos de la abuela", cat: "short", thumb: "assets/MA_Thumbnail_1.png", yt: "", dir: "camila migliore", prod: "calesita" },
            { title: "ratones paranoicos", cat: "music video", thumb: "assets/RP_Thumbmail_1.png", yt: "", dir: "alex roux", prod: "poster" },
            { title: "besos brujos", cat: "short", thumb: "assets/BB_Thumbnail_1.png", yt: "", dir: "karina flonembaum", prod: "-" },
            { title: "las marias", cat: "advertising", thumb: "assets/Marias_Thumbnail_1.png", yt: "", dir: "a. berger parrado", prod: "navajo films" },
            { title: "todo lo que recuerdo", cat: "short", thumb: "assets/TodoLoQueRecuerdo_Thumbnail_1.png", yt: "", dir: "n. fernández melián", prod: "-" }
        ];

        // Rotación del Hero
        let heroIdx = 0;
        function updateHero() {
            const p = heroProjects[heroIdx];
            document.getElementById('hero-name').innerText = p.title;
            document.getElementById('hero-cat').innerText = p.cat;
            
            // Embed muteado y con autoplay para el preview
            document.getElementById('hero-video-box').innerHTML = `
                <iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${p.yt}&rel=0" 
                frameborder="0" allow="autoplay; fullscreen"></iframe>
            `;
            heroIdx = (heroIdx + 1) % heroProjects.length;
        }

        // Renderizado del Grid
        function renderGrid() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = allProjects.map(p => `
                <div class="project-card" onclick="openVideo('${p.yt}', '${p.thumb}')">
                    <div class="thumb-box">
                        <img src="${p.thumb}" alt="${p.title}">
                    </div>
                    <div class="project-info">
                        <h4>${p.title}</h4>
                        <div class="project-credits">
                            dir: ${p.dir}<br>
                            ${p.prod}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openVideo(id, thumb) {
            const modal = document.getElementById('modal');
            const inner = document.getElementById('modal-inner');
            modal.style.display = 'flex';
            if(id) {
                const src = id.length < 20 ? `https://www.youtube.com/embed/${id}?autoplay=1` : `https://drive.google.com/file/d/${id}/preview`;
                inner.innerHTML = `<iframe width="100%" height="100%" src="${src}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
            } else {
                inner.innerHTML = `<img src="${thumb}" style="width:100%; height:100%; object-fit:contain;">`;
            }
        }

        function closeVideo() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-inner').innerHTML = '';
        }

        window.onload = () => {
            updateHero();
            renderGrid();
            setInterval(updateHero, 8000); // Cambia el video del hero cada 8 segundos
        };
    </script>
</body>
</html>
