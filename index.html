<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grafito: #1a1a1a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
            --transition-smooth: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-grafito);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow: hidden; /* Evitamos scroll general en la home */
        }

        /* --- FONDO VIDEO HOME --- */
        .bg-preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: var(--bg-grafito); overflow: hidden;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 2s ease-in-out;
            pointer-events: none;
        }
        .bg-video.active { opacity: 0.35; }
        .bg-video iframe {
            width: 150vw; height: 150vh;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.6);
        }

        /* --- NAVEGACIÓN --- */
        .sidebar {
            position: fixed; top: 60px; right: 60px;
            display: flex; flex-direction: column; text-align: right;
            align-items: flex-end; z-index: 5000;
        }
        .brand { margin-bottom: 40px; cursor: pointer; }
        .brand h1 { font-size: 2.6rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.04em; }
        .brand p { font-size: 0.95rem; font-weight: 200; margin-top: 8px; opacity: 0.8; letter-spacing: 0.05em; }

        .side-nav { display: flex; flex-direction: column; gap: 10px; }
        .side-nav a { 
            text-decoration: none; color: var(--hueso); font-size: 1.1rem; 
            font-weight: 500; opacity: 0.5; transition: 0.3s; 
        }
        .side-nav a:hover, .side-nav a.active { opacity: 1; font-style: italic; }

        .lang-switcher {
            position: fixed; bottom: 40px; left: 60px;
            z-index: 5000; display: flex; gap: 15px;
        }
        .lang-btn {
            background: none; border: none; color: var(--hueso);
            font-family: var(--font-main); font-size: 0.8rem; font-weight: 700;
            cursor: pointer; opacity: 0.3; transition: 0.3s;
        }
        .lang-btn.active { opacity: 1; text-decoration: underline; }

        /* --- ALL PROJECTS SECTION --- */
        #all-projects-section {
            display: none; padding: 180px 0 100px;
            position: relative; z-index: 100; background: var(--bg-grafito); 
            height: 100vh; overflow-y: auto;
        }
        .all-projects-grid {
            display: grid; grid-template-columns: 180px 1px 1fr;
            gap: 40px; max-width: 1600px; margin: 0; padding: 0 60px; align-items: start;
        }
        .cat-nav-column { position: sticky; top: 0; display: flex; flex-direction: column; gap: 15px; }
        .cat-link {
            text-decoration: none; color: var(--hueso); font-size: 0.7rem;
            font-weight: 800; text-transform: uppercase; letter-spacing: 0.2em;
            opacity: 0.25; transition: 0.3s;
        }
        .cat-link:hover { opacity: 1; }
        .v-line { width: 1px; background: rgba(255, 255, 228, 0.1); height: 100%; min-height: 70vh; }

        .category-group { margin-bottom: 80px; }
        .category-separator { 
            font-size: 0.75rem; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 0.3em; opacity: 0.2; padding-bottom: 20px; 
            border-bottom: 1px solid rgba(255, 255, 228, 0.1); margin-bottom: 10px;
        }
        
        .project-row { 
            display: grid; grid-template-columns: 280px 1fr 120px;
            gap: 50px; padding: 35px 0; border-bottom: 1px solid rgba(255, 255, 228, 0.05); 
            align-items: center; transition: var(--transition-smooth); 
            text-decoration: none; color: inherit; 
        }
        .project-row:hover { background-color: rgba(255, 255, 228, 0.02); padding-left: 15px; }
        .thumb-box { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; transition: var(--transition-smooth); }
        .project-row:hover .thumb-box img { opacity: 1; transform: scale(1.03); }

        .info-box h3 { font-size: 2.2rem; font-weight: 800; text-transform: uppercase; line-height: 0.9; margin-bottom: 12px; letter-spacing: -0.02em; }
        .info-box .meta-line { font-size: 0.85rem; opacity: 0.5; font-weight: 400; letter-spacing: 0.05em; margin-bottom: 4px; }
        .info-box .meta-line strong { opacity: 1; color: var(--hueso); margin-right: 4px; }

        .logos-box { display: flex; justify-content: flex-end; align-items: center; }
        .logos-box img { 
            max-height: 25px; 
            max-width: 90px; 
            filter: brightness(0) invert(1); 
            object-fit: contain; 
            opacity: 0.3;
            transition: 0.3s;
        }
        .project-row:hover .logos-box img { opacity: 1; }

        /* --- MODAL DETALLE --- */
        #project-detail {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.96); z-index: 6000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(20px);
        }
        .detail-wrapper {
            width: 92vw; height: 85vh; display: grid; grid-template-columns: 8fr 2fr;
            background: #000; position: relative; overflow: hidden;
        }
        .close-btn { 
            position: fixed; top: 40px; right: 60px; font-size: 0.75rem; 
            font-weight: 800; cursor: pointer; z-index: 6100; 
            text-transform: uppercase; color: var(--hueso); opacity: 0.5;
        }
        .close-btn:hover { opacity: 1; }

        .detail-video-side { 
            background: #000; width: 100%; height: 100%; 
            position: relative; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
        }
        .detail-video-side iframe { width: 100%; height: 100%; border: none; }
        
        .gallery-container { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .gallery-container img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .gallery-container img.active { display: block; }
        
        .gallery-nav { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px; pointer-events: none;
        }
        .gallery-arrow { 
            pointer-events: auto; font-size: 3rem; color: var(--hueso); 
            opacity: 0.2; cursor: pointer; transition: 0.3s; font-weight: 200;
        }
        .gallery-arrow:hover { opacity: 1; }

        .detail-info-side {
            padding: 50px 40px; display: flex; flex-direction: column;
            justify-content: flex-end; border-left: 1px solid rgba(255,255,228,0.1);
            background: var(--bg-grafito); overflow-y: auto;
        }
        .detail-info-side h2 { font-size: 2.2rem; font-weight: 800; text-transform: uppercase; line-height: 0.9; margin-bottom: 40px; }
        .detail-meta-group { margin-bottom: 20px; }
        .detail-meta-group strong { display: block; font-size: 0.65rem; opacity: 0.3; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 5px; }
        .detail-meta-group p { font-size: 0.95rem; font-weight: 400; opacity: 0.8; }
        .detail-desc { margin-top: 30px; font-size: 0.85rem; opacity: 0.5; line-height: 1.6; font-weight: 300; }

        /* --- HOME SECTION --- */
        #home-section {
            height: 100vh; width: 100%; display: flex; align-items: center;
            padding-left: 60px; position: relative; z-index: 10;
        }
        .section-label { font-size: 0.75rem; margin-bottom: 25px; font-weight: 700; opacity: 0.3; letter-spacing: 0.15em; text-transform: uppercase; }
        .film-item {
            font-size: 4.5rem; font-weight: 800; text-transform: uppercase;
            line-height: 0.85; letter-spacing: -0.04em; color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2);
            transition: all 0.4s ease; display: block;
            text-decoration: none; margin-bottom: 5px; width: fit-content;
        }
        .film-item.active, .film-item:hover { color: var(--hueso); -webkit-text-stroke: 0px; transform: translateX(20px); }

        @media (max-width: 1200px) {
            .all-projects-grid { grid-template-columns: 1fr; }
            .cat-nav-column, .v-line { display: none; }
            .project-row { grid-template-columns: 1fr 1fr; }
            .detail-wrapper { grid-template-columns: 1fr; height: 95vh; }
            .detail-info-side { border-left: none; border-top: 1px solid rgba(255,255,228,0.1); }
        }
    </style>
</head>
<body>

    <div class="bg-preview-container" id="bg-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <div class="sidebar">
        <div class="brand" onclick="showSection('home')">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav class="side-nav">
            <a href="#" id="nav-all" onclick="showSection('all')">/ <span data-i18n="all_projects">todos los proyectos</span></a>
            <a href="mailto:leandrobrunoeditor@gmail.com">/ <span data-i18n="contact">contacto</span></a>
        </nav>
    </div>

    <div class="lang-switcher">
        <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <section id="home-section">
        <div class="list-container">
            <p class="section-label" data-i18n="selected_works">trabajos seleccionados</p>
            <div id="featured-list"></div>
        </div>
    </section>

    <section id="all-projects-section">
        <div class="all-projects-grid">
            <div class="cat-nav-column" id="category-nav"></div>
            <div class="v-line"></div>
            <div class="projects-list-body" id="full-index-list"></div>
        </div>
    </section>

    <div id="project-detail">
        <div class="close-btn" onclick="closeDetail()">[ <span data-i18n="close">cerrar</span> / esc ]</div>
        <div class="detail-wrapper" id="detail-dynamic-content"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const i18n = {
            es: { selected_works: "trabajos seleccionados", all_projects: "todos los proyectos", contact: "contacto", close: "cerrar", director: "director", prod: "producción", editor_label: "editor" },
            en: { selected_works: "selected works", all_projects: "all projects", contact: "contact", close: "close", director: "director", prod: "production", editor_label: "editor" }
        };

        const projects = [
            { id: 0, title_es: "menem", title_en: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg", "assets/Menem_Thumbnail_3.png", "assets/Menem_Thumbnail_4.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", logo: "assets/prime.png", desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem en los años 90.", desc_en: "Biopic tracing Carlos Menem's rise to power in the 1990s." },
            { id: 1, title_es: "OREO - Sigamos divirtiendonos", title_en: "OREO - Keep on playing", category: "advertising", images: ["assets/Oreo_Thumbnail_5.png", "assets/Oreo_Thumbnail_1.png", "assets/Oreo_Thumbnail_2.png", "assets/Oreo_Thumbnail_3.png", "assets/Oreo_Thumbnail_4.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México", desc_es: "Campaña publicitaria global para Oreo.", desc_en: "Global advertising campaign for Oreo." },
            { id: 2, title_es: "el tiempo de las moscas", title_en: "time of the flies", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg", "assets/Moscas_Thumbnail_2.png", "assets/Moscas_Thumbnail_3.png", "assets/Moscas_Thumbnail_4.png", "assets/Moscas_Thumbnail_5.png"], yt: "A0d6wnlMRRk", director: "Benjamín Naishtat y Ana Katz", prod: "netflix", logo: "assets/netflix.png", desc_es: "Dos mujeres intentan reconstruir sus vidas tras salir de prisión.", desc_en: "Two women attempt to rebuild their lives after being released from prison." },
            { id: 3, title_es: "levis x winona riders", title_en: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg", "assets/Levis_Thumbnail_2.png", "assets/Levis_Thumbnail_3.png", "assets/Levis_Thumbnail_5.png", "assets/Levis_Thumbnail_6.png", "assets/Levis_Thumbnail_7.png"], yt: "mb2RPesGf7Q", director: "Nico Alarcos", prod: "primo", desc_es: "Campaña de gira de Winona Riders.", desc_en: "Winona Riders commercial tour." },
            { id: 4, title_es: "coppola, el representante", title_en: "coppola, the agent", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg", "assets/Coppola_Thumbnail_3.png", "assets/Coppola_Thumbnail_4.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", logo: "assets/disney.png", desc_es: "La historia de Guillermo Coppola.", desc_en: "The story of Guillermo Coppola." },
            { id: 5, title_es: "blair - Todo lo que tengo", title_en: "blair - All I have", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg", "assets/Blair_Thumbnail_2.png", "assets/Blair_Thumbnail_3.png", "assets/Blair_Thumbnail_4.png", "assets/Blair_Thumbnail_5.png"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "Primer adelanto del disco Bar Scorpios (2025)", desc_en: "First preview of the album Bar Scorpios (2025)" },
            { id: 6, title_es: "las manos de la abuela", title_en: "grandmother's hands", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png", "assets/MA_Thumbnail_3.png", "assets/MA_Thumbnail_4.png", "assets/MA_Thumbnail_5.png"], yt: "", director: "camila migliore", prod: "calesita films", desc_es: "Cortometraje sobre la memoria.", desc_en: "Short film about memory." },
            { id: 7, title_es: "ratones paranoicos", title_en: "ratones paranoicos", category: "music video", images: ["assets/RP_Thumbmail_1.png", "assets/RP_Thumbmail_2.png", "assets/RP_Thumbmail_3.png", "assets/RP_Thumbmail_4.png"], yt: "", director: "alex roux", prod: "poster", desc_es: "Pieza para la legendaria banda de rock.", desc_en: "Piece for the legendary rock band." },
            { id: 8, title_es: "besos brujos", title_en: "witch kisses", category: "cortometraje", images: ["assets/BB_Thumbnail_1.png", "assets/BB_Thumbnail_2.png", "assets/BB_Thumbnail_3.png"], yt: "", director: "karina flonembaum", prod: "", desc_es: "Ficción breve onírica.", desc_en: "Short dreamlike fiction." },
            { id: 9, title_es: "las marias", title_en: "las marias", category: "advertising", images: ["assets/Marias_Thumbnail_1.png", "assets/Marias_Thumbnail_2.png", "assets/Marias_Thumbnail_3.png"], yt: "", director: "alejandro berger parrado", prod: "navajo films", desc_es: "Docu-publicidad sobre la tradición yerbatera.", desc_en: "Ad-documentary about yerba mate tradition." },
            { id: 10, title_es: "todo lo que recuerdo", title_en: "all I remember", category: "cortometraje", images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"], yt: "", director: "nicolas fernandez melian", prod: "", desc_es: "Viaje sensorial por la memoria.", desc_en: "Sensory journey through memory." }
        ];

        let currentLang = 'es';
        let activePaneId = 1;
        let currentIdx = 0;
        let previewTimer;
        let galleryIdx = 0;

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            renderLists();
        }

        function renderLists() {
            const featList = document.getElementById('featured-list');
            const indexList = document.getElementById('full-index-list');
            const catNav = document.getElementById('category-nav');
            featList.innerHTML = ''; indexList.innerHTML = ''; catNav.innerHTML = '';

            projects.filter(p => p.yt).forEach((p, idx) => {
                const a = document.createElement('a');
                a.className = "film-item " + (idx === currentIdx ? 'active' : '');
                a.innerText = p[`title_${currentLang}`];
                a.onmouseenter = () => { currentIdx = idx; changeHeroProject(idx); };
                a.onclick = (e) => { e.preventDefault(); openDetail(p.id); };
                featList.appendChild(a);
            });

            const categories = [...new Set(projects.map(p => p.category))];
            categories.forEach(cat => {
                const catId = `cat-${cat.replace(/\s/g, '')}`;
                const cLink = document.createElement('a');
                cLink.className = "cat-link"; cLink.href = `#${catId}`; cLink.innerText = cat;
                catNav.appendChild(cLink);

                const group = document.createElement('div');
                group.className = "category-group";
                group.innerHTML = `<div class="category-separator" id="${catId}">${cat}</div>`;
                projects.filter(p => p.category === cat).forEach(p => {
                    const row = document.createElement('a');
                    row.className = "project-row";
                    row.innerHTML = `
                        <div class="thumb-box"><img src="${p.images[0]}"></div>
                        <div class="info-box">
                            <h3>${p[`title_${currentLang}`]}</h3>
                            <div class="meta-line"><strong>D:</strong> ${p.director}</div>
                            <div class="meta-line"><strong>P:</strong> ${p.prod || '—'}</div>
                        </div>
                        <div class="logos-box">${p.logo ? `<img src="${p.logo}">` : ''}</div>`;
                    row.onclick = (e) => { e.preventDefault(); openDetail(p.id); };
                    group.appendChild(row);
                });
                indexList.appendChild(group);
            });
        }

        function changeHeroProject(idx) {
            clearTimeout(previewTimer);
            const featured = projects.filter(p => p.yt);
            document.querySelectorAll('.film-item').forEach((el, i) => {
                if(i === idx) el.classList.add('active');
                else el.classList.remove('active');
            });

            const nextPaneId = activePaneId === 1 ? 2 : 1;
            const currentPane = document.getElementById(`pane-${activePaneId}`);
            const nextPane = document.getElementById(`pane-${nextPaneId}`);
            const p = featured[idx];
            const playerDivId = `yt-player-${Date.now()}`;
            nextPane.innerHTML = `<div id="${playerDivId}"></div>`;

            new YT.Player(playerDivId, {
                videoId: p.yt,
                playerVars: { autoplay: 1, mute: 1, controls: 0, modestbranding: 1, rel: 0, start: 10, loop: 1, playlist: p.yt },
                events: {
                    onReady: (e) => {
                        nextPane.classList.add('active');
                        currentPane.classList.remove('active');
                        activePaneId = nextPaneId;
                        setTimeout(() => { currentPane.innerHTML = ''; }, 2000);
                        previewTimer = setTimeout(() => {
                            currentIdx = (idx + 1) % featured.length;
                            changeHeroProject(currentIdx);
                        }, 10000);
                    }
                }
            });
        }

        function openDetail(id) {
            clearTimeout(previewTimer);
            const p = projects.find(proj => proj.id === id);
            const detail = document.getElementById('project-detail');
            const container = document.getElementById('detail-dynamic-content');
            galleryIdx = 0;

            let mediaHtml = '';
            if (p.yt) {
                mediaHtml = `<iframe id="modal-iframe" src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0&modestbranding=1" allow="autoplay"></iframe>`;
            } else {
                mediaHtml = `<div class="gallery-container" id="gallery-host">`;
                p.images.forEach((img, i) => {
                    mediaHtml += `<img src="${img}" class="${i === 0 ? 'active' : ''}">`;
                });
                if (p.images.length > 1) {
                    mediaHtml += `
                    <div class="gallery-nav">
                        <div class="gallery-arrow" onclick="moveGallery(-1)">←</div>
                        <div class="gallery-arrow" onclick="moveGallery(1)">→</div>
                    </div>`;
                }
                mediaHtml += `</div>`;
            }

            container.innerHTML = `
                <div class="detail-video-side">${mediaHtml}</div>
                <div class="detail-info-side">
                    <h2>${p[`title_${currentLang}`]}</h2>
                    <div class="detail-meta-group"><strong>${i18n[currentLang].director}</strong><p>${p.director}</p></div>
                    <div class="detail-meta-group"><strong>${i18n[currentLang].prod}</strong><p>${p.prod || '—'}</p></div>
                    <div class="detail-meta-group"><strong>${i18n[currentLang].editor_label}</strong><p>leandro bruno</p></div>
                    <p class="detail-desc">${p[`desc_${currentLang}`]}</p>
                </div>`;
            
            detail.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function moveGallery(step) {
            const imgs = document.querySelectorAll('#gallery-host img');
            if (imgs.length <= 1) return;
            imgs[galleryIdx].classList.remove('active');
            galleryIdx = (galleryIdx + step + imgs.length) % imgs.length;
            imgs[galleryIdx].classList.add('active');
        }

        function closeDetail() {
            const detail = document.getElementById('project-detail');
            const container = document.getElementById('detail-dynamic-content');
            container.innerHTML = '';
            detail.style.display = 'none';
            const isAllVisible = document.getElementById('all-projects-section').style.display === 'block';
            document.body.style.overflowY = isAllVisible ? 'auto' : 'hidden';
            if(!isAllVisible) changeHeroProject(currentIdx);
        }

        function showSection(sec) {
            const home = document.getElementById('home-section');
            const all = document.getElementById('all-projects-section');
            const bg = document.getElementById('bg-container');
            const navAll = document.getElementById('nav-all');

            if(sec === 'all') { 
                clearTimeout(previewTimer);
                home.style.display = 'none'; bg.style.display = 'none'; all.style.display = 'block'; 
                document.body.style.overflowY = 'auto'; navAll.classList.add('active');
            } else { 
                home.style.display = 'flex'; bg.style.display = 'block'; all.style.display = 'none'; 
                document.body.style.overflowY = 'hidden'; navAll.classList.remove('active');
                changeHeroProject(currentIdx);
            }
        }

        document.addEventListener('keydown', (e) => { 
            if (e.key === "Escape") closeDetail();
            if (document.getElementById('project-detail').style.display === 'flex') {
                if (e.key === "ArrowRight") moveGallery(1);
                if (e.key === "ArrowLeft") moveGallery(-1);
            }
        });

        window.onload = () => { renderLists(); setTimeout(() => changeHeroProject(0), 1000); };
    </script>
</body>
</html>
