<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root { 
            --bg: #f5f5f0; /* Tono hueso premium */
            --text: #1a1a1a; 
            --accent: #666;
            --font-main: 'Manrope', sans-serif;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: var(--font-main);
            overflow: hidden; letter-spacing: -0.02em;
        }

        /* Grilla de cruces (+) según referencia */
        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle, #d1d1ca 1px, transparent 1px);
            background-size: 50px 50px; /* Ajuste para que parezcan cruces o puntos técnicos */
            z-index: -1; opacity: 0.5;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 240px 1fr 180px;
            height: 100vh;
            padding: 40px;
            gap: 60px;
        }

        /* LOGO SEGÚN IMAGEN ADJUNTA */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            margin-bottom: 50px;
        }
        .brand-name {
            font-weight: 800;
            font-size: 1.4rem;
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .brand-name span { display: block; }
        .brand-sub {
            font-weight: 200;
            font-size: 1.4rem;
            white-space: nowrap;
            color: var(--text);
            padding-top: 12px;
        }

        /* NAVEGACIÓN */
        .left-panel { display: flex; flex-direction: column; z-index: 10; }
        .nav-links { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .nav-links a, .nav-links div { 
            text-decoration: none; color: var(--text); 
            font-size: 0.85rem; font-weight: 400; 
            cursor: pointer; opacity: 0.6; transition: 0.3s;
        }
        .nav-links a:hover { opacity: 1; }

        .lang-switch { font-size: 0.7rem; font-weight: 700; display: flex; gap: 8px; margin-bottom: 20px; }
        .lang-switch span { cursor: pointer; opacity: 0.3; }
        .lang-switch span.active-lang { opacity: 1; border-bottom: 1px solid var(--text); }

        /* VISOR CENTRAL */
        .center-panel { width: 100%; overflow-y: auto; scrollbar-width: none; }
        .center-panel::-webkit-scrollbar { display: none; }

        .main-viewer {
            width: 100%; aspect-ratio: 16 / 9; background: #e9e9e2;
            position: relative; overflow: hidden;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .main-viewer img { 
            position: absolute; width: 100%; height: 100%; 
            object-fit: cover; transition: opacity 0.8s ease; opacity: 0; 
        }
        .main-viewer img.active-slide { opacity: 1; z-index: 2; }

        .play-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--text); color: #fff; padding: 10px 20px; 
            font-weight: 700; font-size: 0.65rem; z-index: 20; 
            text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
            display: none;
        }
        .main-viewer.has-video:hover .play-indicator { display: block; }

        /* DETALLES PROYECTO - Estilo Cargo Reference */
        .project-details { 
            margin-top: 40px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 40px;
            padding-bottom: 80px;
            transition: opacity 0.4s;
        }
        .project-details.fading { opacity: 0; }
        
        #p-title { 
            font-size: 1.1rem; font-weight: 700; margin: 0; 
            text-transform: capitalize; 
        }
        
        .meta-container { font-size: 0.85rem; line-height: 1.6; }
        .meta-item { margin-bottom: 15px; }
        .meta-item strong { display: block; font-weight: 700; font-style: italic; margin-bottom: 2px; }
        #p-description { color: var(--accent); max-width: 450px; margin-top: 20px; }

        /* PANEL DERECHO - Mini Thumbs */
        .right-panel { display: flex; flex-direction: column; gap: 15px; }
        .thumb-item { 
            width: 100%; aspect-ratio: 16 / 9; 
            background: #e9e9e2; cursor: pointer; 
            overflow: hidden; transition: 0.4s;
            border: 1px solid transparent;
        }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; filter: grayscale(1); transition: 0.4s; }
        .thumb-item:hover img, .thumb-item.active-thumb img { opacity: 1; filter: grayscale(0); }
        .thumb-item.active-thumb { border-color: var(--text); }

        /* ABOUT SECTION */
        #about-section { display: none; gap: 60px; animation: fadeIn 0.6s ease; }
        .profile-pic { width: 300px; filter: grayscale(1); mix-blend-mode: multiply; }
        .about-content { max-width: 500px; }
        .about-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 30px; font-weight: 400; color: #333; }
        .imdb-link { text-decoration: none; color: var(--text); font-weight: 700; font-size: 0.8rem; border: 1px solid var(--text); padding: 10px 20px; display: inline-block; transition: 0.3s; }
        .imdb-link:hover { background: var(--text); color: #fff; }

        /* MODAL */
        .video-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: none; z-index: 1000; justify-content: center; align-items: center; }
        .close-btn { position: fixed; top: 40px; right: 40px; cursor: pointer; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 1000px) {
            .main-layout { grid-template-columns: 1fr; height: auto; padding: 20px; }
            .right-panel { flex-direction: row; overflow-x: auto; padding-bottom: 20px; }
            .thumb-item { min-width: 150px; }
            .project-details { grid-template-columns: 1fr; }
            .brand-container { flex-direction: column; align-items: flex-start; gap: 5px; }
            .brand-sub { padding-top: 0; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>

    <main class="main-layout" id="main-grid">
        <section class="left-panel">
            <div class="brand-container" onclick="showSection('work')">
                <div class="brand-name">
                    <span>Leandro</span>
                    <span>Bruno</span>
                </div>
                <div class="brand-sub">film editor</div>
            </div>
            
            <nav class="nav-links">
                <div class="lang-switch">
                    <span id="btn-es" class="active-lang" onclick="setLanguage('es')">ES</span>
                    <span id="btn-en" onclick="setLanguage('en')">EN</span>
                </div>
                
                <div id="filter-label" style="margin-bottom: 5px; font-weight: 700; opacity: 1;">proyectos / todos</div>
                <a onclick="filterBy('ficción', 'narrative')">/ ficción</a>
                <a onclick="filterBy('advertising', 'advertising')">/ publicidad</a>
                <a onclick="filterBy('music video', 'music_video')">/ videoclips</a>
                <a onclick="filterBy('all', 'all_projects')" style="font-style: italic;">/ ver todos</a>

                <div style="margin-top: 30px;">
                    <a id="nav-bio" onclick="showSection('about')">/ biografía</a><br>
                    <a id="nav-contact" href="mailto:leandrobrunoeditor@gmail.com" style="display: block; margin-top: 10px;">/ contacto</a>
                </div>
            </nav>
        </section>

        <section class="center-panel">
            <div id="work-section">
                <div class="main-viewer" id="viewer" onclick="openVideo()">
                    <div class="play-indicator" id="txt-play">reproducir_contenido</div>
                    <div id="image-container"></div>
                </div>

                <div class="project-details" id="p-details">
                    <div id="p-title">Project Name</div>
                    <div class="meta-container">
                        <div class="meta-item">
                            <strong id="label-dir">Director</strong>
                            <span id="p-director"></span>
                        </div>
                        <div class="meta-item">
                            <strong id="label-prod">Producción</strong>
                            <span id="p-prod"></span>
                        </div>
                        <div id="p-description"></div>
                        <div id="txt-view-btn" style="margin-top: 25px; font-weight: 800; cursor: pointer; font-size: 0.7rem;" onclick="openVideo()">[ Ver ]</div>
                    </div>
                </div>
            </div>

            <div id="about-section">
                <img src="assets/Perfil_LMB.png" class="profile-pic" alt="Leandro Bruno" onerror="this.src='https://via.placeholder.com/400x500'">
                <div class="about-content">
                    <div class="about-text" id="txt-about-body"></div>
                    <a href="https://www.imdb.com/name/nm10600109/" target="_blank" class="imdb-link" id="txt-imdb">IMDB_CREDITS ↗</a>
                    <div style="margin-top: 40px;">
                        <a style="cursor:pointer; font-size: 0.7rem; font-weight: 800;" onclick="showSection('work')" id="txt-back">[ VOLVER ]</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="right-panel" id="thumbnail-list"></section>
    </main>

    <div class="video-modal" id="modal">
        <div class="close-btn" onclick="closeVideo()">[ CERRAR ]</div>
        <div style="width: 85%; aspect-ratio: 16/9;">
            <div id="video-player"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let currentLang = 'es';
        const texts = {
            es: {
                all_projects: "proyectos / todos", narrative: "proyectos / ficción",
                advertising: "proyectos / publicidad", music_video: "proyectos / videoclips",
                bio: "/ biografía", contact: "/ contacto", play: "reproducir",
                close: "[ CERRAR ]", back: "[ VOLVER ]", imdb: "IMDB_CREDITS ↗",
                dir: "Director", prod: "Producción", view: "[ Ver ]",
                about: "Leandro Bruno es un editor de cine y publicidad con base en Buenos Aires. Se especializa en montaje rítmico y narrativa de ficción para plataformas globales como Netflix, Disney+ y Prime Video."
            },
            en: {
                all_projects: "projects / all", narrative: "projects / fiction",
                advertising: "projects / advertising", music_video: "projects / music videos",
                bio: "/ bio", contact: "/ contact", play: "play",
                close: "[ CLOSE ]", back: "[ BACK ]", imdb: "IMDB_CREDITS ↗",
                dir: "Director", prod: "Production", view: "[ View ]",
                about: "Leandro Bruno is a film and advertising editor based in Buenos Aires. He specializes in rhythmic editing and narrative fiction for global platforms such as Netflix, Disney+, and Prime Video."
            }
        };

        const projects = [
            { title: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg", "assets/Menem_Thumbnail_2.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic sobre el ascenso al poder de Carlos Menem en los 90.", desc_en: "Biopic tracing Carlos Menem's rise to power in the 1990s." },
            { title: "oreo", category: "advertising", images: ["https://img.youtube.com/vi/7Cllu0Rme74/maxresdefault.jpg"], yt: "7Cllu0Rme74", director: "primo films", prod: "primo", desc_es: "Campaña global con ritmo visual dinámico.", desc_en: "Global campaign with dynamic visual rhythm." },
            { title: "el tiempo de las moscas", category: "serie", images: ["assets/Moscas_Thumbnail_v01.png"], yt: "A0d6wnlMRRk", director: "ana katz", prod: "netflix", desc_es: "Dos mujeres reconstruyen su vida tras la prisión.", desc_en: "Two women rebuild their lives after prison." },
            { title: "coppola", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", desc_es: "La vida del representante más famoso de Argentina.", desc_en: "The life of Argentina's most famous manager." },
            { title: "blair", category: "music video", images: ["assets/Blair_Thumbnail_v01.jpg"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "Videoclip oficial para la artista Blair.", desc_en: "Official music video for artist Blair." }
        ];

        let filteredProjects = [...projects];
        let currentIndex = 0;
        let slideIndex = 0;
        let rotation, slideRotation, player;

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-switch span').forEach(s => s.classList.remove('active-lang'));
            document.getElementById('btn-' + lang).classList.add('active-lang');
            document.getElementById('nav-bio').innerText = texts[lang].bio;
            document.getElementById('nav-contact').innerText = texts[lang].contact;
            document.getElementById('label-dir').innerText = texts[lang].dir;
            document.getElementById('label-prod').innerText = texts[lang].prod;
            document.getElementById('txt-play').innerText = texts[lang].play;
            document.getElementById('txt-view-btn').innerText = texts[lang].view;
            document.getElementById('txt-about-body').innerText = texts[lang].about;
            document.getElementById('txt-back').innerText = texts[lang].back;
            updateDisplay(true);
        }

        function filterBy(val, key) {
            document.getElementById('filter-label').innerText = texts[currentLang][key];
            if(val === 'all') filteredProjects = [...projects];
            else if(val === 'ficción') filteredProjects = projects.filter(p => p.category === 'serie' || p.category === 'cortometraje');
            else filteredProjects = projects.filter(p => p.category === val);
            currentIndex = 0;
            updateDisplay();
            resetIntervals();
        }

        function updateDisplay(onlyText = false) {
            const current = filteredProjects[currentIndex];
            if(!current) return;

            if(!onlyText) {
                const container = document.getElementById('image-container');
                container.innerHTML = ''; slideIndex = 0;
                current.images.forEach((src, idx) => {
                    const img = document.createElement('img');
                    img.src = src;
                    if(idx === 0) img.classList.add('active-slide');
                    container.appendChild(img);
                });
            }

            document.getElementById('p-title').innerText = current.title;
            document.getElementById('p-director').innerText = current.director;
            document.getElementById('p-prod').innerText = current.prod || "—";
            document.getElementById('p-description').innerText = currentLang === 'es' ? current.desc_es : current.desc_en;
            document.getElementById('viewer').classList.toggle('has-video', current.yt !== "");

            const thumbList = document.getElementById('thumbnail-list');
            thumbList.innerHTML = '';
            filteredProjects.forEach((proj, idx) => {
                const item = document.createElement('div');
                item.className = 'thumb-item' + (idx === currentIndex ? ' active-thumb' : '');
                item.innerHTML = `<img src="${proj.images[0]}">`;
                item.onclick = () => { currentIndex = idx; updateDisplay(); resetIntervals(); };
                thumbList.appendChild(item);
            });
        }

        function resetIntervals() {
            clearInterval(rotation); clearInterval(slideRotation);
            rotation = setInterval(() => { if(filteredProjects.length > 1) { currentIndex = (currentIndex + 1) % filteredProjects.length; updateDisplay(); } }, 8000);
            slideRotation = setInterval(() => {
                const slides = document.querySelectorAll('#image-container img');
                if(slides.length > 1) {
                    slides[slideIndex].classList.remove('active-slide');
                    slideIndex = (slideIndex + 1) % slides.length;
                    slides[slideIndex].classList.add('active-slide');
                }
            }, 3000);
        }

        function showSection(section) {
            document.getElementById('work-section').style.display = section === 'work' ? 'block' : 'none';
            document.getElementById('about-section').style.display = section === 'about' ? 'flex' : 'none';
            document.getElementById('thumbnail-list').style.display = section === 'work' ? 'flex' : 'none';
            if(section === 'work') { resetIntervals(); updateDisplay(); }
        }

        function openVideo() {
            const ytId = filteredProjects[currentIndex].yt;
            if(!ytId) return;
            document.getElementById('modal').style.display = 'flex';
            if(player) player.loadVideoById(ytId);
            else player = new YT.Player('video-player', { videoId: ytId, playerVars: { 'autoplay': 1 } });
        }

        function closeVideo() { document.getElementById('modal').style.display = 'none'; if(player) player.stopVideo(); }

        window.onload = () => { setLanguage('es'); resetIntervals(); };
    </script>
</body>
</html>
