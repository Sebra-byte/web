<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { 
            --bg: #f0f0f0; 
            --text: #1a1a1a; 
            --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); 
            --line-accent: rgba(255, 0, 0, 0.15); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; 
            overflow: hidden; text-transform: lowercase; 
        }

        /* FONDO BLUEPRINT */
        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(var(--line-grid) 1px, transparent 1px), 
                linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        /* LÍNEA GUÍA CENTRAL */
        .guide-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--line-accent); z-index: -1; }

        /* ESTRUCTURA DE LA PÁGINA */
        .main-layout {
            display: grid;
            grid-template-columns: 15% 1fr 15%;
            height: 100vh;
            align-items: center;
            padding: 0 30px;
        }

        /* IZQUIERDA: LOGO */
        .side-left { 
            font-size: 1.1rem; 
            letter-spacing: 1px; 
            line-height: 1.4;
        }
        .side-left span { display: block; font-weight: 700; font-size: 1.3rem; margin-bottom: 5px; }

        /* CENTRO: RECUADRO GRANDE */
        .center-frame {
            grid-column: 2;
            width: 100%;
            max-width: 1100px; /* Recuadro más grande */
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            border: 1px solid #aaa;
            position: relative;
            background: #000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .swiper { width: 100%; height: 100%; }
        .video-wrapper { width: 100%; height: 100%; position: relative; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* DERECHA: NAV + FLECHA */
        .side-right { 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 40%; /* Altura para separar flecha de menú */
            align-items: flex-end;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--gray);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }

        /* FLECHA DE NAVEGACIÓN */
        .swiper-button-next-custom {
            cursor: pointer;
            font-size: 2.5rem;
            color: var(--text);
            transition: 0.3s;
            user-select: none;
        }
        .swiper-button-next-custom:hover { transform: translateX(5px); color: var(--gray); }

        /* INFO ABAJO: NOMBRE PROYECTO + CRÉDITOS */
        .bottom-info {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }
        #p-name {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .credits-box { 
            font-size: 1rem; 
            letter-spacing: 1px; 
            color: var(--gray); 
            line-height: 1.6;
        }
        .credits-box strong { color: var(--text); font-weight: 700; }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; height: auto; padding: 60px 20px; }
            .side-left, .side-right { text-align: center; align-items: center; margin: 30px 0; }
            .nav-links { flex-direction: row; gap: 20px; }
            .bottom-info { position: relative; bottom: 0; margin-top: 40px; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>
    <div class="guide-h"></div>

    <main class="main-layout">
        <div class="side-left">
            <span>leandro bruno</span>
            film editor
        </div>

        <div class="center-frame">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" data-title="menem" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video">
                        <div class="video-wrapper"><div id="player1"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="oreo" data-credits="<strong>p.</strong> primo films">
                        <div class="video-wrapper"><div id="player2"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="el tiempo de las moscas" data-credits="<strong>d.</strong> benjamín naishtat, ana katz | <strong>p.</strong> netflix, zona audiovisual">
                        <div class="video-wrapper"><div id="player3"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="coppola" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> disney, pampa films">
                        <div class="video-wrapper"><div id="player4"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="blair" data-credits="<strong>d.</strong> dana campanello | <strong>p.</strong> poster">
                        <div class="video-wrapper"><div id="player5"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-right">
            <div class="swiper-button-next-custom">→</div>
            <div class="nav-links">
                <a href="index.html" class="active">work</a>
                <a href="about.html">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </div>
        </div>
    </main>

    <div class="bottom-info">
        <div id="p-name">menem</div>
        <div class="credits-box" id="p-credits">
            <strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let players = [];
        const videoIds = ['-2AmqmciWXE', '7Cllu0Rme74', 'A0d6wnlMRRk', 'ecr24akKDbs', 'ItX5aqhqsmo'];

        function onYouTubeIframeAPIReady() {
            videoIds.forEach((id, index) => {
                players[index] = new YT.Player('player' + (index + 1), {
                    videoId: id,
                    playerVars: { 
                        'autoplay': 1, 'mute': 1, 'loop': 1, 'playlist': id, 
                        'controls': 0, 'modestbranding': 1, 'rel': 0, 'enablejsapi': 1
                    },
                    events: { 'onReady': (e) => e.target.playVideo() }
                });
            });
        }

        const swiper = new Swiper(".mySwiper", {
            loop: true,
            speed: 800,
            allowTouchMove: true,
            navigation: {
                nextEl: ".swiper-button-next-custom",
            },
            on: {
                slideChange: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    if(activeSlide) {
                        document.getElementById('p-name').innerText = activeSlide.getAttribute('data-title');
                        document.getElementById('p-credits').innerHTML = activeSlide.getAttribute('data-credits');
                    }
                }
            }
        });

        // Play forzado al interactuar
        document.body.addEventListener('mousedown', () => {
            players.forEach(p => { if(p && p.playVideo) p.playVideo(); });
        }, { once: true });
    </script>
</body>
</html>
