<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grafito: #1a1a1a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
            --transition-smooth: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-grafito);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow-x: hidden;
        }

        /* --- FONDO VIDEO HOME --- */
        .bg-preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: var(--bg-grafito); overflow: hidden;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 2s ease-in-out;
            pointer-events: none;
        }
        .bg-video.active { opacity: 0.35; }
        .bg-video iframe {
            width: 150vw; height: 150vh;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.6);
        }

        /* --- NAVEGACIÓN HOME --- */
        .sidebar-home {
            position: fixed; top: 60px; right: 60px;
            display: flex; flex-direction: column; text-align: right;
            align-items: flex-end; z-index: 5000;
        }
        .brand { margin-bottom: 40px; cursor: pointer; }
        .brand h1 { font-size: 2.6rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.04em; }
        .brand p { font-size: 0.95rem; font-weight: 200; margin-top: 8px; opacity: 0.8; letter-spacing: 0.05em; }

        .side-nav { display: flex; flex-direction: column; gap: 10px; }
        .side-nav a { 
            text-decoration: none; color: var(--hueso); font-size: 1.1rem; 
            font-weight: 500; opacity: 0.5; transition: 0.3s; 
        }
        .side-nav a:hover { opacity: 1; font-style: italic; }

        /* --- MENÚ HAMBURGUESA Y ACORDEÓN --- */
        .nav-all-projects {
            position: fixed; top: 60px; right: 60px;
            z-index: 9999; display: none;
        }
        .menu-toggle {
            width: 30px; height: 18px; display: flex; flex-direction: column;
            justify-content: space-between; cursor: pointer; z-index: 10001; position: relative;
        }
        .menu-toggle span { display: block; width: 100%; height: 2px; background: var(--hueso); transition: 0.4s; }
        .menu-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .menu-toggle.open span:nth-child(2) { opacity: 0; }
        .menu-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        .side-menu-overlay {
            position: fixed; top: 0; right: -400px; width: 350px; height: 100vh;
            background: rgba(20, 20, 20, 0.98); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; padding: 120px 60px;
            transition: var(--transition-smooth); z-index: 10000;
            border-left: 1px solid rgba(255, 255, 228, 0.05);
            text-align: right;
        }
        .side-menu-overlay.active { right: 0; }
        .side-menu-links { display: flex; flex-direction: column; gap: 20px; }
        .side-menu-links a {
            text-decoration: none; color: var(--hueso); font-size: 1.2rem;
            font-weight: 500; opacity: 0.5; transition: 0.3s; cursor: pointer;
        }
        .side-menu-links a:hover { opacity: 1; font-style: italic; }

        /* ACORDEÓN CATEGORÍAS */
        .side-menu-categories { 
            display: none; /* Oculto por defecto */
            flex-direction: column; gap: 12px; 
            padding: 20px 0 30px; 
        }
        .side-menu-categories.open { display: flex; }
        .side-menu-categories a {
            text-decoration: none; color: var(--hueso); font-size: 0.7rem;
            font-weight: 800; text-transform: uppercase; letter-spacing: 0.25em;
            opacity: 0.3; transition: 0.3s;
        }
        .side-menu-categories a:hover { opacity: 1; }

        /* --- SELECTOR IDIOMA --- */
        .lang-switcher {
            position: fixed; bottom: 40px; right: 60px;
            z-index: 5000; display: flex; gap: 15px;
        }
        .lang-btn {
            background: none; border: none; color: var(--hueso);
            font-family: var(--font-main); font-size: 0.8rem; font-weight: 700;
            cursor: pointer; opacity: 0.3; transition: 0.3s;
        }
        .lang-btn.active { opacity: 1; text-decoration: underline; }

        /* --- ALL PROJECTS SECTION (SIN ESPACIOS VACÍOS) --- */
        #all-projects-section {
            display: none; 
            padding: 60px 0 100px; /* Reducido padding superior */
            position: relative; z-index: 100; background: var(--bg-grafito); 
            height: 100vh; overflow-y: auto;
        }
        
        .all-projects-grid {
            max-width: 1400px; /* Más ancho para aprovechar espacio */
            margin: 0 auto; 
            padding: 0 60px;
        }

        .category-group { margin-bottom: 80px; }
        .category-separator { 
            font-size: 0.7rem; font-weight: 800; text-transform: uppercase; 
            letter-spacing: 0.5em; opacity: 0.1; padding-bottom: 15px; 
            border-bottom: 1px solid rgba(255, 255, 228, 0.1); margin-bottom: 20px;
        }
        
        .project-row { 
            display: grid; 
            grid-template-columns: 350px 1.5fr 1fr auto; /* Nueva columna para descripción */
            gap: 40px; 
            padding: 30px 0; 
            border-bottom: 1px solid rgba(255, 255, 228, 0.05); 
            align-items: start; 
            transition: var(--transition-smooth); 
            text-decoration: none; color: inherit;
        }
        .project-row:hover { background: rgba(255, 255, 228, 0.02); }

        .thumb-box { 
            width: 100%; aspect-ratio: 16/9; overflow: hidden; 
            background: #000; border-radius: 2px;
        }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: var(--transition-smooth); }
        .project-row:hover .thumb-box img { opacity: 1; }

        .info-box h3 { 
            font-size: 2.2rem; font-weight: 800; text-transform: uppercase; 
            line-height: 0.9; margin-bottom: 12px; letter-spacing: -0.03em;
        }
        .info-box .meta-line { font-size: 0.8rem; opacity: 0.4; font-weight: 400; margin-bottom: 4px; }
        .info-box .meta-line strong { opacity: 0.7; color: var(--hueso); margin-right: 6px; font-weight: 700; }

        .desc-box { font-size: 0.85rem; opacity: 0.5; line-height: 1.5; font-weight: 300; padding-top: 10px; }

        .logos-box { display: flex; align-items: center; justify-content: flex-end; width: 120px; padding-top: 10px; }
        .logos-box img { 
            max-height: 22px; max-width: 100px; 
            filter: brightness(0) invert(1); object-fit: contain; 
            opacity: 0.15; transition: 0.5s ease;
        }
        .project-row:hover .logos-box img { opacity: 0.8; }

        /* --- MODAL DETALLE --- */
        #project-detail {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.98); z-index: 20000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(30px);
        }
        .detail-wrapper {
            width: 92vw; height: 85vh; display: grid; grid-template-columns: 7.2fr 2.8fr;
            background: #000; position: relative; overflow: hidden;
        }
        .close-btn { 
            position: fixed; top: 40px; right: 60px; font-size: 0.75rem; 
            font-weight: 800; cursor: pointer; z-index: 20100; 
            text-transform: uppercase; color: var(--hueso); opacity: 0.4; letter-spacing: 0.15em;
        }

        .detail-video-side { background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .detail-video-side iframe { width: 100%; height: 100%; border: none; }
        .gallery-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        .gallery-container img { max-width: 90%; max-height: 90%; object-fit: contain; }
        
        .detail-info-side {
            padding: 60px 50px; display: flex; flex-direction: column;
            justify-content: flex-end; border-left: 1px solid rgba(255,255,228,0.08);
            background: #111; overflow-y: auto;
        }
        .detail-info-side h2 { font-size: 2.4rem; font-weight: 800; text-transform: uppercase; line-height: 0.9; margin-bottom: 40px; }
        .detail-meta-group { margin-bottom: 22px; }
        .detail-meta-group strong { display: block; font-size: 0.65rem; opacity: 0.3; text-transform: uppercase; letter-spacing: 0.25em; margin-bottom: 6px; }
        .detail-meta-group p { font-size: 1rem; font-weight: 400; opacity: 0.9; }
        .detail-desc { margin-top: 30px; font-size: 0.85rem; opacity: 0.4; line-height: 1.7; font-weight: 300; }

        /* --- HOME SECTION --- */
        #home-section {
            height: 100vh; width: 100%; display: flex; align-items: center;
            padding-left: 80px; position: relative; z-index: 10;
        }
        .section-label { font-size: 0.75rem; margin-bottom: 25px; font-weight: 700; opacity: 0.3; letter-spacing: 0.15em; text-transform: uppercase; }
        .film-item {
            font-size: 4.8rem; font-weight: 800; text-transform: uppercase;
            line-height: 0.85; letter-spacing: -0.04em; color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2);
            transition: all 0.5s ease; display: block;
            text-decoration: none; margin-bottom: 8px; width: fit-content;
        }
        .film-item.active, .film-item:hover { color: var(--hueso); -webkit-text-stroke: 0px; transform: translateX(25px); }

        @media (max-width: 1200px) {
            .project-row { grid-template-columns: 300px 1fr; }
            .desc-box, .logos-box { display: none; }
        }
        @media (max-width: 800px) {
            .project-row { grid-template-columns: 1fr; }
            .film-item { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="bg-preview-container" id="bg-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <div class="sidebar-home" id="nav-home">
        <div class="brand" onclick="showSection('home')">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav class="side-nav">
            <a href="#" onclick="showSection('all')">/ <span data-i18n="all_projects">todos los proyectos</span></a>
            <a href="mailto:leandrobrunoeditor@gmail.com">/ <span data-i18n="contact">contacto</span></a>
        </nav>
    </div>

    <div class="nav-all-projects" id="nav-all-projects">
        <div class="menu-toggle" id="menu-btn" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
        <nav class="side-menu-overlay" id="side-menu">
            <div class="side-menu-links">
                <a href="#" onclick="showSection('home'); toggleMenu();">/ home</a>
                <a onclick="toggleAccordion()">/ <span data-i18n="all_projects">proyectos</span></a>
                <div class="side-menu-categories" id="menu-categories"></div>
                
                <a href="mailto:leandrobrunoeditor@gmail.com" data-i18n="contact">/ contacto</a>
            </div>
        </nav>
    </div>

    <div class="lang-switcher">
        <button class="lang-btn active" id="btn-es" onclick="setLang('es')">ES</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <section id="home-section">
        <div class="list-container">
            <p class="section-label" data-i18n="selected_works">trabajos seleccionados</p>
            <div id="featured-list"></div>
        </div>
    </section>

    <section id="all-projects-section">
        <div class="all-projects-grid">
            <div class="projects-list-body" id="full-index-list"></div>
        </div>
    </section>

    <div id="project-detail">
        <div class="close-btn" onclick="closeDetail()">[ <span data-i18n="close">cerrar</span> / esc ]</div>
        <div class="detail-wrapper" id="detail-dynamic-content"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const i18n = {
            es: { selected_works: "trabajos seleccionados", all_projects: "todos los proyectos", contact: "contacto", close: "cerrar", director: "director", prod: "producción", editor_label: "editor", episodes: "episodios" },
            en: { selected_works: "selected works", all_projects: "all projects", contact: "contact", close: "close", director: "director", prod: "production", editor_label: "editor", episodes: "episodes" }
        };

        const projects = [
            {
                title_es: "menem", title_en: "menem", category: "serie", episodes: 8,
                images: ["assets/Menem_Thumbnail_1.jpg"],
                yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", logo: "assets/prime.png",
                desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem en los años 90.", 
                desc_en: "Biopic tracing Carlos Menem's rise to power in the 1990s."
            },
            {
                title_es: "OREO - Sigamos divirtiendonos", title_en: "OREO - Keep on playing", category: "advertising",
                images: ["assets/Oreo_Thumbnail_5.png"],
                yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México",
                desc_es: "Campaña publicitaria global para Oreo con alto ritmo visual.", 
                desc_en: "Global advertising campaign for Oreo with high visual pace."
            },
            {
                title_es: "el tiempo de las moscas", title_en: "time of the flies", category: "serie", episodes: 6,
                images: ["assets/Moscas_Thumbnail_1.jpg"],
                yt: "A0d6wnlMRRk", director: "Benjamín Naishtat y Ana Katz", prod: "netflix", logo: "assets/netflix.png",
                desc_es: "Dos mujeres intentan reconstruir sus vidas tras salir de prisión.", 
                desc_en: "Two women attempt to rebuild their lives after prison."
            },
            {
                title_es: "levis x winona riders", title_en: "levis x winona riders", category: "advertising",
                images: ["assets/Levis_Thumbnail_v01.jpg"],
                yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", director: "Nico Alarcos", prod: "primo",
                desc_es: "Campaña de gira de Winona Riders por el norte de Argentina.", 
                desc_en: "Winona Riders commercial tour of northern Argentina."
            },
            {
                title_es: "coppola, el representante", title_en: "coppola, the agent", category: "serie", episodes: 6,
                images: ["assets/Coppola_Thumbnail_2.jpg"],
                yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", logo: "assets/disney.png",
                desc_es: "La historia de Guillermo Coppola, el representante más famoso.", 
                desc_en: "The story of Guillermo Coppola, the most famous manager."
            },
            {
                title_es: "blair - Todo lo que tengo", title_en: "blair - All I have", category: "music video",
                images: ["assets/Blair_Thumbnail_1.jpg"],
                yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster",
                desc_es: "Videoclip oficial del adelanto de Bar Scorpios.", 
                desc_en: "Official music video for Bar Scorpios preview."
            },
            {
                title_es: "las manos de la abuela", title_en: "grandmother's hands", category: "cortometraje",
                images: ["assets/MA_Thumbnail_1.png"],
                yt: "", director: "camila migliore", prod: "calesita films",
                desc_es: "Cortometraje que explora la memoria y el legado familiar.", 
                desc_en: "Short film exploring memory and family legacy."
            },
            {
                title_es: "ratones paranoicos", title_en: "ratones paranoicos", category: "music video",
                images: ["assets/RP_Thumbmail_1.png"],
                yt: "", director: "alex roux", prod: "poster",
                desc_es: "Pieza audiovisual para la legendaria banda de rock.", 
                desc_en: "Audiovisual piece for the legendary rock band."
            }
        ];

        let currentLang = 'es';
        let activePaneId = 1;
        let currentIdx = 0;
        let previewTimer;

        function toggleMenu() {
            document.getElementById('menu-btn').classList.toggle('open');
            document.getElementById('side-menu').classList.toggle('active');
            // Cerrar acordeon al cerrar menu
            document.getElementById('menu-categories').classList.remove('open');
        }

        function toggleAccordion() {
            document.getElementById('menu-categories').classList.toggle('open');
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            renderLists();
        }

        function renderLists() {
            const featList = document.getElementById('featured-list');
            const indexList = document.getElementById('full-index-list');
            const menuCats = document.getElementById('menu-categories');
            featList.innerHTML = ''; indexList.innerHTML = ''; menuCats.innerHTML = '';

            const featured = projects.filter(p => p.yt);
            featured.forEach((p, idx) => {
                const a = document.createElement('a');
                a.className = "film-item " + (idx === currentIdx ? 'active' : '');
                a.innerText = p[`title_${currentLang}`];
                a.onmouseenter = () => { if(idx !== currentIdx) { currentIdx = idx; updateHomeActiveUI(); changeHeroProject(idx); } };
                a.onclick = (e) => { e.preventDefault(); openDetailByTitle(p.title_es); };
                featList.appendChild(a);
            });

            const categories = [...new Set(projects.map(p => p.category))];
            categories.forEach(cat => {
                const catId = `cat-${cat.replace(/\s/g, '')}`;
                const mLink = document.createElement('a');
                mLink.href = `#${catId}`; mLink.innerText = `/ ${cat}`;
                mLink.onclick = () => { showSection('all'); toggleMenu(); };
                menuCats.appendChild(mLink);

                const group = document.createElement('div');
                group.className = "category-group";
                group.innerHTML = `<div class="category-separator" id="${catId}">${cat}</div>`;
                
                projects.filter(p => p.category === cat).forEach(p => {
                    const row = document.createElement('a');
                    row.className = "project-row";
                    row.innerHTML = `
                        <div class="thumb-box"><img src="${p.images[0]}"></div>
                        <div class="info-box">
                            <h3>${p[`title_${currentLang}`]}</h3>
                            <div class="meta-line"><strong>D:</strong> ${p.director}</div>
                            <div class="meta-line"><strong>P:</strong> ${p.prod}</div>
                            ${p.episodes ? `<div class="meta-line"><strong>${i18n[currentLang].episodes}:</strong> ${p.episodes}</div>` : ''}
                        </div>
                        <div class="desc-box">${p[`desc_${currentLang}`]}</div>
                        <div class="logos-box">${p.logo ? `<img src="${p.logo}">` : ''}</div>`;
                    row.onclick = (e) => { e.preventDefault(); openDetailByTitle(p.title_es); };
                    group.appendChild(row);
                });
                indexList.appendChild(group);
            });
        }

        function updateHomeActiveUI() {
            document.querySelectorAll('.film-item').forEach((el, i) => { el.classList.toggle('active', i === currentIdx); });
        }

        function changeHeroProject(idx) {
            clearTimeout(previewTimer);
            const featured = projects.filter(p => p.yt);
            if(featured.length === 0) return;
            const nextPaneId = activePaneId === 1 ? 2 : 1;
            const currentPane = document.getElementById(`pane-${activePaneId}`);
            const nextPane = document.getElementById(`pane-${nextPaneId}`);
            const p = featured[idx];
            const playerDivId = `yt-player-${Date.now()}`;
            nextPane.innerHTML = `<div id="${playerDivId}"></div>`;

            new YT.Player(playerDivId, {
                videoId: p.yt,
                playerVars: { autoplay: 1, mute: 1, controls: 0, modestbranding: 1, rel: 0, start: 10, loop: 1, playlist: p.yt },
                events: {
                    onReady: (e) => {
                        nextPane.classList.add('active');
                        currentPane.classList.remove('active');
                        activePaneId = nextPaneId;
                        setTimeout(() => { currentPane.innerHTML = ''; }, 2000);
                        previewTimer = setTimeout(() => { currentIdx = (currentIdx + 1) % featured.length; updateHomeActiveUI(); changeHeroProject(currentIdx); }, 10000);
                    }
                }
            });
        }

        function openDetailByTitle(title) {
            clearTimeout(previewTimer);
            const p = projects.find(proj => proj.title_es === title);
            const detail = document.getElementById('project-detail');
            const container = document.getElementById('detail-dynamic-content');
            let mediaHtml = p.yt ? `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0" allow="autoplay"></iframe>` : `<div class="gallery-container"><img src="${p.images[0]}"></div>`;
            container.innerHTML = `<div class="detail-video-side">${mediaHtml}</div><div class="detail-info-side"><h2>${p[`title_${currentLang}`]}</h2><div class="detail-meta-group"><strong>${i18n[currentLang].director}</strong><p>${p.director}</p></div><div class="detail-meta-group"><strong>${i18n[currentLang].prod}</strong><p>${p.prod}</p></div><div class="detail-meta-group"><strong>${i18n[currentLang].editor_label}</strong><p>leandro bruno</p></div><p class="detail-desc">${p[`desc_${currentLang}`] || ''}</p></div>`;
            detail.style.display = 'flex'; document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detail-dynamic-content').innerHTML = '';
            document.getElementById('project-detail').style.display = 'none';
            if(document.getElementById('all-projects-section').style.display !== 'block') { document.body.style.overflow = 'hidden'; changeHeroProject(currentIdx); } else { document.body.style.overflowY = 'auto'; }
        }

        function showSection(sec) {
            const home = document.getElementById('home-section'), all = document.getElementById('all-projects-section'), bg = document.getElementById('bg-container'), navHome = document.getElementById('nav-home'), navAll = document.getElementById('nav-all-projects');
            if(sec === 'all') { home.style.display = 'none'; bg.style.display = 'none'; all.style.display = 'block'; navHome.style.display = 'none'; navAll.style.display = 'block'; document.body.style.overflowY = 'auto'; clearTimeout(previewTimer); } 
            else { home.style.display = 'flex'; bg.style.display = 'block'; all.style.display = 'none'; navHome.style.display = 'flex'; navAll.style.display = 'none'; document.body.style.overflowY = 'hidden'; changeHeroProject(currentIdx); }
        }

        document.addEventListener('keydown', (e) => { if (e.key === "Escape") closeDetail(); });
        window.onload = () => { renderLists(); setTimeout(() => changeHeroProject(0), 1000); };
    </script>
</body>
</html>
