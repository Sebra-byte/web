<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { 
            --bg: #f0f0f0; --text: #1a1a1a; --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); --line-accent: rgba(255, 0, 0, 0.15); 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; overflow: hidden; text-transform: lowercase; 
        }

        /* FONDO BLUEPRINT */
        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--line-grid) 1px, transparent 1px), linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }
        .guide-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--line-accent); z-index: -1; }

        /* LAYOUT PRINCIPAL */
        .main-layout {
            display: grid; grid-template-columns: 18% 1fr 18%; height: 100vh; align-items: center; padding: 0 40px;
        }

        .side-left { font-size: 1.2rem; letter-spacing: 1px; line-height: 1.5; z-index: 10; }
        .side-left span { display: block; font-weight: 700; font-size: 1.4rem; margin-bottom: 5px; }

        /* CONTENEDOR CENTRAL */
        .center-frame {
            grid-column: 2; width: 100%; max-width: 1000px; aspect-ratio: 16 / 9; margin: 0 auto;
            position: relative; 
        }

        /* Swiper Vertical con overflow visible para el stack */
        .swiper { width: 100%; height: 100%; overflow: visible !important; }

        .swiper-slide {
            width: 100%; height: 100%;
            background: #000;
            border: 1px solid #aaa;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            transition: filter 0.6s ease;
        }

        /* Slide inactivo: gris y oscuro */
        .swiper-slide-next, .swiper-slide-prev {
            filter: grayscale(1) brightness(0.6);
        }

        .video-wrapper { width: 100%; height: 100%; position: relative; }
        .video-wrapper iframe { 
            width: 100%; height: 112%; border: none; 
            position: absolute; top: -6%; left: 0;
            pointer-events: none; 
        }

        /* NAVEGACIÓN DERECHA */
        .side-right { display: flex; flex-direction: column; justify-content: space-around; height: 60%; align-items: flex-end; z-index: 10; }
        .swiper-button-next-custom { cursor: pointer; font-size: 3rem; color: var(--text); transition: 0.3s; margin-bottom: 50px; }
        /* Flecha apuntando hacia abajo para indicar swiper vertical */
        .swiper-button-next-custom { transform: rotate(90deg); }
        .swiper-button-next-custom:hover { transform: rotate(90deg) translateX(5px); }

        .nav-links { display: flex; flex-direction: column; gap: 15px; align-items: flex-end; }
        .nav-links a { text-decoration: none; color: var(--gray); font-size: 1.1rem; font-weight: 700; letter-spacing: 2px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }

        /* INFO INFERIOR */
        .bottom-info { 
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); 
            text-align: center; width: 100%; z-index: 10;
        }
        #p-name { font-size: 1.6rem; font-weight: 700; letter-spacing: 5px; margin-bottom: 5px; }
        #p-credits { font-size: 1rem; color: var(--gray); }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>
    <div class="guide-h"></div>

    <main class="main-layout">
        <div class="side-left">
            <span>leandro bruno</span>
            film editor
        </div>

        <div class="center-frame">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    
                    <div class="swiper-slide" data-title="menem" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, prime video">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/-2AmqmciWXE?autoplay=1&mute=1&loop=1&playlist=-2AmqmciWXE&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                        </div>
                    </div>

                    <div class="swiper-slide" data-title="oreo" data-credits="<strong>p.</strong> primo films">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/7Cllu0Rme74?autoplay=1&mute=1&loop=1&playlist=7Cllu0Rme74&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                        </div>
                    </div>

                    <div class="swiper-slide" data-title="coppola" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> pampa films">
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/ecr24akKDbs?autoplay=1&mute=1&loop=1&playlist=ecr24akKDbs&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="side-right">
            <div class="swiper-button-next-custom">→</div>
            <div class="nav-links">
                <a href="#" class="active">work</a>
                <a href="#">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </div>
        </div>
    </main>

    <div class="bottom-info">
        <div id="p-name">menem</div>
        <div id="p-credits"><strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, prime video</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper(".mySwiper", {
            direction: 'vertical', // CAMBIO A DIRECCIÓN VERTICAL
            loop: true,
            speed: 1000,
            grabCursor: true,
            effect: 'creative',
            creativeEffect: {
                prev: {
                    shadow: true,
                    translate: [0, "120%", -500], // Se va hacia abajo
                },
                next: {
                    // EL STACK ARRIBA: centrado horizontalmente (0) y desplazado hacia arriba (-20%)
                    translate: [0, "-20%", -250], 
                    rotate: [0, 0, 0],
                    opacity: 0.5,
                    scale: 0.85,
                },
            },
            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
            },
            navigation: {
                nextEl: ".swiper-button-next-custom",
            },
            on: {
                slideChange: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    if(activeSlide) {
                        document.getElementById('p-name').innerText = activeSlide.getAttribute('data-title');
                        document.getElementById('p-credits').innerHTML = activeSlide.getAttribute('data-credits');
                    }
                }
            }
        });
    </script>
</body>
</html>
