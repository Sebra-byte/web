<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --bg: #000; --text: #fff; --gray: #555; --line: #1a1a1a; --accent: #333; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; overflow: hidden; text-transform: lowercase; }

        /* FONDO ESTRUCTURAL (GRID) */
        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 60px 60px; z-index: -1;
        }

        /* LAYOUT PRINCIPAL */
        .main-layout {
            display: grid;
            grid-template-columns: 12% 1fr 12%;
            grid-template-rows: 1fr auto 1fr;
            height: 100vh;
            align-items: center;
        }

        /* LOGO (CENTRO IZQUIERDA) */
        .side-left { grid-column: 1; grid-row: 2; text-align: center; transform: rotate(-90deg); }
        .side-left img { height: 22px; opacity: 0.8; }

        /* NOMBRE PROYECTO (CENTRO DERECHA) */
        .side-right { grid-column: 3; grid-row: 2; text-align: center; transform: rotate(90deg); white-space: nowrap; }
        .project-title { font-size: 0.75rem; letter-spacing: 6px; color: var(--text); font-weight: 200; transition: opacity 0.5s; }

        /* CARRUSEL CENTRADO */
        .center-frame {
            grid-column: 2; grid-row: 2;
            width: 100%; max-width: 960px;
            aspect-ratio: 16 / 9;
            border: 1px solid var(--accent);
            position: relative;
            background: #000;
            margin: 0 auto;
            overflow: hidden;
        }

        /* EFECTO DE ESCANEO AL CAMBIAR SLIDE */
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
            z-index: 10; pointer-events: none; opacity: 0;
        }
        .scanning { animation: scan 0.8s ease-in-out; }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 0.5; }
            100% { top: 100%; opacity: 0; }
        }

        .swiper { width: 100%; height: 100%; }
        .video-wrapper { width: 100%; height: 100%; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; filter: brightness(0.9); }

        /* INFORMACIÓN (ABAJO CENTRO) */
        .bottom-info {
            grid-column: 2; grid-row: 3;
            text-align: center;
            align-self: start;
            padding-top: 50px;
        }
        .credits-box { font-size: 0.6rem; letter-spacing: 2.5px; color: var(--gray); line-height: 2; transition: opacity 0.5s; }
        .credits-box strong { color: #888; font-weight: 400; margin-right: 4px; }

        /* NAVEGACIÓN SUPERIOR */
        nav {
            position: fixed; top: 50px; width: 100%;
            display: flex; justify-content: center; gap: 50px;
            z-index: 100;
        }
        nav a { text-decoration: none; color: var(--gray); font-size: 0.65rem; letter-spacing: 4px; transition: 0.4s; }
        nav a:hover, nav a.active { color: #fff; }

        /* LÍNEAS DE REFERENCIA TÉCNICA */
        .guide-h { position: absolute; width: 100%; height: 1px; background: var(--line); top: 50%; z-index: -1; }
        .guide-v { position: absolute; height: 100%; width: 1px; background: var(--line); left: 50%; z-index: -1; }

        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto auto; padding: 20px; }
            .side-left, .side-right { transform: none; grid-column: 1; margin: 30px 0; }
            .center-frame { grid-column: 1; grid-row: 2; width: 100%; }
            .bottom-info { grid-column: 1; grid-row: 4; }
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>
    <div class="guide-h"></div>
    <div class="guide-v"></div>

    <nav>
        <a href="index.html" class="active">work</a>
        <a href="about.html">about</a>
        <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
    </nav>

    <main class="main-layout">
        <div class="side-left">
            <a href="index.html"><img src="assets/LOGO_Manrope_v01.png" alt="leandro bruno"></a>
        </div>

        <div class="center-frame">
            <div class="scan-line" id="scanner"></div>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" data-title="menem" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video">
                        <div class="video-wrapper"><div id="player1"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="oreo" data-credits="<strong>p.</strong> primo">
                        <div class="video-wrapper"><div id="player2"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="el tiempo de las moscas" data-credits="<strong>d.</strong> benjamín naishtat, ana katz | <strong>p.</strong> netflix, zona audiovisual">
                        <div class="video-wrapper"><div id="player3"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="coppola" data-credits="<strong>d.</strong> ariel winograd | <strong>p.</strong> disney, pampa films">
                        <div class="video-wrapper"><div id="player4"></div></div>
                    </div>
                    <div class="swiper-slide" data-title="blair" data-credits="<strong>d.</strong> dana campanello | <strong>p.</strong> poster">
                        <div class="video-wrapper"><div id="player5"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="side-right">
            <div class="project-title" id="p-name">menem</div>
        </div>

        <div class="bottom-info">
            <div class="credits-box" id="p-credits">
                <strong>d.</strong> ariel winograd | <strong>p.</strong> claxon, yavu, prime video
            </div>
        </div>
    </main>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let players = [];
        const videoIds = ['-2AmqmciWXE', '7Cllu0Rme74', 'A0d6wnlMRRk', 'ecr24akKDbs', 'ItX5aqhqsmo'];

        function onYouTubeIframeAPIReady() {
            videoIds.forEach((id, index) => {
                players[index] = new YT.Player('player' + (index + 1), {
                    videoId: id,
                    playerVars: { 'autoplay': 1, 'mute': 1, 'loop': 1, 'playlist': id, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
                    events: { 'onReady': (e) => e.target.playVideo() }
                });
            });
        }

        const swiper = new Swiper(".mySwiper", {
            loop: true,
            speed: 1200,
            effect: "fade",
            fadeEffect: { crossFade: true },
            autoplay: { delay: 6000, disableOnInteraction: false },
            on: {
                slideChangeTransitionStart: function () {
                    // Trigger Scan Line
                    const scanner = document.getElementById('scanner');
                    scanner.classList.remove('scanning');
                    void scanner.offsetWidth; // Reset animation
                    scanner.classList.add('scanning');

                    // Fade out texts
                    document.getElementById('p-name').style.opacity = 0;
                    document.getElementById('p-credits').style.opacity = 0;
                },
                slideChangeTransitionEnd: function () {
                    const activeSlide = this.slides[this.activeIndex];
                    
                    // Update texts
                    document.getElementById('p-name').innerText = activeSlide.getAttribute('data-title');
                    document.getElementById('p-credits').innerHTML = activeSlide.getAttribute('data-credits');
                    
                    // Fade in texts
                    document.getElementById('p-name').style.opacity = 1;
                    document.getElementById('p-credits').style.opacity = 1;
                }
            }
        });
    </script>
</body>
</html>
