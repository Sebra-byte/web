<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grafito: #1a1a1a;
            --bg-grafito-claro: #2a2a2a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg-grafito);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 40px 50px;
            z-index: 5000;
            mix-blend-mode: difference;
        }

        .brand h1 { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.03em; cursor: pointer; }
        .brand p { font-size: 0.85rem; font-weight: 300; margin-top: 5px; opacity: 0.8; }

        nav ul { list-style: none; text-align: right; display: flex; gap: 30px; }
        nav ul li a { text-decoration: none; color: var(--hueso); font-size: 1rem; font-weight: 500; opacity: 0.6; transition: 0.3s; }
        nav ul li a:hover, .active-nav { opacity: 1; }

        /* --- FONDO VIDEO (HOME) --- */
        .bg-preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: var(--bg-grafito); overflow: hidden;
        }
        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .bg-video.active { opacity: 0.35; }
        .bg-video iframe {
            width: 150vw; height: 150vh;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            pointer-events: none;
        }

        /* --- HOME SECTION --- */
        #home-section {
            height: 100vh; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; padding-left: 50px;
            position: relative; z-index: 10;
        }
        .list-container p { 
            font-size: 0.8rem; margin-bottom: 25px; font-weight: 700; 
            opacity: 0.4; letter-spacing: 0.1em; text-transform: uppercase;
        }
        .film-item {
            font-size: 4.5rem; font-weight: 800; text-transform: uppercase;
            line-height: 0.85; letter-spacing: -0.04em; color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2);
            transition: all 0.4s ease; display: block;
            text-decoration: none; margin-bottom: 2px; width: fit-content;
        }
        .film-item.active, .film-item:hover {
            color: var(--hueso); -webkit-text-stroke: 0px; transform: translateX(15px);
        }

        /* --- ALL PROJECTS SECTION --- */
        #all-projects-section {
            display: none;
            padding: 150px 50px 100px;
            position: relative;
            z-index: 100;
            background: var(--bg-grafito);
            min-height: 100vh;
        }

        .category-separator {
            font-size: 0.85rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.25em; color: var(--hueso); opacity: 0.3;
            padding: 70px 0 25px; border-bottom: 1px solid rgba(255, 255, 228, 0.1);
            margin-bottom: 20px;
        }

        .project-row {
            display: grid; grid-template-columns: 450px 1fr 250px;
            gap: 60px; padding: 50px 20px;
            border-bottom: 1px solid rgba(255, 255, 228, 0.05);
            align-items: center; transition: 0.3s;
            text-decoration: none; color: inherit;
        }
        .project-row:hover, .project-row.selected { background-color: var(--bg-grafito-claro); }

        .project-row .thumb-box { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: #000; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .project-row .thumb-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.6s; }
        .project-row:hover .thumb-box img { transform: scale(1.05); }

        .project-row .info-box h3 { font-size: 2.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; line-height: 0.95; }
        .series-specs { display: inline-block; margin-left: 10px; font-size: 0.75rem; padding: 2px 8px; border: 1px solid rgba(255, 255, 228, 0.3); border-radius: 4px; vertical-align: middle; opacity: 0.8; text-transform: uppercase; }

        .project-row .logos-box img { max-height: 50px; max-width: 130px; filter: brightness(0) invert(1); opacity: 0.9; }

        /* --- MODAL DETALLE --- */
        #project-detail {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-grafito); z-index: 6000;
            display: none; flex-direction: column;
            padding: 100px 50px 50px; overflow-y: auto;
        }
        .close-btn { position: fixed; top: 40px; right: 50px; font-size: 0.8rem; font-weight: 800; color: var(--hueso); cursor: pointer; z-index: 6100; text-transform: uppercase; }

        .detail-video-box { width: 100%; aspect-ratio: 21/9; background: #000; margin-bottom: 40px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .detail-video-box img { width: 100%; height: 100%; object-fit: cover; }

        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); font-size: 3rem; color: var(--hueso); background: rgba(0,0,0,0.2); padding: 30px; cursor: pointer; z-index: 10; transition: 0.3s; user-select: none; }
        .nav-arrow:hover { background: rgba(0,0,0,0.7); }
        .arrow-left { left: 0; }
        .arrow-right { right: 0; }

        .detail-thumbnails { display: flex; gap: 15px; margin-bottom: 40px; overflow-x: auto; padding: 10px 0; }
        .mini-thumb { width: 140px; aspect-ratio: 16/9; opacity: 0.4; cursor: pointer; transition: 0.3s; border: 2px solid transparent; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .mini-thumb.active { opacity: 1; border-color: var(--hueso); transform: translateY(-5px); }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; padding-bottom: 100px; }
        .detail-grid h2 { font-size: 4rem; font-weight: 800; text-transform: uppercase; line-height: 0.85; }

        @media (max-width: 900px) {
            .project-row { grid-template-columns: 1fr; gap: 20px; }
            .project-row .info-box h3 { font-size: 2rem; }
            .detail-grid { grid-template-columns: 1fr; gap: 30px; }
            .detail-grid h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="showSection('home')">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <ul>
                <li><a href="#" id="nav-all" onclick="showSection('all')">/ all projects</a></li>
                <li><a href="mailto:leandrobrunoeditor@gmail.com">/ contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="bg-preview-container" id="bg-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <section id="home-section">
        <div class="list-container">
            <p>selected works</p>
            <div id="featured-list"></div>
        </div>
    </section>

    <section id="all-projects-section">
        <div class="projects-list" id="full-index-list"></div>
    </section>

    <div id="project-detail">
        <div class="close-btn" onclick="closeDetail()">[ close / esc ]</div>
        <div id="detail-dynamic-content"></div>
    </div>

    <script>
        const projects = [
            { id: 0, title_es: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", platform: "https://upload.wikimedia.org/wikipedia/commons/f/f1/Prime_Video.png", specs: "6 episodios" },
            { id: 1, title_es: "el tiempo de las moscas", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg"], yt: "A0d6wnlMRRk", director: "Benjamín Naishtat y Ana Katz", prod: "netflix", platform: "https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg", specs: "6 episodios" },
            { id: 2, title_es: "coppola, el representante", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", platform: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg", specs: "6 episodios" },
            { id: 3, title_es: "OREO - Sigamos divirtiendonos", category: "advertising", images: ["assets/Oreo_Thumbnail_5.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México", platform: "" },
            { id: 4, title_es: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "mb2RPesGf7Q", director: "Nico Alarcos", prod: "primo", platform: "" },
            { id: 5, title_es: "las marias", category: "advertising", images: ["assets/Marias_Thumbnail_1.png"], yt: "", director: "alejandro berger parrado", prod: "navajo films", platform: "" },
            { id: 6, title_es: "blair - Todo lo que tengo", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", platform: "" },
            { id: 7, title_es: "ratones paranoicos", category: "music video", images: ["assets/RP_Thumbmail_1.png"], yt: "", director: "alex roux", prod: "poster", platform: "" },
            { id: 8, title_es: "las manos de la abuela", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png", "assets/MA_Thumbnail_2.png", "assets/MA_Thumbnail_3.png"], yt: "", director: "camila migliore", prod: "calesita films", platform: "" },
            { id: 9, title_es: "besos brujos", category: "cortometraje", images: ["assets/BB_Thumbnail_1.png", "assets/BB_Thumbnail_2.png"], yt: "", director: "karina flonembaum", prod: "calesita films", platform: "" },
            { id: 10, title_es: "todo lo que recuerdo", category: "cortometraje", images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"], yt: "", director: "nicolas fernandez melian", prod: "u n m a", platform: "" }
        ];

        let currentIdx = 0;
        let listSelectionIdx = 0;
        let activePane = 1;
        let isHovering = false;
        let rotationTimer;
        let currentGalleryIdx = 0;

        function init() {
            const featList = document.getElementById('featured-list');
            const indexList = document.getElementById('full-index-list');

            // 1. Home (Solo los que tienen YT)
            projects.filter(p => p.yt).slice(0, 6).forEach((p, idx) => {
                const a = document.createElement('a');
                a.className = "film-item";
                a.innerText = p.title_es;
                a.onmouseenter = () => { isHovering = true; changeHeroProject(idx); };
                a.onmouseleave = () => { isHovering = false; };
                a.onclick = (e) => { e.preventDefault(); openDetail(p.id); };
                featList.appendChild(a);
            });

            // 2. All Projects por categorías
            const categories = [...new Set(projects.map(p => p.category))];
            categories.forEach(cat => {
                const sep = document.createElement('div');
                sep.className = "category-separator";
                sep.innerText = cat;
                indexList.appendChild(sep);

                projects.filter(p => p.category === cat).forEach(p => {
                    const row = document.createElement('a');
                    row.href = "#";
                    row.className = "project-row";
                    row.id = `row-${p.id}`;
                    row.innerHTML = `
                        <div class="thumb-box"><img src="${p.images[0]}" alt="${p.title_es}"></div>
                        <div class="info-box">
                            <h3>${p.title_es} ${p.specs ? `<span class="series-specs">${p.specs}</span>` : ''}</h3>
                            <p><strong>Director:</strong> ${p.director}</p>
                            <p><strong>Production:</strong> ${p.prod}</p>
                        </div>
                        <div class="logos-box">${p.platform ? `<img src="${p.platform}">` : ''}</div>
                    `;
                    row.onclick = (e) => { e.preventDefault(); openDetail(p.id); };
                    indexList.appendChild(row);
                });
            });

            changeHeroProject(0);
            startRotation();
        }

        function openDetail(id) {
            const p = projects.find(proj => proj.id === id);
            listSelectionIdx = id;
            updateListSelection();
            
            const detail = document.getElementById('project-detail');
            detail.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            renderDetailContent(p);
        }

        function renderDetailContent(p) {
            currentGalleryIdx = 0;
            const container = document.getElementById('detail-dynamic-content');
            
            let mediaHtml = '';
            if(p.yt) {
                mediaHtml = `<div class="detail-video-box"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/${p.yt}?autoplay=1&rel=0" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
            } else {
                mediaHtml = `
                    <div class="detail-video-box">
                        ${p.images.length > 1 ? `<div class="nav-arrow arrow-left" onclick="changeImage(-1, ${p.id})">‹</div>` : ''}
                        <img id="gallery-main" src="${p.images[0]}">
                        ${p.images.length > 1 ? `<div class="nav-arrow arrow-right" onclick="changeImage(1, ${p.id})">›</div>` : ''}
                    </div>
                    ${p.images.length > 1 ? `
                    <div class="detail-thumbnails">
                        ${p.images.map((img, i) => `<img src="${img}" class="mini-thumb ${i===0?'active':''}" onclick="setGalleryImage(${i}, ${p.id})">`).join('')}
                    </div>` : ''}`;
            }

            container.innerHTML = `
                ${mediaHtml}
                <div class="detail-grid">
                    <div><h2>${p.title_es}</h2><p style="opacity:0.4; margin-top:10px; font-weight:800; text-transform:uppercase;">${p.category} ${p.specs ? ` — ${p.specs}` : ''}</p></div>
                    <div style="font-size:1.1rem; line-height:1.6; opacity:0.8; text-transform:none;">
                        <p><strong>director:</strong> ${p.director}</p>
                        <p><strong>production:</strong> ${p.prod}</p>
                        <p><strong>editor:</strong> leandro bruno</p>
                    </div>
                </div>
            `;
        }

        function changeImage(dir, pId) {
            const p = projects.find(proj => proj.id === pId);
            currentGalleryIdx = (currentGalleryIdx + dir + p.images.length) % p.images.length;
            setGalleryImage(currentGalleryIdx, pId);
        }

        function setGalleryImage(idx, pId) {
            currentGalleryIdx = idx;
            const p = projects.find(proj => proj.id === pId);
            const mainImg = document.getElementById('gallery-main');
            if(mainImg) mainImg.src = p.images[idx];
            document.querySelectorAll('.mini-thumb').forEach((m, i) => m.classList.toggle('active', i === idx));
        }

        function closeDetail() {
            document.getElementById('project-detail').style.display = 'none';
            document.getElementById('detail-dynamic-content').innerHTML = '';
            document.body.style.overflowY = document.getElementById('all-projects-section').style.display === 'block' ? 'auto' : 'hidden';
        }

        function updateListSelection() {
            document.querySelectorAll('.project-row').forEach(r => r.classList.remove('selected'));
            const activeRow = document.getElementById(`row-${listSelectionIdx}`);
            if(activeRow) {
                activeRow.classList.add('selected');
                if(document.getElementById('all-projects-section').style.display === 'block') {
                    activeRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // --- CONTROLES TECLADO ---
        document.addEventListener('keydown', (e) => {
            const isDetailOpen = document.getElementById('project-detail').style.display === 'flex';
            
            if (e.key === "Escape") closeDetail();
            
            if (isDetailOpen) {
                const p = projects.find(proj => proj.id === listSelectionIdx);
                if(!p.yt && p.images.length > 1) {
                    if (e.key === "ArrowRight") changeImage(1, p.id);
                    if (e.key === "ArrowLeft") changeImage(-1, p.id);
                }
            } else if (document.getElementById('all-projects-section').style.display === 'block') {
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    listSelectionIdx = (listSelectionIdx + 1) % projects.length;
                    updateListSelection();
                }
                if (e.key === "ArrowUp") {
                    e.preventDefault();
                    listSelectionIdx = (listSelectionIdx - 1 + projects.length) % projects.length;
                    updateListSelection();
                }
                if (e.key === "Enter") openDetail(listSelectionIdx);
            }
        });

        // --- LÓGICA HOME ---
        function changeHeroProject(idx) {
            const featuredOnes = projects.filter(p => p.yt);
            const items = document.querySelectorAll('.film-item');
            items.forEach(item => item.classList.remove('active'));
            if(items[idx]) items[idx].classList.add('active');

            const nextPaneIdx = activePane === 1 ? 2 : 1;
            const currentPane = document.getElementById(`pane-${activePane}`);
            const nextPane = document.getElementById(`pane-${nextPaneIdx}`);

            const p = featuredOnes[idx];
            if(p) {
                nextPane.innerHTML = `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${p.yt}&modestbranding=1" frameborder="0"></iframe>`;
                setTimeout(() => {
                    nextPane.classList.add('active');
                    currentPane.classList.remove('active');
                    activePane = nextPaneIdx;
                    setTimeout(() => { currentPane.innerHTML = ''; }, 1500);
                }, 500);
            }
            currentIdx = idx;
        }

        function startRotation() {
            rotationTimer = setInterval(() => {
                if (!isHovering) {
                    const featuredOnes = projects.filter(p => p.yt);
                    currentIdx = (currentIdx + 1) % featuredOnes.length;
                    changeHeroProject(currentIdx);
                }
            }, 6000);
        }

        function showSection(sec) {
            const home = document.getElementById('home-section');
            const all = document.getElementById('all-projects-section');
            const bg = document.getElementById('bg-container');
            if(sec === 'all') {
                home.style.display = 'none'; bg.style.display = 'none';
                all.style.display = 'block'; document.body.style.overflowY = 'auto';
                updateListSelection();
            } else {
                home.style.display = 'flex'; bg.style.display = 'block';
                all.style.display = 'none'; document.body.style.overflowY = 'hidden';
            }
            document.getElementById('nav-all').classList.toggle('active-nav', sec === 'all');
        }

        window.onload = init;
    </script>
</body>
</html>
