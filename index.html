<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leandro Bruno | film editor</title>
    <link rel="icon" type="image/png" href="assets/favicom_250120.png">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --hueso: #FFFFE4;
            --font-main: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg);
            color: var(--hueso);
            font-family: var(--font-main);
            text-transform: lowercase;
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 40px 50px;
            z-index: 5000;
            mix-blend-mode: difference;
        }

        .brand h1 { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; line-height: 0.8; letter-spacing: -0.03em; cursor: pointer; }
        .brand p { font-size: 0.8rem; font-weight: 300; margin-top: 5px; opacity: 0.8; }

        nav ul { list-style: none; text-align: right; display: flex; gap: 20px; }
        nav ul li a { text-decoration: none; color: var(--hueso); font-size: 0.8rem; font-weight: 500; opacity: 0.6; transition: 0.3s; }
        nav ul li a:hover, .active-nav { opacity: 1; }

        /* --- CONTENEDORES DE VIDEO (CROSSFADE) --- */
        .bg-preview-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; background: var(--bg); overflow: hidden;
        }

        .bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.5s ease-in-out;
        }

        .bg-video.active { opacity: 0.35; }

        .bg-video iframe {
            width: 150vw; height: 150vh;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            pointer-events: none;
        }

        /* --- SECCIÓN HOME (LISTADO IZQUIERDA) --- */
        #home-section {
            height: 100vh; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; padding-left: 50px;
            position: relative; z-index: 10;
        }

        .list-container p { 
            font-size: 0.75rem; margin-bottom: 20px; font-weight: 700; 
            opacity: 0.4; letter-spacing: 0.1em; text-transform: uppercase;
        }

        .film-item {
            font-size: 4rem; font-weight: 800; text-transform: uppercase;
            line-height: 0.85; letter-spacing: -0.04em; color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 228, 0.2);
            transition: all 0.4s ease; display: block;
            text-decoration: none; margin-bottom: 2px; width: fit-content;
        }

        .film-item.active, .film-item:hover {
            color: var(--hueso); -webkit-text-stroke: 0px; transform: translateX(15px);
        }

        /* --- SECCIÓN ALL PROJECTS (GRID) --- */
        #all-projects-section {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 4000;
            display: none; flex-direction: column;
            padding: 120px 50px 50px; overflow-y: auto;
        }

        .project-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 40px; margin-top: 40px;
        }

        .grid-card { cursor: pointer; margin-bottom: 40px; }
        .grid-thumb { width: 100%; aspect-ratio: 16/9; background: #111; overflow: hidden; margin-bottom: 15px; }
        .grid-thumb img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .grid-card:hover img { transform: scale(1.05); }

        /* --- VISTA DETALLE --- */
        #project-detail {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 6000;
            display: none; flex-direction: column;
            padding: 100px 50px 50px; overflow-y: auto;
        }

        .close-btn {
            position: fixed; top: 40px; right: 50px;
            font-size: 0.75rem; font-weight: 800; color: var(--hueso);
            cursor: pointer; z-index: 6100; text-transform: uppercase;
        }

        .detail-video-box { width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 50px; }
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; padding-bottom: 100px; }
        .detail-grid h2 { font-size: 3.5rem; font-weight: 800; text-transform: uppercase; line-height: 0.85; }
        .detail-meta { font-size: 0.9rem; line-height: 1.6; color: rgba(255, 255, 228, 0.7); }
        .detail-meta strong { display: block; color: var(--hueso); text-transform: uppercase; font-size: 0.7rem; font-weight: 800; margin-top: 20px; }

        @media (max-width: 900px) {
            .project-grid { grid-template-columns: 1fr; }
            .detail-grid { grid-template-columns: 1fr; gap: 40px; }
            .film-item { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="showSection('home')">
            <h1>Leandro Bruno</h1>
            <p>film editor</p>
        </div>
        <nav>
            <ul>
                <li><a href="#" id="nav-all" onclick="showSection('all')">/ all projects</a></li>
                <li><a href="mailto:leandrobrunoeditor@gmail.com">/ contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="bg-preview-container">
        <div id="pane-1" class="bg-video"></div>
        <div id="pane-2" class="bg-video"></div>
    </div>

    <section id="home-section">
        <div class="list-container">
            <p>selected works</p>
            <div id="featured-list"></div>
        </div>
    </section>

    <section id="all-projects-section">
        <div class="list-container">
            <p>index / all projects</p>
            <div class="project-grid" id="grid-container"></div>
        </div>
    </section>

    <section id="project-detail">
        <div class="close-btn" onclick="closeDetail()">[ close ]</div>
        <div id="detail-dynamic-content"></div>
    </section>

    <script>
        const projects = [
            { title_es: "menem", category: "serie", images: ["assets/Menem_Thumbnail_1.jpg"], yt: "-2AmqmciWXE", director: "ariel winograd", prod: "claxon / prime video", desc_es: "Biopic que recorre el ascenso al poder de Carlos Menem en los años 90." },
            { title_es: "OREO - Sigamos divirtiendonos", category: "advertising", images: ["assets/Oreo_Thumbnail_5.png"], yt: "7Cllu0Rme74", director: "Martín Jalfen", prod: "Pop Studios - México", desc_es: "Campaña publicitaria global para Oreo, destacando dinamismo y ritmo visual." },
            { title_es: "el tiempo de las moscas", category: "serie", images: ["assets/Moscas_Thumbnail_1.jpg"], yt: "A0d6wnlMRRk", director: "Benjamín Naishtat y Ana Katz", prod: "netflix", desc_es: "Dos mujeres intentan reconstruir sus vidas tras salir de prisión." },
            { title_es: "levis x winona riders", category: "advertising", images: ["assets/Levis_Thumbnail_v01.jpg"], yt: "1eE588vXvqSECtESSjgwN_vpRmMFaUpRg", director: "Nico Alarcos", prod: "primo", desc_es: "Campaña de gira de Winona Riders por el norte de Argentina." },
            { title_es: "coppola, el representante", category: "serie", images: ["assets/Coppola_Thumbnail_2.jpg"], yt: "ecr24akKDbs", director: "ariel winograd", prod: "pampa films / disney+", desc_es: "La historia de Guillermo Coppola, el representante más famoso de Argentina." },
            { title_es: "blair - Todo lo que tengo", category: "music video", images: ["assets/Blair_Thumbnail_1.jpg"], yt: "ItX5aqhqsmo", director: "dana campanello", prod: "poster", desc_es: "Primer adelanto del disco Bar Scorpios (2025)" },
            { title_es: "las manos de la abuela", category: "cortometraje", images: ["assets/MA_Thumbnail_1.png"], yt: "", director: "camila migliore", prod: "calesita films", desc_es: "Cortometraje que explora la memoria y el legado familiar." },
            { title_es: "ratones paranoicos", category: "music video", images: ["assets/RP_Thumbmail_1.png"], yt: "", director: "alex roux", prod: "poster", desc_es: "Pieza audiovisual para la legendaria banda de rock argentina." },
            { title_es: "besos brujos", category: "cortometraje", images: ["assets/BB_Thumbnail_1.png"], yt: "", director: "karina flonembaum", prod: "", desc_es: "Ficción breve que juega con los límites del deseo y la fantasía." },
            { title_es: "las marias", category: "advertising", images: ["assets/Marias_Thumbnail_1.png"], yt: "", director: "alejandro berger parrado", prod: "navajo films", desc_es: "Documental publicitaria sobre la tradición yerbatera argentina." },
            { title_es: "todo lo que recuerdo", category: "cortometraje", images: ["assets/TodoLoQueRecuerdo_Thumbnail_1.png"], yt: "", director: "nicolas fernandez melian", prod: "", desc_es: "Un viaje sensorial por la memoria fragmentada." }
        ];

        let currentIdx = 0;
        let isHovering = false;
        let activePane = 1;
        let rotationTimer;

        function init() {
            const featList = document.getElementById('featured-list');
            const gridCont = document.getElementById('grid-container');

            projects.forEach((p, idx) => {
                // Lista Home (Solo los 6 primeros con video)
                if(p.yt) {
                    const a = document.createElement('a');
                    a.className = "film-item";
                    a.innerText = p.title_es;
                    a.onmouseenter = () => { isHovering = true; changeHeroProject(idx); };
                    a.onmouseleave = () => { isHovering = false; };
                    a.onclick = (e) => { e.preventDefault(); openDetail(p); };
                    featList.appendChild(a);
                }

                // Grid All Projects
                const card = document.createElement('div');
                card.className = "grid-card";
                card.innerHTML = `
                    <div class="grid-thumb"><img src="${p.images[0]}" alt="${p.title_es}"></div>
                    <div style="display:flex; justify-content:space-between; align-items:baseline;">
                        <h4 style="text-transform:uppercase; font-weight:800;">${p.title_es}</h4>
                        <span style="font-size:0.7rem; opacity:0.5;">${p.category}</span>
                    </div>
                `;
                card.onclick = () => openDetail(p);
                gridCont.appendChild(card);
            });

            changeHeroProject(0);
            startRotation();
        }

        function changeHeroProject(idx) {
            const items = document.querySelectorAll('.film-item');
            items.forEach(item => item.classList.remove('active'));
            if(items[idx]) items[idx].classList.add('active');

            const nextPaneIdx = activePane === 1 ? 2 : 1;
            const currentPane = document.getElementById(`pane-${activePane}`);
            const nextPane = document.getElementById(`pane-${nextPaneIdx}`);

            const p = projects[idx];
            if(p && p.yt) {
                nextPane.innerHTML = `<iframe src="https://www.youtube.com/embed/${p.yt}?autoplay=1&mute=1&controls=0&loop=1&playlist=${p.yt}&modestbranding=1&rel=0" frameborder="0"></iframe>`;
                setTimeout(() => {
                    nextPane.classList.add('active');
                    currentPane.classList.remove('active');
                    activePane = nextPaneIdx;
                    setTimeout(() => { currentPane.innerHTML = ''; }, 1500);
                }, 500);
            }
            currentIdx = idx;
        }

        function startRotation() {
            rotationTimer = setInterval(() => {
                if (!isHovering) {
                    let next = (currentIdx + 1) % projects.length;
                    while(!projects[next].yt) { next = (next + 1) % projects.length; }
                    changeHeroProject(next);
                }
            }, 6000);
        }

        function showSection(sec) {
            document.getElementById('all-projects-section').style.display = sec === 'all' ? 'flex' : 'none';
            document.getElementById('nav-all').classList.toggle('active-nav', sec === 'all');
        }

        function openDetail(p) {
            const detail = document.getElementById('project-detail');
            detail.style.display = 'flex';
            document.getElementById('detail-dynamic-content').innerHTML = `
                <div class="detail-video-box">
                    ${p.yt ? `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${p.yt}?autoplay=1" frameborder="0" allowfullscreen></iframe>` : `<img src="${p.images[0]}" style="width:100%; height:100%; object-fit:cover;">`}
                </div>
                <div class="detail-grid">
                    <div><h2>${p.title_es}</h2><p style="opacity:0.4; margin-top:10px; font-weight:800;">${p.category}</p></div>
                    <div class="detail-meta">
                        <p>${p.desc_es}</p>
                        <strong>director</strong><p>${p.director}</p>
                        <strong>production</strong><p>${p.prod}</p>
                    </div>
                </div>
            `;
        }

        function closeDetail() { document.getElementById('project-detail').style.display = 'none'; }

        window.onload = init;
    </script>
</body>
</html>
