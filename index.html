<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leandro bruno | film editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { 
            --bg: #ececec; 
            --text: #1a1a1a; 
            --gray: #666; 
            --transition-speed: 0.6s;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; overflow: hidden; 
        }

        /* UI OVERLAY */
        .ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 50px; pointer-events: none; z-index: 100;
        }

        .side-brand { pointer-events: auto; }
        .side-brand h1 { font-size: 1.1rem; font-weight: 700; margin: 0; line-height: 1.2; }
        .side-brand p { font-size: 0.9rem; margin: 0; color: var(--gray); }

        .side-nav { pointer-events: auto; text-align: right; display: flex; flex-direction: column; gap: 40px; align-items: flex-end; }
        
        /* CATEGORIAS / WORK */
        .nav-categories { display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px; }
        .nav-categories span { font-size: 0.7rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .cat-link { cursor: pointer; text-decoration: none; color: var(--gray); font-size: 0.9rem; font-weight: 700; transition: 0.3s; border: none; background: none; padding: 0; text-align: right; font-family: inherit; }
        .cat-link.active { color: var(--text); }
        .cat-link:hover { color: var(--text); }

        .main-links { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #ccc; pt: 15px; padding-top: 15px; }
        .main-links a { text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 700; }

        .arrow-next { cursor: pointer; font-size: 1.5rem; margin-bottom: 30px; pointer-events: auto; }

        /* INFO INFERIOR */
        .project-info {
            position: fixed; bottom: 45px; left: 50%; transform: translateX(-50%);
            text-align: center; z-index: 100; width: 100%;
        }
        .info-wrapper { transition: opacity 0.5s, transform 0.5s; }
        .info-wrapper.changing { opacity: 0; transform: translateY(10px); }
        .project-info h2 { font-size: 1.4rem; font-weight: 700; margin: 0 0 5px 0; letter-spacing: 2px; }
        .project-info p { font-size: 0.85rem; color: var(--gray); margin: 0; }

        /* SLIDER */
        .slider-container { width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .center-frame { width: 65%; max-width: 950px; aspect-ratio: 16 / 9; position: relative; }

        .swiper { width: 100%; height: 100%; overflow: visible !important; }
        .swiper-slide { width: 100%; height: 100%; background: #000; border-radius: 2px; overflow: hidden; box-shadow: 0 40px 80px rgba(0,0,0,0.12); }

        .video-container { width: 100%; height: 100%; position: relative; cursor: zoom-in; }
        .video-container iframe { width: 100%; height: 114%; border: none; position: absolute; top: -7%; left: 0; pointer-events: none; }

        @media (max-width: 1024px) { .center-frame { width: 85%; } .ui-overlay { padding: 0 20px; } }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="side-brand">
            <h1>leandro bruno</h1>
            <p>film editor</p>
        </div>

        <div class="side-nav">
            <div class="arrow-next" id="js-next">→</div>
            
            <div class="nav-categories">
                <span>filter</span>
                <button class="cat-link active" onclick="filterProjects('all')">all</button>
                <button class="cat-link" onclick="filterProjects('film')">serie/film</button>
                <button class="cat-link" onclick="filterProjects('advertising')">advertising</button>
                <button class="cat-link" onclick="filterProjects('music')">music video</button>
            </div>

            <div class="main-links">
                <a href="#">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </div>
        </div>
    </div>

    <div class="project-info">
        <div class="info-wrapper" id="info-anim-target">
            <h2 id="p-title"></h2>
            <p id="p-credits"></p>
        </div>
    </div>

    <div class="slider-container">
        <div class="center-frame" id="fullscreen-target">
            <div class="swiper mySwiper">
                <div class="swiper-wrapper" id="projects-wrapper">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // BASE DE DATOS DE PROYECTOS
        const allProjects = [
            { id: '7Cllu0Rme74', title: 'oreo', credits: 'p. primo films', cat: 'advertising' },
            { id: '-2AmqmciWXE', title: 'menem', credits: 'd. ariel winograd | p. claxon', cat: 'film' },
            { id: 'ecr24akKDbs', title: 'coppola', credits: 'd. ariel winograd | p. pampa films', cat: 'film' }
        ];

        let swiper;
        const wrapper = document.getElementById('projects-wrapper');

        function initSwiper() {
            if (swiper) swiper.destroy(true, true);
            
            swiper = new Swiper(".mySwiper", {
                direction: 'vertical',
                loop: true,
                speed: 1000,
                effect: 'creative',
                creativeEffect: {
                    prev: { translate: [0, "110%", 0], opacity: 0 },
                    next: { translate: [0, "-24%", -250], opacity: 0.4, scale: 0.86 }
                },
                autoplay: { delay: 5000, disableOnInteraction: false },
                on: {
                    slideChangeTransitionStart: () => document.getElementById('info-anim-target').classList.add('changing'),
                    slideChange: function () {
                        const activeSlide = this.slides[this.activeIndex];
                        if(activeSlide) {
                            setTimeout(() => {
                                document.getElementById('p-title').innerText = activeSlide.getAttribute('data-title');
                                document.getElementById('p-credits').innerHTML = activeSlide.getAttribute('data-credits');
                                document.getElementById('info-anim-target').classList.remove('changing');
                            }, 300);
                        }
                    }
                }
            });
        }

        function filterProjects(category) {
            // Actualizar botones UI
            document.querySelectorAll('.cat-link').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(category) || (category === 'all' && btn.innerText === 'all'));
            });

            const filtered = category === 'all' ? allProjects : allProjects.filter(p => p.cat === category);
            
            wrapper.innerHTML = filtered.map(p => `
                <div class="swiper-slide" data-title="${p.title}" data-credits="${p.credits}">
                    <div class="video-container" onclick="toggleFullscreen()">
                        <iframe src="https://www.youtube.com/embed/${p.id}?autoplay=1&mute=1&loop=1&playlist=${p.id}&controls=0&modestbranding=1&rel=0" allow="autoplay"></iframe>
                    </div>
                </div>
            `).join('');

            initSwiper();
        }

        // FUNCIÓN PANTALLA COMPLETA
        function toggleFullscreen() {
            const elem = document.getElementById('fullscreen-target');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        document.getElementById('js-next').addEventListener('click', () => swiper.slideNext());

        // Carga inicial
        filterProjects('all');
    </script>
</body>
</html>
