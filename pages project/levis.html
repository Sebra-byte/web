<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVI'S x WINONA RIDERS | Leandro Bruno</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --text: #fff; --gray: #888; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; margin: 0; padding: 0; }
        nav { display: flex; justify-content: space-between; padding: 40px 5%; align-items: center; position: absolute; top: 0; width: 90%; z-index: 1000; }
        .logo img { height: 40px; width: auto; }
        .menu-item a { text-decoration: none; color: var(--gray); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; }
        .menu-item:hover a { color: #fff; }
        .video-container { width: 100%; min-height: 80vh; padding-top: 120px; display: flex; align-items: center; justify-content: center; background: #000; }
        .instagram-wrapper { width: 100%; max-width: 540px; }
        .project-details { padding: 60px 5%; display: grid; grid-template-columns: 1fr 2fr; gap: 40px; }
        .project-title h1 { font-size: 1.5rem; letter-spacing: 5px; font-weight: 400; text-transform: uppercase; margin: 0; }
        .credits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .credit-item { border-top: 1px solid #222; padding-top: 15px; }
        .label { font-size: 0.6rem; color: var(--gray); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .value { font-size: 0.85rem; font-weight: 200; letter-spacing: 1px; }
        @media (max-width: 768px) { .project-details { grid-template-columns: 1fr; } }
        footer { padding: 80px 5%; text-align: center; font-size: 9px; color: #222; }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html"><img src="LOGO_Manrope_v01.png" alt="Leandro Bruno"></a></div>
        <div class="menu"><div class="menu-item"><a href="index.html">BACK TO WORK</a></div></div>
    </nav>
    <section class="video-container">
        <div class="instagram-wrapper">
            <blockquote class="instagram-media" data-instgrm-permalink="https://www.instagram.com/p/C9Vazh3PVzU/" data-instgrm-version="14" style=" background:#000; border:0; margin:1px; max-width:540px; min-width:326px; padding:0; width:99.375%;"></blockquote>
            <script async src="//www.instagram.com/embed.js"></script>
        </div>
    </section>
    <section class="project-details">
        <div class="project-title">
            <h1>LEVI'S x WINONA RIDERS</h1>
            <p style="color:var(--gray); font-size:0.7rem; letter-spacing:2px; margin-top:10px;">ADVERTISING / CAMPAIGN</p>
        </div>
        <div class="credits-grid">
            <div class="credit-item"><div class="label">Client</div><div class="value">Levi's</div></div>
            <div class="credit-item"><div class="label">Featuring</div><div class="value">Winona Riders</div></div>
            <div class="credit-item"><div class="label">Editor</div><div class="value">Leandro Bruno</div></div>
            <div class="credit-item"><div class="label">Format</div><div class="value">Digital Campaign</div></div>
        </div>
    </section>
    <footer>© 2026 LEANDRO BRUNO.</footer>
</body>
</html>
