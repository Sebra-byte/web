<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENEM | Leandro Bruno</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #000; --text: #fff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; margin: 0; }
        nav { display: flex; justify-content: space-between; padding: 40px 5%; align-items: center; position: absolute; top: 0; width: 90%; z-index: 1000; }
        .logo img { height: 40px; }
        .menu-item a { text-decoration: none; color: #fff; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6; }
        .video-container { width: 100%; height: 80vh; padding-top: 100px; }
        iframe { width: 100%; height: 100%; border: none; }
        .project-details { padding: 60px 5%; display: grid; grid-template-columns: 1fr 2fr; gap: 40px; }
        .project-title h1 { font-size: 1.5rem; letter-spacing: 5px; font-weight: 400; text-transform: uppercase; }
        .credits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .credit-item { border-top: 1px solid #222; padding-top: 15px; }
        .label { font-size: 0.6rem; color: #fff; opacity: 0.5; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .value { font-size: 0.85rem; font-weight: 200; }
        @media (max-width: 768px) { .project-details { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html"><img src="LOGO_Manrope_v01.png"></a></div>
        <div class="menu-item"><a href="index.html">BACK TO WORK</a></div>
    </nav>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/-2AmqmciWXE?autoplay=1&mute=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
    <section class="project-details">
        <div class="project-title"><h1>MENEM</h1><p>SERIE DOCUMENTAL</p></div>
        <div class="credits-grid">
            <div class="credit-item"><div class="label">Director</div><div class="value">Federico Cassinelli</div></div>
            <div class="credit-item"><div class="label">Production</div><div class="value">Prime Video</div></div>
            <div class="credit-item"><div class="label">Editor</div><div class="value">Leandro Bruno</div></div>
        </div>
    </section>
</body>
</html>
