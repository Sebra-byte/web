<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about | leandro bruno</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #f0f0f0; --text: #1a1a1a; --gray: #777; 
            --line-grid: rgba(0, 0, 0, 0.05); --line-accent: rgba(255, 0, 0, 0.15); 
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); color: var(--text); 
            font-family: 'Space Mono', monospace; overflow: hidden; text-transform: lowercase; 
        }
        .blueprint-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--line-grid) 1px, transparent 1px), linear-gradient(90deg, var(--line-grid) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }
        .guide-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: var(--line-accent); z-index: -1; }

        .main-layout {
            display: grid; grid-template-columns: 18% 1fr 18%; height: 100vh; align-items: center; padding: 0 40px;
        }
        .side-left { font-size: 1.2rem; letter-spacing: 1px; }
        .side-left span { display: block; font-weight: 700; font-size: 1.4rem; margin-bottom: 5px; }

        .center-frame {
            grid-column: 2; width: 100%; max-width: 1150px; margin: 0 auto;
            display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
        }
        .profile-img { width: 100%; border: 1px solid #aaa; filter: grayscale(1); box-shadow: 0 20px 50px rgba(0,0,0,0.08); }
        .bio-text { font-size: 1.2rem; line-height: 1.8; color: var(--text); }

        .side-right { display: flex; flex-direction: column; justify-content: flex-end; height: 60%; align-items: flex-end; }
        .nav-links { display: flex; flex-direction: column; gap: 15px; align-items: flex-end; }
        .nav-links a { text-decoration: none; color: var(--gray); font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; }
        .nav-links a.active { color: var(--text); }

        .bottom-info { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; }
        .contact-links { font-size: 1.1rem; color: var(--gray); font-weight: 700; }
        .contact-links a { color: var(--text); text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="blueprint-bg"></div>
    <div class="guide-h"></div>
    <main class="main-layout">
        <div class="side-left"><span>leandro bruno</span>film editor</div>
        <div class="center-frame">
            <img src="assets/Perfil_LMB.png" class="profile-img">
            <div class="bio-text">
                editor de cine y publicidad basado en buenos aires. enfocado en la narrativa visual y la estructura rítmica del montaje para proyectos de alta gama.
            </div>
        </div>
        <div class="side-right">
            <div class="nav-links">
                <a href="index.html">work</a>
                <a href="about.html" class="active">about</a>
                <a href="mailto:leandrobrunoeditor@gmail.com">contact</a>
            </div>
        </div>
    </main>
    <div class="bottom-info">
        <div class="contact-links">
            <a href="mailto:leandrobrunoeditor@gmail.com">email</a> / <a href="#">vimeo</a> / <a href="#">instagram</a>
        </div>
    </div>
</body>
</html>
